            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches" \
            --data "$payload")"
          if [[ "$status" != "204" ]]; then
            echo "G13_PREFLIGHT_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/g13-preflight-dispatch-response.txt
            exit 1
          fi
          echo "G13_PREFLIGHT_DISPATCHED=true RUN_INPUT_COMPILE_PARITY_ID=$COMPILE_PARITY_RUN_ID SHA=$GITHUB_SHA"

