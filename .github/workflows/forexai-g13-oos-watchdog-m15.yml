      - name: Dispatch exact Controlled Demo Package Preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "G13_WATCHDOG_MAIN_MOVED_BEFORE_PREFLIGHT=true CURRENT_MAIN=$main_sha TARGET_SHA=$GITHUB_SHA"
