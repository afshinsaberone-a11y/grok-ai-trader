name: ForexAI G13 OOS Watchdog M15

# Deterministic recovery/orchestration for the official G13 M15 chain.
# Source evidence (Validation + Robustness) is dispatched explicitly before OOS,
# A main push also refreshes exact-SHA G13 evidence after orchestration-only fixes.
# removing reliance on push-trigger delivery. Exact SHA is enforced throughout.
# This workflow does not alter strategy logic, candidate parameters, data policy,
# or trading permissions. Live remains disabled.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: g13-oos-watchdog-m15-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dispatch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Set up retryable GitHub CLI wrapper for transient API reads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bin_dir="$RUNNER_TEMP/g13-gh-retry-bin"
          real_gh="$(command -v gh)"
          mkdir -p "$bin_dir"
          cat > "$bin_dir/gh" <<'WRAPPER'
          #!/usr/bin/env bash
          set -uo pipefail
          real_gh="$G13_REAL_GH_PATH"
          error_file="$RUNNER_TEMP/g13-gh-api-retry.stderr"
          retryable=0
          if [[ "$#" -gt 0 && "$1" == "api" ]]; then
            retryable=1
            for arg in "$@"; do
              if [[ "$arg" == "--method" || "$arg" == "-X" ]]; then
                retryable=0
                break
              fi
            done
          fi
          if [[ "$retryable" != "1" ]]; then
            exec "$real_gh" "$@"
          fi
          status=1
          for attempt in 1 2 3 4 5; do
            # Never let one stalled GitHub API read hold the G13 chain indefinitely.
            # Mutating requests are not retried here; this wrapper only handles read-only gh api calls.
            output=$(timeout --signal=TERM --kill-after=5s 45s "$real_gh" "$@" 2>"$error_file")
            status=$?
            if [[ "$status" -eq 0 ]]; then
              printf '%s' "$output"
              exit 0
            fi
            if [[ "$status" -eq 124 || "$status" -eq 137 ]]; then
              echo "G13_GH_API_READ_TIMEOUT attempt=$attempt/5 timeout=45s" >&2
            elif ! grep -Eiq 'HTTP (429|500|502|503|504)|timed out|timeout|temporary failure|connection reset|unexpected EOF|EOF' "$error_file"; then
              cat "$error_file" >&2
              exit "$status"
            fi
            if [[ "$attempt" -lt 5 ]]; then
              delay=$((attempt * 3))
              echo "G13_GH_API_READ_RETRY attempt=$attempt/5 delay=$delay seconds" >&2
              sleep "$delay"
            fi
          done
          cat "$error_file" >&2
          echo "G13_GH_API_READ_RETRY_EXHAUSTED attempts=5" >&2
          exit "$status"
          WRAPPER
          chmod +x "$bin_dir/gh"
          echo "G13_REAL_GH_PATH=$real_gh" >> "$GITHUB_ENV"
          echo "$bin_dir" >> "$GITHUB_PATH"
          echo "G13_RETRYABLE_GITHUB_CLI_READY=true"
      - name: Verify current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "G13_WATCHDOG_STALE_SHA=true CURRENT_MAIN=$current_main EVENT_SHA=$GITHUB_SHA"
            exit 1
          fi
          echo "G13_WATCHDOG_SHA_OK=true SHA=$GITHUB_SHA"

      - name: Define dispatch helpers
        id: helpers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > "$GITHUB_OUTPUT"
          echo "HELPERS_READY=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact Validation and Robustness producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_workflow() {
            local workflow_file="$1"
            local body="$2"
            local status
            local current_main
            # Workflow dispatch accepts a branch ref, not an immutable commit SHA.
            # Recheck immediately before every dispatch so a stale watchdog cannot
            # enqueue work against a newer main head.
            current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$current_main" != "$GITHUB_SHA" ]]; then
              echo "G13_DISPATCH_STALE_SHA=true WORKFLOW=$workflow_file CURRENT_MAIN=$current_main TARGET_SHA=$GITHUB_SHA"
              exit 1
            fi
            status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
              --data "$body")"
            if [[ "$status" != "204" ]]; then
              echo "G13_WORKFLOW_DISPATCH_FAILED workflow=$workflow_file http=$status"
              cat /tmp/dispatch-response.txt
              exit 1
            fi
            echo "G13_WORKFLOW_DISPATCH_OK workflow=$workflow_file"
          }

          dispatch_workflow "forexai-g13-validation-m15.yml" '{"ref":"main"}'
          dispatch_workflow "forexai-g13-robustness-m15.yml" '{"ref":"main"}'
          echo "G13_SOURCE_PRODUCERS_DISPATCHED=true SHA=$GITHUB_SHA"

      - name: Resolve exact successful Validation and Robustness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_success() {
            local workflow_file="$1"
            local workflow_name="$2"
            local label="$3"
            for attempt in $(seq 1 100); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?branch=main&per_page=50")"
              state="$(printf '%s' "$payload" | LABEL="$label" TARGET_SHA="$GITHUB_SHA" EXPECTED_NAME="$workflow_name" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; name=os.environ["EXPECTED_NAME"]; label=os.environ["LABEL"]; rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("name")==name and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' )"
              case "$state" in
                SUCCESS\|*)
                  echo "G13_${label}_SUCCESS=true RUN=${state#SUCCESS|} SHA=$GITHUB_SHA"
                  return 0
                  ;;
                FAILED\|*)
                  echo "G13_${label}_FAILED=true RUN=${state#FAILED|} SHA=$GITHUB_SHA"
                  return 1
                  ;;
                PENDING\|*|NOT_STARTED\|*)
                  echo "G13_${label}_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                  sleep 30
                  ;;
              esac
            done
            echo "G13_${label}_WAIT_TIMEOUT=true SHA=$GITHUB_SHA"
            return 1
          }

          resolve_success "forexai-g13-validation-m15.yml" "ForexAI G13 Validation M15" "VALIDATION"
          resolve_success "forexai-g13-robustness-m15.yml" "ForexAI G13 Robustness M15" "ROBUSTNESS"
          echo "G13_EXACT_SOURCE_EVIDENCE_READY=true SHA=$GITHUB_SHA"

      - name: Dispatch official OOS only after source evidence is ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A previous-SHA watchdog must not dispatch OOS against the current branch
          # after main has moved. Snapshot the baseline so only this invocation's OOS
          # run can satisfy the following resolver.
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo "G13_OOS_DISPATCH_STALE_SHA=true CURRENT_MAIN=$current_main TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          oos_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/runs?branch=main&per_page=50")"
          oos_baseline_id="$(printf '%s' "$oos_before" | python -c 'import json,sys; rs=json.load(sys.stdin).get("workflow_runs", []); print(max((int(r.get("id",0)) for r in rs),default=0))')"
          echo "G13_OOS_BASELINE_ID=$oos_baseline_id"
          echo "G13_OOS_BASELINE_ID=$oos_baseline_id" >> "$GITHUB_ENV"
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"expected_main_sha":sys.argv[1],"watchdog_run_id":sys.argv[2]}}))' "$GITHUB_SHA" "$GITHUB_RUN_ID")"
          status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_OOS_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/dispatch-response.txt
            exit 1
          }
          echo "G13_OOS_WATCHDOG_OOS_DISPATCHED=true SHA=$GITHUB_SHA"

      - name: Resolve exact successful OOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          oos_run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | TARGET_SHA="$GITHUB_SHA" BASELINE_ID="$G13_OOS_BASELINE_ID" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; baseline=int(os.environ["BASELINE_ID"]); rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if int(r.get("id",0))>baseline and r.get("name")=="ForexAI G13 OOS M15 Current" and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' )"
            case "$state" in
              SUCCESS\|*)
                oos_run_id="${state#SUCCESS|}"
                echo "G13_OOS_SUCCESS_RESOLVED=true RUN=$oos_run_id SHA=$GITHUB_SHA"
                break
                ;;
              FAILED\|*)
                echo "G13_OOS_FAILED_FOR_SHA=$GITHUB_SHA RUN=${state#FAILED|}"
                exit 1
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "G13_OOS_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                sleep 30
                ;;
            esac
          done

          if [[ -z "$oos_run_id" ]]; then
            echo "G13_OOS_WAIT_TIMEOUT_FOR_SHA=$GITHUB_SHA"
            exit 1
          fi

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "G13_WATCHDOG_MAIN_MOVED_DURING_OOS=true CURRENT_MAIN=$current_main ORIGINAL_SHA=$GITHUB_SHA"
            exit 1
          fi

          echo "OOS_RUN_ID=$oos_run_id" >> "$GITHUB_ENV"

      - name: Dispatch exact Promotion after successful OOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo "G13_PROMOTION_DISPATCH_STALE_SHA=true CURRENT_MAIN=$current_main TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          payload='{"ref":"main"}'
          status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-promotion-m15.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_PROMOTION_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/dispatch-response.txt
            exit 1
          }
          echo "G13_PROMOTION_EXPLICITLY_DISPATCHED=true OOS_RUN_ID=$OOS_RUN_ID SHA=$GITHUB_SHA"

      - name: Resolve exact successful Promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          promotion_run_id=""
          for attempt in $(seq 1 100); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-promotion-m15.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | TARGET_SHA="$GITHUB_SHA" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("name")=="ForexAI G13 Final Promotion M15" and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' )"
            case "$state" in
              SUCCESS\|*)
                promotion_run_id="${state#SUCCESS|}"
                echo "G13_PROMOTION_SUCCESS_RESOLVED=true RUN=$promotion_run_id SHA=$GITHUB_SHA"
                break
                ;;
              FAILED\|*)
                echo "G13_PROMOTION_FAILED_FOR_SHA=$GITHUB_SHA RUN=${state#FAILED|}"
                exit 1
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "G13_PROMOTION_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                sleep 30
                ;;
            esac
          done
          test -n "$promotion_run_id"
          echo "PROMOTION_RUN_ID=$promotion_run_id" >> "$GITHUB_ENV"

      - name: Dispatch exact Execution Safety Audit after Promotion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "G13_SAFETY_DISPATCH_STALE_SHA=true CURRENT_MAIN=$main_sha TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          safety_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-execution-safety-audit-m15.yml/runs?branch=main&per_page=50")"
          safety_baseline_id="$(printf '%s' "$safety_before" | python -c 'import json,sys; rs=json.load(sys.stdin).get("workflow_runs",[]); print(max((int(r.get("id",0)) for r in rs),default=0))')"
          echo "G13_SAFETY_AUDIT_BASELINE_ID=$safety_baseline_id" >> "$GITHUB_ENV"
          # Capture the newest Compile/Parity run before dispatch. Without this
          # baseline, the resolver below can accept a prior successful run for the
          # same SHA while the run we just dispatched is still queued.
          compile_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-compile-parity.yml/runs?branch=main&per_page=100")"
          compile_baseline_id="$(printf '%s' "$compile_before" | python -c 'import json,sys; rs=json.load(sys.stdin).get("workflow_runs",[]); print(max((int(r.get("id",0)) for r in rs),default=0))')"
          echo "G13_COMPILE_PARITY_BASELINE_ID=$compile_baseline_id"
          echo "G13_COMPILE_PARITY_BASELINE_ID=$compile_baseline_id" >> "$GITHUB_ENV"
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"promotion_run_id":sys.argv[1]}}))' "$PROMOTION_RUN_ID")"
          status="$(curl -sS --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors --retry-delay 2 \
            -o /tmp/g13-safety-dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-execution-safety-audit-m15.yml/dispatches" \
            --data "$payload")"
          if [[ "$status" != "204" ]]; then
            echo "G13_SAFETY_AUDIT_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/g13-safety-dispatch-response.txt
            exit 1
          fi
          echo "G13_SAFETY_AUDIT_DISPATCHED=true PROMOTION_RUN_ID=$PROMOTION_RUN_ID TARGET_SHA=$GITHUB_SHA"

      - name: Resolve exact successful Execution Safety Audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          safety_run_id=""
          for attempt in $(seq 1 40); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-execution-safety-audit-m15.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | TARGET_SHA="$GITHUB_SHA" BASELINE_ID="$G13_SAFETY_AUDIT_BASELINE_ID" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; baseline=int(os.environ["BASELINE_ID"]); rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if int(r.get("id",0))>baseline and r.get("event")=="workflow_dispatch" and r.get("name")=="ForexAI G13 Execution Safety Audit M15" and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' )"
            case "$state" in
              SUCCESS\|*)
                safety_run_id="${state#SUCCESS|}"
                echo "G13_SAFETY_AUDIT_SUCCESS_RESOLVED=true RUN=$safety_run_id SHA=$GITHUB_SHA"
                break
                ;;
              FAILED\|*)
                echo "G13_SAFETY_AUDIT_FAILED_FOR_SHA=$GITHUB_SHA RUN=${state#FAILED|}"
                exit 1
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "G13_SAFETY_AUDIT_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                sleep 30
                ;;
            esac
          done
          if [[ -z "$safety_run_id" ]]; then
            echo "G13_SAFETY_AUDIT_WAIT_TIMEOUT_FOR_SHA=$GITHUB_SHA"
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "G13_SAFETY_AUDIT_MAIN_MOVED=true CURRENT_MAIN=$main_sha TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          safety_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$safety_run_id")"
          printf '%s' "$safety_json" | TARGET_SHA="$GITHUB_SHA" python -c 'import json,os,sys; p=json.load(sys.stdin); target=os.environ["TARGET_SHA"]; assert p["name"]=="ForexAI G13 Execution Safety Audit M15",p["name"]; assert p["head_branch"]=="main",p["head_branch"]; assert p["status"]=="completed",p["status"]; assert p["conclusion"]=="success",p["conclusion"]; assert p["head_sha"]==target,(p["head_sha"],target); print("G13_EXACT_SAFETY_AUDIT_BOUND",p["id"],target)'
          echo "SAFETY_AUDIT_RUN_ID=$safety_run_id" >> "$GITHUB_ENV"

      - name: Dispatch exact MT5 Compile + Signal Parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$current_main" == "$GITHUB_SHA" ]] || {
            echo "G13_COMPILE_PARITY_DISPATCH_STALE_SHA=true CURRENT_MAIN=$current_main TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"promotion_run_id":sys.argv[1]}}))' "$PROMOTION_RUN_ID")"
          status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-compile-parity.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_COMPILE_PARITY_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/dispatch-response.txt
            exit 1
          }
          echo "G13_OOS_TO_COMPILE_DISPATCHED=true OOS_RUN_ID=$OOS_RUN_ID PROMOTION_RUN_ID=$PROMOTION_RUN_ID TARGET_SHA=$GITHUB_SHA"
      - name: Resolve exact successful MT5 Compile + Signal Parity
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_BASELINE_ID: ${{ env.G13_COMPILE_PARITY_BASELINE_ID }}
        run: |
          set -euo pipefail
          compile_run_id=""
          compile_setup_retry_used="0"
          compile_retry_run_id=""
          compile_retry_from_attempt="0"
          for attempt in $(seq 1 80); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-compile-parity.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | TARGET_SHA="$GITHUB_SHA" BASELINE_ID="$COMPILE_BASELINE_ID" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; baseline=int(os.environ["BASELINE_ID"]); rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if int(r.get("id",0))>baseline and r.get("name")=="ForexAI G13 MT5 Compile + Signal Parity" and r.get("head_branch")=="main" and r.get("head_sha")==target]; ok=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(ok,key=lambda x:x["id"])["id"])) if ok else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' )"
            case "$state" in
              SUCCESS\|*)
                compile_run_id="${state#SUCCESS|}"
                echo "G13_COMPILE_PARITY_SUCCESS_RESOLVED=true RUN=$compile_run_id SHA=$GITHUB_SHA"
                break
                ;;
              FAILED\|*)
                failed_run_id="${state#FAILED|}"
                if [[ "$compile_setup_retry_used" == "1" && "$failed_run_id" == "$compile_retry_run_id" ]]; then
                  retry_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id")"
                  retry_observed_attempt="$(printf '%s' "$retry_run_json" | python -c 'import json,sys; print(int(json.load(sys.stdin).get("run_attempt",0)))')"
                  retry_observed_status="$(printf '%s' "$retry_run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))')"
                  if [[ "$retry_observed_status" != "completed" || "$retry_observed_attempt" -le "$compile_retry_from_attempt" ]]; then
                    echo "G13_COMPILE_PARITY_RETRY_START_PENDING=true RUN=$failed_run_id OBSERVED_ATTEMPT=$retry_observed_attempt"
                    sleep 15
                    continue
                  fi
                fi
                if [[ "$compile_setup_retry_used" == "0" ]]; then
                  failed_run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id")"
                  failed_observed_status="$(printf '%s' "$failed_run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))')"
                  failed_observed_conclusion="$(printf '%s' "$failed_run_json" | python -c 'import json,sys; print(json.load(sys.stdin).get("conclusion","unknown") or "unknown")')"
                  failed_observed_attempt="$(printf '%s' "$failed_run_json" | python -c 'import json,sys; print(int(json.load(sys.stdin).get("run_attempt",0)))')"
                  if [[ "$failed_observed_status" != "completed" ]]; then
                    echo "G13_COMPILE_PARITY_FAILURE_STATE_CHANGED=true RUN=$failed_run_id STATUS=$failed_observed_status CONCLUSION=$failed_observed_conclusion ATTEMPT=$failed_observed_attempt"
                    sleep 15
                    continue
                  fi
                  if [[ "$failed_observed_conclusion" != "failure" && "$failed_observed_conclusion" != "timed_out" && "$failed_observed_conclusion" != "startup_failure" ]]; then
                    echo "G13_COMPILE_PARITY_NON_RETRYABLE_CONCLUSION=$failed_observed_conclusion RUN=$failed_run_id"
                    exit 1
                  fi
                  failed_attempt="$(printf '%s' "$failed_run_json" | TARGET_SHA="$GITHUB_SHA" python -c 'import json,os,sys; p=json.load(sys.stdin); target=os.environ["TARGET_SHA"]; assert p.get("name")=="ForexAI G13 MT5 Compile + Signal Parity",p.get("name"); assert p.get("head_branch")=="main",p.get("head_branch"); assert p.get("head_sha")==target,(p.get("head_sha"),target); print(int(p.get("run_attempt",0)))')"
                  failed_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/attempts/$failed_attempt/jobs?per_page=100")"
                  setup_only_failure="$(printf '%s' "$failed_jobs" | python -c 'import json,sys; jobs=json.load(sys.stdin).get("jobs", []); failed=[job for job in jobs if job.get("conclusion") not in (None,"success","skipped")]; safe=(len(failed)==1 and failed[0].get("name")=="compile-and-parity" and ((failed[0].get("conclusion")=="failure" and len(failed[0].get("steps") or [])==1 and (failed[0].get("steps") or [])[0].get("name")=="Set up job" and (failed[0].get("steps") or [])[0].get("conclusion")=="failure") or (failed[0].get("conclusion") in {"failure","timed_out","startup_failure"} and len(failed[0].get("steps") or [])==0))); print("true" if safe else "false")')"
                  if [[ "$setup_only_failure" == "true" ]]; then
                    if gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$failed_run_id/rerun-failed-jobs" >/dev/null; then
                      compile_setup_retry_used="1"
                      compile_retry_run_id="$failed_run_id"
                      compile_retry_from_attempt="$failed_attempt"
                      echo "G13_COMPILE_PARITY_SETUP_ONLY_FAILURE_RETRY=true RUN=$failed_run_id FAILED_ATTEMPT=$failed_attempt"
                      echo "G13_COMPILE_PARITY_SETUP_RETRY_REQUESTED=true RUN=$failed_run_id"
                      sleep 15
                      continue
                    else
                      echo "G13_COMPILE_PARITY_SETUP_RETRY_REQUEST_FAILED=true RUN=$failed_run_id"
                      exit 1
                    fi
                  fi
                fi
                echo "G13_COMPILE_PARITY_FAILED_FOR_SHA=$GITHUB_SHA RUN=$failed_run_id"
                exit 1
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "G13_COMPILE_PARITY_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                sleep 30
                ;;
            esac
          done
          if [[ -z "$compile_run_id" ]]; then
            echo "G13_COMPILE_PARITY_WAIT_TIMEOUT_FOR_SHA=$GITHUB_SHA"
            exit 1
          fi
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "G13_WATCHDOG_MAIN_MOVED_BEFORE_PREFLIGHT=true CURRENT_MAIN=$main_sha TARGET_SHA=$GITHUB_SHA"
            exit 1
          }
          compile_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$compile_run_id")"
          printf '%s' "$compile_json" | TARGET_SHA="$GITHUB_SHA" python -c 'import json,os,sys; p=json.load(sys.stdin); target=os.environ["TARGET_SHA"]; assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity",p["name"]; assert p["head_branch"]=="main",p["head_branch"]; assert p["status"]=="completed",p["status"]; assert p["conclusion"]=="success",p["conclusion"]; assert p["head_sha"]==target,(p["head_sha"],target); print("G13_EXACT_COMPILE_PARITY_BOUND",p["id"],target)'
          echo "COMPILE_PARITY_RUN_ID=$compile_run_id" >> "$GITHUB_ENV"

      - name: Dispatch exact MT5 Runtime Safety Probe after successful parity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          [[ "$main_sha" == "$GITHUB_SHA" ]] || {
            echo "G13_RUNTIME_DISPATCH_STALE_SHA=true CURRENT_MAIN=$main_sha TARGET_SHA=$GITHUB_SHA"
            exit 1
          }

          runtime_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml/runs?branch=main&per_page=50")"
          runtime_baseline_id="$(printf '%s' "$runtime_before" | python -c 'import json,sys; rs=json.load(sys.stdin).get("workflow_runs",[]); print(max((int(r.get("id",0)) for r in rs),default=0))')"
          echo "G13_RUNTIME_SAFETY_BASELINE_ID=$runtime_baseline_id"
          echo "G13_RUNTIME_SAFETY_BASELINE_ID=$runtime_baseline_id" >> "$GITHUB_ENV"

          status="$(curl -sS --connect-timeout 15 --max-time 60 --retry 3 --retry-all-errors --retry-delay 2 \
            -o /tmp/g13-runtime-dispatch-response.txt -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [[ "$status" != "204" ]]; then
            echo "G13_RUNTIME_SAFETY_DISPATCH_FAILED_HTTP=$status"
            cat /tmp/g13-runtime-dispatch-response.txt
            exit 1
          fi
          echo "G13_RUNTIME_SAFETY_PROBE_DISPATCHED=true TARGET_SHA=$GITHUB_SHA"

      - name: Resolve exact successful MT5 Runtime Safety Probe
