name: ForexAI G13 OOS Watchdog M15

# Recovery-only dispatcher for the official G13 OOS workflow.
# It does not alter strategy logic, candidate parameters, data policy, or trading permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: g13-oos-watchdog-m15
  cancel-in-progress: true

jobs:
  dispatch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Verify current main and dispatch official OOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "G13_WATCHDOG_STALE_SHA=true CURRENT_MAIN=$current_main EVENT_SHA=$GITHUB_SHA"
            exit 1
          fi

          dispatch_workflow() {
            local workflow_file="$1"
            local body="$2"
            local status
            status="$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
              --data "$body")"
            if [[ "$status" != "204" ]]; then
              echo "G13_WORKFLOW_DISPATCH_FAILED workflow=$workflow_file http=$status"
              cat /tmp/dispatch-response.txt
              return 1
            fi
            echo "G13_WORKFLOW_DISPATCH_OK workflow=$workflow_file"
          }

          dispatch_workflow "forexai-g13-oos-m15-current.yml" '{"ref":"main"}'
          echo "G13_OOS_WATCHDOG_OOS_DISPATCHED=true SHA=$GITHUB_SHA"

          oos_run_id=""
          for attempt in $(seq 1 120); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | python -c 'import json,sys; target=sys.argv[1]; rs=[r for r in json.load(sys.stdin).get("workflow_runs",[]) if r.get("name")=="ForexAI G13 OOS M15 Current" and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else ("PENDING|" if pending else "NOT_STARTED|")))' "$GITHUB_SHA")"
            case "$state" in
              SUCCESS\|*)
                oos_run_id="${state#SUCCESS|}"
                echo "G13_OOS_SUCCESS_RESOLVED=true RUN=$oos_run_id SHA=$GITHUB_SHA"
                break
                ;;
              FAILED\|*)
                echo "G13_OOS_FAILED_FOR_SHA=$GITHUB_SHA RUN=${state#FAILED|}"
                exit 1
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "G13_OOS_WAIT attempt=$attempt state=$state SHA=$GITHUB_SHA"
                sleep 30
                ;;
            esac
          done

          if [[ -z "$oos_run_id" ]]; then
            echo "G13_OOS_WAIT_TIMEOUT_FOR_SHA=$GITHUB_SHA"
            exit 1
          fi

          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "G13_WATCHDOG_MAIN_MOVED_DURING_OOS=true CURRENT_MAIN=$current_main ORIGINAL_SHA=$GITHUB_SHA"
            exit 1
          fi

          dispatch_workflow "forexai-g13-promotion-m15.yml" '{"ref":"main"}'
          echo "G13_PROMOTION_EXPLICITLY_DISPATCHED=true OOS_RUN_ID=$oos_run_id SHA=$GITHUB_SHA"

          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"target_sha":sys.argv[1]}}))' "$GITHUB_SHA")"
          dispatch_workflow "forexai-g13-oos-compile-dispatcher-m15.yml" "$payload"
          echo "G13_OOS_TO_COMPILE_EXPLICITLY_DISPATCHED=true OOS_RUN_ID=$oos_run_id SHA=$GITHUB_SHA"
