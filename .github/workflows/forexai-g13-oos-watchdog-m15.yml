name: ForexAI G13 OOS Watchdog M15

# Recovery-only dispatcher for the official G13 OOS workflow.
# It does not alter strategy logic, candidate parameters, data policy, or trading permissions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: g13-oos-watchdog-m15
  cancel-in-progress: true

jobs:
  dispatch-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify current main and dispatch official OOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "G13_WATCHDOG_STALE_SHA=true CURRENT_MAIN=$current_main EVENT_SHA=$GITHUB_SHA"
            exit 1
          fi

          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/dispatches"             -f ref=main

          echo "G13_OOS_WATCHDOG_DISPATCHED=true SHA=$GITHUB_SHA"
