          readiness_baseline_id="$(printf '%s' "$readiness_before" | python -c 'import json,sys; rs=json.load(sys.stdin).get("workflow_runs",[]); print(max((int(r.get("id",0)) for r in rs),default=0))')"
          echo "G13_READINESS_BASELINE_ID=$readiness_baseline_id"
          echo "G13_READINESS_BASELINE_ID=$readiness_baseline_id" >> "$GITHUB_ENV"

          # Snapshot run IDs before dispatch. Only a fresh Preflight run for this SHA
          # can satisfy this invocation of the official G13 chain.
          preflight_before="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/runs?branch=main&per_page=50")"
