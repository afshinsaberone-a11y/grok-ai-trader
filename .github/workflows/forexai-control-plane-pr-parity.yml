name: ForexAI Control Plane PR Real-Data Parity

# This runs the existing real EURUSD M15 Python/MQL5 parity harness against
# EAs generated from this exact same-repository candidate SHA. The Promotion
# artifact remains sourced from an independently successful main SHA.
# The MQL5 script is signal-only; it does not attach/run generated EAs or trade.
on:
  push:
    branches:
      - feat/authoritative-capital-control-plane-v1
    paths:
      - 'research/optimization/g13_control_plane_ea_gate_v1.py'
      - 'research/optimization/g13_mql5_generator_v2.py'
      - 'research/optimization/g13_mql5_parity.py'
      - 'research/optimization/g13_mql5_parity_harness_generator.py'
      - '.github/workflows/forexai-control-plane-pr-parity.yml'
      - '.github/workflows/forexai-g13-mt5-compile-parity.yml'

permissions:
  contents: read
  actions: read

jobs:
  resolve-main:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.main.outputs.sha }}
    steps:
      - name: Checkout current main for the Promotion SHA
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Record exact main SHA
        id: main
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "PARITY_PROMOTION_TARGET_MAIN_SHA=$sha"

  real-data-parity:
    needs: resolve-main
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/forexai-g13-mt5-compile-parity.yml
    with:
      candidate_source_ref: ${{ github.sha }}
      promotion_target_sha: ${{ needs.resolve-main.outputs.sha }}
