name: ForexAI Control Plane Producer v1

# Manual only. Observes/sets the safety switch to DENY before checking inputs.
# This workflow prepares authority only; it never submits an order.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_CONTROL_PLANE_PREFLIGHT for the non-ordering preflight"
        required: true
        type: string
      terminal_path:
        description: "MT5 terminal executable on the self-hosted Windows runner"
        required: true
        default: 'C:\Program Files\MetaTrader 5\terminal64.exe'
        type: string

permissions:
  contents: read

concurrency:
  group: forexai-control-plane-producer-v1
  cancel-in-progress: false

jobs:
  produce-demo-authority:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: "1"
      TERMINAL_PATH: ${{ inputs.terminal_path }}
      FOREXAI_CONTROL_PLANE_ADMISSION_PUBLIC_KEY: ${{ vars.FOREXAI_CONTROL_PLANE_ADMISSION_PUBLIC_KEY }}
      FOREXAI_EXPECTED_DEMO_ACCOUNT_FINGERPRINT: ${{ vars.FOREXAI_EXPECTED_DEMO_ACCOUNT_FINGERPRINT }}
      OPERATOR_CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Validate explicit workflow invocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'CONTROL_PLANE_MANUAL_DISPATCH_REQUIRED'
          }
          if ($env:OPERATOR_CONFIRMATION -cne 'RUN_CONTROL_PLANE_PREFLIGHT') {
            throw 'CONTROL_PLANE_OPERATOR_CONFIRMATION_INVALID'
          }
          Write-Output 'CONTROL_PLANE_EXPLICIT_INVOCATION=PASS'
          Write-Output 'ORDER_SUBMISSION_ENABLED=false'
          Write-Output 'LIVE_TRADING_ALLOWED=false'

      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Resolve MT5 Common Files and force the kill switch to DENY
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $resolver = Join-Path $env:GITHUB_WORKSPACE 'tools\resolve_mt5_common_files_v1.ps1'
          if (!(Test-Path -LiteralPath $resolver -PathType Leaf)) {
            throw 'CONTROL_PLANE_MT5_PROFILE_RESOLVER_MISSING'
          }
          $resolverOutput = & $resolver -TerminalPath "$env:TERMINAL_PATH" -SetDenyKillSwitch
          $resolverExit = $LASTEXITCODE
          $resolverOutput | ForEach-Object {
            $line = [string]$_
            if ($line -match '^G13_MT5_COMMON_FILES=') { Write-Output 'G13_MT5_COMMON_FILES=[REDACTED]' }
            elseif ($line -match '^G13_MT5_TERMINAL_OWNER=') { Write-Output 'G13_MT5_TERMINAL_OWNER=[REDACTED]' }
            elseif ($line -match '^G13_MT5_TERMINAL_PIDS=') { Write-Output 'G13_MT5_TERMINAL_PIDS=[REDACTED]' }
            else { Write-Output $line }
          }
          if ($resolverExit -ne 0) { throw 'CONTROL_PLANE_MT5_PROFILE_RESOLUTION_FAILED' }

      - name: Require configured paths and trusted account binding
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ledger = $env:FOREXAI_TRADE_LEDGER_PATH
          $envelope = $env:FOREXAI_AUTHENTICATED_ENVELOPE_PATH
          $request = $env:FOREXAI_CONTROL_PLANE_ADMISSION_REQUEST_PATH
          $providerPublicKey = $env:FOREXAI_CONTROL_PLANE_ADMISSION_PUBLIC_KEY
          $expectedAccountFingerprint = $env:FOREXAI_EXPECTED_DEMO_ACCOUNT_FINGERPRINT
          if ([string]::IsNullOrWhiteSpace($providerPublicKey)) {
            throw 'CONTROL_PLANE_ADMISSION_PUBLIC_KEY_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($expectedAccountFingerprint) -or $expectedAccountFingerprint -cnotmatch '^[0-9a-f]{16}$') {
            throw 'CONTROL_PLANE_EXPECTED_DEMO_ACCOUNT_FINGERPRINT_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($request)) {
            throw 'CONTROL_PLANE_ADMISSION_REQUEST_PATH_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($ledger)) {
            throw 'CONTROL_PLANE_LEDGER_PATH_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($envelope)) {
            throw 'CONTROL_PLANE_ENVELOPE_PATH_NOT_CONFIGURED'
          }
          if (!(Test-Path -LiteralPath $request -PathType Leaf)) {
            throw 'CONTROL_PLANE_ADMISSION_REQUEST_FILE_MISSING'
          }
          $requestFull = [System.IO.Path]::GetFullPath($request)
          $ledgerFull = [System.IO.Path]::GetFullPath($ledger)
          $envelopeFull = [System.IO.Path]::GetFullPath($envelope)
          if ($requestFull -eq $ledgerFull -or $requestFull -eq $envelopeFull -or $ledgerFull -eq $envelopeFull) {
            throw 'CONTROL_PLANE_PATH_COLLISION'
          }
          Write-Output 'CONTROL_PLANE_RUNNER_PATHS=CONFIGURED'
          Write-Output 'CONTROL_PLANE_ADMISSION_REQUEST=EXISTS'

      - name: Resolve Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pythonExe = $null
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { $pythonExe = $cmd.Source }
          if (-not $pythonExe) {
            foreach ($candidate in @(
              'C:\Users\Star\AppData\Local\Programs\Python\Python312\python.exe',
              'C:\Program Files\Python312\python.exe',
              'C:\Program Files\Python311\python.exe'
            )) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { $pythonExe = $candidate; break }
            }
          }
          if (-not $pythonExe) { throw 'CONTROL_PLANE_PYTHON_NOT_FOUND' }
          $versionOutput = & $pythonExe -c "import sys; print(sys.version_info.major, sys.version_info.minor)" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'CONTROL_PLANE_PYTHON_VERSION_CHECK_FAILED' }
          $version = ([string]($versionOutput | Select-Object -Last 1)).Trim()
          if ($version -notmatch '^3 (11|12|13)$') { throw 'CONTROL_PLANE_PYTHON_VERSION_UNSUPPORTED' }
          "PYTHON_EXE=$pythonExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "CONTROL_PLANE_PYTHON_VERSION=$version"

      - name: Run Control Plane contract tests
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
            & $env:PYTHON_EXE -m pytest -q tests/test_control_plane_service_v1.py
            if ($LASTEXITCODE -ne 0) { throw 'CONTROL_PLANE_CONTRACT_TESTS_FAILED' }
          } finally {
            Pop-Location
          }

      - name: Produce signed DEMO authority envelope (never sends orders)
        shell: powershell
        env:
          FOREXAI_CONTROL_PLANE_HMAC_SECRET: ${{ secrets.FOREXAI_CONTROL_PLANE_HMAC_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FOREXAI_CONTROL_PLANE_ADMISSION_PUBLIC_KEY)) {
            throw 'CONTROL_PLANE_ADMISSION_PUBLIC_KEY_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($env:FOREXAI_EXPECTED_DEMO_ACCOUNT_FINGERPRINT) -or $env:FOREXAI_EXPECTED_DEMO_ACCOUNT_FINGERPRINT -cnotmatch '^[0-9a-f]{16}$') {
            throw 'CONTROL_PLANE_EXPECTED_DEMO_ACCOUNT_FINGERPRINT_NOT_CONFIGURED'
          }
          if ([string]::IsNullOrWhiteSpace($env:FOREXAI_CONTROL_PLANE_HMAC_SECRET)) {
            throw 'CONTROL_PLANE_ENVELOPE_SECRET_NOT_CONFIGURED'
          }
          New-Item -ItemType Directory -Force -Path (Join-Path $env:GITHUB_WORKSPACE 'artifacts/g13-control-plane') | Out-Null
          $reportPath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/g13-control-plane/producer-report.json'
          $producerArgs = @(
            '-m', 'tools.control_plane_service_v1',
            '--admission-request', $env:FOREXAI_CONTROL_PLANE_ADMISSION_REQUEST_PATH,
            '--ledger', $env:FOREXAI_TRADE_LEDGER_PATH,
            '--authenticated-envelope-output', $env:FOREXAI_AUTHENTICATED_ENVELOPE_PATH,
            '--terminal-path', $env:TERMINAL_PATH
          )
          Push-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
            & $env:PYTHON_EXE @producerArgs | Tee-Object -FilePath $reportPath
            $producerExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($producerExit -ne 0) { throw 'CONTROL_PLANE_PRODUCER_FAILED_CLOSED' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS' -or $report.orders_submitted -ne $false -or $report.live_trading_allowed -ne $false) {
            throw 'CONTROL_PLANE_PRODUCER_REPORT_ASSERTION_FAILED'
          }
          Write-Output 'CONTROL_PLANE_PRODUCER_STATUS=PASS'
          Write-Output 'CONTROL_PLANE_ORDER_SUBMISSION=false'
          Write-Output 'CONTROL_PLANE_LIVE_TRADING_ALLOWED=false'

      - name: Upload redacted Control Plane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forexai-control-plane-producer-v1
          path: artifacts/g13-control-plane/producer-report.json
          if-no-files-found: ignore
