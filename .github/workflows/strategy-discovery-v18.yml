name: ForexAI v18 Cost-Aware Strategy Discovery
on:
  workflow_dispatch:
    inputs:
      start: {required: true, default: '2022-01-01', type: string}
      end: {required: true, default: '2025-01-01', type: string}
      spread_pips: {required: true, default: '0.5', type: string}
      slippage_pips: {required: true, default: '0.2', type: string}
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Ingest REAL EURUSD M1
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Discover interpretable strategy combinations
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}', SPREAD: '${{ inputs.spread_pips }}', SLIPPAGE: '${{ inputs.slippage_pips }}'}
        run: |
          python - <<'PY'
          import os,glob,json
          from pathlib import Path
          import pandas as pd,numpy as np
          fs=glob.glob('data/real/normalized/EURUSD_M1_*.csv')
          if not fs: raise SystemExit('REAL_M1_REQUIRED')
          d=pd.read_csv(max(fs,key=lambda x:Path(x).stat().st_size)); cols={x.lower():x for x in d.columns}; ts=next(x for x in d if x.lower() in ('timestamp','time','datetime'))
          d=d.rename(columns={cols[k]:k.title() for k in ('open','high','low','close')}); d[ts]=pd.to_datetime(d[ts],utc=True); d=d.set_index(ts).sort_index(); d=d[(d.index>=pd.Timestamp(os.environ['START'],tz='UTC'))&(d.index<pd.Timestamp(os.environ['END'],tz='UTC'))]
          O,H,L,C=d.Open.to_numpy(),d.High.to_numpy(),d.Low.to_numpy(),d.Close.to_numpy(); pip=.0001; cost=2*(float(os.environ['SPREAD'])+float(os.environ['SLIPPAGE'])); r=pd.Series(H-L); atr=r.rolling(60,min_periods=60).mean().to_numpy(); ema20=pd.Series(C).ewm(span=20,adjust=False).mean().to_numpy(); ema50=pd.Series(C).ewm(span=50,adjust=False).mean().to_numpy(); hh20=pd.Series(H).rolling(20).max().shift(1).to_numpy(); ll20=pd.Series(L).rolling(20).min().shift(1).to_numpy(); mom10=np.r_[np.zeros(10),C[10:]-C[:-10]]; body=np.abs(C-O)/np.maximum(H-L,pip); hour=d.index.hour.to_numpy()
          entries={'trend':np.where((ema20>ema50)&(C>ema20),1,np.where((ema20<ema50)&(C<ema20),-1,0)),'breakout':np.where(C>hh20,1,np.where(C<ll20,-1,0)),'momentum':np.where(mom10>0,1,np.where(mom10<0,-1,0)),'volbreak':np.where((H-L>np.nan_to_num(atr)*1.5)&(C>O),1,np.where((H-L>np.nan_to_num(atr)*1.5)&(C<O),-1,0))}
          regimes={'all':np.ones(len(d),bool),'high_vol':(H-L)>=np.nan_to_num(atr)*1.5,'low_vol':(H-L)<=np.nan_to_num(atr)*0.75,'london':(hour>=8)&(hour<12),'ny':(hour>=13)&(hour<17)}
          exits=[(1.0,1.0,30),(1.0,1.5,60),(1.0,2.0,60),(1.5,2.0,90),(2.0,3.0,120)]
          def execute(sig,mask,slm,tpm,expiry):
            pn=[]; i=0
            while i<len(d)-1:
              if sig[i]==0 or not mask[i] or not np.isfinite(atr[i]): i+=1; continue
              direction=int(sig[i]); entry=C[i+1]; risk=max(atr[i]*slm,pip); sl=entry-risk if direction>0 else entry+risk; tp=entry+risk*tpm if direction>0 else entry-risk*tpm; hit=None; ex=None
              for j in range(i+1,min(len(d),i+1+expiry)):
                if direction>0:
                  if L[j]<=sl: hit=-slm*atr[i]/pip-cost; ex=j; break
                  if H[j]>=tp: hit=tpm*slm*atr[i]/pip-cost; ex=j; break
                else:
                  if H[j]>=sl: hit=-slm*atr[i]/pip-cost; ex=j; break
                  if L[j]<=tp: hit=tpm*slm*atr[i]/pip-cost; ex=j; break
              if hit is not None: pn.append(hit); i=ex+1
              else: i+=1
            a=np.asarray(pn); gp=a[a>0].sum() if len(a) else 0; gl=-a[a<0].sum() if len(a) else 0; eq=np.cumsum(a) if len(a) else np.array([0]); return {'trades':int(len(a)),'win_rate_pct':float((a>0).mean()*100) if len(a) else 0,'profit_factor':float(gp/gl) if gl else 999.,'net_pips':float(a.sum()) if len(a) else 0,'expectancy_pips':float(a.mean()) if len(a) else 0,'max_dd_pips':float((np.maximum.accumulate(eq)-eq).max()) if len(a) else 0}
          rows=[]
          for en,sig in entries.items():
            for rg,mask in regimes.items():
              for slm,tpm,exp in exits:
                st=execute(sig,mask,slm,tpm,exp); rows.append({'entry':en,'regime':rg,'sl_mult':slm,'tp_mult':tpm,'expiry':exp,**st})
          rows=sorted(rows,key=lambda x:(x['profit_factor'],x['expectancy_pips']),reverse=True); eligible=[x for x in rows if x['trades']>=100 and x['profit_factor']>1 and x['expectancy_pips']>0]; out={'schema_version':'forexai.strategy_discovery.v18','cost_pips_round_trip':cost,'candidate_count':len(rows),'eligible_count':len(eligible),'ranking':rows[:50],'eligible_candidates':eligible[:25]}; Path('artifacts').mkdir(exist_ok=True); Path('artifacts/strategy-discovery-v18.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: strategy-discovery-v18, path: artifacts/, if-no-files-found: warn}
