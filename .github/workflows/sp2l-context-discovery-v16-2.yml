name: ForexAI SP2L v16.2 Context-Aware Rule Discovery
on:
  workflow_dispatch:
    inputs:
      start: {required: true, default: '2022-01-01', type: string}
      end: {required: true, default: '2025-01-01', type: string}
      spread_pips: {required: true, default: '0.5', type: string}
      slippage_pips: {required: true, default: '0.2', type: string}
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Ingest REAL EURUSD M1
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Discover interpretable context variants
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}', SPREAD: '${{ inputs.spread_pips }}', SLIPPAGE: '${{ inputs.slippage_pips }}'}
        run: |
          python - <<'PY'
          import os,glob,json
          from pathlib import Path
          import pandas as pd,numpy as np
          from research.optimization.sp2l_v15_7 import Params,signals
          fs=glob.glob('data/real/normalized/EURUSD_M1_*.csv')
          if not fs: raise SystemExit('REAL_M1_REQUIRED')
          d=pd.read_csv(max(fs,key=lambda x:Path(x).stat().st_size)); c={x.lower():x for x in d.columns}; ts=next(x for x in d if x.lower() in ('timestamp','time','datetime'))
          d=d.rename(columns={c[k]:k.title() for k in ('open','high','low','close')}); d[ts]=pd.to_datetime(d[ts],utc=True); d=d.set_index(ts).sort_index(); d=d[(d.index>=pd.Timestamp(os.environ['START'],tz='UTC'))&(d.index<pd.Timestamp(os.environ['END'],tz='UTC'))]
          base=signals(d,Params()).to_numpy(); H=d.High.to_numpy(); L=d.Low.to_numpy(); C=d.Close.to_numpy(); O=d.Open.to_numpy(); pip=.0001; cost=2*(float(os.environ['SPREAD'])+float(os.environ['SLIPPAGE'])); rng=(H-L); atr=rng.rolling(60).mean().to_numpy() if hasattr(rng,'rolling') else pd.Series(rng).rolling(60).mean().to_numpy(); body=np.abs(C-O)/np.maximum(rng,pip); wick=np.minimum(np.abs(H-np.maximum(O,C)),np.abs(np.minimum(O,C)-L))/np.maximum(rng,pip)
          variants=[]
          for b in (0.25,0.4,0.55): variants.append((f'body_ge_{b}',('body',b)))
          for w in (0.2,0.35,0.5): variants.append((f'wick_le_{w}',('wick',w)))
          for am in (0.75,1.0,1.25,1.5): variants.append((f'range_atr_ge_{am}',('atr',am)))
          for hour0,hour1 in ((7,10),(8,11),(9,12),(10,13)): variants.append((f'utc_{hour0}_{hour1}',('hour',(hour0,hour1))))
          out={'schema_version':'forexai.sp2l_context_discovery.v16.2','cost_pips_round_trip':cost,'variants':{}}
          def run(s):
            pn=[]
            for i in np.flatnonzero(s):
              if i+1>=len(d): continue
              r=max(H[i]-L[i],pip); e=C[i+1]; sl=e-r if s[i]>0 else e+r; tp=e+1.5*r if s[i]>0 else e-1.5*r; hit=None
              for j in range(i+1,min(len(d),i+1+Params().expiry_bars)):
                if s[i]>0:
                  if L[j]<=sl: hit=-r/pip-cost; break
                  if H[j]>=tp: hit=1.5*r/pip-cost; break
                else:
                  if H[j]>=sl: hit=-r/pip-cost; break
                  if L[j]<=tp: hit=1.5*r/pip-cost; break
              if hit is not None: pn.append(hit)
            a=np.asarray(pn); gp=a[a>0].sum() if len(a) else 0; gl=-a[a<0].sum() if len(a) else 0; eq=np.cumsum(a) if len(a) else np.array([0]); return {'trades':int(len(a)),'win_rate_pct':float((a>0).mean()*100) if len(a) else 0,'profit_factor':float(gp/gl) if gl else 999.,'net_pips':float(a.sum()) if len(a) else 0,'expectancy_pips':float(a.mean()) if len(a) else 0,'max_dd_pips':float((np.maximum.accumulate(eq)-eq).max()) if len(a) else 0}
          out['variants']['baseline']=run(base)
          for name,(kind,v) in variants:
            s=base.copy(); m=np.ones(len(d),bool)
            if kind=='body': m &= body>=v
            elif kind=='wick': m &= wick<=v
            elif kind=='atr': m &= rng>=np.nan_to_num(atr)*v
            else:
              h=d.index.hour.to_numpy(); m &= (h>=v[0])&(h<v[1])
            s[~m]=0; out['variants'][name]=run(s)
          Path('artifacts').mkdir(exist_ok=True); Path('artifacts/sp2l-v16-2-context-discovery.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sp2l-v16-2-context-discovery, path: artifacts/, if-no-files-found: warn}
