name: Provider dependency lock generation

on:
  push:
    branches:
      - ops/bootstrap-provider-host-v1-20261025
    paths:
      - ".github/workflows/provider-dependency-lock-generation.yml"
      - "requirements-provider.in"
      - "requirements-provider-test.in"

permissions:
  contents: read

jobs:
  generate-and-verify-locks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed lock inputs
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate hash locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "pip-tools==7.5.0"
          if ($LASTEXITCODE -ne 0) { throw "PIP_TOOLS_INSTALL_FAILED" }

          python -m piptools compile --generate-hashes --resolver=backtracking --no-emit-index-url --output-file=requirements-provider.lock.txt requirements-provider.in
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_GENERATION_FAILED" }

          python -m piptools compile --generate-hashes --resolver=backtracking --no-emit-index-url --output-file=requirements-provider-test.lock.txt requirements-provider-test.in
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_GENERATION_FAILED" }

      - name: Verify runtime lock installs on Windows Python 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .provider-runtime-lock-verify
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_VERIFY_VENV_FAILED" }
          .\.provider-runtime-lock-verify\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-provider.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_INSTALL_FAILED" }
          .\.provider-runtime-lock-verify\Scripts\python.exe -c "import cryptography; print('PROVIDER_RUNTIME_LOCK=PASS', cryptography.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_IMPORT_FAILED" }

      - name: Verify test lock installs on Windows Python 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m venv .provider-test-lock-verify
          if ($LASTEXITCODE -ne 0) { throw "TEST_VERIFY_VENV_FAILED" }
          .\.provider-test-lock-verify\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r requirements-provider-test.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_INSTALL_FAILED" }
          .\.provider-test-lock-verify\Scripts\python.exe -c "import cryptography, pytest; print('PROVIDER_TEST_LOCK=PASS', cryptography.__version__, pytest.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_IMPORT_FAILED" }

      - name: Print lock files for explicit review
        shell: pwsh
        run: |
          Write-Output "===== BEGIN requirements-provider.lock.txt ====="
          Get-Content -LiteralPath requirements-provider.lock.txt -Raw
          Write-Output "===== END requirements-provider.lock.txt ====="
          Write-Output "===== BEGIN requirements-provider-test.lock.txt ====="
          Get-Content -LiteralPath requirements-provider-test.lock.txt -Raw
          Write-Output "===== END requirements-provider-test.lock.txt ====="

      - name: Upload generated hash locks
        uses: actions/upload-artifact@v4
        with:
          name: provider-hash-locks-${{ github.sha }}
          path: |
            requirements-provider.lock.txt
            requirements-provider-test.lock.txt
          if-no-files-found: error
