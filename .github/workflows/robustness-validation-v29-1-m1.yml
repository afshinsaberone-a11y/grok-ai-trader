name: ForexAI v29.1 Robustness Validation — M1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  robustness-validation-m1:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      TIMEFRAME: M1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime
        run: |
          python - <<'PY'
          import numpy, pandas
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          PY

      - name: Download REAL EURUSD M1 dataset
        run: |
          set -euo pipefail
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --start 2022-01-01 \
            --end 2026-01-01 \
            --timeframe "$TIMEFRAME" \
            --output data/real \
            --validate \
            --manifest

      - name: Locate REAL M1 dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M1_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          test -f "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "Selected timeframe: M1 (fixed; no manual timeframe input)"
          echo "Using REAL dataset: $DATA"

      - name: Validate REAL M1 dataset and cadence
        run: |
          python - <<'PY'
          import os, pandas as pd
          p=os.environ['DATA']
          df=pd.read_csv(p)
          ts='timestamp' if 'timestamp' in df.columns else 'time'
          t=pd.to_datetime(df[ts], utc=True).sort_values()
          if t.duplicated().any(): raise SystemExit('duplicate timestamps')
          if not ((t.min() < pd.Timestamp('2025-01-01', tz='UTC')) and (t.max() >= pd.Timestamp('2025-12-31', tz='UTC'))):
              raise SystemExit('dataset does not contain required pre-OOS and validation history')
          med=t.diff().dropna().dt.total_seconds().div(60).median()
          if abs(float(med)-1.0)>0.01: raise SystemExit(f'cadence mismatch: {med} vs 1.0')
          print('selected_timeframe=M1')
          print('rows',len(df),'median_cadence_minutes',med,'synthetic_fallback=FORBIDDEN')
          PY

      - name: Run v29.1 frozen robustness validation — M1
        run: |
          python -m research.optimization.robustness_validation_v29_1 \
            --data "$DATA" \
            --timeframe M1 \
            --output artifacts/robustness-validation-v29-1-M1.json

      - name: Assert output timeframe is M1
        run: |
          python - <<'PY'
          import json
          p='artifacts/robustness-validation-v29-1-M1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('timeframe') == 'M1', d.get('timeframe')
          print('OUTPUT_TIMEFRAME_OK=M1')
          PY

      - name: Validate fail-closed promotion state
        run: |
          python - <<'PY'
          import json
          p='artifacts/robustness-validation-v29-1-M1.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d['real_data_only'] is True
          assert d['oos_evaluated'] is False
          assert d['optimization_enabled'] is False
          assert d['execution_model']['entry']=='next_bar_open'
          assert d['execution_model']['round_trip_cost_pips']==1.4
          assert d['execution_model']['same_bar_resolution']=='SL first (conservative)'
          assert d['execution_model']['overlap']=='one position at a time'
          assert d['promotion_gate']['ready_for_oos'] == d['promotion_gate']['robustness_pass']
          if d['promotion_gate']['ready_for_oos']:
              assert d['validation']['strict_gate_pass'] is True
          print('V29.1_M1_VALIDATION_SCHEMA_OK')
          print('robustness_pass=', d['promotion_gate']['robustness_pass'])
          print('ready_for_oos=', d['promotion_gate']['ready_for_oos'])
          PY

      - name: Upload v29.1 M1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-validation-v29-1-M1
          path: artifacts/robustness-validation-v29-1-M1.json
          if-no-files-found: error
