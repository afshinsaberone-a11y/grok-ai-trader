name: ForexAI G13 MT5 Runtime Safety Probe M15 v2

# Read-only execution safety verification. No EA/order submission is possible.
# Runtime evidence is dispatched only by the main G13 watchdog after exact-SHA signal parity.
# Every run is bound to the current main SHA through the official watchdog's ordered chain.
# Every probe is installed under a run-unique MT5 Scripts directory to avoid
# collisions with older MT5 processes or files locked by a prior run.
on:
  # The watchdog dispatches this only after exact-SHA Compile + Signal Parity.
  # Do not let PR/source pushes seize the single Windows MT5 runner early.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Shared with the legacy manual-only probe so they never run concurrently
  # against the same terminal/runner. Queue rather than cancel active safety evidence.
  group: g13-mt5-runtime-safety-probe-shared
  cancel-in-progress: false

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  runtime-safety-probe:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 20
    env:
      MT5_ROOT: 'C:\Program Files\MetaTrader 5'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve MT5 service paths
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MT5_ROOT
          $meta = Join-Path $root 'metaeditor64.exe'
          $terminal = Join-Path $root 'terminal64.exe'
          foreach ($p in @($meta,$terminal)) {
            if (!(Test-Path -LiteralPath $p -PathType Leaf)) { throw 'G13_MT5_INSTALLATION_FILE_MISSING' }
          }

          # Resolve the actual terminal owner's profile. The runner service is
          # LocalSystem/Session 0, so launching the probe in its own identity
          # cannot reliably start the user's EURUSD M15 startup script.
          $resolver = Join-Path $env:GITHUB_WORKSPACE 'tools\resolve_mt5_common_files_v1.ps1'
          if (!(Test-Path -LiteralPath $resolver -PathType Leaf)) { throw 'G13_MT5_PROFILE_RESOLVER_MISSING' }
          $resolved = @(& $resolver -TerminalPath $terminal)
          $commonLine = $resolved | Where-Object { ([string]$_) -match '^G13_MT5_COMMON_FILES=' } | Select-Object -Last 1
          $ownerLine = $resolved | Where-Object { ([string]$_) -match '^G13_MT5_TERMINAL_OWNER=' } | Select-Object -Last 1
          if (-not $commonLine) { throw 'G13_MT5_COMMON_FILES_UNRESOLVED' }
          if (-not $ownerLine) { throw 'G13_MT5_OWNER_UNRESOLVED' }
          $common = ([string]$commonLine).Substring('G13_MT5_COMMON_FILES='.Length)
          $interactiveAccount = ([string]$ownerLine).Substring('G13_MT5_TERMINAL_OWNER='.Length)
          if (!(Test-Path -LiteralPath $common -PathType Container)) { throw 'G13_MT5_COMMON_FILES_MISSING' }
          if ([string]::IsNullOrWhiteSpace($interactiveAccount) -or
              $interactiveAccount -match '^(SYSTEM|LOCAL SERVICE|NETWORK SERVICE)$') {
            throw 'G13_MT5_INTERACTIVE_ACCOUNT_INVALID'
          }

          $appData = $common -replace '[\\/]+MetaQuotes[\\/]+Terminal[\\/]+Common[\\/]+Files$', ''
          if ([string]::IsNullOrWhiteSpace($appData) -or $appData -eq $common) { throw 'G13_MT5_APPDATA_DERIVATION_FAILED' }
          $serviceData = Join-Path $appData 'MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075'
          $scriptsRoot = Join-Path $serviceData 'MQL5\Scripts'
          foreach ($p in @($serviceData,$scriptsRoot)) {
            if (!(Test-Path -LiteralPath $p -PathType Container)) { throw 'G13_MT5_USER_PROFILE_SCRIPT_PATH_MISSING' }
          }

          "APPDATA=$appData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_APPDATA=$appData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_SERVICE_DATA_ROOT=$serviceData" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_COMMON_FILES=$common" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "MT5_SCRIPTS_ROOT=$scriptsRoot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "G13_MT5_INTERACTIVE_ACCOUNT=$interactiveAccount" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "G13_AUTH_OFF_SCRIPT=G13_Safety_Probe_AuthOff_$($env:GITHUB_RUN_ID)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "G13_AUTH_ON_SCRIPT=G13_Safety_Probe_AuthOn_$($env:GITHUB_RUN_ID)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host 'MT5_PROFILE_RESOLUTION=PASS'
          Write-Host 'MT5_RUNTIME_PROBE_LAUNCH_MODE=INTERACTIVE_TASK'

      - name: Static no-order preflight
        run: |
          $ErrorActionPreference = 'Stop'
          $probeFiles = @(
            'research\optimization\G13_Safety_Probe_AuthOff.mq5',
            'research\optimization\G13_Safety_Probe_AuthOn.mq5'
          )
          $forbidden = @('CTrade','trade.Sell(','trade.Buy(','OrderSend(','PositionOpen(','BuyLimit(','BuyStop(','SellLimit(','SellStop(')
          foreach ($file in $probeFiles) {
            $text = Get-Content -LiteralPath $file -Raw
            foreach ($token in $forbidden) {
              if ($text.Contains($token)) { throw "Order API token found in non-trading probe: $file :: $token" }
            }
            if (-not $text.Contains('orders_submitted,false')) { throw "Probe lacks explicit no-order invariant: $file" }
            if (-not $text.Contains('probe_only,true')) { throw "Probe lacks probe_only invariant: $file" }
          }
          Write-Host "MT5_PROBE_NO_ORDER_PREFLIGHT_OK"

      - name: Compile safety probes
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\safety_probe_build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          Remove-Item (Join-Path $buildDir '*') -Recurse -Force -ErrorAction SilentlyContinue
          foreach ($name in @('G13_Safety_Probe_AuthOff','G13_Safety_Probe_AuthOn')) {
            $src = Join-Path $buildDir ($name + '.mq5')
            $ex5 = Join-Path $buildDir ($name + '.ex5')
            $log = Join-Path $buildDir ($name + '.log')
            Copy-Item (Join-Path $env:GITHUB_WORKSPACE ('research\optimization\' + $name + '.mq5')) $src -Force
            Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $meta -WorkingDirectory $buildDir -ArgumentList @("/compile:$src",'/log') -Wait -PassThru
            if (!(Test-Path -LiteralPath $log)) { throw "MetaEditor log missing for $name" }
            $logText = Get-Content -LiteralPath $log -Raw
            $m=[regex]::Match($logText,'Result:\s*(\d+) errors,\s*(\d+) warnings')
            if (!$m.Success) { throw "Unable to parse MetaEditor result for $name" }
            $errors=[int]$m.Groups[1].Value
            $warnings=[int]$m.Groups[2].Value
            Write-Host "PROBE=$name METAEDITOR_EXIT=$($proc.ExitCode) ERRORS=$errors WARNINGS=$warnings"
            if ($errors -ne 0) { throw "Probe $name failed to compile" }
            if (!(Test-Path -LiteralPath $ex5)) { throw "Probe $name produced no EX5" }
          }
          Write-Host "MT5_SAFETY_PROBE_COMPILE_OK"

      - name: Deploy run-unique non-trading probes
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:MT5_SCRIPTS_ROOT -PathType Container)) {
            throw "MT5 Scripts destination missing: $env:MT5_SCRIPTS_ROOT"
          }
          $pairs = @(
            @{ Source='G13_Safety_Probe_AuthOff'; Dest=($env:G13_AUTH_OFF_SCRIPT + '.ex5') },
            @{ Source='G13_Safety_Probe_AuthOn'; Dest=($env:G13_AUTH_ON_SCRIPT + '.ex5') }
          )
          foreach ($pair in $pairs) {
            $src = Join-Path $env:GITHUB_WORKSPACE ('artifacts\g13\safety_probe_build\' + $pair.Source + '.ex5')
            $dst = Join-Path $env:MT5_SCRIPTS_ROOT $pair.Dest
            if (!(Test-Path -LiteralPath $src -PathType Leaf)) { throw "Probe EX5 missing: $src" }
            Copy-Item -LiteralPath $src -Destination $dst -Force
            $srcHash=(Get-FileHash $src -Algorithm SHA256).Hash
            $dstHash=(Get-FileHash $dst -Algorithm SHA256).Hash
            if($srcHash -ne $dstHash){throw "Probe deploy hash mismatch: $($pair.Source)"}
            Write-Host "DEPLOYED_PROBE=$($pair.Source) DEST=$dst SHA256=$dstHash"
          }
          Write-Host "MT5_SAFETY_PROBE_DEPLOY_OK=$env:MT5_SCRIPTS_ROOT"

      - name: Snapshot shared kill switch
        run: |
          $ErrorActionPreference = 'Stop'
          $switch = Join-Path $env:MT5_COMMON_FILES 'g13_demo_kill_switch.txt'
          $snapshot = Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_demo_kill_switch.before.txt'
          if (Test-Path -LiteralPath $switch) {
            Copy-Item -LiteralPath $switch -Destination $snapshot -Force
          } else {
            Set-Content -LiteralPath $snapshot -Value '__MISSING__' -Encoding ascii
          }
          Write-Host "KILL_SWITCH_SNAPSHOT_CREATED"

      - name: Run Auth OFF probe
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-TrimmedTextOrEmpty {
            param([Parameter(Mandatory = $true)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return '' }
            $raw = Get-Content -LiteralPath $Path -Raw -ErrorAction SilentlyContinue
            if ($null -eq $raw) { return '' }
            return ([string]$raw).Trim()
          }

          $terminal = Join-Path $env:MT5_ROOT 'terminal64.exe'
          $config = Join-Path $env:MT5_COMMON_FILES "g13-probe-auth-off-$($env:GITHUB_RUN_ID).ini"
          $done = Join-Path $env:MT5_COMMON_FILES 'g13_safety_probe_auth_off.done.txt'
          $scriptRel = $env:G13_AUTH_OFF_SCRIPT
          $scriptBinary = Join-Path $env:MT5_SCRIPTS_ROOT ($scriptRel + '.ex5')
          $taskName = "ForexAI-G13-AuthOff-$($env:GITHUB_RUN_ID)"
          $schtasks = Join-Path $env:WINDIR 'System32\schtasks.exe'
          Remove-Item -LiteralPath $done -Force -ErrorAction SilentlyContinue
          if (!(Test-Path -LiteralPath $scriptBinary -PathType Leaf)) { throw 'G13_RUNTIME_AUTH_OFF_SCRIPT_BINARY_MISSING' }
          $switch = Join-Path $env:MT5_COMMON_FILES 'g13_demo_kill_switch.txt'
          if (!(Test-Path -LiteralPath $switch -PathType Leaf) -or (Get-Content -LiteralPath $switch -Raw).Trim() -ne 'DENY') { throw 'G13_RUNTIME_AUTH_OFF_KILL_SWITCH_NOT_DENY' }
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=$scriptRel
          Symbol=EURUSD
          Period=M15
          ShutdownTerminal=1
          "@ | Set-Content -LiteralPath $config -Encoding ascii

          $principal = New-ScheduledTaskPrincipal -UserId $env:G13_MT5_INTERACTIVE_ACCOUNT -LogonType Interactive -RunLevel Limited
          $action = New-ScheduledTaskAction -Execute $terminal -Argument ('/config:"' + $config + '" /skipupdate')
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 4) -MultipleInstances IgnoreNew
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            $startStdoutPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_off-task-start.stdout.txt"
            $startStderrPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_off-task-start.stderr.txt"
            Remove-Item -LiteralPath $startStdoutPath,$startStderrPath -Force -ErrorAction SilentlyContinue
            $start = Start-Process -FilePath $schtasks -ArgumentList @('/Run','/TN',$taskName) -NoNewWindow -RedirectStandardOutput $startStdoutPath -RedirectStandardError $startStderrPath -PassThru
            if (-not $start.WaitForExit(15000)) {
              Stop-Process -Id $start.Id -Force -ErrorAction SilentlyContinue
              Write-Host 'G13_RUNTIME_AUTH_OFF_TASK_START_TIMEOUT=true'
              throw 'G13_RUNTIME_AUTH_OFF_TASK_START_TIMEOUT'
            }
            $startStdoutText = Get-TrimmedTextOrEmpty -Path $startStdoutPath
            $startStderrText = Get-TrimmedTextOrEmpty -Path $startStderrPath
            if ($startStdoutText.Length -gt 2000) { $startStdoutText = $startStdoutText.Substring(0,2000) }
            if ($startStderrText.Length -gt 2000) { $startStderrText = $startStderrText.Substring(0,2000) }
            # Some Windows/PowerShell runner combinations expose a null cached
            # ExitCode even after WaitForExit succeeds. Refresh and read the process
            # result, and only use the exact schtasks SUCCESS acknowledgement as a
            # launch fallback. The run-unique MQL5 marker and safety assertions below
            # remain mandatory; this does not count as a successful probe by itself.
            $start.Refresh()
            $startExitCode = $null
            try {
              $rawStartExitCode = $start.ExitCode
              if ($null -ne $rawStartExitCode) { $startExitCode = [int]$rawStartExitCode }
            } catch {}
            if ($null -eq $startExitCode) {
              if ($startStdoutText -match '(?i)^SUCCESS:\s+Attempted to run the scheduled task\b') {
                $startExitCode = 0
                Write-Host 'G13_RUNTIME_AUTH_OFF_TASK_START_EXIT_CODE_FALLBACK=SUCCESS_STDOUT'
              } else {
                $startExitCode = -1
                Write-Host 'G13_RUNTIME_AUTH_OFF_TASK_START_EXIT_CODE_UNAVAILABLE=true'
              }
            }
            Write-Host "G13_RUNTIME_AUTH_OFF_TASK_START_EXIT_CODE=$startExitCode"
            Write-Host "G13_RUNTIME_AUTH_OFF_TASK_START_STDOUT=$startStdoutText"
            Write-Host "G13_RUNTIME_AUTH_OFF_TASK_START_STDERR=$startStderrText"
            Remove-Item -LiteralPath $startStdoutPath,$startStderrPath -Force -ErrorAction SilentlyContinue
            if ($startExitCode -ne 0) {
              $queryStdoutPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_off-task-query.stdout.txt"
              $queryStderrPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_off-task-query.stderr.txt"
              Remove-Item -LiteralPath $queryStdoutPath,$queryStderrPath -Force -ErrorAction SilentlyContinue
              try {
                $query = Start-Process -FilePath $schtasks -ArgumentList @('/Query','/TN',$taskName,'/FO','LIST') -NoNewWindow -RedirectStandardOutput $queryStdoutPath -RedirectStandardError $queryStderrPath -PassThru
                if (-not $query.WaitForExit(10000)) {
                  Stop-Process -Id $query.Id -Force -ErrorAction SilentlyContinue
                  Write-Host 'G13_RUNTIME_AUTH_OFF_TASK_QUERY_TIMEOUT=true'
                } else {
                  $queryStdoutText = Get-TrimmedTextOrEmpty -Path $queryStdoutPath
                  $queryStderrText = Get-TrimmedTextOrEmpty -Path $queryStderrPath
                  if ($queryStdoutText.Length -gt 2000) { $queryStdoutText = $queryStdoutText.Substring(0,2000) }
                  if ($queryStderrText.Length -gt 2000) { $queryStderrText = $queryStderrText.Substring(0,2000) }
                  Write-Host "G13_RUNTIME_AUTH_OFF_TASK_QUERY_EXIT_CODE=$($query.ExitCode)"
                  Write-Host "G13_RUNTIME_AUTH_OFF_TASK_QUERY_OUTPUT=$queryStdoutText"
                  Write-Host "G13_RUNTIME_AUTH_OFF_TASK_QUERY_STDERR=$queryStderrText"
                }
              } catch {
                Write-Host "G13_RUNTIME_AUTH_OFF_TASK_QUERY_ERROR=$($_.Exception.Message)"
              } finally {
                Remove-Item -LiteralPath $queryStdoutPath,$queryStderrPath -Force -ErrorAction SilentlyContinue
              }
              throw "G13_RUNTIME_AUTH_OFF_TASK_START_FAILED_EXIT_$startExitCode"
            }
            Write-Host 'G13_RUNTIME_AUTH_OFF_TASK_STARTED=true'

            $startedAt = Get-Date
            $deadline = $startedAt.AddSeconds(180)
            $nextHeartbeat = 15
            while ((Get-Date) -lt $deadline -and !(Test-Path -LiteralPath $done -PathType Leaf)) {
              $elapsed = [int]((Get-Date) - $startedAt).TotalSeconds
              if ($elapsed -ge $nextHeartbeat) { Write-Host "G13_RUNTIME_AUTH_OFF_WAITING_FOR_MARKER elapsed_seconds=$elapsed"; $nextHeartbeat += 15 }
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path -LiteralPath $done -PathType Leaf)) {
              $diag = [ordered]@{
                schema_version = 'forexai.g13.runtime_probe_startup_diagnostic.v1'
                mode = 'AUTH_OFF'
                result_marker_present = $false
                startup_config_present = [bool](Test-Path -LiteralPath $config -PathType Leaf)
                probe_ex5_present = [bool](Test-Path -LiteralPath $scriptBinary -PathType Leaf)
                kill_switch_state_is_deny = ((Test-Path -LiteralPath $switch -PathType Leaf) -and (Get-Content -LiteralPath $switch -Raw).Trim() -eq 'DENY')
                raw_terminal_logs_exported = $false
                raw_task_query_exported = $false
                raw_task_config_exported = $false
                orders_expected = $false
              }
              $diag | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13-runtime-probe-startup-diagnostic-AUTH_OFF.json') -Encoding utf8
              throw 'G13_RUNTIME_AUTH_OFF_MARKER_MISSING'
            }
            foreach ($assertion in @(
              @{ Pattern='^status,PASS$'; Error='G13_RUNTIME_AUTH_OFF_STATUS_INVALID' },
              @{ Pattern='^authorization,false$'; Error='G13_RUNTIME_AUTH_OFF_AUTHORIZATION_MISMATCH' },
              @{ Pattern='^execution_allowed,false$'; Error='G13_RUNTIME_AUTH_OFF_MUST_BLOCK' },
              @{ Pattern='^orders_submitted,false$'; Error='G13_RUNTIME_AUTH_OFF_ORDER_INVARIANT_FAILED' },
              @{ Pattern='^account_identity_verified,true$'; Error='G13_RUNTIME_AUTH_OFF_ACCOUNT_IDENTITY_UNVERIFIED' },
              @{ Pattern='^terminal_connected,true$'; Error='G13_RUNTIME_AUTH_OFF_TERMINAL_DISCONNECTED' },
              @{ Pattern='^demo_account,true$'; Error='G13_RUNTIME_AUTH_OFF_DEMO_ACCOUNT_UNVERIFIED' },
              @{ Pattern='^real_account_detected,false$'; Error='G13_RUNTIME_AUTH_OFF_REAL_ACCOUNT_REJECTED' }
            )) {
              if (!(Select-String -LiteralPath $done -Pattern $assertion.Pattern -Quiet)) { throw $assertion.Error }
            }
            Copy-Item -LiteralPath $done -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_safety_probe_auth_off.done.txt') -Force
            Write-Host 'MT5_AUTH_OFF_PROBE_OK'
          }
          finally {
            foreach ($verb in @('/End','/Delete')) {
              try {
                $args = @($verb,'/TN',$taskName)
                if ($verb -eq '/Delete') { $args += '/F' }
                $cleanup = Start-Process -FilePath $schtasks -ArgumentList $args -NoNewWindow -PassThru
                if (-not $cleanup.WaitForExit(10000)) { Stop-Process -Id $cleanup.Id -Force -ErrorAction SilentlyContinue; Write-Host "G13_RUNTIME_AUTH_OFF_TASK_CLEANUP_TIMEOUT=$verb" }
              } catch { Write-Host "G13_RUNTIME_AUTH_OFF_TASK_CLEANUP_ERROR=$verb" }
            }
            Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue
          }

      - name: Run Auth ON probe
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-TrimmedTextOrEmpty {
            param([Parameter(Mandatory = $true)][string]$Path)
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf)) { return '' }
            $raw = Get-Content -LiteralPath $Path -Raw -ErrorAction SilentlyContinue
            if ($null -eq $raw) { return '' }
            return ([string]$raw).Trim()
          }

          $terminal = Join-Path $env:MT5_ROOT 'terminal64.exe'
          $config = Join-Path $env:MT5_COMMON_FILES "g13-probe-auth-on-$($env:GITHUB_RUN_ID).ini"
          $done = Join-Path $env:MT5_COMMON_FILES 'g13_safety_probe_auth_on.done.txt'
          $scriptRel = $env:G13_AUTH_ON_SCRIPT
          $scriptBinary = Join-Path $env:MT5_SCRIPTS_ROOT ($scriptRel + '.ex5')
          $taskName = "ForexAI-G13-AuthOn-$($env:GITHUB_RUN_ID)"
          $schtasks = Join-Path $env:WINDIR 'System32\schtasks.exe'
          Remove-Item -LiteralPath $done -Force -ErrorAction SilentlyContinue
          if (!(Test-Path -LiteralPath $scriptBinary -PathType Leaf)) { throw 'G13_RUNTIME_AUTH_ON_SCRIPT_BINARY_MISSING' }
          $switch = Join-Path $env:MT5_COMMON_FILES 'g13_demo_kill_switch.txt'
          if (!(Test-Path -LiteralPath $switch -PathType Leaf) -or (Get-Content -LiteralPath $switch -Raw).Trim() -ne 'DENY') { throw 'G13_RUNTIME_AUTH_ON_KILL_SWITCH_NOT_DENY' }
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=$scriptRel
          Symbol=EURUSD
          Period=M15
          ShutdownTerminal=1
          "@ | Set-Content -LiteralPath $config -Encoding ascii

          $principal = New-ScheduledTaskPrincipal -UserId $env:G13_MT5_INTERACTIVE_ACCOUNT -LogonType Interactive -RunLevel Limited
          $action = New-ScheduledTaskAction -Execute $terminal -Argument ('/config:"' + $config + '" /skipupdate')
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 4) -MultipleInstances IgnoreNew
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            $startStdoutPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_on-task-start.stdout.txt"
            $startStderrPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_on-task-start.stderr.txt"
            Remove-Item -LiteralPath $startStdoutPath,$startStderrPath -Force -ErrorAction SilentlyContinue
            $start = Start-Process -FilePath $schtasks -ArgumentList @('/Run','/TN',$taskName) -NoNewWindow -RedirectStandardOutput $startStdoutPath -RedirectStandardError $startStderrPath -PassThru
            if (-not $start.WaitForExit(15000)) {
              Stop-Process -Id $start.Id -Force -ErrorAction SilentlyContinue
              Write-Host 'G13_RUNTIME_AUTH_ON_TASK_START_TIMEOUT=true'
              throw 'G13_RUNTIME_AUTH_ON_TASK_START_TIMEOUT'
            }
            $startStdoutText = Get-TrimmedTextOrEmpty -Path $startStdoutPath
            $startStderrText = Get-TrimmedTextOrEmpty -Path $startStderrPath
            if ($startStdoutText.Length -gt 2000) { $startStdoutText = $startStdoutText.Substring(0,2000) }
            if ($startStderrText.Length -gt 2000) { $startStderrText = $startStderrText.Substring(0,2000) }
            # Some Windows/PowerShell runner combinations expose a null cached
            # ExitCode even after WaitForExit succeeds. Refresh and read the process
            # result, and only use the exact schtasks SUCCESS acknowledgement as a
            # launch fallback. The run-unique MQL5 marker and safety assertions below
            # remain mandatory; this does not count as a successful probe by itself.
            $start.Refresh()
            $startExitCode = $null
            try {
              $rawStartExitCode = $start.ExitCode
              if ($null -ne $rawStartExitCode) { $startExitCode = [int]$rawStartExitCode }
            } catch {}
            if ($null -eq $startExitCode) {
              if ($startStdoutText -match '(?i)^SUCCESS:\s+Attempted to run the scheduled task\b') {
                $startExitCode = 0
                Write-Host 'G13_RUNTIME_AUTH_ON_TASK_START_EXIT_CODE_FALLBACK=SUCCESS_STDOUT'
              } else {
                $startExitCode = -1
                Write-Host 'G13_RUNTIME_AUTH_ON_TASK_START_EXIT_CODE_UNAVAILABLE=true'
              }
            }
            Write-Host "G13_RUNTIME_AUTH_ON_TASK_START_EXIT_CODE=$startExitCode"
            Write-Host "G13_RUNTIME_AUTH_ON_TASK_START_STDOUT=$startStdoutText"
            Write-Host "G13_RUNTIME_AUTH_ON_TASK_START_STDERR=$startStderrText"
            Remove-Item -LiteralPath $startStdoutPath,$startStderrPath -Force -ErrorAction SilentlyContinue
            if ($startExitCode -ne 0) {
              $queryStdoutPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_on-task-query.stdout.txt"
              $queryStderrPath = Join-Path $env:RUNNER_TEMP "g13-runtime-$($env:GITHUB_RUN_ID)-auth_on-task-query.stderr.txt"
              Remove-Item -LiteralPath $queryStdoutPath,$queryStderrPath -Force -ErrorAction SilentlyContinue
              try {
                $query = Start-Process -FilePath $schtasks -ArgumentList @('/Query','/TN',$taskName,'/FO','LIST') -NoNewWindow -RedirectStandardOutput $queryStdoutPath -RedirectStandardError $queryStderrPath -PassThru
                if (-not $query.WaitForExit(10000)) {
                  Stop-Process -Id $query.Id -Force -ErrorAction SilentlyContinue
                  Write-Host 'G13_RUNTIME_AUTH_ON_TASK_QUERY_TIMEOUT=true'
                } else {
                  $queryStdoutText = Get-TrimmedTextOrEmpty -Path $queryStdoutPath
                  $queryStderrText = Get-TrimmedTextOrEmpty -Path $queryStderrPath
                  if ($queryStdoutText.Length -gt 2000) { $queryStdoutText = $queryStdoutText.Substring(0,2000) }
                  if ($queryStderrText.Length -gt 2000) { $queryStderrText = $queryStderrText.Substring(0,2000) }
                  Write-Host "G13_RUNTIME_AUTH_ON_TASK_QUERY_EXIT_CODE=$($query.ExitCode)"
                  Write-Host "G13_RUNTIME_AUTH_ON_TASK_QUERY_OUTPUT=$queryStdoutText"
                  Write-Host "G13_RUNTIME_AUTH_ON_TASK_QUERY_STDERR=$queryStderrText"
                }
              } catch {
                Write-Host "G13_RUNTIME_AUTH_ON_TASK_QUERY_ERROR=$($_.Exception.Message)"
              } finally {
                Remove-Item -LiteralPath $queryStdoutPath,$queryStderrPath -Force -ErrorAction SilentlyContinue
              }
              throw "G13_RUNTIME_AUTH_ON_TASK_START_FAILED_EXIT_$startExitCode"
            }
            Write-Host 'G13_RUNTIME_AUTH_ON_TASK_STARTED=true'

            $startedAt = Get-Date
            $deadline = $startedAt.AddSeconds(180)
            $nextHeartbeat = 15
            while ((Get-Date) -lt $deadline -and !(Test-Path -LiteralPath $done -PathType Leaf)) {
              $elapsed = [int]((Get-Date) - $startedAt).TotalSeconds
              if ($elapsed -ge $nextHeartbeat) { Write-Host "G13_RUNTIME_AUTH_ON_WAITING_FOR_MARKER elapsed_seconds=$elapsed"; $nextHeartbeat += 15 }
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path -LiteralPath $done -PathType Leaf)) {
              $diag = [ordered]@{
                schema_version = 'forexai.g13.runtime_probe_startup_diagnostic.v1'
                mode = 'AUTH_ON'
                result_marker_present = $false
                startup_config_present = [bool](Test-Path -LiteralPath $config -PathType Leaf)
                probe_ex5_present = [bool](Test-Path -LiteralPath $scriptBinary -PathType Leaf)
                kill_switch_state_is_deny = ((Test-Path -LiteralPath $switch -PathType Leaf) -and (Get-Content -LiteralPath $switch -Raw).Trim() -eq 'DENY')
                raw_terminal_logs_exported = $false
                raw_task_query_exported = $false
                raw_task_config_exported = $false
                orders_expected = $false
              }
              $diag | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13-runtime-probe-startup-diagnostic-AUTH_ON.json') -Encoding utf8
              throw 'G13_RUNTIME_AUTH_ON_MARKER_MISSING'
            }
            foreach ($assertion in @(
              @{ Pattern='^status,PASS$'; Error='G13_RUNTIME_AUTH_ON_STATUS_INVALID' },
              @{ Pattern='^authorization,true$'; Error='G13_RUNTIME_AUTH_ON_AUTHORIZATION_MISMATCH' },
              @{ Pattern='^orders_submitted,false$'; Error='G13_RUNTIME_AUTH_ON_ORDER_INVARIANT_FAILED' },
              @{ Pattern='^account_identity_verified,true$'; Error='G13_RUNTIME_AUTH_ON_ACCOUNT_IDENTITY_UNVERIFIED' },
              @{ Pattern='^terminal_connected,true$'; Error='G13_RUNTIME_AUTH_ON_TERMINAL_DISCONNECTED' },
              @{ Pattern='^demo_account,true$'; Error='G13_RUNTIME_AUTH_ON_DEMO_ACCOUNT_UNVERIFIED' },
              @{ Pattern='^real_account_detected,false$'; Error='G13_RUNTIME_AUTH_ON_REAL_ACCOUNT_REJECTED' }
            )) {
              if (!(Select-String -LiteralPath $done -Pattern $assertion.Pattern -Quiet)) { throw $assertion.Error }
            }
            Copy-Item -LiteralPath $done -Destination (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_safety_probe_auth_on.done.txt') -Force
            Write-Host 'MT5_AUTH_ON_PROBE_OK'
          }
          finally {
            foreach ($verb in @('/End','/Delete')) {
              try {
                $args = @($verb,'/TN',$taskName)
                if ($verb -eq '/Delete') { $args += '/F' }
                $cleanup = Start-Process -FilePath $schtasks -ArgumentList $args -NoNewWindow -PassThru
                if (-not $cleanup.WaitForExit(10000)) { Stop-Process -Id $cleanup.Id -Force -ErrorAction SilentlyContinue; Write-Host "G13_RUNTIME_AUTH_ON_TASK_CLEANUP_TIMEOUT=$verb" }
              } catch { Write-Host "G13_RUNTIME_AUTH_ON_TASK_CLEANUP_ERROR=$verb" }
            }
            Remove-Item -LiteralPath $config -Force -ErrorAction SilentlyContinue
          }

      - name: Evaluate runtime evidence
        run: |
          $ErrorActionPreference = 'Stop'
          $off = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_safety_probe_auth_off.done.txt')
          $on = Get-Content (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_safety_probe_auth_on.done.txt')
          function Value([string[]]$lines,[string]$key) {
            $line=$lines | Where-Object { $_ -like ($key + ',*') } | Select-Object -First 1
            if(!$line){throw "Missing key $key"}
            return $line.Substring($key.Length+1)
          }
          $mode=Value $on 'account_mode'
          $demo=Value $on 'demo_account'
          $realAccount=Value $on 'real_account_detected'
          $authOnAllowed=Value $on 'execution_allowed'
          $authOffAllowed=Value $off 'execution_allowed'
          $ordersOn=Value $on 'orders_submitted'
          $ordersOff=Value $off 'orders_submitted'
          foreach($key in @(
            'terminal_connected','terminal_trade_allowed','mql_trade_allowed',
            'account_trade_allowed','account_trade_expert',
            'symbol_market_order_allowed','symbol_sl_allowed','symbol_tp_allowed',
            'symbol_trade_mode','stops_level_points'
          )){
            $null=Value $on $key
            $null=Value $off $key
          }
          if($demo -ne 'true'){throw "Runtime probe is not on DEMO account"}
          if($realAccount -ne 'false'){throw "Runtime probe is not on a DEMO-only account state"}
          if($authOffAllowed -ne 'false'){throw "Auth OFF allowed execution"}
          $expectedOnAllowed = (
            (Value $on 'authorization') -eq 'true' -and
            $demo -eq 'true' -and
            (Value $on 'terminal_connected') -eq 'true' -and
            (Value $on 'terminal_trade_allowed') -eq 'true' -and
            (Value $on 'mql_trade_allowed') -eq 'true' -and
            (Value $on 'account_trade_allowed') -eq 'true' -and
            (Value $on 'account_trade_expert') -eq 'true' -and
            (Value $on 'symbol_market_order_allowed') -eq 'true' -and
            (Value $on 'symbol_sl_allowed') -eq 'true' -and
            (Value $on 'symbol_tp_allowed') -eq 'true' -and
            ([int](Value $on 'stops_level_points')) -ge 0 -and
            (Value $on 'kill_switch_allow') -eq 'true' -and
            (Value $on 'other_g13_position') -eq 'false'
          )
          if((($authOnAllowed -eq 'true')) -ne $expectedOnAllowed){throw "Auth ON execution_allowed is inconsistent with permission/kill-switch/position evidence"}
          if($authOnAllowed -eq 'true'){
            Write-Host "DEMO_RUNTIME_GATE=ALL_POLICY_CONTROLS_CLEAR"
          } else {
            Write-Host "DEMO_RUNTIME_GATE=BLOCKED_BY_RUNTIME_CONTROL"
          }
          if($ordersOn -ne 'false' -or $ordersOff -ne 'false'){throw "Probe order-submission invariant violated"}
          Write-Host "ACCOUNT_MODE=$mode"
          Write-Host "DEMO_ACCOUNT=$demo"
          Write-Host "REAL_ACCOUNT_DETECTED=$realAccount"
          Write-Host "AUTH_OFF_ALLOWED=$authOffAllowed"
          Write-Host "AUTH_ON_ALLOWED=$authOnAllowed"
          Write-Host "ORDERS_OFF=$ordersOff"
          Write-Host "ORDERS_ON=$ordersOn"

      - name: Verify kill switch unchanged
        run: |
          $ErrorActionPreference = 'Stop'
          $switch = Join-Path $env:MT5_COMMON_FILES 'g13_demo_kill_switch.txt'
          $before = (Get-Content (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\g13_demo_kill_switch.before.txt') -Raw).Trim()
          if(Test-Path -LiteralPath $switch){$after=(Get-Content $switch -Raw).Trim()}else{$after='__MISSING__'}
          if($before -ne $after){throw 'Safety probes modified shared kill switch'}
          Write-Host 'KILL_SWITCH_UNCHANGED=true'

      - name: Upload runtime safety evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-mt5-runtime-safety-probe-m15-v2
          path: artifacts/g13/**
          if-no-files-found: warn
