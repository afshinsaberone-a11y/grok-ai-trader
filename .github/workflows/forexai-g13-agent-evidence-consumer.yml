name: ForexAI G13 Agent Evidence Consumer

on:
  workflow_run:
    workflows:
      - "ForexAI G13 OOS M15 Current"
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  consume:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile and test G13 Evidence Consumer
        run: |
          python -m py_compile agents/github_artifact_evidence_bridge.py agents/g13_agent_evidence_consumer.py
          python -m pytest -q tests/test_g13_agent_evidence_consumer.py

      - name: Download G13 OOS artifact from triggering run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/g13
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name g13-oos-m15-2026-current \
            --dir incoming/g13
          test -s incoming/g13/g13-oos-m15-2026.json
          echo "G13_ARTIFACT_PAYLOAD=incoming/g13/g13-oos-m15-2026.json" >> "$GITHUB_ENV"

      - name: Bridge G13 artifact into Agent Evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from agents.github_artifact_evidence_bridge import normalize_artifact, write_evidence
          repo=os.environ['GITHUB_REPOSITORY']
          run_id=int(os.environ['RUN_ID'])
          commit_sha=os.environ['COMMIT_SHA']
          name='g13-oos-m15-2026-current'
          raw=subprocess.check_output(
              ['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'],
              text=True, env=os.environ
          )
          page=json.loads(raw)
          matches=[a for a in page.get('artifacts',[]) if a.get('name')==name and not a.get('expired')]
          assert matches, f'no live {name} artifact found'
          meta=max(matches, key=lambda a: (a.get('created_at',''), int(a.get('id',0))))
          print('SELECTED_G13_ARTIFACT', meta['id'], meta.get('created_at'))
          payload=json.loads(Path('incoming/g13/g13-oos-m15-2026.json').read_text(encoding='utf-8'))
          envelope=normalize_artifact(
              artifact_id=int(meta['id']),
              artifact_name=str(meta['name']),
              artifact_digest=str(meta['digest']),
              run_id=run_id,
              job_id=None,
              commit_sha=commit_sha,
              payload=payload,
          )
          evidence_path=write_evidence(envelope, output_dir=Path('artifacts/g13-agent-evidence'))
          saved=json.loads(evidence_path.read_text(encoding='utf-8'))
          assert saved['schema']=='forexai.github_artifact_evidence.v1'
          assert saved['artifact']['name']==name
          assert saved['workflow']['run_id']==run_id
          assert saved['workflow']['commit_sha']==commit_sha
          assert saved['payload']['schema_version']=='forexai.g13.oos_m15.2026.v1'
          Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8').write(f'EVIDENCE_PATH={evidence_path}\n')
          print('G13_AGENT_EVIDENCE_WRITTEN', evidence_path)
          print('OOS_PASS_COUNT', saved['payload'].get('oos_pass_count'))
          PY

      - name: Consume G13 Agent Evidence deterministically
        env:
          EVIDENCE_PATH: ${{ env.EVIDENCE_PATH }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/g13-agent-evidence
          set +e
          python -m agents.g13_agent_evidence_consumer \
            --evidence "$EVIDENCE_PATH" \
            --output artifacts/g13-agent-evidence/consumer-decision.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/g13-agent-evidence/consumer-decision.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['decision']=='HOLD'
          assert d['ea_generation_allowed'] is False
          assert all(d['validations'].values())
          print('G13_AGENT_EVIDENCE_CONSUMED_OK')
          print(json.dumps(d,indent=2,ensure_ascii=False))
          PY

      - name: Upload G13 Agent Evidence and decision
        uses: actions/upload-artifact@v4
        with:
          name: g13-agent-evidence
          path: |
            ${{ env.EVIDENCE_PATH }}
            artifacts/g13-agent-evidence/consumer-decision.json
          include-hidden-files: true
          if-no-files-found: error
