name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date for a small REAL-data smoke test"
        required: true
        default: "2026-08-03"
        type: string
      end:
        description: "UTC end date (exclusive) for the smoke test"
        required: true
        default: "2026-08-04"
        type: string

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  control-plane-inventory-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Control Plane PowerShell diagnostics without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'tools\\diagnose_control_plane_storage_inventory_v1.ps1',
            'tools\\diagnose_capital_firewall_laptop_v1.ps1',
            'tools\\bootstrap_provider_host_v1.ps1'
          )
          foreach ($script in $scripts) {
            $scriptPath = (Resolve-Path $script).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error ("{0}: line {1}: {2}" -f $script, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }
          Write-Output 'CONTROL_PLANE_INVENTORY_POWERSHELL_PARSE=PASS'
          Write-Output 'CONTROL_PLANE_POWERSHELL_DIAGNOSTICS_PARSE=PASS'


  provider-lock-generation:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'ops/bootstrap-provider-host-v1-20261025' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed lock inputs
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate and verify hash locks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "pip-tools==7.5.0"
          if ($LASTEXITCODE -ne 0) { throw "PIP_TOOLS_INSTALL_FAILED" }
          New-Item -ItemType Directory -Path generated-locks -ErrorAction Stop | Out-Null
          python -m piptools compile --generate-hashes --resolver=backtracking --no-emit-index-url --output-file=generated-locks/requirements-provider.lock.txt requirements-provider.in
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_GENERATION_FAILED" }
          python -m piptools compile --generate-hashes --resolver=backtracking --no-emit-index-url --output-file=generated-locks/requirements-provider-test.lock.txt requirements-provider-test.in
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_GENERATION_FAILED" }
          Write-Output "===== BEGIN requirements-provider.lock.txt ====="
          Get-Content -LiteralPath generated-locks/requirements-provider.lock.txt -Raw
          Write-Output "===== END requirements-provider.lock.txt ====="
          Write-Output "===== BEGIN requirements-provider-test.lock.txt ====="
          Get-Content -LiteralPath generated-locks/requirements-provider-test.lock.txt -Raw
          Write-Output "===== END requirements-provider-test.lock.txt ====="
          python -m venv .provider-runtime-lock-verify
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_VERIFY_VENV_FAILED" }
          .\.provider-runtime-lock-verify\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r generated-locks/requirements-provider.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_INSTALL_FAILED" }
          .\.provider-runtime-lock-verify\Scripts\python.exe -c "import cryptography; print('PROVIDER_RUNTIME_LOCK=PASS', cryptography.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "RUNTIME_LOCK_IMPORT_FAILED" }
          python -m venv .provider-test-lock-verify
          if ($LASTEXITCODE -ne 0) { throw "TEST_VERIFY_VENV_FAILED" }
          .\.provider-test-lock-verify\Scripts\python.exe -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r generated-locks/requirements-provider-test.lock.txt
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_INSTALL_FAILED" }
          .\.provider-test-lock-verify\Scripts\python.exe -c "import cryptography, pytest; print('PROVIDER_TEST_LOCK=PASS', cryptography.__version__, pytest.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "TEST_LOCK_IMPORT_FAILED" }
      - name: Upload generated lock files
        uses: actions/upload-artifact@v4
        with:
          name: provider-hash-locks-${{ github.sha }}
          path: generated-locks/*.txt
          if-no-files-found: error

  real-data-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and validate REAL Dukascopy EURUSD M1 data
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M1 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate \
            --manifest
      - name: Build and validate M5 dataset
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M5 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate
      - name: Build and validate M15 dataset
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M15 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate
      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-eurusd-smoke-${{ inputs.start }}-${{ inputs.end }}
          path: data/real/normalized/
          if-no-files-found: error
