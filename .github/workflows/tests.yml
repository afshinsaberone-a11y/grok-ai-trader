name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date for a small REAL-data smoke test"
        required: true
        default: "2026-08-03"
        type: string
      end:
        description: "UTC end date (exclusive) for the smoke test"
        required: true
        default: "2026-08-04"
        type: string

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  control-plane-inventory-powershell-parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Control Plane PowerShell diagnostics without executing them
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'tools\\diagnose_control_plane_storage_inventory_v1.ps1',
            'tools\\diagnose_capital_firewall_laptop_v1.ps1',
            'tools\\bootstrap_provider_host_v1.ps1',
          )
          foreach ($script in $scripts) {
            $scriptPath = (Resolve-Path $script).Path
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $scriptPath,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object {
                Write-Error ("{0}: line {1}: {2}" -f $script, $_.Extent.StartLineNumber, $_.Message)
              }
              exit 1
            }
          }
          Write-Output 'CONTROL_PLANE_INVENTORY_POWERSHELL_PARSE=PASS'
          Write-Output 'CONTROL_PLANE_POWERSHELL_DIAGNOSTICS_PARSE=PASS'

  real-data-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and validate REAL Dukascopy EURUSD M1 data
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M1 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate \
            --manifest
      - name: Build and validate M5 dataset
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M5 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate
      - name: Build and validate M15 dataset
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD \
            --timeframe M15 \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --output data/real \
            --validate
      - name: Upload smoke-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-eurusd-smoke-${{ inputs.start }}-${{ inputs.end }}
          path: data/real/normalized/
          if-no-files-found: error
