name: ForexAI Dropbox Manifest Verification

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Exact Dropbox path to _SYNC_MANIFEST.json"
        required: true
        type: string
      expected_run_id:
        description: "Optional expected GitHub Actions run ID"
        required: false
        type: string
      expected_run_attempt:
        description: "Optional expected GitHub Actions run attempt"
        required: false
        type: string
      expected_workflow:
        description: "Optional expected source workflow name"
        required: false
        type: string
      expected_head_sha:
        description: "Optional expected source commit SHA"
        required: false
        type: string
      expected_conclusion:
        description: "Optional expected source conclusion"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dropbox credential
        run: |
          set -euo pipefail
          test -n "${DROPBOX_ACCESS_TOKEN}" || {
            echo "DROPBOX_MANIFEST_VERIFY_NOT_CONFIGURED: add GitHub Actions secret DROPBOX_ACCESS_TOKEN"
            exit 78
          }

      - name: Download exact Dropbox manifest (read-only)
        env:
          MANIFEST_PATH: ${{ inputs.manifest_path }}
        run: |
          set -euo pipefail
          [[ "${MANIFEST_PATH}" == /ForexAI/*/_SYNC_MANIFEST.json ]] || {
            echo "DROPBOX_MANIFEST_VERIFY_FAIL_CLOSED: manifest_path must target /ForexAI/.../_SYNC_MANIFEST.json"
            exit 2
          }
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("dropbox-api-arg.json").write_text(
              json.dumps({"path": os.environ["MANIFEST_PATH"]}, separators=(",", ":")),
              encoding="utf-8",
          )
          PY
          curl -fsSL             -X POST             -H "Authorization: Bearer ${DROPBOX_ACCESS_TOKEN}"             -H "Dropbox-API-Arg: @dropbox-api-arg.json"             -o dropbox-manifest.json             https://content.dropboxapi.com/2/files/download
          test -s dropbox-manifest.json

      - name: Verify manifest provenance and integrity
        env:
          EXPECTED_RUN_ID: ${{ inputs.expected_run_id }}
          EXPECTED_RUN_ATTEMPT: ${{ inputs.expected_run_attempt }}
          EXPECTED_WORKFLOW: ${{ inputs.expected_workflow }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          EXPECTED_CONCLUSION: ${{ inputs.expected_conclusion }}
        run: |
          set -euo pipefail
          python -m py_compile tools/verify_dropbox_evidence_manifest.py
          ARGS=(--manifest dropbox-manifest.json)
          if [ -n "$EXPECTED_RUN_ID" ]; then ARGS+=(--expected-run-id "$EXPECTED_RUN_ID"); fi
          if [ -n "$EXPECTED_RUN_ATTEMPT" ]; then ARGS+=(--expected-run-attempt "$EXPECTED_RUN_ATTEMPT"); fi
          if [ -n "$EXPECTED_WORKFLOW" ]; then ARGS+=(--expected-workflow "$EXPECTED_WORKFLOW"); fi
          if [ -n "$EXPECTED_HEAD_SHA" ]; then ARGS+=(--expected-head-sha "$EXPECTED_HEAD_SHA"); fi
          if [ -n "$EXPECTED_CONCLUSION" ]; then ARGS+=(--expected-conclusion "$EXPECTED_CONCLUSION"); fi
          python tools/verify_dropbox_evidence_manifest.py "${ARGS[@]}" | tee verification-report.json

      - name: Publish verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-manifest-verification
          path: verification-report.json
          if-no-files-found: error
