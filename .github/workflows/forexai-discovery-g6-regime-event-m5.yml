name: ForexAI Discovery G6 - Regime Aware Event M5
on:
  push:
    branches: [main]
    paths:
      - "research/optimization/regime_aware_event_discovery_g6.py"
      - ".github/workflows/forexai-discovery-g6-regime-event-m5.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  g6:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile G6
        run: python -m py_compile research/optimization/regime_aware_event_discovery_g6.py research/optimization/execution_contract_v1.py
      - name: Download REAL EURUSD M5
        run: |
          python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M5 --output data/real --validate --manifest
      - name: Locate dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M5_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Feature self-check
        run: |
          DATASET="$DATA" python - <<'PY'
          import os,pandas as pd
          from research.optimization.regime_aware_event_discovery_g6 import prepare
          d=prepare(pd.read_csv(os.environ["DATASET"]))
          req={"ATR","EMA8","EMA12","EMA16","EMA26","EMA34","EMA50","ROC3","ROC6","ATRq"}
          miss=sorted(req-set(d.columns))
          assert not miss, miss
          print("G6_FEATURES_OK",sorted(req))
          PY
      - name: Run G6
        run: python -m research.optimization.regime_aware_event_discovery_g6 --data "$DATA" --timeframe M5 --output artifacts/regime-event-g6-M5.json
      - name: Fail-closed G6 controls
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/regime-event-g6-M5.json",encoding="utf-8"))
          r=d["result"]; e=d["execution_model"]
          assert d["real_data_required"] is True and d["synthetic_fallback"] is False
          assert d["oos_policy"]["loaded"] is False and d["oos_policy"]["status"]=="HELD_OUT"
          assert e["entry"]=="next_bar_open" and e["round_trip_cost_pips"]==1.4
          assert e["same_bar_resolution"]=="SL first (conservative)" and e["expiry_bars"]==24
          assert e["overlap"]=="one position at a time" and e["adverse_exit_cost_applied"] is True
          assert r["candidate_total"]==108 and r["champion"] is None
          print("G6_FAIL_CLOSED_OK",r["candidate_total"],r["pre_oos_qualified_count"],r["validation_qualified_count"])
          print("G6_FAMILY_COUNTS",d["catalog"]["family_counts"])
          print("G6_GATE_COUNTS",r["gate_rejection_counts_all_candidates"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: regime-event-g6-M5
          path: artifacts/regime-event-g6-M5.json
          if-no-files-found: error
