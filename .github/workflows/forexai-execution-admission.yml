name: ForexAI Execution Admission

on:
  push:
    paths:
      - "tools/execution_admission_v1.py"
      - "tests/test_execution_admission_v1.py"
      - "config/forexai_execution_parity_v1.json"
      - "tools/capital_firewall_v1.py"
      - "tools/runtime_authorization_envelope_v1.py"
      - "config/forexai_mql5_authorization_record_v1.json"
      - "tools/runtime_authorization_record_v1.py"
      - "tools/trade_ledger_v1.py"
  pull_request:
    paths:
      - "tools/execution_admission_v1.py"
      - "tests/test_execution_admission_v1.py"
      - "config/forexai_execution_parity_v1.json"
      - "tools/capital_firewall_v1.py"
      - "tools/runtime_authorization_envelope_v1.py"
      - "tools/trade_ledger_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate execution admission contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(
              Path("config/forexai_execution_parity_v1.json").read_text(encoding="utf-8")
          )
          admission = contract["execution_admission"]
          assert admission["schema"] == "forexai.execution_admission.v1"
          assert admission["required"] is True
          assert admission["authority"] == "CapitalFirewall"
          assert admission["verify_current_state_immediately_before_submit"] is True
          assert admission["reconciliation_must_be_clear"] is True
          assert admission["risk_cap"] == 0.006
          assert admission["execution_contract_version"] == "forexai.execution.v1"
          assert admission["request_fields"] == [
              "trade_id",
              "symbol",
              "timeframe",
              "side",
              "volume",
              "risk_fraction",
              "stop_loss",
              "take_profit",
              "execution_contract_version",
          ]
          print("execution admission contract: PASS")
          PY

      - name: Run execution admission tests
        run: pytest -q tests/test_execution_admission_v1.py
