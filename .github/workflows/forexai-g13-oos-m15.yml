name: ForexAI G13 OOS M15

# Independent final OOS gate for the frozen G13 M15 candidates.
# 2026 is evaluated only; no selection or optimization is allowed.
# Dukascopy JETTA v1 is the real-data source for this independent OOS run.

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  g13-oos:
    name: G13 2026 OOS M15
    runs-on: [self-hosted, windows]
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile \
            research/optimization/g13_oos_m15.py \
            research/optimization/g13_robustness_m15.py \
            research/optimization/rsi_divergence_discovery_g13.py \
            research/optimization/execution_contract_v1.py \
            research/real_data/dukascopy_ingest.py
      - name: Dukascopy real-feed smoke test on known weekday
        run: |
          python - <<'PY'
          import json
          import lzma
          import time
          from datetime import date
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          day = date(2025, 2, 14)
          jetta_url = (
              f"https://jetta.dukascopy.com/v1/candles/minute/EUR-USD/BID/"
              f"{day.year:04d}/{day.month:02d}/{day.day:02d}"
          )
          legacy_url = (
              f"https://datafeed.dukascopy.com/datafeed/EURUSD/{day.year:04d}/"
              f"{day.month - 1:02d}/{day.day:02d}/BID_candles_min_1.bi5"
          )
          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json, text/plain, */*",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "identity",
          }

          last_error = None
          for attempt in range(1, 4):
              try:
                  with urlopen(Request(jetta_url, headers=headers), timeout=30) as response:
                      payload = response.read()
                  data = json.loads(payload.decode("utf-8"))
                  required = {
                      "timestamp", "multiplier", "times", "shift",
                      "open", "high", "low", "close",
                      "opens", "highs", "lows", "closes", "volumes",
                  }
                  missing = required.difference(data)
                  assert not missing, f"JETTA schema missing: {sorted(missing)}"
                  assert len(data["times"]) > 0
                  assert all(
                      len(data[k]) == len(data["times"])
                      for k in ("opens", "highs", "lows", "closes", "volumes")
                  )
                  print("DUKASCOPY_SMOKE_OK source=JETTA candles=", len(data["times"]), "attempt=", attempt)
                  break
              except (HTTPError, URLError, TimeoutError, OSError, UnicodeDecodeError, json.JSONDecodeError, AssertionError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  if attempt < 3:
                      delay = 2 ** attempt
                      print(f"JETTA_SMOKE_RETRY attempt={attempt} delay={delay}s error={last_error}")
                      time.sleep(delay)
          else:
              print("JETTA_SMOKE_FALLBACK error=", last_error)
              for attempt in range(1, 4):
                  try:
                      with urlopen(Request(legacy_url, headers=headers), timeout=30) as response:
                          payload = response.read()
                      assert payload, "empty BI5 payload"
                      decoded = lzma.decompress(payload)
                      assert len(decoded) > 0 and len(decoded) % 24 == 0
                      print("DUKASCOPY_SMOKE_OK source=legacy-BI5 records=", len(decoded) // 24, "attempt=", attempt)
                      break
                  except (HTTPError, URLError, TimeoutError, OSError, lzma.LZMAError, AssertionError) as exc:
                      last_error = f"{type(exc).__name__}: {exc}"
                      if attempt < 3:
                          delay = 2 ** attempt
                          print(f"BI5_SMOKE_RETRY attempt={attempt} delay={delay}s error={last_error}")
                          time.sleep(delay)
              else:
                  raise SystemExit(
                      "REAL_DATA_REQUIRED: neither Dukascopy JETTA nor legacy BI5 smoke succeeded: "
                      + str(last_error)
                  )
          PY
      - name: Download REAL EURUSD M1 from Dukascopy including 2026 OOS
        run: |
          python -m research.real_data.dukascopy_ingest \
            --symbol EURUSD --start 2025-01-01 --end 2027-01-01 \
            --timeframe M1 --output data/real --validate --manifest --resume \
            --workers 2 --batch-size 5 --batch-pause 2
      - name: Locate dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M1_20250101_20261231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Build M15 OOS dataset from real M1
        shell: bash
        run: |
          DATASET="$DATA" python - <<'PY'
          import os
          import pandas as pd
          from pathlib import Path
          from research.real_data.normalizer import resample_ohlcv
          from research.real_data.validator import validate_ohlcv

          src=Path(os.environ['DATASET'])
          d=pd.read_csv(src,parse_dates=['timestamp'])
          d['timestamp']=pd.to_datetime(d['timestamp'],utc=True)
          m15=resample_ohlcv(d,'15min')
          report=validate_ohlcv(m15,symbol='EURUSD',timeframe='M15')
          if report.status != 'PASS':
              raise SystemExit(f'REAL_DATA_REQUIRED: M15 validation failed: {report.to_dict()}')
          out=Path('data/real/normalized/EURUSD_M15_20250101_20261231.csv')
          m15.to_csv(out,index=False)
          print(report.to_dict())
          print('M15_DATASET',out,len(m15))
          PY
          echo "DATA=data/real/normalized/EURUSD_M15_20250101_20261231.csv" >> "$GITHUB_ENV"
      - name: Verify frozen handoff and strict OOS boundary
        run: |
          DATASET="$DATA" python - <<'PY'
          import json,os
          import pandas as pd
          h=json.load(open('artifacts/g13/frozen/g13-candidate-handoff-m15.json',encoding='utf-8'))
          assert h['schema_version']=='forexai.g13.candidate_handoff.frozen.v1'
          assert h['research_symbol']=='EURUSD'
          assert h['research_timeframe']=='M15'
          assert h['validation_qualified_count']==16
          assert len(h['candidates'])==16
          assert h['oos_policy']=={'loaded':False,'status':'HELD_OUT'}
          policy=h['handoff_policy']
          assert policy['parameters_are_frozen'] is True
          assert policy['oos_optimization_disabled'] is True
          assert policy['robustness_may_not_select'] is True
          assert policy['validation_must_approve'] is True
          for c in h['candidates']:
              assert c['config_hash']
          d=pd.read_csv(os.environ['DATASET'])
          ts=pd.to_datetime(d['timestamp'],utc=True)
          oos=d[(ts>=pd.Timestamp('2026-01-01',tz='UTC'))&(ts<pd.Timestamp('2027-01-01',tz='UTC'))]
          assert not oos.empty
          assert ts.max()<pd.Timestamp('2027-01-01',tz='UTC')
          assert ts.min()<pd.Timestamp('2026-01-01',tz='UTC')
          print('FROZEN_OOS_INPUT_OK',len(h['candidates']),len(oos),ts.min().isoformat(),ts.max().isoformat())
          PY
      - name: Run independent G13 2026 OOS
        run: |
          python -m research.optimization.g13_oos_m15 \
            --data "$DATA" \
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json \
            --output artifacts/g13-oos-m15-2026.json
      - name: Fail closed OOS gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('artifacts/g13-oos-m15-2026.json',encoding='utf-8'))
          assert r['real_data_only'] is True
          assert r['research_scope']['timeframe']=='M15'
          assert r['research_scope']['evaluation_year']==2026
          assert r['candidate_count']==16
          assert r['selection_performed'] is False
          assert r['optimization_enabled'] is False
          assert r['parameters_frozen'] is True
          assert r['oos']['status']=='EVALUATED'
          assert r['oos']['optimization_allowed'] is False
          assert r['oos']['selection_allowed'] is False
          assert r['promotion_gate']['ea_generation_allowed'] is False
          print('G13_OOS_FAIL_CLOSED_OK')
          print('OOS_PASS',r.get('oos_pass_count'))
          print('OOS_IDS',[x['candidate_id'] for x in r['candidates'] if x.get('oos_pass')])
          PY
      - name: Upload OOS evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-oos-m15-2026
          path: |
            artifacts/g13/frozen/g13-candidate-handoff-m15.json
            artifacts/g13-oos-m15-2026.json
          if-no-files-found: error
