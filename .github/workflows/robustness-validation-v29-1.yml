name: ForexAI v29.1 Robustness Validation

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Research timeframe (must be explicitly selected)
        required: true
        default: M5
        type: choice
        options: [M1, M5, M15]
      validation_run_id:
        description: GitHub Actions run ID that produced the canonical candidate-handoff-v1 artifact
        required: true
        type: string
      candidate_id:
        description: Exact validation-approved candidate_id from candidate-handoff-v1
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  REQUESTED_TIMEFRAME: ${{ inputs.timeframe }}
  VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
  CANDIDATE_ID: ${{ inputs.candidate_id }}

jobs:
  robustness-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate requested inputs
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_TIMEFRAME" in
            M1|M5|M15) ;;
            *) echo "ERROR: invalid requested timeframe: $REQUESTED_TIMEFRAME"; exit 1 ;;
          esac
          [[ "$VALIDATION_RUN_ID" =~ ^[0-9]+$ ]] || { echo "ERROR: validation_run_id must be numeric"; exit 1; }
          test -n "$CANDIDATE_ID"
          echo "REQUESTED_TIMEFRAME=$REQUESTED_TIMEFRAME"
          echo "VALIDATION_RUN_ID=$VALIDATION_RUN_ID"
          echo "CANDIDATE_ID=$CANDIDATE_ID"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime
        run: |
          python - <<'PY'
          import numpy, pandas
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          PY

      - name: Download canonical Candidate Handoff v1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/handoff
          gh run download "$VALIDATION_RUN_ID" \
            --name "research-missions-v25-${REQUESTED_TIMEFRAME}" \
            --dir artifacts/handoff
          HANDOFF="$(find artifacts/handoff -type f -name 'candidate-handoff-v1.json' | head -n1)"
          test -n "$HANDOFF" && test -f "$HANDOFF"
          cp "$HANDOFF" artifacts/candidate-handoff-v1.json
          echo "HANDOFF_PATH=artifacts/candidate-handoff-v1.json" >> "$GITHUB_ENV"

      - name: Verify canonical handoff provenance and candidate
        run: |
          python - <<'PY'
          import json, os
          from agents.candidate_contract import validate_handoff
          p=os.environ['HANDOFF_PATH']
          d=json.load(open(p,encoding='utf-8'))
          candidates=validate_handoff(d)
          requested=os.environ['REQUESTED_TIMEFRAME']
          cid=os.environ['CANDIDATE_ID']
          if d.get('research_timeframe') != requested:
              raise SystemExit(f"handoff timeframe mismatch: {d.get('research_timeframe')} vs {requested}")
          matches=[x for x in candidates if str(x['candidate_id']) == str(cid)]
          if len(matches) != 1:
              raise SystemExit(f'candidate_id not uniquely present in canonical handoff: {cid}')
          assert matches[0]['selection_frozen'] is True
          assert matches[0]['oos_optimization_allowed'] is False
          print('CANONICAL_HANDOFF_OK')
          print('candidate_id=',matches[0]['candidate_id'])
          print('config_hash=',matches[0]['config_hash'])
          print('source_validation_sha256=',d['source_validation_sha256'])
          PY

      - name: Download source validation artifact from the same run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/source-validation
          gh run download "$VALIDATION_RUN_ID" \
            --name "research-missions-v25-${REQUESTED_TIMEFRAME}" \
            --dir artifacts/source-validation
          VAL="$(find artifacts/source-validation -type f -name 'validation-mission-v25.json' | head -n1)"
          test -n "$VAL" && test -f "$VAL"
          cp "$VAL" artifacts/validation-mission-v25.json
          echo "VALIDATION_PATH=artifacts/validation-mission-v25.json" >> "$GITHUB_ENV"

      - name: Download REAL EURUSD dataset
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --start 2022-01-01 \
            --end 2026-01-01 \
            --timeframe "$REQUESTED_TIMEFRAME" \
            --output data/real \
            --validate \
            --manifest

      - name: Locate REAL dataset
        shell: bash
        run: |
          set -euo pipefail
          TF="$REQUESTED_TIMEFRAME"
          DATA="$(find data/real/normalized -type f -name "EURUSD_${TF}_20220101_20251231.csv" | sort | head -n1)"
          test -n "$DATA"
          test -f "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "Using REAL dataset: $DATA"

      - name: Validate REAL dataset and cadence
        run: |
          python - <<'PY'
          import os, pandas as pd
          p=os.environ['DATA']; tf=os.environ['REQUESTED_TIMEFRAME']; expected={'M1':1.0,'M5':5.0,'M15':15.0}[tf]
          df=pd.read_csv(p); ts='timestamp' if 'timestamp' in df.columns else 'time'; t=pd.to_datetime(df[ts],utc=True).sort_values()
          if t.duplicated().any(): raise SystemExit('duplicate timestamps')
          if not ((t.min()<pd.Timestamp('2025-01-01',tz='UTC')) and (t.max()>=pd.Timestamp('2025-12-31',tz='UTC'))): raise SystemExit('dataset does not contain required pre-OOS and validation history')
          med=t.diff().dropna().dt.total_seconds().div(60).median()
          if abs(float(med)-expected)>0.01: raise SystemExit(f'cadence mismatch: {med} vs {expected}')
          print('REAL_DATA_CADENCE_OK',tf,len(df),med)
          PY

      - name: Run v29.1 canonical-handoff robustness validation
        run: |
          set -euo pipefail
          python -m research.optimization.robustness_validation_v29_1 \
            --data "$DATA" \
            --timeframe "$REQUESTED_TIMEFRAME" \
            --handoff "$HANDOFF_PATH" \
            --candidate-id "$CANDIDATE_ID" \
            --validation-artifact "$VALIDATION_PATH" \
            --output artifacts/robustness-validation-v29-1.json

      - name: Validate fail-closed promotion state and timeframe
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('artifacts/robustness-validation-v29-1.json',encoding='utf-8'))
          requested=os.environ['REQUESTED_TIMEFRAME']
          if d.get('timeframe') != requested: raise SystemExit(f"timeframe mismatch: {d.get('timeframe')} vs {requested}")
          assert d['real_data_only'] is True
          assert d['oos_evaluated'] is False
          assert d['optimization_enabled'] is False
          assert d['oos']['status']=='HELD_OUT' and d['oos']['optimization_allowed'] is False
          assert d['handoff']['candidate_id'] == os.environ['CANDIDATE_ID']
          assert d['frozen_candidate']['source'] == 'canonical_candidate_handoff_v1'
          assert d['execution_model']['entry']=='next_bar_open'
          assert d['execution_model']['round_trip_cost_pips']==1.4
          assert d['execution_model']['same_bar_resolution']=='SL first (conservative)'
          assert d['execution_model']['overlap']=='one position at a time'
          assert d['validation']['metrics']['adverse_exit_cost_applied'] is True
          assert d['promotion_gate']['ready_for_oos'] == d['promotion_gate']['robustness_pass']
          if d['promotion_gate']['ready_for_oos']: assert d['validation']['strict_gate_pass'] is True
          print('V29.1_CANONICAL_HANDOFF_VALIDATION_OK')
          print('candidate_id=',d['handoff']['candidate_id'])
          print('config_hash=',d['frozen_candidate']['config_hash'])
          print('robustness_pass=',d['promotion_gate']['robustness_pass'])
          print('ready_for_oos=',d['promotion_gate']['ready_for_oos'])
          PY

      - name: Upload v29.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-validation-v29-1-${{ env.REQUESTED_TIMEFRAME }}
          path: |
            artifacts/robustness-validation-v29-1.json
            artifacts/candidate-handoff-v1.json
            artifacts/validation-mission-v25.json
          if-no-files-found: error
