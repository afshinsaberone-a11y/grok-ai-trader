name: ForexAI v29.1 Robustness Validation

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Research timeframe (must be explicitly selected)
        required: true
        default: M5
        type: choice
        options: [M1, M5, M15]

permissions:
  contents: read

env:
  REQUESTED_TIMEFRAME: ${{ inputs.timeframe }}

jobs:
  robustness-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate requested timeframe
        shell: bash
        run: |
          set -euo pipefail
          case "$REQUESTED_TIMEFRAME" in
            M1|M5|M15) ;;
            *) echo "ERROR: invalid requested timeframe: $REQUESTED_TIMEFRAME"; exit 1 ;;
          esac
          echo "REQUESTED_TIMEFRAME=$REQUESTED_TIMEFRAME"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify runtime
        run: |
          python - <<'PY'
          import numpy, pandas
          print('numpy', numpy.__version__)
          print('pandas', pandas.__version__)
          PY

      - name: Download REAL EURUSD dataset
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --start 2022-01-01 \
            --end 2026-01-01 \
            --timeframe "$REQUESTED_TIMEFRAME" \
            --output data/real \
            --validate \
            --manifest

      - name: Locate REAL dataset
        shell: bash
        run: |
          set -euo pipefail
          TF="$REQUESTED_TIMEFRAME"
          DATA="$(find data/real/normalized -type f -name "EURUSD_${TF}_20220101_20251231.csv" | sort | head -n1)"
          test -n "$DATA"
          test -f "$DATA"
          case "$DATA" in
            *"EURUSD_${TF}_20220101_20251231.csv") ;;
            *) echo "ERROR: located dataset does not match requested timeframe: $DATA"; exit 1 ;;
          esac
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "Selected timeframe: $TF"
          echo "Using REAL dataset: $DATA"

      - name: Validate REAL dataset and cadence
        run: |
          python - <<'PY'
          import os, pandas as pd
          p=os.environ['DATA']
          tf=os.environ['REQUESTED_TIMEFRAME']
          expected={'M1':1.0,'M5':5.0,'M15':15.0}[tf]
          df=pd.read_csv(p)
          ts='timestamp' if 'timestamp' in df.columns else 'time'
          t=pd.to_datetime(df[ts], utc=True).sort_values()
          if t.duplicated().any(): raise SystemExit('duplicate timestamps')
          if not ((t.min() < pd.Timestamp('2025-01-01', tz='UTC')) and (t.max() >= pd.Timestamp('2025-12-31', tz='UTC'))):
              raise SystemExit('dataset does not contain required pre-OOS and validation history')
          med=t.diff().dropna().dt.total_seconds().div(60).median()
          if abs(float(med)-expected)>0.01: raise SystemExit(f'cadence mismatch: {med} vs {expected}')
          print('requested_timeframe',tf)
          print('rows',len(df),'median_cadence_minutes',med,'synthetic_fallback','FORBIDDEN')
          PY

      - name: Run v29.1 frozen robustness validation
        run: |
          python -m research.optimization.robustness_validation_v29_1 \
            --data "$DATA" \
            --timeframe "$REQUESTED_TIMEFRAME" \
            --output artifacts/robustness-validation-v29-1.json

      - name: Validate fail-closed promotion state and timeframe
        run: |
          python - <<'PY'
          import json, os
          p='artifacts/robustness-validation-v29-1.json'
          d=json.load(open(p,encoding='utf-8'))
          requested=os.environ['REQUESTED_TIMEFRAME']
          selected=d.get('timeframe') or d.get('selected_timeframe') or d.get('research_timeframe')
          if selected is not None and selected != requested:
              raise SystemExit(f'timeframe mismatch: requested={requested}, artifact={selected}')
          data_path=d.get('data_path') or d.get('dataset') or d.get('dataset_path')
          if data_path is not None and f'EURUSD_{requested}_' not in str(data_path):
              raise SystemExit(f'dataset/timeframe mismatch: requested={requested}, artifact={data_path}')
          assert d['real_data_only'] is True
          assert d['oos_evaluated'] is False
          assert d['optimization_enabled'] is False
          assert d['execution_model']['entry']=='next_bar_open'
          assert d['execution_model']['round_trip_cost_pips']==1.4
          assert d['execution_model']['same_bar_resolution']=='SL first (conservative)'
          assert d['execution_model']['overlap']=='one position at a time'
          assert d['promotion_gate']['ready_for_oos'] == d['promotion_gate']['robustness_pass']
          if d['promotion_gate']['ready_for_oos']:
              assert d['validation']['strict_gate_pass'] is True
          print('V29.1_VALIDATION_SCHEMA_OK')
          print('requested_timeframe=', requested)
          print('artifact_timeframe=', selected)
          print('robustness_pass=', d['promotion_gate']['robustness_pass'])
          print('ready_for_oos=', d['promotion_gate']['ready_for_oos'])
          PY

      - name: Upload v29.1 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robustness-validation-v29-1-${{ env.REQUESTED_TIMEFRAME }}
          path: artifacts/robustness-validation-v29-1.json
          if-no-files-found: error
