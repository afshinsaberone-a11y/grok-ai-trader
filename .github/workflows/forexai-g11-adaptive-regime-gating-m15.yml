name: ForexAI G11 Adaptive Regime Gating M15

on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/adaptive_regime_gating_g11.py
      - .github/workflows/forexai-g11-adaptive-regime-gating-m15.yml

permissions:
  contents: read
  actions: read

jobs:
  g11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile research/optimization/adaptive_regime_gating_g11.py research/optimization/regime_transition_forensics_g10.py research/optimization/regime_stability_forensics_g9.py research/optimization/regime_aware_event_discovery_g6.py
      - name: Download REAL EURUSD M15
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M15 --output data/real --validate --manifest
      - name: Locate and validate dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M15_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          DATASET="$DATA" python - <<'PY'
          import os, pandas as pd
          p=os.environ['DATASET']
          d=pd.read_csv(p, parse_dates=['timestamp'])
          assert len(d)==93017, len(d)
          assert d.timestamp.dt.year.max() < 2026
          assert d.timestamp.is_monotonic_increasing
          print('REAL_DATA_OK', len(d), d.timestamp.max().isoformat())
          PY
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run G11
        run: python -m research.optimization.adaptive_regime_gating_g11 --data "$DATA" --output artifacts/adaptive-regime-gating-g11-M15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/adaptive-regime-gating-g11-M15.json'))
          assert p['data']['synthetic_data'] is False
          assert p['data']['oos_2026_used'] is False
          assert p['parameter_selection']['used_2025'] is False
          assert p['champion'] is None
          assert p['execution_model']['next_bar_open'] is True
          assert p['execution_model']['round_trip_cost_pips'] == 1.4
          print('G11_FAIL_CLOSED_OK')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-regime-gating-g11-M15
          path: artifacts/adaptive-regime-gating-g11-M15.json
