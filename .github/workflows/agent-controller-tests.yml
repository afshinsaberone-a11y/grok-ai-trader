name: ForexAI Agent Controller Tests

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'tests/test_research_controller.py'
      - 'tests/test_research_mission.py'
      - 'tests/test_forexai_tools.py'
      - '.github/workflows/agent-controller-tests.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/test_research_controller.py'
      - 'tests/test_research_mission.py'
      - 'tests/test_forexai_tools.py'
      - '.github/workflows/agent-controller-tests.yml'
  workflow_dispatch:

jobs:
  controller-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: pip install pytest openai-agents
      - name: Compile agent modules
        run: python -m py_compile agents/forexai_tools.py agents/research_controller.py agents/research_mission.py agents/forexai_orchestrator.py
      - name: Run controller, mission, and evidence-tool tests
        run: python -m pytest -q tests/test_research_controller.py tests/test_research_mission.py tests/test_forexai_tools.py
