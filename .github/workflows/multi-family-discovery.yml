name: Multi-Family Strategy Discovery

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Pre-OOS start"
        required: true
        default: "2022-01-01"
        type: string
      end:
        description: "Pre-OOS end (exclusive)"
        required: true
        default: "2026-01-01"
        type: string

jobs:
  discover:
    strategy:
      fail-fast: false
      matrix:
        family:
          - trend_ema_rsi
          - momentum_breakout
          - donchian_breakout
          - bollinger_mean_reversion
          - rsi_mean_reversion
          - session_range_breakout
          - volatility_expansion
          - sp2l_lite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore historical HistData cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-pre-oos-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            histdata-eurusd-m1-pre-oos-
            histdata-eurusd-m1-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real pre-OOS HistData only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD --timeframe M1 \
            --start "$START" --end "$END" \
            --output data/real --validate --manifest
      - name: Build pre-OOS M5 dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          src=Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          df=pd.read_csv(src)
          df['timestamp']=pd.to_datetime(df['timestamp'],utc=True)
          for c in ['open','high','low','close','volume']:
              df[c]=pd.to_numeric(df[c])
          work=df.set_index('timestamp')[['open','high','low','close','volume']]
          m5=work.resample('5min').agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'}).dropna(subset=['open','high','low','close']).reset_index()
          out=Path('data/real/normalized/EURUSD_M5_20220101_20251231.csv')
          m5.to_csv(out,index=False)
          print('PRE_OOS_M5_ROWS=',len(m5))
          PY
      - name: Run one strategy family on pre-OOS only
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python -m research.optimization.multi_family_discovery \
            --data data/real/normalized/EURUSD_M5_20220101_20251231.csv \
            --family "$FAMILY" \
            --output "artifacts/${FAMILY}.json"
      - name: Upload family discovery artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-family-${{ matrix.family }}
          path: |
            artifacts/${{ matrix.family }}.json
            data/real/normalized/*.manifest.json
          if-no-files-found: warn

  aggregate:
    if: ${{ always() }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: multi-family-*
          path: artifacts/families
          merge-multiple: false
      - name: Aggregate family results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('artifacts/families').glob('multi-family-*/**/*.json'))
          results=[]
          for p in files:
              data=json.loads(p.read_text(encoding='utf-8'))
              results.append(data.get('result', data))
          champions=[r['champion'] for r in results if r.get('champion')]
          champions.sort(key=lambda x:(-float(x['robustness_score']), x['family'], x['candidate']))
          report={
              'schema_version':'forexai.multi_family_discovery.v2',
              'results':results,
              'qualified_count':len(champions),
              'champion':champions[0] if champions else None,
              'oos_policy':{'loaded':False,'start':'2026-01-01','status':'HELD_OUT'},
              'partial_run': any(r.get('family') == 'trend_ema_rsi' and not r.get('top_50') for r in results),
              'sp2l_status':'SP2L-lite is an engineering proxy; official SP2L PR #2 is not merged into main',
          }
          out=Path('artifacts/multi_family_summary.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'qualified_count':len(champions),'champion':report['champion'],'partial_run':report['partial_run'],'families_with_results':[r.get('family') for r in results]},indent=2,sort_keys=True))
          PY
      - name: Upload aggregate discovery artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: multi-family-summary
          path: artifacts/multi_family_summary.json
          if-no-files-found: warn
