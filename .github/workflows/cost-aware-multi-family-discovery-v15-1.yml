name: Cost-Aware Multi-Family Discovery v15.1

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Research timeframe"
        required: true
        default: "M5"
        type: choice
        options: [M5]
      start:
        description: "Pre-OOS start"
        required: true
        default: "2022-01-01"
        type: string
      end:
        description: "Pre-OOS end (exclusive; 2026 remains holdout)"
        required: true
        default: "2026-01-01"
        type: string
      spread_pips:
        description: "Adverse spread cost per side in pips"
        required: true
        default: "0.5"
        type: string
      slippage_pips:
        description: "Adverse slippage cost per side in pips"
        required: true
        default: "0.2"
        type: string

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and test execution-cost contract
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile research/optimization/cost_aware_discovery_v15_1.py
          python - <<'PY'
          from research.optimization.cost_aware_discovery_v15_1 import _cost_price
          assert _cost_price(0.5, 0.2) == 0.00007
          try:
              _cost_price(-0.1, 0.2)
          except ValueError:
              pass
          else:
              raise AssertionError('negative execution cost must fail')
          print('DISCOVERY_V15_1_EXECUTION_COST_TEST=PASS')
          PY

  discover:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        family:
          - trend_ema_rsi
          - momentum_breakout
          - donchian_breakout
          - bollinger_mean_reversion
          - rsi_mean_reversion
          - session_range_breakout
          - volatility_expansion
          - sp2l_lite
          - volatility_switch_momentum_reversal
          - skew_kurt_momentum
          - regime_zscore_reversion
          - ichimoku_regime_trend
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate requested timeframe
        env:
          TF: ${{ inputs.timeframe }}
        run: test "$TF" = "M5"
      - name: Restore real HistData cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-pre-oos-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            histdata-eurusd-m1-pre-oos-
            histdata-eurusd-m1-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download REAL M1 data only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Build deterministic REAL M5 dataset
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import pandas as pd

          src=Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          if not src.exists():
              raise SystemExit(f'REAL_DATA_REQUIRED: missing {src}')
          df=pd.read_csv(src)
          df['timestamp']=pd.to_datetime(df['timestamp'],utc=True)
          for c in ['open','high','low','close','volume']:
              df[c]=pd.to_numeric(df[c],errors='raise')
          if not df['timestamp'].is_monotonic_increasing or df['timestamp'].duplicated().any():
              raise SystemExit('INVALID_M1_TIMESTAMP_ORDER_OR_DUPLICATES')
          if not (df['timestamp'].dt.second.eq(0) & df['timestamp'].dt.microsecond.eq(0)).all():
              raise SystemExit('INVALID_M1_TIMESTAMP_ALIGNMENT')

          start=pd.Timestamp(os.environ['START'],tz='UTC')
          end=pd.Timestamp(os.environ['END'],tz='UTC')
          df=df[(df['timestamp']>=start)&(df['timestamp']<end)].copy()
          if df.empty:
              raise SystemExit('REAL_DATA_REQUIRED: empty requested interval')

          grouped=df.set_index('timestamp')[['open','high','low','close','volume']].resample('5min')
          m5=grouped.agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'})
          counts=grouped['close'].count()
          complete_mask=counts.eq(5)
          incomplete_buckets=int((~complete_mask).sum())
          partial_rows=int(counts[~complete_mask].sum())
          m5=m5.loc[complete_mask].dropna(subset=['open','high','low','close']).reset_index()
          if m5.empty:
              raise SystemExit('REAL_DATA_REQUIRED: no fully observed M5 buckets')
          if m5['timestamp'].duplicated().any():
              raise SystemExit('INVALID_M5_DUPLICATES')
          if not m5['timestamp'].dt.minute.mod(5).eq(0).all():
              raise SystemExit('INVALID_M5_TIMESTAMP_ALIGNMENT')
          diffs=m5['timestamp'].diff().dropna()
          print('REAL_M5_ROWS=',len(m5))
          print('REAL_M5_INCOMPLETE_5MIN_BUCKETS_DROPPED=',incomplete_buckets)
          print('REAL_M5_SOURCE_ROWS_IN_INCOMPLETE_BUCKETS=',partial_rows)
          print('REAL_M5_GAPS_GT_5MIN_AFTER_FILTER=',int((diffs > pd.Timedelta('5min')).sum()))
          print('REAL_M5_NO_SYNTHETIC_FILL=true')
          out=Path('data/real/normalized/EURUSD_M5_20220101_20251231.csv')
          out.parent.mkdir(parents=True,exist_ok=True)
          m5.to_csv(out,index=False)
          PY
      - name: Run v15.1 diagnostics-first discovery
        env:
          FAMILY: ${{ matrix.family }}
          SPREAD: ${{ inputs.spread_pips }}
          SLIPPAGE: ${{ inputs.slippage_pips }}
        run: |
          python -m research.optimization.cost_aware_discovery_v15_1 --data data/real/normalized/EURUSD_M5_20220101_20251231.csv --family "$FAMILY" --spread-pips "$SPREAD" --slippage-pips "$SLIPPAGE" --output "artifacts/$FAMILY.json"
          python - <<'PY'
          import json,os
          p=f"artifacts/{os.environ['FAMILY']}.json"
          d=json.load(open(p,encoding='utf-8'))
          r=d['result']
          assert d['real_data_required'] is True
          assert d['synthetic_fallback'] is False
          assert d['oos_policy']['status']=='HELD_OUT'
          assert d['oos_policy']['loaded'] is False
          assert r['execution_model']=='v28.1_next_bar_open'
          assert d['execution_model']['entries_equal_exits'] is True
          assert d['execution_model']['ohlc_invariants'] is True
          print(json.dumps({'family':r['family'],'candidate_total':r['candidate_total'],'qualified_count':r['qualified_count'],'diagnostic_top_candidate':r['diagnostic_top_rejected_or_unqualified'][0]['candidate'] if r['diagnostic_top_rejected_or_unqualified'] else None}))
          PY
      - name: Upload family artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-aware-v15-1-${{ matrix.family }}
          path: artifacts/${{ matrix.family }}.json
          if-no-files-found: warn

  aggregate:
    if: ${{ always() }}
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download family artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cost-aware-v15-1-*
          path: artifacts/families
          merge-multiple: false
      - name: Aggregate diagnostics without manufacturing a Champion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files=sorted(Path('artifacts/families').glob('cost-aware-v15-1-*/**/*.json'))
          results=[]
          for p in files:
              d=json.loads(p.read_text(encoding='utf-8'))
              if d.get('schema_version')!='forexai.cost_aware_discovery.v15.1':
                  raise SystemExit(f'INVALID_SCHEMA: {p}')
              r=d['result']
              if r.get('execution_model')!='v28.1_next_bar_open':
                  raise SystemExit(f'EXECUTION_MODEL_MISMATCH: {p}')
              results.append(r)

          diagnostic=[]
          for r in results:
              for x in r.get('diagnostic_top_rejected_or_unqualified',[]):
                  diagnostic.append(x)
          diagnostic.sort(key=lambda x:(-float(x.get('diagnostic_score',-999)),x['family'],x['candidate']))
          qualified=[r['champion'] for r in results if r.get('champion')]
          qualified.sort(key=lambda x:(-float(x['diagnostic_score']),x['family'],x['candidate']))

          report={
            'schema_version':'forexai.cost_aware_multi_family.v15.1',
            'research_timeframe':'M5',
            'execution_model':'v28.1_next_bar_open',
            'execution_cost_model':{
              'spread_pips_per_side':float('${{ inputs.spread_pips }}'),
              'slippage_pips_per_side':float('${{ inputs.slippage_pips }}'),
              'round_trip_pips':2*(float('${{ inputs.spread_pips }}')+float('${{ inputs.slippage_pips }}'))
            },
            'results':results,
            'diagnostic_top_20_across_families':diagnostic[:20],
            'qualified_count':len(qualified),
            'candidate_pool':qualified[:20],
            'champion':None,
            'promotion_status':'NOT_PROMOTED',
            'oos_policy':{'loaded':False,'start':'2026-01-01','status':'HELD_OUT'},
            'real_data_required':True,
            'synthetic_fallback':False,
            'diagnostic_ranking_is_not_a_promotion_gate':True
          }
          out=Path('artifacts/cost_aware_summary_v15_1.json')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text(json.dumps(report,indent=2,sort_keys=True),encoding='utf-8')
          print(json.dumps({'families':len(results),'qualified_count':len(qualified),'diagnostic_pool':len(diagnostic[:20]),'champion':None,'promotion_status':'NOT_PROMOTED'},indent=2))
          PY
      - name: Upload aggregate artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-aware-summary-v15-1
          path: artifacts/cost_aware_summary_v15_1.json
          if-no-files-found: error
