name: real-research-histdata

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date for the HistData research dataset"
        required: true
        default: "2022-01-01"
        type: string
      end:
        description: "UTC end date (exclusive)"
        required: true
        default: "2026-01-01"
        type: string
      timeframe:
        description: "Research timeframe"
        required: true
        default: "M5"
        type: choice
        options:
          - M1
          - M5
          - M15

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  real-research-histdata:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore HistData yearly archive cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            histdata-eurusd-m1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate REAL HistData EURUSD M1 data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --timeframe "$TIMEFRAME" \
            --start "$START" \
            --end "$END" \
            --output data/real \
            --validate \
            --manifest

      - name: Locate normalized dataset
        run: |
          find data/real/normalized -maxdepth 1 -type f -print | sort

      - name: Run baseline backtest on IS and Validation only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          END_INCLUSIVE=$(date -u -d "$END - 1 day" +%Y%m%d)
          START_COMPACT=${START//-/}
          DATA="data/real/normalized/EURUSD_${TIMEFRAME}_${START_COMPACT}_${END_INCLUSIVE}.csv"
          test -f "$DATA"
          python -m research.real_data.run_real_backtest \
            --data "$DATA" \
            --timeframe "$TIMEFRAME" \
            --output artifacts/real_backtest_report.json

      - name: Upload HistData research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-research-histdata-${{ inputs.timeframe }}-${{ inputs.start }}-${{ inputs.end }}
          path: |
            data/real/normalized/
            data/real/raw/histdata/
            artifacts/real_backtest_report.json
          if-no-files-found: error
