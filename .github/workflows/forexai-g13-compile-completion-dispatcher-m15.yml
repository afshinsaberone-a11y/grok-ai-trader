name: ForexAI G13 Compile Completion Dispatcher M15

# Direct completion orchestration for the exact successful G13 Compile + Signal Parity run.
# This workflow is read-only with respect to trading and only dispatches the existing
# Controlled Demo Package Preflight after an exact-main successful Compile/Parity run.

on:
  workflow_run:
    workflows:
      - "ForexAI G13 MT5 Compile + Signal Parity"
    types:
      - completed

permissions:
  contents: read
  actions: write

concurrency:
  group: g13-compile-completion-dispatcher-m15
  cancel-in-progress: true

jobs:
  dispatch-preflight:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'ForexAI G13 MT5 Compile + Signal Parity' &&
          github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      COMPILE_PARITY_RUN_ID: ${{ github.event.workflow_run.id }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify exact successful Compile/Parity run
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID")"
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity", p["name"]; assert p["conclusion"]=="success", (p["id"],p["conclusion"]); assert p["status"]=="completed", (p["id"],p["status"]); assert p["head_branch"]=="main", p["head_branch"]; assert p["head_sha"]==sys.argv[1], (p["id"],p["head_sha"],sys.argv[1]); print("G13_COMPILE_COMPLETION_RUN_VERIFIED",p["id"],p["head_sha"])' "$TARGET_SHA" <<< "$json"

      - name: Dispatch exact Controlled Demo Package Preflight
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"compile_parity_run_id":sys.argv[1]}}))' "$COMPILE_PARITY_RUN_ID")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_PREFLIGHT_DISPATCH_FAILED_HTTP=$status"
            exit 1
          }
          echo "G13_PREFLIGHT_DISPATCHED=true COMPILE_PARITY_RUN_ID=$COMPILE_PARITY_RUN_ID TARGET_SHA=$TARGET_SHA"
