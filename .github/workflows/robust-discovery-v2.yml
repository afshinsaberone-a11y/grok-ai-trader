name: Robust Candidate Discovery v2

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: "Deterministic candidate count"
        required: true
        default: "200"
        type: string

jobs:
  robust-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore historical HistData cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-pre-oos-2022-01-01-2026-01-01
          restore-keys: |
            histdata-eurusd-m1-pre-oos-
            histdata-eurusd-m1-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real pre-OOS HistData only
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --timeframe M1 \
            --start 2022-01-01 \
            --end 2026-01-01 \
            --output data/real \
            --validate \
            --manifest
      - name: Build pre-OOS M5 dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          src = Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          if not src.exists():
              raise SystemExit(f'REAL_DATA_REQUIRED: missing normalized dataset: {src}')
          df = pd.read_csv(src)
          df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True)
          for col in ['open','high','low','close','volume']:
              df[col] = pd.to_numeric(df[col])
          work = df.set_index('timestamp')[['open','high','low','close','volume']]
          agg = work.resample('5min').agg({
              'open':'first','high':'max','low':'min','close':'last','volume':'sum'
          }).dropna(subset=['open','high','low','close']).reset_index()
          out = Path('data/real/normalized/EURUSD_M5_20220101_20251231.csv')
          agg.to_csv(out, index=False)
          print(f'PRE_OOS_M5_ROWS={len(agg)}')
          print(f'PRE_OOS_DATA={out}')
          PY
      - name: Run robust Candidate Discovery v2
        env:
          CANDIDATES: ${{ inputs.candidates }}
        run: |
          python -m research.optimization.robust_discovery_v2 \
            --data data/real/normalized/EURUSD_M5_20220101_20251231.csv \
            --candidates "$CANDIDATES" \
            --output artifacts/robust_discovery_v2.json
      - name: Upload discovery artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: robust-discovery-v2
          path: |
            artifacts/robust_discovery_v2.json
            data/real/normalized/*.manifest.json
          if-no-files-found: warn
