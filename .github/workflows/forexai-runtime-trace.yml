name: ForexAI Runtime Trace Bridge

on:
  push:
    paths:
      - "tools/runtime_trace_bridge_v1.py"
      - "tools/trade_ledger_v1.py"
      - "tests/test_runtime_trace_bridge_v1.py"
  pull_request:
    paths:
      - "tools/runtime_trace_bridge_v1.py"
      - "tools/trade_ledger_v1.py"
      - "tests/test_runtime_trace_bridge_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime trace contract tests
        run: |
          python -m pip install --disable-pip-version-check pytest
          pytest -q tests/test_runtime_trace_bridge_v1.py
