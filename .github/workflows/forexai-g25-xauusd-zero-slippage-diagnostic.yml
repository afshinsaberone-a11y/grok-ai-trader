name: ForexAI G25 XAUUSD Zero-Slippage Diagnostic
# Diagnostic upper-bound run: real BID/ASK spread retained; only added slippage is zero.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/forexai-g25-xauusd-zero-slippage-diagnostic.yml"

permissions:
  actions: read
  contents: read

concurrency:
  group: forexai-g25-xauusd-zero-slippage-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies
        run: python -m pip install numpy pandas

      - name: Download immutable G22 2021-2024 source artifact
        uses: actions/download-artifact@v4
        with:
          name: forexai-g22-xauusd-m5-full-history-2021-2024
          path: data/g22
          repository: ${{ github.repository }}
          run-id: 41911516706
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download only the four immutable G24 2025 shards
        uses: actions/download-artifact@v4
        with:
          pattern: forexai-g24-xauusd-m5-fresh-oos-2025-*
          path: data/g24-shards
          merge-multiple: false
          repository: ${{ github.repository }}
          run-id: 42201880647
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run seven fixed hypotheses with zero added slippage
        run: |
          python -m research.optimization.xauusd_intraday_preregistered_discovery_v1 \
            --train-root data/g22 \
            --validation-root data/g24-shards \
            --commission-usd-per-oz-round-turn 0.08 \
            --slippage-usd-per-oz-per-side 0.0 \
            --output artifacts/g25-xauusd-zero-slippage-diagnostic.json

      - name: Upload zero-slippage diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g25-xauusd-zero-slippage-diagnostic
          path: artifacts/g25-xauusd-zero-slippage-diagnostic.json
          if-no-files-found: error
          retention-days: 90
