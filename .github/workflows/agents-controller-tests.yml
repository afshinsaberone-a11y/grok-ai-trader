name: ForexAI Agent Controller Tests

on:
  push:
    paths:
      - 'agents/**'
      - 'tests/test_research_controller.py'
      - '.github/workflows/agents-controller-tests.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/test_research_controller.py'
      - '.github/workflows/agents-controller-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Compile controller and agents
        run: python -m py_compile agents/research_controller.py agents/research_mission.py agents/validation_mission.py agents/robustness_mission.py agents/forexai_orchestrator.py
      - name: Run controller regression tests
        run: pytest -q tests/test_research_controller.py
