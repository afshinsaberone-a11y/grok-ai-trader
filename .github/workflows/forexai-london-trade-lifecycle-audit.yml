name: ForexAI London Trade Lifecycle Audit

on:
  push:
    branches: [main]
    paths:
      - "research/optimization/london_trade_lifecycle_audit.py"
      - ".github/workflows/forexai-london-trade-lifecycle-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile lifecycle audit
        run: python -m py_compile research/optimization/london_trade_lifecycle_audit.py
      - name: Download REAL EURUSD M5
        run: |
          python -m research.real_data.histdata_ingest             --symbol EURUSD --start 2022-01-01 --end 2026-01-01             --timeframe M5 --output data/real --validate --manifest
      - name: Locate dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M5_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run lifecycle audit
        run: |
          python research/optimization/london_trade_lifecycle_audit.py             --data "$DATA"             --output artifacts/london-trade-lifecycle-audit.json
      - name: Fail-closed audit controls
        run: |
          python - <<'PY'
          import json
          d=json.load(open("artifacts/london-trade-lifecycle-audit.json",encoding="utf-8"))
          assert d["policy"]["real_data_only"] is True
          assert d["policy"]["profitability_evaluated"] is False
          assert d["policy"]["oos_2026_used"] is False
          for x in d["configs"]:
              assert x["entry_candidates"] >= 0
              assert x["invalid_risk"] >= 0
          print("LIFECYCLE_AUDIT_OK")
          print(json.dumps(d["configs"], indent=2))
          PY
      - name: Upload lifecycle audit
        uses: actions/upload-artifact@v4
        with:
          name: london-trade-lifecycle-audit
          path: artifacts/london-trade-lifecycle-audit.json
          if-no-files-found: error
