name: ForexAI G17 Efficiency-Ratio Momentum M5

on:
  pull_request:
    paths:
      - "research/optimization/efficiency_ratio_momentum_g17.py"
      - "tests/test_efficiency_ratio_momentum_g17.py"
      - "research/real_data/histdata_ingest.py"
      - "tests/test_histdata_ingest.py"
      - "docs/research/g17-efficiency-ratio-momentum-v1-protocol-20261104.md"
      - ".github/workflows/forexai-g17-efficiency-ratio-momentum-m5.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile G17
        run: python -m py_compile research/optimization/efficiency_ratio_momentum_g17.py tests/test_efficiency_ratio_momentum_g17.py
      - name: Run G17 and HistData ingestion regression tests
        run: pytest -q tests/test_efficiency_ratio_momentum_g17.py tests/test_histdata_ingest.py
      - name: Download REAL EURUSD M5 through canonical HistData pipeline
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M5 --output data/real --validate --manifest
      - name: Locate exact dataset and manifest
        run: |
          set -euo pipefail
          DATA="data/real/normalized/EURUSD_M5_20220101_20251231.csv"
          MANIFEST="data/real/normalized/EURUSD_M5_20220101_20251231.manifest.json"
          test -s "$DATA"
          test -s "$MANIFEST"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
      - name: Run G17 IS ranking and confirmation-only 2025 evaluation
        run: |
          python -m research.optimization.efficiency_ratio_momentum_g17 \
            --data "$DATA" \
            --manifest "$MANIFEST" \
            --output artifacts/g17-efficiency-ratio-momentum-m5.json
      - name: Fail closed on protocol and authorization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/g17-efficiency-ratio-momentum-m5.json").read_text(encoding="utf-8"))
          assert p["schema_version"] == "forexai.g17.efficiency_ratio_momentum.v1"
          assert p["catalog"]["candidate_total"] == 108
          assert p["real_data_required"] is True and p["synthetic_fallback"] is False
          assert p["source_data"]["price_basis"] == "BID_OHLC"
          assert p["protocol"]["is_used_for_ranking"] is True
          assert p["protocol"]["confirmation_used_for_ranking"] is False
          assert p["protocol"]["validation_status"] == "CROSS_FAMILY_REUSED_NOT_PRISTINE"
          assert p["protocol"]["catalog_locked"] is True
          assert p["costs"]["baseline_round_trip_pips"] == 0.9
          assert p["costs"]["moderate_stress_round_trip_pips"] == 1.35
          assert p["costs"]["severe_diagnostic_round_trip_pips"] == 2.0
          assert p["costs"]["spread_paid_once"] is True
          assert p["costs"]["slippage_paid_each_side"] is True
          assert p["oos_policy"]["loaded"] is False
          assert p["oos_policy"]["oos_runner_invoked"] is False
          assert p["oos_policy"]["oos_optimization_allowed"] is False
          assert p["demo_authorized"] is False and p["live_authorized"] is False and p["orders_submitted"] is False
          assert p["selection_frozen"] == (p["frozen_candidate"] is not None)
          if p["frozen_candidate"] is not None:
              assert len(p["frozen_candidate"]["config_sha256"]) == 64
          print(json.dumps({"catalog": p["catalog"], "decision": p["decision"],
                            "costs": p["costs"], "oos_loaded": p["oos_policy"]["loaded"]}, indent=2))
          PY
      - name: Upload G17 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g17-efficiency-ratio-momentum-m5
          path: artifacts/g17-efficiency-ratio-momentum-m5.json
          if-no-files-found: error
      - name: Publish numerical decision to the draft PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('artifacts/g17-efficiency-ratio-momentum-m5.json', 'utf8'));
            const body = [
              '<!-- forexai-g17-result -->',
              '## G17 real-data research result',
              '',
              '**Decision:** ' + p.decision,
              '- Fixed candidates: ' + p.catalog.candidate_total,
              '- IS-qualified: ' + p.catalog.is_qualified_count,
              '- 2025 confirmation finalists: ' + p.catalog.confirmation_finalists_evaluated,
              '- Fully qualified after confirmation and stress: ' + p.catalog.fully_qualified_count,
              '- IS trades across all candidates: ' + p.catalog.total_is_trades_across_catalog,
              '- Round-trip costs (base / moderate / severe): ' + p.costs.baseline_round_trip_pips + ' / ' + p.costs.moderate_stress_round_trip_pips + ' / ' + p.costs.severe_diagnostic_round_trip_pips + ' pips',
              '- 2025 is cross-family reused, not pristine: ' + p.protocol.validation_status,
              '- OOS 2026 loaded: ' + p.oos_policy.loaded,
              '- Frozen config: ' + p.selection_frozen,
              '- Demo / Live / orders: ' + p.demo_authorized + ' / ' + p.live_authorized + ' / ' + p.orders_submitted,
              '',
              'Artifact from Actions run ' + context.runId + ': forexai-g17-efficiency-ratio-momentum-m5',
              '',
              'Research only; any passing candidate still requires a separately controlled, untouched holdout.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const prior = existing.data.find(c => c.body && c.body.includes('<!-- forexai-g17-result -->'));
            if (prior) await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
