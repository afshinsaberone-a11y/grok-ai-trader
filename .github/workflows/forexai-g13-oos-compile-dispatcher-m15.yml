name: ForexAI G13 OOS to Compile/Parity Dispatcher M15

on:
  workflow_run:
    workflows:
      - "ForexAI G13 OOS M15 Current"
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Exact main SHA whose successful OOS should be handed to Compile/Parity"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: g13-oos-to-compile-m15
  cancel-in-progress: true

jobs:
  dispatch-compile:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.name == 'ForexAI G13 OOS M15 Current') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.target_sha }}
    steps:
      - name: Verify target SHA is current main
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$main_sha" = "$TARGET_SHA"
          echo "G13_OOS_CHAIN_TARGET_SHA=$TARGET_SHA"

      - name: Verify successful OOS run for exact SHA
        shell: bash
        run: |
          set -euo pipefail
          payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-oos-m15-current.yml/runs?branch=main&per_page=50")"
          python -c 'import json,sys; target=sys.argv[1]; rs=json.load(sys.stdin).get("workflow_runs",[]); rs=[r for r in rs if r.get("name")=="ForexAI G13 OOS M15 Current" and r.get("head_branch")=="main" and r.get("head_sha")==target and r.get("status")=="completed" and r.get("conclusion")=="success"]; assert rs, f"no successful OOS run for {target}"; r=max(rs,key=lambda x:x["id"]); print("OOS_VERIFIED",r["id"],r["head_sha"]); print(f"OOS_RUN_ID={r['id']}")' "$TARGET_SHA" <<< "$payload" | tee /tmp/oos.txt
          grep '^OOS_RUN_ID=' /tmp/oos.txt >> "$GITHUB_ENV"

      - name: Resolve successful Promotion for exact SHA
        shell: bash
        run: |
          set -euo pipefail
          promotion_run_id=""
          for attempt in $(seq 1 48); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-promotion-m15.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | python -c 'import json,sys; target=sys.argv[1]; rs=json.load(sys.stdin).get("workflow_runs",[]); rs=[r for r in rs if r.get("name")=="ForexAI G13 Final Promotion M15" and r.get("head_branch")=="main" and r.get("head_sha")==target]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' "$TARGET_SHA")"
            case "$state" in
              SUCCESS\|*) promotion_run_id="${state#SUCCESS|}"; break ;;
              PENDING\|*|NOT_STARTED\|*) echo "PROMOTION_WAIT attempt=$attempt state=$state"; sleep 30 ;;
              FAILED\|*) echo "PROMOTION_FAILED_FOR_SHA=$TARGET_SHA RUN=${state#FAILED|}"; exit 1 ;;
            esac
          done
          test -n "$promotion_run_id"
          echo "PROMOTION_RUN_ID=$promotion_run_id" >> "$GITHUB_ENV"
          echo "G13_PROMOTION_RESOLVED=true RUN=$promotion_run_id SHA=$TARGET_SHA"

      - name: Verify Promotion artifact exists
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID" --jq '.name+" "+.conclusion+" "+.head_sha' | grep -F "ForexAI G13 Final Promotion M15 success $TARGET_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="g13-promotion-manifest-m15" and .expired==false) | .id' | grep -E '^[0-9]+$'

      - name: Dispatch exact MT5 Compile + Signal Parity
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"promotion_run_id":sys.argv[1]}}))' "$PROMOTION_RUN_ID")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-compile-parity.yml/dispatches"             --data "$payload")"
          test "$status" = "204"
          echo "G13_OOS_TO_COMPILE_DISPATCHED=true OOS_RUN_ID=$OOS_RUN_ID PROMOTION_RUN_ID=$PROMOTION_RUN_ID TARGET_SHA=$TARGET_SHA"
