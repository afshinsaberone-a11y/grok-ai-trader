name: ForexAI G13 Demo Readiness Gate M15

# Read-only evidence gate. No orders, no trading authorization.
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "Successful G13 MT5 Runtime Safety Probe v2 run"
        required: true
        default: "36335046005"
      safety_run_id:
        description: "Successful G13 Execution Safety Audit run"
        required: true
        default: "36334972883"
      parity_run_id:
        description: "Successful G13 MT5 Compile + Signal Parity run"
        required: true
        default: "36332467481"

permissions:
  contents: read
  actions: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          SAFETY_RUN_ID: ${{ inputs.safety_run_id }}
          PARITY_RUN_ID: ${{ inputs.parity_run_id }}
        run: |
          set -euo pipefail
          for pair in "RUNTIME=$RUNTIME_RUN_ID" "SAFETY=$SAFETY_RUN_ID" "PARITY=$PARITY_RUN_ID"; do
            key="${pair%%=*}"
            id="${pair#*=}"
            json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")"
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["conclusion"]=="success", (x["id"],x["conclusion"]); print(x["id"],x["head_sha"])' <<< "$json"
            sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<< "$json")"
            echo "${key}_HEAD_SHA=$sha" >> "$GITHUB_ENV"
            echo "${key}_RUN_ID=$id" >> "$GITHUB_ENV"
          done

      - name: Download evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          SAFETY_RUN_ID: ${{ inputs.safety_run_id }}
          PARITY_RUN_ID: ${{ inputs.parity_run_id }}
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence/runtime evidence/safety evidence/parity
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name g13-mt5-runtime-safety-probe-m15-v2 --dir evidence/runtime
          gh run download "$SAFETY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name g13-execution-safety-audit-m15 --dir evidence/safety
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARITY_RUN_ID/artifacts" | python -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; m=[x for x in a if x["name"].startswith("g13-mt5-compile-parity-") and not x["expired"]]; assert len(m)==1; print(m[0]["name"])')"
          gh run download "$PARITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir evidence/parity

      - name: Resolve evidence files
        run: |
          set -euo pipefail
          echo "RUNTIME_DIR=$(dirname "$(find evidence/runtime -name g13_safety_probe_auth_off.done.txt -type f | head -n1)")" >> "$GITHUB_ENV"
          echo "SAFETY_JSON=$(find evidence/safety -name g13-execution-safety-audit-m15.json -type f | head -n1)" >> "$GITHUB_ENV"
          echo "PARITY_JSON=$(find evidence/parity -name g13-mql5-signal-parity.json -type f | head -n1)" >> "$GITHUB_ENV"

      - name: Run readiness gate
        run: |
          python -m py_compile research/optimization/g13_demo_readiness_gate_m15.py
          python -m research.optimization.g13_demo_readiness_gate_m15 \
            --promotion artifacts/g13/g13-promotion-manifest-m15.json \
            --safety "$SAFETY_JSON" \
            --runtime-dir "$RUNTIME_DIR" \
            --parity "$PARITY_JSON" \
            --runtime-head-sha "$RUNTIME_HEAD_SHA" \
            --parity-head-sha "$PARITY_HEAD_SHA" \
            --safety-head-sha "$SAFETY_HEAD_SHA" \
            --report artifacts/g13/g13-demo-readiness-gate-m15.json

      - name: Fail closed assertions
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/g13/g13-demo-readiness-gate-m15.json',encoding='utf-8'))
          assert p['status']=='READY_FOR_CONTROLLED_DEMO_AUDIT'
          assert p['promotion']['demo_trading_allowed'] is False
          assert p['promotion']['live_trading_allowed'] is False
          assert p['safety']['status']=='PASS'
          assert p['safety']['matrix_cases']==48
          assert p['safety']['non_tester_allowed_states']==1
          assert p['evidence']['parity_status']=='PASS'
          assert p['evidence']['parity_passed_count']==15
          assert p['runtime']['demo_account'] is True
          assert p['runtime']['authorization_off_blocks'] is True
          assert p['runtime']['authorization_off_blocks'] is True
          assert p['runtime']['orders_submitted'] is False
          assert p['live_remains_disabled'] is True
          print('G13_DEMO_READINESS_GATE_OK')
          PY

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-demo-readiness-gate-m15
          path: artifacts/g13/g13-demo-readiness-gate-m15.json
          if-no-files-found: error
