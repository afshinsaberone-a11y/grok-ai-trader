name: ForexAI G13 Demo Readiness Gate M15

# Read-only evidence gate. No orders, no trading authorization.
# It can be run manually or automatically after the prerequisite evidence
# workflows complete successfully. The gate itself never enables trading.
on:
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: "Successful G13 MT5 Runtime Safety Probe v2 run"
        required: true
      safety_run_id:
        description: "Successful G13 Execution Safety Audit run"
        required: true
      parity_run_id:
        description: "Successful G13 MT5 Compile + Signal Parity run"
        required: true
      promotion_run_id:
        description: "Successful G13 Final Promotion M15 run for the current main commit"
        required: true
  workflow_run:
    workflows:
      - "ForexAI G13 MT5 Compile + Signal Parity"
      - "ForexAI G13 Execution Safety Audit M15"
      - "ForexAI G13 MT5 Runtime Safety Probe M15 v2"
      - "ForexAI G13 Workflow Static Validation"
      - "ForexAI G13 Final Promotion M15"
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: g13-demo-readiness-gate-m15
  cancel-in-progress: true

jobs:
  readiness:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve evidence runs
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUNTIME_RUN_ID: ${{ inputs.runtime_run_id }}
          MANUAL_SAFETY_RUN_ID: ${{ inputs.safety_run_id }}
          MANUAL_PARITY_RUN_ID: ${{ inputs.parity_run_id }}
          MANUAL_PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
          EVENT_WORKFLOW: ${{ github.event.workflow_run.name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            runtime_id="${MANUAL_RUNTIME_RUN_ID}"
            safety_id="${MANUAL_SAFETY_RUN_ID}"
            parity_id="${MANUAL_PARITY_RUN_ID}"
          else
            latest_success() {
              local workflow_file="$1"
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/${workflow_file}/runs?branch=main&status=success&per_page=20" |
                python -c 'import json,sys; rs=json.load(sys.stdin)["workflow_runs"]; assert rs, "no successful run"; print(max(rs,key=lambda x:x["id"])["id"])'
            }

            runtime_id="$(latest_success "forexai-g13-mt5-runtime-safety-probe-m15-v2.yml")"
            safety_id="$(latest_success "forexai-g13-execution-safety-audit-m15.yml")"
            parity_id="$(latest_success "forexai-g13-mt5-compile-parity.yml")"

            case "${EVENT_WORKFLOW}" in
              "ForexAI G13 MT5 Runtime Safety Probe M15 v2") runtime_id="${EVENT_RUN_ID}" ;;
              "ForexAI G13 Execution Safety Audit M15") safety_id="${EVENT_RUN_ID}" ;;
              "ForexAI G13 MT5 Compile + Signal Parity") parity_id="${EVENT_RUN_ID}" ;;
            esac
          fi

          for pair in "RUNTIME=$runtime_id" "SAFETY=$safety_id" "PARITY=$parity_id"; do
            key="${pair%%=*}"
            id="${pair#*=}"
            [ -n "$id" ] || { echo "Missing $key run id"; exit 1; }
            json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id")"
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["conclusion"]=="success", (x["id"],x["conclusion"]); print(x["id"],x["head_sha"])' <<< "$json"
            sha="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<< "$json")"
            echo "${key}_HEAD_SHA=$sha" >> "$GITHUB_ENV"
            echo "${key}_RUN_ID=$id" >> "$GITHUB_ENV"
          done

          lint_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-workflow-lint.yml/runs?branch=main&status=success&per_page=20")"
          lint_id="$(python -c 'import json,sys; rs=json.load(sys.stdin)["workflow_runs"]; assert rs, "no successful static-validation run"; print(max(rs,key=lambda x:x["id"])["id"])' <<< "$lint_runs")"
          echo "LINT_RUN_ID=$lint_id" >> "$GITHUB_ENV"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$lint_id" |
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["conclusion"]=="success", (x["id"],x["conclusion"]); print(x["id"],x["head_sha"])'
          echo "LINT_HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$lint_id" | python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')" >> "$GITHUB_ENV"

      - name: Download evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf evidence
          mkdir -p evidence/runtime evidence/safety evidence/parity
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" --name g13-mt5-runtime-safety-probe-m15-v2 --dir evidence/runtime
          gh run download "$SAFETY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name g13-execution-safety-audit-m15 --dir evidence/safety
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PARITY_RUN_ID/artifacts" | python -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; m=[x for x in a if x["name"].startswith("g13-mt5-compile-parity-") and not x["expired"]]; assert m, "compile/parity artifact missing"; print(max(m,key=lambda x:x["id"])["name"])')"
          gh run download "$PARITY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir evidence/parity

      - name: Resolve evidence files
        run: |
          set -euo pipefail
          runtime_file="$(find evidence/runtime -name g13_safety_probe_auth_off.done.txt -type f | head -n1)"
          safety_file="$(find evidence/safety -name g13-execution-safety-audit-m15.json -type f | head -n1)"
          parity_file="$(find evidence/parity -name g13-mql5-signal-parity.json -type f | head -n1)"
          [ -n "$runtime_file" ] && [ -n "$safety_file" ] && [ -n "$parity_file" ] || exit 1
          echo "RUNTIME_DIR=$(dirname "$runtime_file")" >> "$GITHUB_ENV"
          echo "SAFETY_JSON=$safety_file" >> "$GITHUB_ENV"
          echo "PARITY_JSON=$parity_file" >> "$GITHUB_ENV"

      - name: Verify static validation freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$LINT_RUN_ID" |
            python -c 'import json,sys; x=json.load(sys.stdin); assert x["conclusion"]=="success"; print("STATIC_VALIDATION_SUCCESS",x["id"],x["head_sha"])'
          git diff --quiet "$LINT_HEAD_SHA" -- \
            .github/workflows/forexai-g13-demo-readiness-gate-m15.yml \
            .github/workflows/forexai-g13-workflow-lint.yml \
            .github/workflows/forexai-g13-mt5-compile-parity.yml \
            .github/workflows/forexai-g13-execution-safety-audit-m15.yml \
            .github/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml \
            research/optimization/g13_demo_readiness_gate_m15.py
          echo "STATIC_VALIDATION_COVERS_CURRENT_G13_CONFIG=true"

      - name: Run readiness gate
        run: |
          set -euo pipefail
          python -m py_compile research/optimization/g13_demo_readiness_gate_m15.py
          python -m research.optimization.g13_demo_readiness_gate_m15             --promotion artifacts/g13/g13-promotion-manifest-m15.json             --safety "$SAFETY_JSON"             --runtime-dir "$RUNTIME_DIR"             --parity "$PARITY_JSON"             --runtime-head-sha "$RUNTIME_HEAD_SHA"             --parity-head-sha "$PARITY_HEAD_SHA"             --safety-head-sha "$SAFETY_HEAD_SHA"             --report artifacts/g13/g13-demo-readiness-gate-m15.json

      - name: Fail closed assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open('artifacts/g13/g13-demo-readiness-gate-m15.json',encoding='utf-8'))
          assert p['status']=='READY_FOR_CONTROLLED_DEMO_AUDIT'
          assert p['promotion']['demo_trading_allowed'] is False
          assert p['promotion']['live_trading_allowed'] is False
          assert p['safety']['status']=='PASS'
          assert p['safety']['matrix_cases']==1536
          assert p['safety']['matrix_allowed_states']==769
          assert p['safety']['non_tester_allowed_states']==1
          assert p['evidence']['parity_status']=='PASS'
          assert p['evidence']['parity_passed_count']==15
          assert p['runtime']['demo_account'] is True
          assert p['runtime']['authorization_off_blocks'] is True
          assert p['runtime']['orders_submitted'] is False
          assert p['live_remains_disabled'] is True
          print('G13_DEMO_READINESS_GATE_OK')
          PY

      - name: Upload readiness evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-demo-readiness-gate-m15
          path: artifacts/g13/g13-demo-readiness-gate-m15.json
          if-no-files-found: error
