name: ForexAI v26 ADX Trend EMA Pullback Discovery

on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run v26 ADX EMA pullback discovery
        env:
          START: '2022-01-01'
          END: '2026-01-01'
          MIN_TRADES: '100'
          COST: '1.4'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np, pandas as pd
          from research.real_data.histdata_ingest import load_eurusd_m1

          start,end=os.environ['START'],os.environ['END']; cost=float(os.environ['COST']); min_trades=int(os.environ['MIN_TRADES'])
          df=load_eurusd_m1(start=start,end=end)
          if df is None or len(df)==0: raise RuntimeError('REAL EURUSD data unavailable; refusing synthetic fallback')
          df=df.copy(); df['time']=pd.to_datetime(df['time'],utc=True); df=df.sort_values('time').drop_duplicates('time').reset_index(drop=True)
          if len(df)<1000: raise RuntimeError('Insufficient real market data')
          o,h,l,c=[df[x].to_numpy(float) for x in ('o','h','l','c')]; n=len(df); ts=df.time
          prev=pd.Series(c).shift(1).to_numpy(); tr=np.maximum.reduce([h-l,np.abs(h-prev),np.abs(l-prev)])
          atr=pd.Series(tr).rolling(14,min_periods=14).mean().to_numpy()
          base=df.set_index('time')[['o','h','l','c']].sort_index()
          m15=base['c'].resample('15min',label='right',closed='right').last().shift(1).reindex(df.time,method='ffill').to_numpy()
          m15e20=pd.Series(m15).ewm(span=20,adjust=False,min_periods=20).mean().to_numpy(); m15e50=pd.Series(m15).ewm(span=50,adjust=False,min_periods=50).mean().to_numpy()
          m15prev=pd.Series(m15).shift(1).to_numpy(); m15tr=np.maximum(np.abs(m15-m15prev),1e-12); plus=pd.Series(np.maximum(m15-m15prev,0)).rolling(14,min_periods=14).mean(); minus=pd.Series(np.maximum(m15prev-m15,0)).rolling(14,min_periods=14).mean(); dx=(plus-minus).abs()/(plus+minus).replace(0,np.nan); adx15=(100*dx).rolling(14,min_periods=14).mean().to_numpy()
          ema20=pd.Series(c).ewm(span=20,adjust=False,min_periods=20).mean().to_numpy(); ema50=pd.Series(c).ewm(span=50,adjust=False,min_periods=50).mean().to_numpy()
          hours=ts.dt.hour.to_numpy()
          families=[]
          for adx_min, pull_atr in [(15,0.25),(20,0.25),(20,0.50),(25,0.25),(25,0.50),(30,0.50)]:
            events=[]
            for i in range(80,n-2):
              if not np.isfinite(atr[i]) or not np.isfinite(adx15[i]) or atr[i]<=0 or adx15[i]<adx_min: continue
              up=m15e20[i]>m15e50[i]; down=m15e20[i]<m15e50[i]
              # Pullback must touch/cross the fast M1 EMA, then close back in trend direction.
              bull=up and l[i] <= ema20[i]+pull_atr*atr[i] and c[i] > ema20[i] and c[i] > o[i]
              bear=down and h[i] >= ema20[i]-pull_atr*atr[i] and c[i] < ema20[i] and c[i] < o[i]
              if bull: events.append((i+1,1))
              elif bear: events.append((i+1,-1))
            families.append((adx_min,pull_atr,events))
          contexts=['any','london','ny','overlap','htf_strong','adx_strong','adx_rising']
          exits=[(0.75,1.25,30),(1.0,1.5,60),(1.0,2.0,90),(1.5,2.5,120)]
          rows=[]
          for adx_min,pull_atr,events in families:
            for ctx in contexts:
              for slx,tpx,expiry in exits:
                last_exit=-1; vals=[]; years=[]
                for j,d in events:
                  if j<=last_exit or j>=n-1 or not np.isfinite(atr[j]): continue
                  if ctx=='london': ok=7<=hours[j]<12
                  elif ctx=='ny': ok=12<=hours[j]<17
                  elif ctx=='overlap': ok=12<=hours[j]<16
                  elif ctx=='htf_strong': ok=(d==1 and m15e20[j]>m15e50[j] and (m15e20[j]-m15e50[j])/max(atr[j],1e-9)>0.5) or (d==-1 and m15e20[j]<m15e50[j] and (m15e50[j]-m15e20[j])/max(atr[j],1e-9)>0.5)
                  elif ctx=='adx_strong': ok=np.isfinite(adx15[j]) and adx15[j]>=max(adx_min+5,25)
                  elif ctx=='adx_rising': ok=j>=16 and np.isfinite(adx15[j]) and np.isfinite(adx15[j-15]) and adx15[j]>adx15[j-15]
                  else: ok=True
                  if not ok: continue
                  entry=o[j]; sl=entry-d*slx*atr[j]; tp=entry+d*tpx*atr[j]; exit_i=min(j+expiry,n-1); pnl=None
                  for k in range(j,exit_i+1):
                    if d==1:
                      if l[k]<=sl: pnl=(sl-entry)/0.0001-cost; exit_i=k; break
                      if h[k]>=tp: pnl=(tp-entry)/0.0001-cost; exit_i=k; break
                    else:
                      if h[k]>=sl: pnl=(entry-sl)/0.0001-cost; exit_i=k; break
                      if l[k]<=tp: pnl=(entry-tp)/0.0001-cost; exit_i=k; break
                  if pnl is None: pnl=(c[exit_i]-entry)*d/0.0001-cost
                  vals.append(pnl); years.append(ts.iloc[j].year); last_exit=exit_i
                if len(vals)<min_trades: continue
                v=np.asarray(vals); gp=v[v>0].sum(); gl=-v[v<0].sum(); pf=float(gp/gl) if gl>0 else 0.0; eq=np.cumsum(v); dd=float(np.max(np.maximum.accumulate(eq)-eq)); ys=np.asarray(years); uy=sorted(set(ys)); pos=sum(v[ys==y].sum()>0 for y in uy); stable=sum((v[ys==y][v[ys==y]>0].sum()/(-v[ys==y][v[ys==y]<0].sum()))>1 for y in uy if np.any(v[ys==y]<0))
                rows.append({'family':f'adx{adx_min}_pull{pull_atr}','context':ctx,'sl_atr':slx,'tp_atr':tpx,'expiry_m1':expiry,'trades':len(v),'win_rate':float((v>0).mean()),'profit_factor':pf,'expectancy_pips':float(v.mean()),'net_pips':float(v.sum()),'max_drawdown_pips':dd,'positive_years':int(pos),'stable_pf_years':int(stable)})
          rows.sort(key=lambda x:(x['profit_factor'],x['expectancy_pips'],x['net_pips']),reverse=True)
          eligible=[r for r in rows if r['profit_factor']>1 and r['expectancy_pips']>0 and r['positive_years']>=3 and r['stable_pf_years']>=2]
          out={'schema':'forexai.strategy_discovery.v26','data':{'symbol':'EURUSD','timeframe':'M1','start':start,'end':end,'candles':n,'synthetic':False,'cost_round_trip_pips':cost,'method':'m15_adx_trend_m1_ema_pullback'},'discovery':{'families':len(families),'contexts':len(contexts),'exit_variants':len(exits),'candidate_results':len(rows),'eligible_count':len(eligible),'champion':eligible[0] if eligible else None,'top_results':rows[:30]}}
          Path('artifacts').mkdir(exist_ok=True); Path('artifacts/strategy-discovery-v26.json').write_text(json.dumps(out,indent=2,default=str),encoding='utf-8'); print(json.dumps(out['discovery'],indent=2))
          if not rows: raise RuntimeError('No valid candidate results produced')
          PY
      - name: Upload v26 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v26
          path: artifacts/strategy-discovery-v26.json
          if-no-files-found: warn
