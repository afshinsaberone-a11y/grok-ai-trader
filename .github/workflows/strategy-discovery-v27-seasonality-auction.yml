name: ForexAI v27 Intraday Seasonality Auction Discovery

on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run v27 seasonality auction discovery
        env:
          START: '2022-01-01'
          END: '2026-01-01'
          MIN_TRADES: '100'
          COST: '1.4'
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          import pandas as pd
          from research.real_data.histdata_ingest import load_eurusd_m1

          start, end = os.environ['START'], os.environ['END']
          cost = float(os.environ['COST']); min_trades = int(os.environ['MIN_TRADES'])
          df = load_eurusd_m1(start=start, end=end)
          if df is None or len(df) == 0:
              raise RuntimeError('REAL EURUSD data unavailable; refusing synthetic fallback')
          df = df.copy(); df['time'] = pd.to_datetime(df['time'], utc=True)
          df = df.sort_values('time').drop_duplicates('time').reset_index(drop=True)
          if len(df) < 1000: raise RuntimeError('Insufficient real market data')
          o,h,l,c = [df[x].to_numpy(float) for x in ('o','h','l','c')]
          ts = df['time']; n = len(df); hour = ts.dt.hour.to_numpy(); minute = ts.dt.minute.to_numpy(); dow = ts.dt.dayofweek.to_numpy()
          prev = pd.Series(c).shift(1).to_numpy(); tr = np.maximum.reduce([h-l, np.abs(h-prev), np.abs(l-prev)])
          atr = pd.Series(tr).rolling(14, min_periods=14).mean().to_numpy()
          base = df.set_index('time')[['o','h','l','c']].sort_index()
          m15c = base['c'].resample('15min', label='right', closed='right').last().shift(1).reindex(df['time'], method='ffill').to_numpy()
          m15e20 = pd.Series(m15c).ewm(span=20, adjust=False, min_periods=20).mean().to_numpy()
          m15e50 = pd.Series(m15c).ewm(span=50, adjust=False, min_periods=50).mean().to_numpy()
          # Completed prior-day/session reference levels. No look-ahead.
          day = ts.dt.floor('D')
          day_key = day.astype('int64').to_numpy()
          prev_day_high = pd.Series(h).groupby(day_key).transform('max')
          prev_day_low = pd.Series(l).groupby(day_key).transform('min')
          unique_days = pd.Series(day_key).drop_duplicates().to_numpy()
          dh = pd.Series(h).groupby(day_key).max(); dl = pd.Series(l).groupby(day_key).min()
          prev_map_h = {unique_days[i]: dh.get(unique_days[i-1], np.nan) for i in range(1,len(unique_days))}
          prev_map_l = {unique_days[i]: dl.get(unique_days[i-1], np.nan) for i in range(1,len(unique_days))}
          pdh = np.array([prev_map_h.get(x,np.nan) for x in day_key]); pdl = np.array([prev_map_l.get(x,np.nan) for x in day_key])

          # Build daily/session return statistics from completed historical observations only.
          # The signal uses the median direction/range profile learned from earlier days.
          rows=[]
          sessions=[('asia',0,7),('london',7,12),('overlap',12,16),('ny',12,17),('us_close',16,21)]
          session_id=np.full(n,'other',dtype=object)
          for name,a,b in sessions: session_id[(hour>=a)&(hour<b)] = name
          # Daily/session profiles: direction is computed from prior completed days, then applied to current day.
          dates=pd.Series(day).drop_duplicates().sort_values().to_list()
          date_index={d:i for i,d in enumerate(dates)}
          day_i=np.array([date_index[x] for x in day])
          candidates=[]
          for sess,a,b in sessions:
            mask=(hour>=a)&(hour<b)
            # Session opening auction: first 30 minutes, then trade the next 30/60/90 minute continuation.
            for auction in (15,30,60):
              for hold in (30,60,120):
                candidates.append((sess,auction,hold))

          # Precompute completed-day/session statistics for each session and horizon.
          # Signal: if prior-day median session return is positive/negative, trade that direction at the session open.
          prof={}
          for sess,a,b in sessions:
            for auction in (15,30,60):
              key=(sess,auction)
              vals=[]; last_day=None
              # Aggregate each completed day's first auction return.
              for d in dates:
                m=(day==d)&(hour>=a)&(hour<b)&(minute < auction)
                idx=np.flatnonzero(m.to_numpy())
                if len(idx)<2: continue
                vals.append((d,float(c[idx[-1]]/o[idx[0]]-1.0)))
              prof[key]=vals

          # Trade at session open only when at least 20 prior session observations exist.
          for sess,a,b in sessions:
            mask_session=(hour>=a)&(hour<b)
            for auction,hold in [(15,30),(15,60),(15,120),(30,30),(30,60),(30,120),(60,30),(60,60),(60,120)]:
              for ctx in ('any','mon','tue_wed_thu','fri','htf_agree','prevday_up','prevday_down','high_range','low_range'):
                vals=[]; years=[]; last_exit=-1
                hist=[]
                for d in dates:
                  prior=[r for r in prof[(sess,auction)] if r[0] < d]
                  if len(prior)<20: continue
                  arr=np.array([r[1] for r in prior[-60:]])
                  med=float(np.median(arr)); direction=1 if med>0 else -1 if med<0 else 0
                  if direction==0: continue
                  idx=np.flatnonzero(((day==d)&mask_session).to_numpy())
                  if len(idx)<2: continue
                  j0=int(idx[0]); j1=int(idx[min(len(idx)-1, max(1,auction))])
                  if j0<=last_exit or j0>=n-1 or not np.isfinite(atr[j0]) or atr[j0]<=0: continue
                  if ctx=='mon' and dow[j0]!=0: continue
                  if ctx=='tue_wed_thu' and dow[j0] not in (1,2,3): continue
                  if ctx=='fri' and dow[j0]!=4: continue
                  if ctx=='htf_agree' and not ((direction==1 and m15e20[j0]>m15e50[j0]) or (direction==-1 and m15e20[j0]<m15e50[j0])): continue
                  if ctx=='prevday_up' and not np.isfinite(pdh[j0]): continue
                  if ctx=='prevday_up' and c[j0]<=c[max(0,j0-1)]: continue
                  if ctx=='prevday_down' and not np.isfinite(pdl[j0]): continue
                  if ctx=='prevday_down' and c[j0]>=c[max(0,j0-1)]: continue
                  # Range regime from prior completed day; compare current prior-day range to rolling median.
                  prior_range = pdh[j0]-pdl[j0] if np.isfinite(pdh[j0]) and np.isfinite(pdl[j0]) else np.nan
                  if ctx in ('high_range','low_range'):
                    historical=[]
                    for dd in dates:
                      if dd>=d: break
                      hh=dh.get(dd,np.nan); ll=dl.get(dd,np.nan)
                      if np.isfinite(hh) and np.isfinite(ll): historical.append(hh-ll)
                    if len(historical)<20 or not np.isfinite(prior_range): continue
                    medr=float(np.median(historical[-60:]))
                    if ctx=='high_range' and not prior_range>medr: continue
                    if ctx=='low_range' and not prior_range<=medr: continue
                  entry=o[j0]; sl=entry-direction*1.0*atr[j0]; tp=entry+direction*2.0*atr[j0]; exit_i=min(j0+hold,n-1); pnl=None
                  for k in range(j0,exit_i+1):
                    if direction==1:
                      if l[k]<=sl: pnl=(sl-entry)/0.0001-cost; exit_i=k; break
                      if h[k]>=tp: pnl=(tp-entry)/0.0001-cost; exit_i=k; break
                    else:
                      if h[k]>=sl: pnl=(entry-sl)/0.0001-cost; exit_i=k; break
                      if l[k]<=tp: pnl=(entry-tp)/0.0001-cost; exit_i=k; break
                  if pnl is None: pnl=(c[exit_i]-entry)*direction/0.0001-cost
                  vals.append(pnl); years.append(ts.iloc[j0].year); last_exit=exit_i
                if len(vals)<min_trades: continue
                v=np.asarray(vals); gp=v[v>0].sum(); gl=-v[v<0].sum(); pf=float(gp/gl) if gl>0 else 0.0
                eq=np.cumsum(v); dd=float(np.max(np.maximum.accumulate(eq)-eq)); ys=np.asarray(years); uy=sorted(set(ys)); pos=sum(v[ys==y].sum()>0 for y in uy); stable=sum((v[ys==y][v[ys==y]>0].sum()/(-v[ys==y][v[ys==y]<0].sum()))>1 for y in uy if np.any(v[ys==y]<0))
                rows.append({'family':f'{sess}_auction{auction}_hold{hold}','context':ctx,'sl_atr':1.0,'tp_atr':2.0,'trades':len(v),'win_rate':float((v>0).mean()),'profit_factor':pf,'expectancy_pips':float(v.mean()),'net_pips':float(v.sum()),'max_drawdown_pips':dd,'positive_years':int(pos),'stable_pf_years':int(stable)})

          rows.sort(key=lambda x:(x['profit_factor'],x['expectancy_pips'],x['net_pips']), reverse=True)
          eligible=[r for r in rows if r['profit_factor']>1 and r['expectancy_pips']>0 and r['positive_years']>=3 and r['stable_pf_years']>=2]
          out={'schema':'forexai.strategy_discovery.v27','data':{'symbol':'EURUSD','timeframe':'M1','start':start,'end':end,'candles':n,'synthetic':False,'cost_round_trip_pips':cost,'method':'intraday_seasonality_opening_auction'},'discovery':{'families':len(sessions)*9,'contexts':9,'candidate_results':len(rows),'eligible_count':len(eligible),'champion':eligible[0] if eligible else None,'top_results':rows[:30]}}
          Path('artifacts').mkdir(exist_ok=True); Path('artifacts/strategy-discovery-v27.json').write_text(json.dumps(out,indent=2,default=str),encoding='utf-8'); print(json.dumps(out['discovery'],indent=2))
          if not rows: raise RuntimeError('No valid candidate results produced')
          PY
      - name: Upload v27 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v27
          path: artifacts/strategy-discovery-v27.json
          if-no-files-found: warn
