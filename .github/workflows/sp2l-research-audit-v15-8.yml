name: ForexAI SP2L Research Audit v15.8
on:
  workflow_dispatch:
    inputs:
      start: {required: true, default: '2022-01-01', type: string}
      end: {required: true, default: '2025-01-01', type: string}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate train window
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          s=datetime.fromisoformat(os.environ['START']); e=datetime.fromisoformat(os.environ['END'])
          assert s<e and e<=datetime(2025,1,1), 'TRAIN_WINDOW_ONLY'
          PY
      - name: Ingest REAL EURUSD M5
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M5 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Locate dataset
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: |
          DATA="data/real/normalized/EURUSD_M5_$(date -u -d "$START" +%Y%m%d)_$(date -u -d "$END - 1 day" +%Y%m%d).csv"
          test -s "$DATA" || { echo REAL_DATA_REQUIRED; exit 2; }
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run v15.8 research audit
        run: python -m research.optimization.sp2l_v15_8_audit --data "$DATA" --output artifacts/sp2l-v15-8-audit.json
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp2l-v15-8-research-audit
          path: artifacts/sp2l-v15-8-audit.json
          if-no-files-found: warn
