name: ForexAI Discovery G7 - Multi-Timeframe Cost Sensitivity
on:
  push:
    branches: [main]
    paths:
      - "research/optimization/g7_multitimeframe_cost_sensitivity.py"
      - ".github/workflows/forexai-discovery-g7-mtf-cost-sensitivity.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        timeframe: [M1, M5, M15]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile research/optimization/g7_multitimeframe_cost_sensitivity.py research/optimization/regime_aware_event_discovery_g6.py research/optimization/execution_contract_v1.py
      - name: Download REAL EURUSD
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe ${{ matrix.timeframe }} --output data/real --validate --manifest
      - name: Locate exact dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name "EURUSD_${{ matrix.timeframe }}_20220101_20251231.csv" | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run G7
        run: python -m research.optimization.g7_multitimeframe_cost_sensitivity --data "$DATA" --timeframe ${{ matrix.timeframe }} --output "artifacts/g7-${{ matrix.timeframe }}.json"
      - name: Fail closed
        run: |
          python - <<'PY'
          import json,os
          p=f"artifacts/g7-{os.environ['MATRIX_TIMEFRAME']}.json" if 'MATRIX_TIMEFRAME' in os.environ else None
          if p is None: p="artifacts/g7-${{ matrix.timeframe }}.json"
          d=json.load(open(p,encoding='utf-8'))
          assert d['real_data_required'] is True and d['synthetic_fallback'] is False
          assert d['oos_policy']['loaded'] is False and d['oos_policy']['status']=='HELD_OUT'
          assert d['execution_model']['entry']=='next_bar_open' and d['execution_model']['same_bar_resolution']=='SL first (conservative)'
          assert d['candidate_total']==108 and d['champion'] is None\n          assert len(d['candidates'])==108\n          assert len({json.dumps(x['params'],sort_keys=True) for x in d['candidates']})==108
          assert d['costs_round_trip_pips']==[0.0,0.7,1.4,2.0]
          print('G7_FAIL_CLOSED_OK',d['research_timeframe'],d['candidate_total'])
          print('G7_COST_SUMMARY',d['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: g7-mtf-cost-${{ matrix.timeframe }}
          path: artifacts/g7-${{ matrix.timeframe }}.json
          if-no-files-found: error
