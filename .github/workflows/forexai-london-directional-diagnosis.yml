name: ForexAI London Directional Diagnosis M5

on:
  push:
    branches: [main]
    paths:
      - "research/optimization/london_breakout_discovery_g3.py"
      - ".github/workflows/forexai-london-directional-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  directional-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        mode: [long_only, short_only]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile G3
        run: |
          python -m py_compile research/optimization/london_breakout_discovery_g3.py research/optimization/execution_contract_v1.py
      - name: Download REAL EURUSD M5 data
        run: |
          python -m research.real_data.histdata_ingest             --symbol EURUSD --start 2022-01-01 --end 2026-01-01             --timeframe M5 --output data/real --validate --manifest
      - name: Locate dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M5_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run directional diagnosis
        run: |
          python -m research.optimization.london_breakout_discovery_g3             --data "$DATA"             --timeframe M5             --side-mode-override "${{ matrix.mode }}"             --output "artifacts/london-breakout-g3-M5-${{ matrix.mode }}.json"
      - name: Fail-closed controls
        run: |
          MODE="${{ matrix.mode }}" python - <<'PY'
          import json, os
          mode = os.environ["MODE"]
          path = f"artifacts/london-breakout-g3-M5-{mode}.json"
          d = json.load(open(path, encoding="utf-8"))
          r = d["result"]
          e = d["execution_model"]
          assert d["real_data_required"] is True
          assert d["synthetic_fallback"] is False
          assert d["oos_policy"]["loaded"] is False
          assert d["oos_policy"]["status"] == "HELD_OUT"
          assert e["entry"] == "next_bar_open"
          assert e["round_trip_cost_pips"] == 1.4
          assert e["same_bar_resolution"] == "SL first (conservative)"
          assert e["expiry_bars"] == 30
          assert r["candidate_total"] == 216
          assert r["champion"] is None
          print("DIRECTIONAL_DIAG_OK", mode)
          print(json.dumps({
              "mode": mode,
              "candidate_total": r["candidate_total"],
              "pre_oos_qualified": r["pre_oos_qualified_count"],
              "validation_qualified": r["validation_qualified_count"],
              "gate_counts": r["gate_rejection_counts_all_candidates"],
          }, indent=2))
          PY
      - name: Upload directional evidence
        uses: actions/upload-artifact@v4
        with:
          name: london-directional-${{ matrix.mode }}
          path: artifacts/london-breakout-g3-M5-${{ matrix.mode }}.json
          if-no-files-found: error
