name: ForexAI G13 Robustness M15

# Trigger marker: run robustness on the current main revision.

on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/g13_robustness_m15.py
      - research/optimization/g13_validation_m15.py
      - research/optimization/rsi_divergence_discovery_g13.py
      - research/optimization/execution_contract_v1.py
      - .github/workflows/forexai-g13-robustness-m15.yml

permissions:
  contents: read
  actions: read

jobs:
  g13-robustness:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: |
          python -m py_compile \
            research/optimization/g13_robustness_m15.py \
            research/optimization/g13_validation_m15.py \
            research/optimization/rsi_divergence_discovery_g13.py \
            research/optimization/execution_contract_v1.py \
            research/optimization/cost_aware_gate_v14.py
      - name: Download REAL EURUSD M15
        run: |
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD --start 2022-01-01 --end 2026-01-01 \
            --timeframe M15 --output data/real --validate --manifest
      - name: Locate dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M15_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Validate real dataset and OOS boundary
        run: |
          DATASET="$DATA" python - <<'PY'
          import os,pandas as pd
          d=pd.read_csv(os.environ['DATASET'])
          assert len(d)==93017, len(d)
          ts=pd.to_datetime(d['timestamp'],utc=True)
          assert ts.is_monotonic_increasing
          assert ts.max() < pd.Timestamp('2026-01-01',tz='UTC')
          print('REAL_DATA_OK',len(d),ts.min().isoformat(),ts.max().isoformat())
          PY
      - name: Rebuild G13 validation handoff
        run: |
          python -m research.optimization.rsi_divergence_discovery_g13 \
            --data "$DATA" \
            --output artifacts/rsi-divergence-g13-M15.json
          python -m research.optimization.g13_validation_m15 \
            --data "$DATA" \
            --discovery-artifact artifacts/rsi-divergence-g13-M15.json \
            --output artifacts/g13-validation-m15.json \
            --handoff artifacts/g13-candidate-handoff-m15.json
      - name: Run G13 robustness
        run: |
          python -m research.optimization.g13_robustness_m15 \
            --data "$DATA" \
            --handoff artifacts/g13-candidate-handoff-m15.json \
            --output artifacts/g13-robustness-m15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          v=json.load(open('artifacts/g13-validation-m15.json',encoding='utf-8'))
          r=json.load(open('artifacts/g13-robustness-m15.json',encoding='utf-8'))
          assert v['real_data_only'] is True
          assert v['selection_used_2025'] is False
          assert v['oos_evaluated'] is False
          assert r['real_data_only'] is True
          assert r['selection_performed'] is False
          assert r['optimization_enabled'] is False
          assert r['oos']=={'status':'HELD_OUT','evaluated':False,'optimization_allowed':False}
          assert r['promotion_gate']['ea_generation_allowed'] is False
          print('G13_ROBUSTNESS_FAIL_CLOSED_OK')
          print('VALIDATION_QUALIFIED',v['validation_qualified_count'])
          print('ROBUSTNESS_PASS',r['robustness_pass_count'])
          print('ROBUSTNESS_IDS',[x['candidate_id'] for x in r['candidates'] if x['robustness_pass']])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-robustness-m15
          path: |
            artifacts/rsi-divergence-g13-M15.json
            artifacts/g13-validation-m15.json
            artifacts/g13-candidate-handoff-m15.json
            artifacts/g13-robustness-m15.json
          if-no-files-found: error
