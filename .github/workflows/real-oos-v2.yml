name: real-oos-v2

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC OOS start (must be 2026-01-01 or later)"
        required: true
        default: "2026-01-01"
        type: string
      end:
        description: "UTC OOS end (exclusive); use a completed date"
        required: true
        default: "2026-08-01"
        type: string
      timeframe:
        description: "OOS timeframe"
        required: true
        default: "M5"
        type: choice
        options:
          - M5
          - M15

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: pytest -q

  champion-oos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore current-year HistData monthly cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-current-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            histdata-eurusd-m1-current-
            histdata-eurusd-m1-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download and validate REAL current-year OOS HistData
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          test "$START" != "2022-01-01"
          test "${START:0:4}" = "2026"
          python -m research.real_data.histdata_current \
            --start "$START" \
            --end "$END" \
            --timeframe "$TIMEFRAME" \
            --output data/real
      - name: Locate normalized OOS dataset
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          END_INCLUSIVE=$(date -u -d "$END - 1 day" +%Y%m%d)
          START_COMPACT=${START//-/}
          DATA="data/real/normalized/EURUSD_${TIMEFRAME}_${START_COMPACT}_${END_INCLUSIVE}.csv"
          test -f "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Evaluate frozen Candidate 56 on OOS only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python -m research.optimization.run_champion_oos \
            --data "$DATA" \
            --start "$START" \
            --end "$END" \
            --output artifacts/champion_oos_report.json
      - name: Upload OOS and conflict-audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: real-oos-v2-${{ inputs.timeframe }}-${{ inputs.start }}-${{ inputs.end }}
          path: |
            artifacts/champion_oos_report.json
            data/real/normalized/*.manifest.json
            data/real/conflict_audit/*
          if-no-files-found: warn
