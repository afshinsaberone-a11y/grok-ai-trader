name: ForexAI G12 Adaptive Gate Calibration M15

on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/adaptive_gate_calibration_g12.py
      - .github/workflows/forexai-g12-adaptive-gate-calibration-m15.yml

permissions:
  contents: read
  actions: read

jobs:
  g12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile research/optimization/adaptive_gate_calibration_g12.py research/optimization/regime_aware_event_discovery_g6.py research/optimization/execution_contract_v1.py
      - name: Download REAL EURUSD M15
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M15 --output data/real --validate --manifest
      - name: Locate and validate dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M15_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          DATASET="$DATA" python - <<'PY'
          import os, pandas as pd
          p=os.environ['DATASET']
          d=pd.read_csv(p, parse_dates=['timestamp'])
          assert len(d)==93017, len(d)
          assert d.timestamp.dt.year.max() < 2026
          assert d.timestamp.is_monotonic_increasing
          print('REAL_DATA_OK',len(d),d.timestamp.max().isoformat())
          PY
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run G12
        run: python -m research.optimization.adaptive_gate_calibration_g12 --data "$DATA" --output artifacts/adaptive-gate-calibration-g12-M15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/adaptive-gate-calibration-g12-M15.json'))
          assert p['policy']['real_data_required'] is True
          assert p['policy']['synthetic_data'] is False
          assert p['policy']['oos_2026_used'] is False
          assert p['policy']['parameter_selection_used_2025'] is False
          assert p['policy']['gates_unchanged'] is True
          assert p['policy']['champion'] is None
          assert p['execution_model']['entry']=='next_bar_open'
          assert p['execution_model']['round_trip_cost_pips']==1.4
          assert len(p['variants'])==6
          assert p['canonical_rerun_required'] is True
          print('G12_FAIL_CLOSED_OK')
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-gate-calibration-g12-M15
          path: artifacts/adaptive-gate-calibration-g12-M15.json
