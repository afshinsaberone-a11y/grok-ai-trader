name: Cost-Aware Mean-Reversion Discovery v19

on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: Research timeframe
        required: true
        default: M5
        type: choice
        options: [M5]
      start:
        description: Discovery start
        required: true
        default: '2022-01-01'
        type: string
      end:
        description: Discovery end (exclusive; 2026 held out)
        required: true
        default: '2026-01-01'
        type: string
      spread_pips:
        description: Adverse spread per side
        required: true
        default: '0.5'
        type: string
      slippage_pips:
        description: Adverse slippage per side
        required: true
        default: '0.2'
        type: string

permissions:
  contents: read

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and regression gate
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile research/optimization/cost_aware_mean_reversion_v19.py
          python - <<'PY'
          from research.optimization.cost_aware_mean_reversion_v19 import catalog
          c=catalog()
          assert len(c)==972
          assert len({tuple(sorted(x.items())) for x in c})==len(c)
          print('V19_CATALOG=',len(c))
          print('V19_GATE=PASS')
          PY

  discover:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate dispatch
        env:
          EVENT_NAME: ${{ github.event_name }}
          TF: ${{ inputs.timeframe }}
        run: |
          test "$EVENT_NAME" = workflow_dispatch
          test "$TF" = M5
      - name: Cache REAL HistData raw files
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: histdata-eurusd-m1-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Ingest REAL EURUSD M5
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M5 --start "$START" --end "$END" --output data/real --validate --manifest
          DATASET="$(find data/real/normalized -maxdepth 1 -type f -name 'EURUSD_M5_*.csv' -print | sort | tail -n 1)"
          test -n "$DATASET"
          echo "DATASET=$DATASET" >> "$GITHUB_ENV"
          DATASET="$DATASET" python - <<'PY'
          import os,pandas as pd
          p=os.environ['DATASET']; d=pd.read_csv(p); ts=pd.to_datetime(d['timestamp'],utc=True)
          assert len(d)>0
          assert not ts.duplicated().any() and ts.is_monotonic_increasing
          assert (ts.dt.minute % 5 == 0).all()
          for c in ['open','high','low','close','volume']: pd.to_numeric(d[c],errors='raise')
          assert ts.max() < pd.Timestamp('2026-01-01',tz='UTC')
          assert (d['high']>=d[['open','close','low']].max(axis=1)).all()
          assert (d['low']<=d[['open','close','high']].min(axis=1)).all()
          print('REAL_M5_ROWS=',len(d))
          print('REAL_M5_NO_SYNTHETIC_FILL=true')
          PY
      - name: Run v19 mean-reversion discovery
        env:
          SPREAD: ${{ inputs.spread_pips }}
          SLIPPAGE: ${{ inputs.slippage_pips }}
        run: |
          python -m research.optimization.cost_aware_mean_reversion_v19 --data "$DATASET" --output artifacts/mean_reversion_v19.json --spread-pips "$SPREAD" --slippage-pips "$SLIPPAGE"
          python - <<'PY'
          import json
          d=json.load(open('artifacts/mean_reversion_v19.json',encoding='utf-8'))
          assert d['real_data_required'] is True
          assert d['synthetic_fallback'] is False
          assert d['research_timeframe']=='M5'
          assert d['oos_policy']['loaded'] is False
          assert d['oos_policy']['status']=='HELD_OUT'
          assert d['result']['execution_model']=='v28.1_next_bar_open'
          assert d['result']['champion'] is None
          print(json.dumps({'candidate_total':d['result']['candidate_total'],'qualified_count':d['result']['qualified_count'],'top_candidate':d['result']['top_20_diagnostics'][0]['candidate']},indent=2))
          PY
      - name: Upload v19 result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mean-reversion-v19
          path: artifacts/mean_reversion_v19.json
          if-no-files-found: error
