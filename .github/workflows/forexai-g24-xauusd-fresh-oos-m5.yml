name: ForexAI G24 XAUUSD Fresh OOS M5 Coverage 2025-2026

on:
  pull_request:
    paths:
      - ".github/workflows/forexai-g24-xauusd-fresh-oos-m5.yml"
      - "research/real_data/xauusd_fresh_oos_m5.py"
      - "tests/test_xauusd_fresh_oos_m5.py"
      - "docs/research/g24-xauusd-fresh-oos-m5-coverage-20261106.md"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/forexai-g24-xauusd-fresh-oos-m5.yml"
      - "research/real_data/xauusd_fresh_oos_m5.py"
      - "tests/test_xauusd_fresh_oos-m5.py"
      - "docs/research/g24-xauusd-fresh-oos-m5-coverage-20261106.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forexai-g24-xauusd-fresh-oos-m5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Compile G24 intake and tests
        run: python -m py_compile research/real_data/xauusd_fresh_oos_m5.py tests/test_xauusd_fresh_oos_m5.py
      - name: Run G24 data and reconciliation regression tests
        run: python -m pytest -q tests/test_xauusd_fresh_oos_m5.py tests/test_dukascopy_xauusd_ingest.py

  fresh-oos-shards:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - shard: 2025-Q1
            start: "2025-01-01"
            end: "2025-04-01"
          - shard: 2025-Q2
            start: "2025-04-01"
            end: "2025-07-01"
          - shard: 2025-Q3
            start: "2025-07-01"
            end: "2025-10-01"
          - shard: 2025-Q4
            start: "2025-10-01"
            end: "2026-01-01"
          - shard: 2026-Q1
            start: "2026-01-01"
            end: "2026-04-01"
          - shard: 2026-Q2
            start: "2026-04-01"
            end: "2026-07-01"
          - shard: 2026-Q3
            start: "2026-07-01"
            end: "2026-10-01"
          - shard: 2026-Q4-to-2026-11
            start: "2026-10-01"
            end: "2026-11-01"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source intake dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Download real paired XAUUSD M1 and build/reconcile M5
        run: |
          python -m research.real_data.xauusd_fresh_oos_m5 shard \
            --shard "${{ matrix.shard }}" \
            --start "${{ matrix.start }}" \
            --end "${{ matrix.end }}" \
            --timeout 60 \
            --retries 8 \
            --throttle-retries 12 \
            --output "data/g24-xauusd-m5-fresh-oos/${{ matrix.shard }}"
      - name: Upload immutable quarterly BID/ASK source, M5 and audit
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g24-xauusd-m5-fresh-oos-${{ matrix.shard }}
          path: data/g24-xauusd-m5-fresh-oos/${{ matrix.shard }}/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90

  assemble-fresh-period:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.fresh-oos-shards.result == 'success'
    needs: [validate, fresh-oos-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install assembly dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Download all eight verified quarterly/month shards
        uses: actions/download-artifact@v4
        with:
          pattern: forexai-g24-xauusd-m5-fresh-oos-*
          path: fresh-oos-shards
          merge-multiple: false
      - name: Verify all source hashes and assemble 2025 plus 2026-through-October
        run: |
          python -m research.real_data.xauusd_fresh_oos_m5 assemble \
            --data-root fresh-oos-shards \
            --output fresh-oos-annual
      - name: Upload fresh untouched-period datasets and manifests
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g24-xauusd-m5-fresh-oos-2025-2026
          path: fresh-oos-annual/
          if-no-files-found: error
          compression-level: 1
          retention-days: 90
