name: ForexAI Control Plane Contract

on:
  pull_request:
    paths:
      - 'tools/forexai_control_plane_v1.py'
      - 'research/optimization/g13_control_plane_ea_gate_v1.py'
      - 'research/optimization/g13_mql5_generator_v2.py'
      - 'research/optimization/g13_execution_safety_audit_m15.py'
      - 'tests/test_forexai_control_plane_v1.py'
      - 'tests/test_g13_control_plane_ea_gate_v1.py'
      - 'tests/test_g13_mql5_generator_v2.py'
      - '.github/workflows/forexai-control-plane-contract.yml'
      - '.github/workflows/forexai-control-plane-v1.yml'
      - '.github/workflows/forexai-control-plane-mt5-compile-guard.yml'
      - 'tools/forexai_resolve_exact_promotion_manifest_v1.ps1'
  push:
    paths:
      - 'tools/forexai_control_plane_v1.py'
      - 'research/optimization/g13_control_plane_ea_gate_v1.py'
      - 'research/optimization/g13_mql5_generator_v2.py'
      - 'research/optimization/g13_execution_safety_audit_m15.py'
      - 'tests/test_forexai_control_plane_v1.py'
      - 'tests/test_g13_control_plane_ea_gate_v1.py'
      - 'tests/test_g13_mql5_generator_v2.py'
      - '.github/workflows/forexai-control-plane-contract.yml'
      - '.github/workflows/forexai-control-plane-v1.yml'
      - '.github/workflows/forexai-control-plane-mt5-compile-guard.yml'
      - 'tools/forexai_resolve_exact_promotion_manifest_v1.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keep push and pull_request evidence independent; a push run must not cancel
  # the PR-required contract result for the same commit.
  group: forexai-control-plane-contract-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest cryptography
      - name: Compile producer and deterministic EA patch
        run: |
          python -m py_compile \
            tools/forexai_control_plane_v1.py \
            research/optimization/g13_control_plane_ea_gate_v1.py \
            research/optimization/g13_mql5_generator_v2.py \
            research/optimization/g13_execution_safety_audit_m15.py
      - name: Run Control Plane and generated-EA contract tests
        run: |
          python -m pytest -q \
            tests/test_forexai_control_plane_v1.py \
            tests/test_g13_control_plane_ea_gate_v1.py \
            tests/test_g13_mql5_generator_v2.py
      - name: Audit authority boundaries
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          producer = Path("tools/forexai_control_plane_v1.py").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/forexai-control-plane-v1.yml").read_text(encoding="utf-8")
          generated_gate = Path("research/optimization/g13_control_plane_ea_gate_v1.py").read_text(encoding="utf-8")
          calls = [
              node.func.attr
              for node in ast.walk(ast.parse(producer))
              if isinstance(node, ast.Call) and isinstance(node.func, ast.Attribute)
          ]
          assert "order_send" not in calls
          assert "order_send(" not in workflow.lower()
          assert '"live_trading_allowed": False' in producer
          assert "PROMOTION_RUN_ID_MISMATCH" in producer
          assert "CONTROL_PLANE_INITIAL_DENY=VERIFIED" in workflow
          assert "CONTROL_PLANE_FINAL_DENY=VERIFIED" in workflow
          assert "ControlPlaneCurrentRiskWithinReservation" in generated_gate
          assert "MarkRuntimeAuthorizationConsumed(trade_id)" in generated_gate
          assert "live accounts are always rejected" in generated_gate.lower()
          assert "FOREXAI_CONTROL_PLANE_HMAC_SECRET" in workflow

          # The direct Demo issuer must remain subordinate to the independent
          # signed one-signal admission contract. Do not let local readiness,
          # Promotion, or a manual ALLOW switch become a signing shortcut.
          assert "_verify_external_demo_admission(" in producer
          assert "verify_admission_request(" in producer
          assert "EXTERNAL_DEMO_ADMISSION_DEMO_PERMISSION_MISSING" in producer
          assert "FOREXAI_CONTROL_PLANE_ADMISSION_PUBLIC_KEY" in workflow
          assert "FOREXAI_CONTROL_PLANE_ADMISSION_REQUEST_PATH" in workflow
          assert "admission_request_path=args.admission_request" in producer
          print("FOREXAI_CONTROL_PLANE_AUTHORITY_BOUNDARIES_OK")
          PY
