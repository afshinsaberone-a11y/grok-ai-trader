name: ForexAI G13 Final Promotion M15

# Final deterministic bridge from independently validated research evidence
# to an EA-generation authorization manifest. No trading is enabled here.

# CI refresh marker: re-run G13 promotion after the artifact-uploader syntax hardening.
# Exact-SHA evidence hardening: every upstream G13 source run must succeed on this SHA.
on:
  workflow_dispatch:
  push:
    paths:
      - 'research/optimization/g13_*.py'
      - 'research/real_data/*.py'
      - 'research/optimization/g13_mql5_parity_harness.mq5'
      - 'artifacts/g13/frozen/g13-candidate-handoff-m15.json'
      - 'artifacts/g13/g13-promotion-manifest-m15.json'
      - '.github/workflows/forexai-g13-*.yml'
      - '.github/actions/g13-artifact-upload/**'

concurrency:
  group: g13-promotion-m15
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  TARGET_SHA: ${{ github.sha }}

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve exact successful source runs and download evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/validation evidence/robustness evidence/oos

          resolve_exact_run() {
            local workflow_file="$1"
            local workflow_name="$2"
            local state=""
            for attempt in $(seq 1 100); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/runs?branch=main&per_page=100")"
              state="$(printf '%s' "$payload" | TARGET_SHA="$GITHUB_SHA" EXPECTED_WORKFLOW_NAME="$workflow_name" python -c 'import json,os,sys; target=os.environ["TARGET_SHA"]; name=os.environ["EXPECTED_WORKFLOW_NAME"]; rs=json.load(sys.stdin).get("workflow_runs",[]); rs=[r for r in rs if r.get("head_branch")=="main" and r.get("head_sha")==target and r.get("name")==name]; success=[r for r in rs if r.get("status")=="completed" and r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))')"
              case "$state" in
                SUCCESS\|*)
                  echo "${state#SUCCESS|}"
                  return 0
                  ;;
                FAILED\|*)
                  echo "Exact SHA source workflow failed: $workflow_name run ${state#FAILED|}" >&2
                  return 1
                  ;;
                PENDING\|*|NOT_STARTED\|*)
                  echo "Waiting for exact SHA source: $workflow_name attempt=$attempt state=$state SHA=$GITHUB_SHA" >&2
                  sleep 30
                  ;;
              esac
            done
            echo "Timed out resolving exact SHA source: $workflow_name SHA=$GITHUB_SHA" >&2
            return 1
          }

          VALIDATION_RUN_ID="$(resolve_exact_run 'forexai-g13-validation-m15.yml' 'ForexAI G13 Validation M15')"
          ROBUSTNESS_RUN_ID="$(resolve_exact_run 'forexai-g13-robustness-m15.yml' 'ForexAI G13 Robustness M15')"
          OOS_RUN_ID="$(resolve_exact_run 'forexai-g13-oos-m15-current.yml' 'ForexAI G13 OOS M15 Current')"
          export VALIDATION_RUN_ID ROBUSTNESS_RUN_ID OOS_RUN_ID

          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          target_sha=os.environ['GITHUB_SHA']
          provenance={"schema_version":"forexai.g13.promotion_evidence_provenance.m15.v1","target_sha":target_sha,"sources":{}}
          checks={
            "validation": (int(os.environ["VALIDATION_RUN_ID"]), "g13-validation-m15", "g13-validation", "ForexAI G13 Validation M15", 355468598),
            "robustness": (int(os.environ["ROBUSTNESS_RUN_ID"]), "g13-robustness-m15", "g13-robustness", "ForexAI G13 Robustness M15", 355473409),
            "oos": (int(os.environ["OOS_RUN_ID"]), "g13-oos-m15-2026-current", "G13 2026 OOS M15 Current", "ForexAI G13 OOS M15 Current", 356162316),
          }
          for key, (run_id, expected_artifact_name, expected_job_name, expected_workflow_name, expected_workflow_id) in checks.items():
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}'],text=True))
              assert run.get('status')=="completed" and run.get('conclusion')=="success", (run_id,run.get('status'),run.get('conclusion'))
              assert run.get('name') == expected_workflow_name, (run_id, run.get('name'), expected_workflow_name)
              assert run.get('head_branch') == 'main', (run_id, run.get('head_branch'))
              assert run.get('head_sha') == target_sha, (run_id, run.get('head_sha'), target_sha)
              assert int(run.get('workflow_id')) == expected_workflow_id, (run_id,run.get('workflow_id'))
              arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100'],text=True))['artifacts']
              match=[a for a in arts if a.get('name')==expected_artifact_name and not a.get('expired')]
              assert len(match)==1, (run_id,expected_artifact_name,[a.get('name') for a in arts])
              artifact=match[0]
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/jobs?per_page=100'],text=True))['jobs']
              success_jobs=[j for j in jobs if j.get('name')==expected_job_name and j.get('conclusion')=='success']
              assert len(success_jobs)==1, (run_id, key, expected_job_name, [(j.get('name'),j.get('conclusion')) for j in jobs])
              digest=artifact.get('digest')
              assert isinstance(digest,str) and digest.startswith('sha256:')
              provenance['sources'][key]={
                  'run_id':run_id,
                  'workflow_id':int(run.get('workflow_id')),
                  'workflow_name':run.get('name'),
                  'head_branch':run.get('head_branch'),
                  'job_id':int(success_jobs[0]['id']),
                  'job_name':expected_job_name,
                  'head_sha':run.get('head_sha'),
                  'conclusion':run.get('conclusion'),
                  'artifact':{
                      'artifact_id':int(artifact['id']),
                      'name':artifact.get('name'),
                      'digest':digest,
                      'expired':bool(artifact.get('expired')),
                      'created_at':artifact.get('created_at'),
                  },
              }
              print('SOURCE_RUN_OK',run_id,run.get('head_sha'))
              print('SOURCE_ARTIFACT_OK',int(artifact['id']),artifact.get('name'),digest)
          json.dump(provenance,open('evidence/source-provenance.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          PY
          VALIDATION_ARTIFACT_ID="$(python -c 'import json; p=json.load(open("evidence/source-provenance.json")); print(p["sources"]["validation"]["artifact"]["artifact_id"])')"
          ROBUSTNESS_ARTIFACT_ID="$(python -c 'import json; p=json.load(open("evidence/source-provenance.json")); print(p["sources"]["robustness"]["artifact"]["artifact_id"])')"
          OOS_ARTIFACT_ID="$(python -c 'import json; p=json.load(open("evidence/source-provenance.json")); print(p["sources"]["oos"]["artifact"]["artifact_id"])')"

          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" > evidence/validation/source.zip
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ROBUSTNESS_ARTIFACT_ID/zip" > evidence/robustness/source.zip
          unzip -o evidence/validation/source.zip -d evidence/validation
          unzip -o evidence/robustness/source.zip -d evidence/robustness
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$OOS_ARTIFACT_ID/zip" > evidence/oos/source.zip
          unzip -o evidence/oos/source.zip -d evidence/oos
      - name: Verify downloaded artifact bytes against GitHub digests
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('evidence/source-provenance.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for key, path in {
              'validation':Path('evidence/validation/source.zip'),
              'robustness':Path('evidence/robustness/source.zip'),
              'oos':Path('evidence/oos/source.zip'),
          }.items():
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              expected=d['sources'][key]['artifact']['digest'].split(':',1)[1]
              assert actual==expected,(key,actual,expected)
              d['sources'][key]['local_zip_sha256']=actual
              print('ARTIFACT_BYTES_OK',key,actual)
          p.write_text(json.dumps(d,indent=2,sort_keys=True) + "\n", encoding='utf-8')
          PY
      - name: Verify upstream artifacts exist
        run: |
          set -euo pipefail
          ROB=$(find evidence/robustness -name 'g13-robustness-m15.json' -type f | head -n1)
          VAL=$(find evidence/validation -name 'g13-validation-m15.json' -type f | head -n1)
          OOS=$(find evidence/oos -name 'g13-oos-m15-2026.json' -type f | head -n1)
          test -n "$VAL"
          test -n "$ROB"
          test -n "$OOS"
          test -f artifacts/g13/frozen/g13-candidate-handoff-m15.json
          {
            echo "VALIDATION=$VAL"
            echo "ROBUSTNESS=$ROB"
            echo "OOS=$OOS"
          } >> "$GITHUB_ENV"
      - name: Compile and unit smoke test
        run: |
          python -m py_compile research/optimization/g13_promotion_gate_m15.py
          python -m pytest -q tests/test_g13_oos_m15.py
      - name: Run final promotion gate
        run: |
          python -m research.optimization.g13_promotion_gate_m15 \
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json \
            --validation "$VALIDATION" \
            --robustness "$ROBUSTNESS" \
            --oos "$OOS" \
            --provenance evidence/source-provenance.json \
            --target-sha "$GITHUB_SHA" \
            --output artifacts/g13/g13-promotion-manifest-m15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/g13/g13-promotion-manifest-m15.json',encoding='utf-8'))
          assert p['schema_version']=='forexai.g13.promotion_manifest.m15.v1'
          assert p['status']=='PROMOTION_READY'
          counts=p['counts']
          promoted=p['promoted_candidate_ids']
          rejected=p['rejected_candidate_ids']
          assert counts['validation']==16
          assert counts['robustness']==16
          assert counts['oos_pass']==counts['promoted']==len(promoted)
          assert counts['rejected_at_oos']==len(rejected)
          assert len(promoted)>0
          assert len(set(promoted))==len(promoted)
          assert set(promoted).isdisjoint(rejected)
          assert set(promoted)|set(rejected)==set([2,6,10,12,14,22,26,28,30,32,34,38,42,44,46,48])
          assert p['decision_policy']['selection_performed'] is False
          assert p['decision_policy']['optimization_performed'] is False
          assert p['decision_policy']['ea_generation_allowed'] is True
          assert p['decision_policy']['demo_trading_allowed'] is False
          assert p['decision_policy']['live_trading_allowed'] is False
          print('G13_FINAL_PROMOTION_GATE_OK')
          print('PROMOTED',p['promoted_candidate_ids'])
          PY
      - name: Write promotion run attestation
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          manifest = Path("artifacts/g13/g13-promotion-manifest-m15.json")
          provenance = Path("evidence/source-provenance.json")
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          payload = {
              "schema_version": "forexai.g13.promotion_run_attestation.m15.v1",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "manifest_sha256": sha(manifest),
              "provenance_sha256": sha(provenance),
          }
          Path("evidence/promotion-run-attestation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PROMOTION_RUN_ATTESTATION_OK", payload)
          PY
      - name: Upload promotion manifest
        uses: actions/upload-artifact@v4
        with:
          name: g13-promotion-manifest-m15
          path: |
            artifacts/g13/g13-promotion-manifest-m15.json
            evidence/source-provenance.json
            evidence/promotion-run-attestation.json
          if-no-files-found: error
