name: ForexAI G13 Final Promotion M15

# Final deterministic bridge from independently validated research evidence
# to an EA-generation authorization manifest. No trading is enabled here.
on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/g13_promotion_gate_m15.py
      - artifacts/g13/frozen/g13-candidate-handoff-m15.json
      - .github/workflows/forexai-g13-promotion-m15.yml

permissions:
  contents: read
  actions: read

env:
  VALIDATION_RUN_ID: '34559825574'
  VALIDATION_ARTIFACT_ID: '10184001419'
  ROBUSTNESS_RUN_ID: '34679210600'
  ROBUSTNESS_ARTIFACT_ID: '10293181701'
  OOS_RUN_ID: '34679937623'
  OOS_ARTIFACT_ID: '10293797420'

jobs:
  promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify source runs and download exact evidence artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/validation evidence/robustness evidence/oos
          python - <<'PY'
          import json, os, subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          provenance={"schema_version":"forexai.g13.promotion_evidence_provenance.m15.v1","sources":{}}
          checks={
            "validation": ('VALIDATION_RUN_ID', 'VALIDATION_ARTIFACT_ID'),
            "robustness": ('ROBUSTNESS_RUN_ID', 'ROBUSTNESS_ARTIFACT_ID'),
            "oos": ('OOS_RUN_ID', 'OOS_ARTIFACT_ID'),
          }
          for key, (run_key, art_key) in checks.items():
              run_id=int(os.environ[run_key]); artifact_id=int(os.environ[art_key])
              run=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}'],text=True))
              assert run.get('conclusion')=='success', (run_id,run.get('conclusion'))
              arts=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/artifacts'],text=True))['artifacts']
              match=[a for a in arts if int(a['id'])==artifact_id]
              assert len(match)==1, (run_id,artifact_id)
              artifact=match[0]
              assert artifact.get('expired') is False
              jobs=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/runs/{run_id}/jobs'],text=True))['jobs']
              success_jobs=[j for j in jobs if j.get('conclusion')=='success']
              assert success_jobs, (run_id,'no successful job')
              job_id=int(success_jobs[0]['id'])
              digest=artifact.get('digest')
              assert isinstance(digest,str) and digest.startswith('sha256:')
              provenance['sources'][key]={
                  'run_id':run_id,
                  'job_id':job_id,
                  'head_sha':run.get('head_sha'),
                  'conclusion':run.get('conclusion'),
                  'artifact':{
                      'artifact_id':int(artifact['id']),
                      'name':artifact.get('name'),
                      'digest':digest,
                      'expired':bool(artifact.get('expired')),
                      'created_at':artifact.get('created_at'),
                  },
              }
              print('SOURCE_RUN_OK',run_id,run.get('head_sha'))
              print('SOURCE_ARTIFACT_OK',artifact_id,artifact.get('name'),digest)
          json.dump(provenance,open('evidence/source-provenance.json','w',encoding='utf-8'),indent=2,sort_keys=True)
          PY
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID/zip" > evidence/validation/source.zip
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ROBUSTNESS_ARTIFACT_ID/zip" > evidence/robustness/source.zip
          unzip -o evidence/validation/source.zip -d evidence/validation
          unzip -o evidence/robustness/source.zip -d evidence/robustness
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$OOS_ARTIFACT_ID/zip" > evidence/oos/source.zip
          unzip -o evidence/oos/source.zip -d evidence/oos
      - name: Verify downloaded artifact bytes against GitHub digests
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('evidence/source-provenance.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          for key, path in {
              'validation':Path('evidence/validation/source.zip'),
              'robustness':Path('evidence/robustness/source.zip'),
              'oos':Path('evidence/oos/source.zip'),
          }.items():
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              expected=d['sources'][key]['artifact']['digest'].split(':',1)[1]
              assert actual==expected,(key,actual,expected)
              d['sources'][key]['local_zip_sha256']=actual
              print('ARTIFACT_BYTES_OK',key,actual)
          p.write_text(json.dumps(d,indent=2,sort_keys=True)+'
',encoding='utf-8')
          PY
      - name: Verify upstream artifacts exist
        run: |
          set -euo pipefail
          ROB=$(find evidence/robustness -name 'g13-robustness-m15.json' -type f | head -n1)
          VAL=$(find evidence/validation -name 'g13-validation-m15.json' -type f | head -n1)
          OOS=$(find evidence/oos -name 'g13-oos-m15-2026.json' -type f | head -n1)
          test -n "$VAL"
          test -n "$ROB"
          test -n "$OOS"
          test -f artifacts/g13/frozen/g13-candidate-handoff-m15.json
          echo "VALIDATION=$VAL" >> "$GITHUB_ENV"
          echo "ROBUSTNESS=$ROB" >> "$GITHUB_ENV"
          echo "OOS=$OOS" >> "$GITHUB_ENV"
      - name: Compile and unit smoke test
        run: |
          python -m py_compile research/optimization/g13_promotion_gate_m15.py
          python -m pytest -q tests/test_g13_oos_m15.py
      - name: Run final promotion gate
        run: |
          python -m research.optimization.g13_promotion_gate_m15 \
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json \
            --validation "$VALIDATION" \
            --robustness "$ROBUSTNESS" \
            --oos "$OOS" \
            --provenance evidence/source-provenance.json \
\
            --output artifacts/g13/g13-promotion-manifest-m15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/g13/g13-promotion-manifest-m15.json',encoding='utf-8'))
          assert p['schema_version']=='forexai.g13.promotion_manifest.m15.v1'
          assert p['status']=='PROMOTION_READY'
          assert p['counts']=={'validation':16,'robustness':16,'oos_pass':15,'promoted':15,'rejected_at_oos':1}
          assert p['promoted_candidate_ids']==[2,6,10,12,14,22,26,28,30,32,34,38,42,46,48]
          assert p['rejected_candidate_ids']==[44]
          assert p['decision_policy']['selection_performed'] is False
          assert p['decision_policy']['optimization_performed'] is False
          assert p['decision_policy']['ea_generation_allowed'] is True
          assert p['decision_policy']['demo_trading_allowed'] is False
          assert p['decision_policy']['live_trading_allowed'] is False
          print('G13_FINAL_PROMOTION_GATE_OK')
          print('PROMOTED',p['promoted_candidate_ids'])
      - name: Upload promotion manifest
        uses: actions/upload-artifact@v4
        with:
          name: g13-promotion-manifest-m15
          path: |
            artifacts/g13/g13-promotion-manifest-m15.json
            evidence/source-provenance.json
          if-no-files-found: error
