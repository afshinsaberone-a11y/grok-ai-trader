name: ForexAI G13 Final Promotion M15

# Final deterministic bridge from independently validated research evidence
# to an EA-generation authorization manifest. No trading is enabled here.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA whose fresh producer evidence is eligible for Promotion'
        required: true
        type: string
  workflow_run:
    workflows:
      - "ForexAI G13 Producer Lineage Audit M15"
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  promotion:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONOPTIMIZE: '0'
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Resolve exact fresh producer runs and download evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess
          import zipfile
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", target_sha), target_sha

          specs = {
              "validation": {
                  "workflow_file": "forexai-g13-validation-m15.yml",
                  "workflow_name": "ForexAI G13 Validation M15",
                  "workflow_id": 355468598,
                  "job_name": "g13-validation",
                  "artifact_name": "g13-validation-m15",
                  "provenance_name": "g13-validation-data-provenance.json",
              },
              "robustness": {
                  "workflow_file": "forexai-g13-robustness-m15.yml",
                  "workflow_name": "ForexAI G13 Robustness M15",
                  "workflow_id": 355473409,
                  "job_name": "g13-robustness",
                  "artifact_name": "g13-robustness-m15",
                  "provenance_name": "g13-robustness-data-provenance.json",
              },
              "oos": {
                  "workflow_file": "forexai-g13-oos-m15-current.yml",
                  "workflow_name": "ForexAI G13 OOS M15 Current",
                  "workflow_id": 356162316,
                  "job_name": "G13 2026 OOS M15 Current",
                  "artifact_name": "g13-oos-m15-2026-current",
                  "provenance_name": "g13-oos-data-provenance.json",
              },
          }

          source_provenance = {
              "schema_version": "forexai.g13.promotion_evidence_provenance.m15.v1",
              "target_sha": target_sha,
              "sources": {},
          }

          def gh_json(path: str) -> dict:
              return json.loads(subprocess.check_output(["gh", "api", path], text=True))

          for role, spec in specs.items():
              runs = gh_json(
                  f"repos/{repo}/actions/workflows/{spec['workflow_file']}/runs"
                  "?branch=main&status=success&per_page=100"
              )["workflow_runs"]
              matches = [
                  r for r in runs
                  if r.get("head_sha") == target_sha and r.get("conclusion") == "success"
              ]
              assert matches, f"no successful {role} producer run for exact target SHA {target_sha}"
              run = max(matches, key=lambda r: int(r["id"]))

              assert run.get("name") == spec["workflow_name"]
              assert int(run.get("workflow_id")) == spec["workflow_id"]
              assert run.get("head_branch") == "main"
              assert run.get("head_sha") == target_sha
              run_id = int(run["id"])

              artifacts = gh_json(f"repos/{repo}/actions/runs/{run_id}/artifacts")["artifacts"]
              candidates = [
                  a for a in artifacts
                  if a.get("name") == spec["artifact_name"] and a.get("expired") is False
              ]
              assert len(candidates) == 1, (role, spec["artifact_name"], candidates)
              artifact = candidates[0]
              artifact_id = int(artifact["id"])
              digest = str(artifact.get("digest", ""))
              assert re.fullmatch(r"sha256:[0-9a-fA-F]{64}", digest)

              jobs = gh_json(f"repos/{repo}/actions/runs/{run_id}/jobs")["jobs"]
              job_matches = [
                  j for j in jobs
                  if j.get("name") == spec["job_name"] and j.get("conclusion") == "success"
              ]
              assert len(job_matches) == 1, (role, spec["job_name"], job_matches)
              job_id = int(job_matches[0]["id"])

              dest = Path("evidence") / role
              dest.mkdir(parents=True, exist_ok=True)
              zip_path = dest / "source.zip"
              with zip_path.open("wb") as fh:
                  subprocess.run(
                      [
                          "gh", "api", "--method", "GET",
                          f"repos/{repo}/actions/artifacts/{artifact_id}/zip",
                      ],
                      check=True,
                      stdout=fh,
                  )

              actual = hashlib.sha256(zip_path.read_bytes()).hexdigest()
              expected = digest.split(":", 1)[1]
              assert actual == expected, (role, actual, expected)

              with zipfile.ZipFile(zip_path) as archive:
                  archive.extractall(dest)

              provenance_files = list(dest.rglob(spec["provenance_name"]))
              assert len(provenance_files) == 1, (role, provenance_files)
              local_provenance = provenance_files[0]
              (dest / "provenance.json").write_bytes(local_provenance.read_bytes())

              source_provenance["sources"][role] = {
                  "run_id": run_id,
                  "workflow_id": int(run["workflow_id"]),
                  "workflow_name": run["name"],
                  "head_branch": run["head_branch"],
                  "job_id": job_id,
                  "job_name": spec["job_name"],
                  "head_sha": run["head_sha"],
                  "conclusion": run["conclusion"],
                  "artifact": {
                      "artifact_id": artifact_id,
                      "name": artifact["name"],
                      "digest": digest,
                      "expired": bool(artifact["expired"]),
                      "created_at": artifact.get("created_at"),
                  },
                  "local_zip_sha256": actual,
              }
              print("SOURCE_RUN_OK", role, run_id, target_sha)
              print("SOURCE_ARTIFACT_OK", role, artifact_id, digest)

          Path("evidence/source-provenance.json").write_text(
              json.dumps(source_provenance, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify upstream artifacts exist
        run: |
          set -euo pipefail
          ROB=$(find evidence/robustness -name 'g13-robustness-m15.json' -type f | head -n1)
          VAL=$(find evidence/validation -name 'g13-validation-m15.json' -type f | head -n1)
          OOS=$(find evidence/oos -name 'g13-oos-m15-2026.json' -type f | head -n1)
          test -n "$VAL"
          test -n "$ROB"
          test -n "$OOS"
          VAL_DATA_PROV=$(find evidence/validation -name 'g13-validation-data-provenance.json' -type f | head -n1)
          ROB_DATA_PROV=$(find evidence/robustness -name 'g13-robustness-data-provenance.json' -type f | head -n1)
          OOS_DATA_PROV=$(find evidence/oos -name 'g13-oos-data-provenance.json' -type f | head -n1)
          test -n "$VAL_DATA_PROV"
          test -n "$ROB_DATA_PROV"
          test -n "$OOS_DATA_PROV"
          test -f artifacts/g13/frozen/g13-candidate-handoff-m15.json
          {
            echo "VALIDATION=$VAL"
            echo "ROBUSTNESS=$ROB"
            echo "OOS=$OOS"
            echo "VALIDATION_DATA_PROVENANCE=$VAL_DATA_PROV"
            echo "ROBUSTNESS_DATA_PROVENANCE=$ROB_DATA_PROV"
            echo "OOS_DATA_PROVENANCE=$OOS_DATA_PROV"
          } >> "$GITHUB_ENV"

      - name: Compile and unit smoke test
        run: |
          python -m py_compile research/optimization/g13_promotion_gate_m15.py research/optimization/g13_data_provenance.py
          python -m pytest -q tests/test_g13_oos_m15.py tests/test_g13_promotion_gate_provenance.py tests/test_g13_data_provenance.py

      - name: Run final promotion gate
        run: |
          python -m research.optimization.g13_promotion_gate_m15             --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json             --validation "$VALIDATION"             --robustness "$ROBUSTNESS"             --oos "$OOS"             --provenance evidence/source-provenance.json             --validation-data-provenance "$VALIDATION_DATA_PROVENANCE"             --robustness-data-provenance "$ROBUSTNESS_DATA_PROVENANCE"             --oos-data-provenance "$OOS_DATA_PROVENANCE"             --target-sha "$TARGET_SHA"             --output artifacts/g13/g13-promotion-manifest-m15.json

      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/g13/g13-promotion-manifest-m15.json',encoding='utf-8'))
          assert p['schema_version']=='forexai.g13.promotion_manifest.m15.v1'
          assert p['status']=='PROMOTION_READY'
          assert p['counts']=={'validation':16,'robustness':16,'oos_pass':15,'promoted':15,'rejected_at_oos':1}
          assert p['promoted_candidate_ids']==[2,6,10,12,14,22,26,28,30,32,34,38,42,46,48]
          assert p['rejected_candidate_ids']==[44]
          assert p['decision_policy']['selection_performed'] is False
          assert p['decision_policy']['optimization_performed'] is False
          assert p['decision_policy']['ea_generation_allowed'] is True
          assert p['decision_policy']['demo_trading_allowed'] is False
          assert p['decision_policy']['live_trading_allowed'] is False
          assert p['data_lineage']['schema_version']=='forexai.g13.data_lineage_binding.m15.v1'
          assert p['data_lineage']['status']=='PASS'
          assert p['data_lineage']['target_sha'] == '${{ env.TARGET_SHA }}'
          assert p['data_lineage']['validation']['data_sha256']
          assert p['data_lineage']['robustness']['data_manifest_sha256']
          assert p['data_lineage']['oos']['upstream_data_sha256']
          print('G13_FINAL_PROMOTION_GATE_OK')
          print('PROMOTED',p['promoted_candidate_ids'])
          PY

      - name: Write promotion run attestation
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path

          manifest = Path("artifacts/g13/g13-promotion-manifest-m15.json")
          provenance = Path("evidence/source-provenance.json")
          sha = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          payload = {
              "schema_version": "forexai.g13.promotion_run_attestation.m15.v1",
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "head_sha": os.environ["GITHUB_SHA"],
              "target_sha": os.environ["TARGET_SHA"],
              "manifest_sha256": sha(manifest),
              "provenance_sha256": sha(provenance),
          }
          Path("evidence/promotion-run-attestation.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("PROMOTION_RUN_ATTESTATION_OK", payload)
          PY

      - name: Upload promotion manifest
        uses: actions/upload-artifact@v4
        with:
          name: g13-promotion-manifest-m15
          path: |
            artifacts/g13/g13-promotion-manifest-m15.json
            evidence/source-provenance.json
            evidence/promotion-run-attestation.json
          if-no-files-found: error
