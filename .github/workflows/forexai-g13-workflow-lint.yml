name: ForexAI G13 Workflow Static Validation

# Static GitHub-hosted validation for the self-hosted MT5 parity workflow.
# Re-trigger after each G13 workflow repair; keep this gate current with main.
# Validate the current main branch configuration, including custom MT5 labels.

on:
  # Keep triggers aligned with the freshness check below. Any change under
  # these audited roots must produce a fresh successful static-validation run.
  push:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'research/optimization/**'
      - 'research/real_data/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/G13_PROVIDER_HOST_PREFLIGHT_V1.md'
      - 'docs/CAPITAL_FIREWALL_GRANT_ISSUER_V1.md'
      - 'docs/CAPITAL_FIREWALL_HOST_PREFLIGHT_V1.md'
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actionlint.yaml'
      - 'research/optimization/**'
      - 'research/real_data/**'
      - 'tests/**'
      - 'tools/**'
      - 'docs/G13_PROVIDER_HOST_PREFLIGHT_V1.md'
      - 'docs/CAPITAL_FIREWALL_GRANT_ISSUER_V1.md'
      - 'docs/CAPITAL_FIREWALL_HOST_PREFLIGHT_V1.md'
  workflow_dispatch:
concurrency:
  group: g13-workflow-static-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest 'cryptography>=42,<52' 'numpy>=1.26,<3' 'pandas>=2.0,<3'

      - name: Test read-only Provider host diagnostic contract
        run: python -m pytest -q tests/test_control_plane_provider_host_preflight_v1.py

      - name: Test read-only Provider registry access recovery diagnostic
        run: python -m pytest -q tests/test_provider_registry_access_recovery_diagnostic_contract.py

      - name: Test explicit Provider issuance registry lifecycle
        run: |
          python -m py_compile tools/control_plane_admission_provider_v1.py tools/control_plane_provider_host_preflight_v1.py
          python -m pytest -q tests/test_control_plane_admission_provider_v1.py tests/test_control_plane_provider_host_preflight_v1.py

      - name: Test G13 watchdog orchestration contract
        run: python -m pytest -q tests/test_g13_oos_watchdog_contract.py

      - name: Test MT5 Common Files profile resolution contract
        run: python -m pytest -q tests/test_mt5_common_files_profile_workflow_contract.py

      - name: Test G13 runtime probe startup, timeout and identity contracts
        run: python -m pytest -q tests/test_g13_runtime_safety_probe_startup_contract.py tests/test_g13_runtime_safety_probe_timeout_contract.py tests/test_g13_demo_readiness_promotion_binding.py

      - name: Test legacy runtime probe trigger and shared runner lock
        run: python -m pytest -q tests/test_g13_runtime_probe_v1_trigger_contract.py

      - name: Test G13 RSI divergence NumPy parity
        run: python -m pytest -q tests/test_g13_rsi_divergence_numpy_parity.py

      - name: Test G13 robustness exact-return cache
        run: python -m pytest -q tests/test_g13_robustness_cache_v1.py

      - name: Test Capital Firewall Grant issuer and host preflight contracts
        run: |
          python -m py_compile tools/capital_firewall_grant_issuer_v1.py tools/capital_firewall_host_preflight_v1.py
          python -m pytest -q tests/test_capital_firewall_grant_issuer_v1.py tests/test_capital_firewall_host_preflight_v1.py tests/test_g13_capital_firewall_promotion_attestor_v1.py

      - name: Parse PowerShell Provider host diagnostics
        shell: pwsh
        run: |
          $scripts = @(
            'tools/diagnose_provider_host_deployment_v1.ps1',
            'tools/diagnose_provider_registry_access_recovery_v1.ps1',
            'tools/diagnose_capital_firewall_laptop_v1.ps1',
            'tools/diagnose_github_runner_network_v1.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($script + ': ' + $_.Message) }
              exit 1
            }
          }
          Write-Output 'PROVIDER_HOST_DIAGNOSTICS_PARSE=PASS'

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256} actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Validate G13 workflows
        run: |
          ./actionlint .github/workflows/forexai-g13-mt5-compile-parity.yml
          ./actionlint .github/workflows/forexai-g13-execution-safety-audit-m15.yml
          ./actionlint .github/workflows/forexai-g13-demo-readiness-gate-m15.yml
          ./actionlint .github/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml
          ./actionlint .github/workflows/forexai-g13-mt5-runtime-safety-probe-m15.yml
          ./actionlint .github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml
          ./actionlint .github/workflows/forexai-g13-preflight-dispatcher-m15.yml
          ./actionlint .github/workflows/forexai-g13-controlled-demo-execution-audit-m15.yml
          ./actionlint .github/workflows/forexai-g13-controlled-demo-execution-collector-m15.yml
          ./actionlint .github/workflows/forexai-g13-promotion-m15.yml

      - name: Compile all G13 Python gates
        run: |
          python -m py_compile \
            research/optimization/g13_mql5_generator_v2.py \
            research/optimization/g13_mql5_parity_harness_generator.py \
            research/optimization/g13_mql5_parity.py \
            research/optimization/g13_demo_readiness_gate_m15.py \
            research/optimization/g13_execution_safety_audit_m15.py \
            research/optimization/g13_controlled_demo_execution_audit.py \
            research/optimization/g13_demo_package_preflight_m15.py \
            research/optimization/g13_demo_package_manifest_builder_m15.py \
            research/optimization/g13_real_data_provenance.py \
            research/optimization/g13_promotion_gate_m15.py

      - name: Smoke-test deterministic G13 EA rendering
        run: |
          set -euo pipefail
          rm -rf /tmp/g13_mql5_smoke
          python -m research.optimization.g13_mql5_generator_v2             --manifest artifacts/g13/g13-promotion-manifest-m15.json             --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json             --output-dir /tmp/g13_mql5_smoke
          EXPECTED_COUNT="$(python -c 'import json; print(len(json.load(open("artifacts/g13/g13-promotion-manifest-m15.json", encoding="utf-8"))["promoted_candidate_ids"]))')"
          test "$EXPECTED_COUNT" -ge 1
          test "$(find /tmp/g13_mql5_smoke -maxdepth 1 -name 'ForexAI_G13_Candidate_*.mq5' | wc -l)" -eq "$EXPECTED_COUNT"
          ! grep -R -nE 'MqlTick tick=\{\};|trans\.magic|trans\.comment' /tmp/g13_mql5_smoke
          ! grep -R -nF 'StringFormat(""' /tmp/g13_mql5_smoke
          ! grep -R -nF 'StringReplace(value,"""' /tmp/g13_mql5_smoke
          ! grep -R -nF 'PositionsByMagic(' /tmp/g13_mql5_smoke
          ! grep -R -nF 'lots=MathMin(lots,broker_lots)' /tmp/g13_mql5_smoke
          test "$(grep -R -lF 'StringFormat("\"deal_ticket' /tmp/g13_mql5_smoke | wc -l)" -eq "$EXPECTED_COUNT"
          test "$(grep -R -lF 'double lots=0.0;' /tmp/g13_mql5_smoke | wc -l)" -eq "$EXPECTED_COUNT"
          test "$(grep -R -lF 'LotSize(risk,entry)' /tmp/g13_mql5_smoke | wc -l)" -eq "$EXPECTED_COUNT"
          test "$(grep -R -lE 'input[[:space:]]+bool[[:space:]]+DemoTradingAuthorized[[:space:]]*=[[:space:]]*false;' /tmp/g13_mql5_smoke | wc -l)" -eq "$EXPECTED_COUNT"
          python - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path("artifacts/g13/g13-promotion-manifest-m15.json").read_text(encoding="utf-8"))
          expected_count = len(manifest["promoted_candidate_ids"])
          assert expected_count >= 1
          paths = sorted(Path("/tmp/g13_mql5_smoke").glob("ForexAI_G13_Candidate_*.mq5"))
          assert len(paths) == expected_count
          bs = chr(92)
          required = [
              bs + '"side' + bs + '":' + bs + '"SELL' + bs + '"',
              bs + '"retcode' + bs + '":%u',
              bs + '"deal_ticket' + bs + '":' + bs + '"%I64d' + bs + '"',
          ]
          for path in paths:
              rendered = path.read_text(encoding="utf-8")
              assert 'StringFormat(""side' not in rendered
              assert 'StringFormat(""' not in rendered
              assert 'StringReplace(value,"""' not in rendered
              for fragment in required:
                  assert fragment in rendered, f"{path.name}: missing rendered fragment {fragment!r}"
              trace_escape = rendered.split("string TraceJsonEscape", 1)[1].split("void TraceRecord", 1)[0]
              assert trace_escape.count("StringReplace(value") == 4, f"{path.name}: TraceJsonEscape must contain four replacements"
          PY

      - name: Compile controlled Demo evidence validator
        run: |
          python -m py_compile research/optimization/g13_controlled_demo_execution_audit.py

      - name: Compile final promotion gate
        run: |
          python -m py_compile research/optimization/g13_promotion_gate_m15.py
          python -m pytest -q tests/test_g13_mql5_generator_v2.py tests/test_g13_promotion_gate_provenance.py tests/test_g13_demo_readiness_promotion_binding.py tests/test_g13_demo_package_preflight_binding.py tests/test_g13_demo_package_manifest_builder.py tests/test_g13_real_data_provenance.py

      - name: Validate G13 parity contract wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/forexai-g13-mt5-compile-parity.yml").read_text(encoding="utf-8")
          harness = Path("research/optimization/g13_mql5_parity_harness_generator.py").read_text(encoding="utf-8")

          required_workflow_tokens = [
              "Compile and deploy MQL5 real-data parity script",
              "Run MQL5 real-data parity script",
              "Script=ForexAI_G13_Parity_Harness.ex5",
              "AllowLiveTrading=0",
              "DATA_CSV_INPUT:",
              "DATA_MANIFEST_RESOLVED",
              "--data-manifest",
              "DATA_MANIFEST_CI",
              "Test-TrustedRealDataset",
              "Download exact Promotion artifact handoff",
              "Stage exact Promotion artifact on GitHub-hosted resolver",
              "Upload exact Promotion artifact handoff",
              "source-artifact.env",
              "PROMOTION_ARTIFACT_DIGEST",
              "Resolve exact Promotion run",
              "G13_PROMOTION_ARTIFACT_CONSUMER_OK",
              "PROMOTION_MANIFEST",
              "Build immutable Demo package manifest",
              "g13-demo-package-manifest-m15.json",
          ]
          for token in required_workflow_tokens:
              assert token in workflow, f"missing workflow token: {token}"
          windows_compile = workflow.split("  compile-and-parity:", 1)[1]
          assert "$artifact." not in windows_compile, "Compile job must not reference an undefined Promotion artifact object"
          checkout_step = windows_compile.split("- name: Checkout", 1)[1].split("- name:", 1)[0]
          assert "persist-credentials: false" in checkout_step, (
              "Windows MT5 checkout must not persist credentials or require credential cleanup in the post job"
          )
          assert "DATA_CSV_RESOLVED=$(Join-Path $env:APPDATA" not in workflow, "Do not overwrite the manifest-bound real-data CSV with a legacy Common/Files path"
          for forbidden in ["gh api", "HttpClient", "Invoke-RestMethod", "Invoke-WebRequest"]:
              assert forbidden not in windows_compile, f"Windows Compile job must not use raw GitHub/network client: {forbidden}"

          promotion = Path(".github/workflows/forexai-g13-promotion-m15.yml").read_text(encoding="utf-8")
          for token in [
              "source-provenance.json",
              "Verify downloaded artifact bytes against GitHub digests",
              "--provenance evidence/source-provenance.json",
              "promotion-run-attestation.json",
              "g13-promotion-manifest-m15",
              "workflow_dispatch:",
              "TARGET_SHA",
          ]:
              assert token in promotion, f"promotion provenance token missing: {token}"

          # The Watchdog owns the official chain and explicitly dispatches each gate in order.
          # Prevent main pushes from racing that chain with duplicate Validation/Robustness/Promotion runs.
          for orchestrated_gate in [
              ".github/workflows/forexai-g13-validation-m15.yml",
              ".github/workflows/forexai-g13-robustness-m15.yml",
              ".github/workflows/forexai-g13-promotion-m15.yml",
          ]:
              gate_workflow = Path(orchestrated_gate).read_text(encoding="utf-8")
              trigger_prefix = gate_workflow.split("\nconcurrency:", 1)[0].split("\npermissions:", 1)[0]
              assert "workflow_dispatch:" in trigger_prefix, f"manual dispatch missing from orchestrated gate: {orchestrated_gate}"
              assert "\n  push:" not in trigger_prefix, f"orchestrated gate must not have a duplicate push trigger: {orchestrated_gate}"

          watchdog = Path(".github/workflows/forexai-g13-oos-watchdog-m15.yml").read_text(encoding="utf-8")
          assert "group: g13-oos-watchdog-m15-" in watchdog and "github.sha }}" in watchdog, (
              "G13 Watchdog concurrency must be scoped to its exact SHA"
          )
          preflight_dispatcher = Path(".github/workflows/forexai-g13-preflight-dispatcher-m15.yml").read_text(encoding="utf-8")
          dispatcher_triggers = preflight_dispatcher.split("\npermissions:", 1)[0]
          assert "workflow_dispatch:" in dispatcher_triggers, (
              "Preflight Dispatcher must remain manually recoverable"
          )
          assert "\n  push:" not in dispatcher_triggers and "\n  workflow_run:" not in dispatcher_triggers, (
              "Preflight Dispatcher must not race/cancel the primary Watchdog dispatch"
          )
          assert "group: g13-preflight-dispatcher-m15-" in preflight_dispatcher and "github.sha }}" in preflight_dispatcher, (
              "Manual Preflight Dispatcher concurrency must be SHA scoped"
          )

          # Prevent older G13 runs from cancelling evidence for a newer commit.
          # Check expression fragments separately so Actions does not parse a
          # literal expression opener inside this Python assertion block.
          sha_scoped_dispatch_gates = [
              (".github/workflows/forexai-g13-validation-m15.yml", "g13-validation-m15"),
              (".github/workflows/forexai-g13-robustness-m15.yml", "g13-robustness-m15"),
              (".github/workflows/forexai-g13-oos-m15-current.yml", "g13-oos-m15-current"),
              (".github/workflows/forexai-g13-mt5-compile-parity.yml", "g13-mt5-compile-parity"),
              (".github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml", "g13-controlled-demo-package-preflight"),
          ]
          for workflow_path, group_prefix in sha_scoped_dispatch_gates:
              workflow_text = Path(workflow_path).read_text(encoding="utf-8")
              assert f"group: {group_prefix}-" in workflow_text, (
                  f"G13 concurrency group must be SHA/invocation scoped: {workflow_path}"
              )
              if workflow_path.endswith("forexai-g13-oos-m15-current.yml"):
                  # OOS must be uniquely keyed by the verified expected main SHA
                  # and the dispatching watchdog run, so a stale watchdog cannot
                  # cancel a newer invocation. Its start guard independently
                  # verifies GITHUB_SHA and the parent watchdog run.
                  for required in (
                      "github.event.inputs.expected_main_sha",
                      "github.event.inputs.watchdog_run_id",
                      "G13_OOS_RUN_SHA_MISMATCH",
                      "G13_OOS_WATCHDOG_INVOCATION_VERIFIED",
                      "G13_OOS_MAIN_MOVED_BEFORE_START",
                  ):
                      assert required in workflow_text, (
                          f"OOS invocation-binding token missing: {required}"
                      )
              else:
                  assert "github.sha }}" in workflow_text, (
                      f"G13 concurrency group must use the dispatched commit SHA: {workflow_path}"
                  )

          # Execution Safety still uses workflow_run events, so bind its
          # concurrency group to the event source SHA. Demo Readiness is now
          # explicitly dispatched with verified run IDs and has no workflow_run
          # trigger; its concurrency key must therefore use github.sha.
          safety_path = ".github/workflows/forexai-g13-execution-safety-audit-m15.yml"
          safety_workflow = Path(safety_path).read_text(encoding="utf-8")
          assert "group: g13-execution-safety-audit-m15-" in safety_workflow, (
              f"G13 workflow_run concurrency group must be SHA-scoped: {safety_path}"
          )
          assert "github.event.workflow_run.head_sha || github.sha }}" in safety_workflow, (
              f"G13 workflow_run concurrency must bind to the event's source SHA: {safety_path}"
          )

          readiness_path = ".github/workflows/forexai-g13-demo-readiness-gate-m15.yml"
          readiness_workflow = Path(readiness_path).read_text(encoding="utf-8")
          readiness_triggers = readiness_workflow.split("\npermissions:", 1)[0]
          readiness_sha_expr = "$" + "{{ github.sha }}"
          assert f"group: g13-demo-readiness-gate-m15-{readiness_sha_expr}" in readiness_workflow, (
              f"explicitly dispatched Readiness must use the dispatched SHA: {readiness_path}"
          )
          assert "workflow_dispatch:" in readiness_triggers and "\n  workflow_run:" not in readiness_triggers, (
              f"Demo Readiness must have only the explicit dispatch trigger: {readiness_path}"
          )
          assert "github.event.workflow_run.head_sha || github.sha }}" not in readiness_workflow, (
              f"workflow_run concurrency expression is obsolete for explicit-only Readiness: {readiness_path}"
          )
          for token in [
              "actions: write",
              'dispatch_workflow "forexai-g13-validation-m15.yml"',
              'dispatch_workflow "forexai-g13-robustness-m15.yml"',
              "forexai-g13-oos-m15-current.yml/dispatches",
              "forexai-g13-promotion-m15.yml/dispatches",
              "forexai-g13-mt5-compile-parity.yml/dispatches",
              "G13_SOURCE_PRODUCERS_DISPATCHED=true",
              "G13_EXACT_SOURCE_EVIDENCE_READY=true",
              "G13_OOS_SUCCESS_RESOLVED=true",
              "G13_PROMOTION_SUCCESS_RESOLVED=true",
              "G13_WATCHDOG_MAIN_MOVED_DURING_OOS=true",
          ]:
              assert token in watchdog, f"G13 watchdog explicit-dispatch token missing: {token}"

          for token in [
              "Set up retryable GitHub CLI wrapper for transient API reads",
              "G13_GH_API_READ_RETRY",
              "G13_GH_API_READ_RETRY_EXHAUSTED attempts=5",
              "HTTP (429|500|502|503|504)",
              'echo "$bin_dir" >> "$GITHUB_PATH"',
          ]:
              assert token in watchdog, f"transient GitHub API retry token missing: {token}"

          assert watchdog.index("Set up retryable GitHub CLI wrapper for transient API reads") < watchdog.index("Verify current main"), (
              "retry wrapper must be installed before watchdog GitHub API reads"
          )

          for token in [
              "G13_COMPILE_PARITY_SETUP_ONLY_FAILURE_RETRY=true",
              "G13_COMPILE_PARITY_SETUP_RETRY_REQUESTED=true",
              "G13_COMPILE_PARITY_SETUP_RETRY_REQUEST_FAILED=true",
              "rerun-failed-jobs",
              "compile_setup_retry_used",
              "compile_retry_from_attempt",
              'failed[0].get("name")=="compile-and-parity"',
              "len(failed)==1",
              "len(failed[0].get(\"steps\") or [])==1",
              "Set up job",
              "for attempt in $(seq 1 80); do",
          ]:
              assert token in watchdog, f"G13 setup-only retry guard missing: {token}"

          assert watchdog.index("G13_COMPILE_PARITY_SETUP_ONLY_FAILURE_RETRY=true") < watchdog.index("G13_COMPILE_PARITY_FAILED_FOR_SHA="), (
              "setup-only retry must be classified before hard-failing compile/parity"
          )

          preflight = Path(".github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml").read_text(encoding="utf-8")
          preflight_dispatcher = Path(".github/workflows/forexai-g13-preflight-dispatcher-m15.yml").read_text(encoding="utf-8")
          assert "workflow_dispatch:" in preflight and "compile_parity_run_id:" in preflight, (
              "package preflight must remain manually dispatchable with an exact Compile/Parity run ID"
          )
          assert "workflow_run:" not in preflight, (
              "package preflight must not dispatch itself on Compile/Parity completion; the dispatcher is the single automatic owner"
          )
          assert 'forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches' in watchdog, (
              "watchdog must dispatch package Preflight itself after exact Compile/Parity succeeds"
          )
          assert "G13_PREFLIGHT_DISPATCHED=true" in watchdog and "G13_PREFLIGHT_BASELINE_ID" in watchdog, (
              "watchdog must record a baseline and correlate only a newly dispatched Preflight run"
          )
          assert "COMPILE_PARITY_RUN_ID" in watchdog and '"compile_parity_run_id"' in watchdog, (
              "watchdog must pass the exact successful Compile/Parity run ID to Preflight"
          )
          assert 'forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches' in preflight_dispatcher, (
              "manual recovery dispatcher must retain an explicit Preflight dispatch path"
          )
          assert "SOURCE=manual-recovery" in preflight_dispatcher and "workflow_dispatch:" in dispatcher_triggers, (
              "dispatcher must be a manual recovery path, not a competing automatic owner"
          )

          validation_dispatch = watchdog.index('dispatch_workflow "forexai-g13-validation-m15.yml"')
          robustness_dispatch = watchdog.index('dispatch_workflow "forexai-g13-robustness-m15.yml"')
          oos_dispatch = watchdog.index("forexai-g13-oos-m15-current.yml/dispatches")
          assert validation_dispatch < robustness_dispatch < oos_dispatch, (
              "G13 source evidence must be dispatched before OOS"
          )

          gate = Path("research/optimization/g13_promotion_gate_m15.py").read_text(encoding="utf-8")
          for token in [
              "def validate_provenance",
              "forexai.g13.promotion_evidence_provenance.m15.v1",
              "local_zip_sha256",
              "workflow_id",
              "workflow_name",
              "head_branch",
              "evidence_provenance_sha256",
              "promotion_run_attestation.m15.v1",
          ]:
              assert token in gate, f"promotion gate provenance token missing: {token}"

          for workflow_name in [
              ".github/workflows/forexai-g13-promotion-m15.yml",
              ".github/workflows/forexai-g13-mt5-compile-parity.yml",
              ".github/workflows/forexai-g13-demo-readiness-gate-m15.yml",
              ".github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml",
              ".github/workflows/forexai-g13-workflow-lint.yml",
          ]:
              workflow_text = Path(workflow_name).read_text(encoding="utf-8")
              assert "PYTHONOPTIMIZE: '0'" in workflow_text, f"optimized Python not blocked in workflow: {workflow_name}"

          for gate_name in [
              "research/optimization/g13_promotion_gate_m15.py",
              "research/optimization/g13_demo_readiness_gate_m15.py",
              "research/optimization/g13_demo_package_preflight_m15.py",
              "research/optimization/g13_demo_package_manifest_builder_m15.py",
              "research/optimization/g13_mql5_parity.py",
              "research/optimization/g13_real_data_provenance.py",
              "research/optimization/g13_execution_safety_audit_m15.py",
              "research/optimization/g13_controlled_demo_execution_audit.py",
          ]:
              gate_text = Path(gate_name).read_text(encoding="utf-8")
