name: ForexAI G13 Workflow Static Validation

# Static GitHub-hosted validation for the self-hosted MT5 parity workflow.
# Re-trigger after each G13 workflow repair; keep this gate current with main.
# Validate the current main branch configuration, including custom MT5 labels.

on:
  push:
    paths:
      - '.github/workflows/forexai-g13-mt5-compile-parity.yml'
      - '.github/workflows/forexai-g13-workflow-lint.yml'
      - '.github/workflows/forexai-g13-demo-readiness-gate-m15.yml'
      - '.github/actionlint.yaml'
      - 'research/optimization/g13_mql5_parity_harness_generator.py'
      - 'research/optimization/g13_mql5_parity.py'
      - 'research/optimization/g13_mql5_generator_v2.py'
      - 'research/optimization/g13_demo_readiness_gate_m15.py'
      - '.github/workflows/forexai-g13-promotion-m15.yml'
      - 'research/optimization/g13_promotion_gate_m15.py'
      - 'research/optimization/g13_controlled_demo_execution_audit.py'
      - 'research/optimization/g13_execution_safety_audit_m15.py'
      - 'research/optimization/G13_Safety_Probe_AuthOff.mq5'
      - 'research/optimization/G13_Safety_Probe_AuthOn.mq5'
      - '.github/workflows/forexai-g13-execution-safety-audit-m15.yml'
      - '.github/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml'
      - '.github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml'
      - 'research/optimization/g13_demo_package_preflight_m15.py'
      - 'research/optimization/g13_demo_package_manifest_builder_m15.py'
      - 'research/optimization/g13_real_data_provenance.py'
      - 'research/optimization/g13_data_provenance.py'
      - '.github/workflows/forexai-g13-validation-m15.yml'
      - '.github/workflows/forexai-g13-robustness-m15.yml'
      - '.github/workflows/forexai-g13-oos-m15-current.yml'
      - '.github/workflows/forexai-g13-producer-lineage-audit-m15.yml'
      - 'research/real_data/histdata_ingest.py'
      - 'research/real_data/dukascopy_ingest.py'
      - 'tests/test_g13_demo_readiness_promotion_binding.py'
      - 'tests/test_g13_real_data_provenance.py'
      - 'tests/test_g13_data_provenance.py'
      - 'tests/test_g13_producer_lineage_audit.py'
      - 'tests/test_g13_demo_package_preflight_binding.py'
      - 'tests/test_g13_promotion_gate_provenance.py'
  pull_request:
    paths:
      - '.github/workflows/forexai-g13-promotion-m15.yml'
      - 'research/optimization/g13_promotion_gate_m15.py'
      - '.github/workflows/forexai-g13-mt5-compile-parity.yml'
      - '.github/workflows/forexai-g13-workflow-lint.yml'
      - 'research/optimization/g13_mql5_parity_harness_generator.py'
      - 'research/optimization/g13_mql5_parity.py'
      - 'research/optimization/g13_demo_readiness_gate_m15.py'
      - 'research/optimization/g13_demo_package_manifest_builder_m15.py'
      - 'research/optimization/g13_demo_package_preflight_m15.py'
      - 'research/optimization/g13_real_data_provenance.py'
      - 'research/optimization/g13_data_provenance.py'
      - '.github/workflows/forexai-g13-validation-m15.yml'
      - '.github/workflows/forexai-g13-robustness-m15.yml'
      - '.github/workflows/forexai-g13-oos-m15-current.yml'
      - 'research/real_data/histdata_ingest.py'
      - 'research/real_data/dukascopy_ingest.py'
      - '.github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml'
      - 'tests/test_g13_real_data_provenance.py'
      - 'tests/test_g13_demo_package_preflight_binding.py'
      - 'tests/test_g13_demo_readiness_promotion_binding.py'
      - 'tests/test_g13_demo_package_manifest_builder.py'
      - 'tests/test_g13_promotion_gate_provenance.py'
  workflow_dispatch:

concurrency:
  group: g13-workflow-static-validation-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          curl -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256} actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          chmod +x actionlint

      - name: Validate G13 workflows
        run: |
          ./actionlint .github/workflows/forexai-g13-mt5-compile-parity.yml
          ./actionlint .github/workflows/forexai-g13-execution-safety-audit-m15.yml
          ./actionlint .github/workflows/forexai-g13-demo-readiness-gate-m15.yml
          ./actionlint .github/workflows/forexai-g13-mt5-runtime-safety-probe-m15-v2.yml
          ./actionlint .github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml
          ./actionlint .github/workflows/forexai-g13-promotion-m15.yml
          ./actionlint .github/workflows/forexai-g13-producer-lineage-audit-m15.yml

      - name: Compile all G13 Python gates
        run: |
          python -m py_compile \
            research/optimization/g13_mql5_generator_v2.py \
            research/optimization/g13_mql5_parity_harness_generator.py \
            research/optimization/g13_mql5_parity.py \
            research/optimization/g13_demo_readiness_gate_m15.py \
            research/optimization/g13_execution_safety_audit_m15.py \
            research/optimization/g13_controlled_demo_execution_audit.py \
            research/optimization/g13_demo_package_preflight_m15.py \
            research/optimization/g13_demo_package_manifest_builder_m15.py \
            research/optimization/g13_real_data_provenance.py \
            research/optimization/g13_promotion_gate_m15.py

      - name: Smoke-test deterministic G13 EA rendering
        run: |
          set -euo pipefail
          rm -rf /tmp/g13_mql5_smoke
          python -m research.optimization.g13_mql5_generator_v2 \
            --manifest artifacts/g13/g13-promotion-manifest-m15.json \
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json \
            --output-dir /tmp/g13_mql5_smoke
          test "$(find /tmp/g13_mql5_smoke -maxdepth 1 -name 'ForexAI_G13_Candidate_*.mq5' | wc -l)" -eq 15
          ! grep -R -nE 'MqlTick tick=\{\};|trans\.magic|trans\.comment' /tmp/g13_mql5_smoke
          test "$(grep -R -lE 'input[[:space:]]+bool[[:space:]]+DemoTradingAuthorized[[:space:]]*=[[:space:]]*false;' /tmp/g13_mql5_smoke | wc -l)" -eq 15

      - name: Compile controlled Demo evidence validator
        run: |
          python -m py_compile research/optimization/g13_controlled_demo_execution_audit.py

      - name: Compile final promotion gate
        run: |
          python -m py_compile research/optimization/g13_promotion_gate_m15.py research/optimization/g13_data_provenance.py
          python -m pytest -q tests/test_g13_promotion_gate_provenance.py tests/test_g13_demo_readiness_promotion_binding.py tests/test_g13_demo_package_preflight_binding.py tests/test_g13_demo_package_manifest_builder.py tests/test_g13_real_data_provenance.py tests/test_g13_data_provenance.py tests/test_g13_producer_lineage_audit.py

      - name: Validate G13 parity contract wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/forexai-g13-mt5-compile-parity.yml").read_text(encoding="utf-8")
          harness = Path("research/optimization/g13_mql5_parity_harness_generator.py").read_text(encoding="utf-8")

          required_workflow_tokens = [
              "Compile and deploy MQL5 real-data parity script",
              "Run MQL5 real-data parity script",
              "Script=ForexAI_G13_Parity_Harness.ex5",
              "AllowLiveTrading=0",
              "DATA_CSV_INPUT:",
              "DATA_MANIFEST_RESOLVED",
              "--data-manifest",
              "DATA_MANIFEST_CI",
              "Test-TrustedRealDataset",
              "Resolve exact Promotion run",
              "G13_PROMOTION_ARTIFACT_CONSUMER_OK",
              "PROMOTION_MANIFEST",
              "Build immutable Demo package manifest",
              "g13-demo-package-manifest-m15.json",
          ]
          for token in required_workflow_tokens:
              assert token in workflow, f"missing workflow token: {token}"

          promotion = Path(".github/workflows/forexai-g13-promotion-m15.yml").read_text(encoding="utf-8")
          for token in [
              "source-provenance.json",
              "Consume exact successful lineage-audit evidence",
              "--provenance evidence/source-provenance.json",
              "promotion-run-attestation.json",
              "g13-promotion-manifest-m15",
          ]:
              assert token in promotion, f"promotion provenance token missing: {token}"

          gate = Path("research/optimization/g13_promotion_gate_m15.py").read_text(encoding="utf-8")
          for token in [
              "def validate_provenance",
              "forexai.g13.promotion_evidence_provenance.m15.v1",
              "local_zip_sha256",
              "workflow_id",
              "workflow_name",
              "head_branch",
              "evidence_provenance_sha256",
              "data_lineage",
              "forexai.g13.data_lineage_binding.m15.v1",
              "validate_data_lineage",
              "--validation-data-provenance",
              "--robustness-data-provenance",
              "--oos-data-provenance",
              "--target-sha",
              "promotion_run_attestation.m15.v1",
          ]:
              assert token in gate, f"promotion gate provenance token missing: {token}"

          promotion_workflow = Path(".github/workflows/forexai-g13-promotion-m15.yml").read_text(encoding="utf-8")
          for token in [
              "target_sha:",
              "audit_run_id:",
              "TARGET_SHA:",
              "AUDIT_RUN_ID:",
              "MAIN_HEAD_SHA",
              "assert audit_run.get(\"head_sha\") == target_sha",\n              "assert int(audit_report[\"audit_run_id\"]) == audit_run_id",
              "test \"$TARGET_SHA\" = \"$MAIN_HEAD_SHA\"",
              "PROMOTION_TARGET_CURRENT_MAIN_OK",
              "ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}",
              "Consume exact successful lineage-audit evidence",
              "g13-producer-lineage-audit-m15",
              "assert run.get(\"head_sha\") == target_sha",
              "g13-validation-data-provenance.json",
              "g13-robustness-data-provenance.json",
              "g13-oos-data-provenance.json",
              "VALIDATION_DATA_PROVENANCE",
              "ROBUSTNESS_DATA_PROVENANCE",
              "OOS_DATA_PROVENANCE",
              "--validation-data-provenance",
              "--robustness-data-provenance",
              "--oos-data-provenance",
              "--target-sha",
          ]:
              assert token in promotion_workflow, f"Promotion data-lineage wiring token missing: {token}"

          for workflow_name in [
              ".github/workflows/forexai-g13-promotion-m15.yml",
              ".github/workflows/forexai-g13-mt5-compile-parity.yml",
              ".github/workflows/forexai-g13-demo-readiness-gate-m15.yml",
              ".github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml",
              ".github/workflows/forexai-g13-workflow-lint.yml",
          ]:
              workflow_text = Path(workflow_name).read_text(encoding="utf-8")
              assert "PYTHONOPTIMIZE: '0'" in workflow_text, f"optimized Python not blocked in workflow: {workflow_name}"

          for gate_name in [
              "research/optimization/g13_promotion_gate_m15.py",
              "research/optimization/g13_demo_readiness_gate_m15.py",
              "research/optimization/g13_demo_package_preflight_m15.py",
              "research/optimization/g13_demo_package_manifest_builder_m15.py",
              "research/optimization/g13_mql5_parity.py",
              "research/optimization/g13_real_data_provenance.py",
              "research/optimization/g13_execution_safety_audit_m15.py",
              "research/optimization/g13_controlled_demo_execution_audit.py",
          ]:
              gate_text = Path(gate_name).read_text(encoding="utf-8")
              assert "if not __debug__:" in gate_text, f"optimized Python guard missing: {gate_name}"

          builder = Path("research/optimization/g13_demo_package_manifest_builder_m15.py").read_text(encoding="utf-8")
          for token in [
              "forexai.g13.demo_package_manifest.m15.v2",
              "parity_evidence_sha256",
              "promotion_manifest_sha256",
              "ea_source_commit",
              "mq5_sha256",
              "data_sha256",
              "data_manifest_sha256",
              "data_provenance",
              "data_sha256",
              "data_manifest_sha256",
              "mql5_signal_parity.v2",
          ]:
              assert token in builder, f"package manifest builder token missing: {token}"

          lineage_audit = Path("research/optimization/g13_producer_lineage_audit.py").read_text(encoding="utf-8")
          for token in [
              "forexai.g13.producer_lineage_audit.m15.v1",
              "shared_pre_oos_dataset",
              "oos_dataset",
              "target_sha",
              "Dukascopy",
              "workflow_file",
              "assert source_metadata_by_role is not None",
              "set(source_metadata_by_role) == set(WORKFLOWS)",
              "assert re.fullmatch(r\"[0-9a-f]{40}\", target_sha)",
              "assert metadata[\"conclusion\"] == \"success\"",
              "if not __debug__:",
          ]:
              assert token in lineage_audit, f"producer lineage audit token missing: {token}"

          audit_workflow = Path(".github/workflows/forexai-g13-producer-lineage-audit-m15.yml").read_text(encoding="utf-8")
          for token in [
              "g13-validation-data-provenance.json",
              "g13-robustness-data-provenance.json",
              "g13-oos-data-provenance.json",
              "verify artifact bytes",
              "status=success",
              "echo \"TARGET_SHA=$TARGET_SHA\"",
              "expected_workflow_name",
              "--audit-run-id \"$GITHUB_RUN_ID\"",
              "355468598",
              "355473409",
              "356162316",
              "g13-producer-lineage-audit-m15",
              "audit_run_id",
          ]:
              # The workflow intentionally uses GitHub CLI/API for exact run/artifact binding.
              assert token in audit_workflow, f"producer lineage workflow token missing: {token}"

          data_provenance = Path("research/optimization/g13_data_provenance.py").read_text(encoding="utf-8")
          for token in [
              "forexai.g13.data_provenance.m15.v2",
              "data_sha256",
              "manifest_identity_sha256",
              "producer",
              "upstream_manifest_sha256",
              "producer_workflow_file",
              "if not __debug__:",
          ]:
              assert token in data_provenance, f"producer data provenance token missing: {token}"

          validation_workflow = Path(".github/workflows/forexai-g13-validation-m15.yml").read_text(encoding="utf-8")
          robustness_workflow = Path(".github/workflows/forexai-g13-robustness-m15.yml").read_text(encoding="utf-8")
          oos_workflow = Path(".github/workflows/forexai-g13-oos-m15-current.yml").read_text(encoding="utf-8")
          continuation = "research/optimization/cost_aware_gate_v14.py " + "\\" + "\n            research/optimization/g13_data_provenance.py"
          assert continuation in validation_workflow, "validation provenance helper must remain in py_compile continuation"
          assert continuation in robustness_workflow, "robustness provenance helper must remain in py_compile continuation"
          oos_continuation = "research/real_data/dukascopy_ingest.py " + "\\" + "\n            research/optimization/g13_data_provenance.py"
          assert oos_continuation in oos_workflow, "OOS provenance helper must remain in py_compile continuation"

          provenance = Path("research/optimization/g13_real_data_provenance.py").read_text(encoding="utf-8")
          for token in [
              "if not __debug__:",
              "EXPECTED_DATASET_ID",
              "ALLOWED_SOURCES",
              "data_sha256",
              "non-canonical real-data path",
          ]:
              assert token in provenance, f"real-data provenance validator token missing: {token}"

          preflight = Path("research/optimization/g13_demo_package_preflight_m15.py").read_text(encoding="utf-8")
          for token in [
              "compile_parity_run_id",
              "compile_parity_head_sha",
              "compile_parity_artifact_id",
              "compile_parity_artifact_digest",
              "downloaded_zip_sha256",
          ]:
              assert token in preflight, f"preflight provenance token missing: {token}"

          for workflow_path, role, output_name in [
              (".github/workflows/forexai-g13-validation-m15.yml", "validation", "artifacts/g13-validation-data-provenance.json"),
              (".github/workflows/forexai-g13-robustness-m15.yml", "robustness", "artifacts/g13-robustness-data-provenance.json"),
              (".github/workflows/forexai-g13-oos-m15-current.yml", "oos", "artifacts/g13-oos-data-provenance.json"),
          ]:
              producer_workflow = Path(workflow_path).read_text(encoding="utf-8")
              assert "research/optimization/g13_data_provenance.py" in producer_workflow, f"data provenance helper missing: {workflow_path}"
              assert f"--role {role}" in producer_workflow, f"data provenance role missing: {workflow_path}"
              assert output_name in producer_workflow, f"data provenance output missing: {workflow_path}"
              assert "--producer-run-id \"$GITHUB_RUN_ID\"" in producer_workflow
              assert "--head-sha \"$GITHUB_SHA\"" in producer_workflow
              assert f"--producer-workflow-file \"{workflow_path.split('/')[-1]}\"" in producer_workflow
              if role == "oos":
                  assert "--upstream-manifest \"$M1_MANIFEST\"" in producer_workflow
              else:
                  assert "--manifest \"$DATA_MANIFEST\"" in producer_workflow

          package_preflight_workflow = Path(".github/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml").read_text(encoding="utf-8")
          for token in [
              "g13-demo-package-manifest-m15.json",
              "g13_real_eurusd_m15.manifest.json",
              "PARITY_EVIDENCE",
              "DATA_MANIFEST_EVIDENCE",
              "--parity-evidence",
              "--data-manifest",
              "--compile-parity-artifact-digest",
          ]:
              assert token in package_preflight_workflow, f"package preflight wiring token missing: {token}"

          generator = Path("research/optimization/g13_mql5_generator_v2.py").read_text(encoding="utf-8")
          assert "trans.magic" not in generator, "MQL5 MqlTradeTransaction has no magic field; use history/request resolution"
          assert "trans.comment" not in generator, "MQL5 MqlTradeTransaction has no comment field; resolve deal/order comment from history"
          forbidden_workflow_tokens = [
              "[Common]",
              "Login=${env:MT5_LOGIN}",
              "Server=${env:MT5_SERVER}",
              "Password=${env:MT5_PASSWORD}",
              "[Tester]",
          ]
          for token in forbidden_workflow_tokens:
              assert token not in workflow, f"forbidden legacy token still present: {token}"

          assert "void OnStart()" in harness, "parity harness must be a Script with OnStart()"
          assert "bool RunHarness()" in harness, "parity harness RunHarness() missing"
          assert "FILE_COMMON" in harness, "parity harness must use FILE_COMMON"
          assert "synthetic_data" in harness and 'false' in harness, "synthetic-data contract missing"

          readiness = Path("research/optimization/g13_demo_readiness_gate_m15.py").read_text(encoding="utf-8")
          readiness_workflow = Path(".github/workflows/forexai-g13-demo-readiness-gate-m15.yml").read_text(encoding="utf-8")
          for token in [
              "promotion_run_id",
              "preflight_run_id",
              "g13-controlled-demo-package-preflight-m15",
              "latest_success_exact",
              "local target_sha=\"$2\"",
              "github.event.workflow_run.name == 'ForexAI G13 Controlled Demo Package Preflight M15'",
              "download_exact_artifact",
              "G13_EVIDENCE_ARTIFACTS_BYTE_BOUND=true",
          ]:
              assert token in readiness_workflow, f"readiness workflow binding token missing: {token}"
          for token in [
              'PROMOTION_FILE = "artifacts/g13/g13-promotion-manifest-m15.json"',
              'HANDOFF_FILE = "artifacts/g13/frozen/g13-candidate-handoff-m15.json"',
              'PARITY_CODE_FILES',
              'SAFETY_CODE_FILES',
              'RUNTIME_CRITICAL_FILES',
              'len(s["matrix"]) == 1536',
              'sum(1 for row in s["matrix"] if row["actual_allowed"]) == 769',
              '"status": "READY_FOR_CONTROLLED_DEMO_AUDIT"',
              'def validate_promotion_binding',
              'promotion_manifest_sha256',
              'data_lineage',
              'promotion["data_lineage"]["target_sha"] == main_head_sha',
              'preflight_run_id',
              'parity_run_id',
          ]:
              assert token in readiness, f"readiness contract token missing: {token}"

          generator = Path("research/optimization/g13_mql5_generator_v2.py").read_text(encoding="utf-8")
          for token in [
              "input bool   DemoTradingAuthorized = false;",
              "bool DemoTradingExecutionAllowed()",
              "ACCOUNT_TRADE_MODE_DEMO",
              "MQLInfoInteger(MQL_TESTER)",
              "if(!DemoTradingExecutionAllowed()) return;",
              "g13_demo_kill_switch.txt",
              "DemoKillSwitchAllowed()",
              "HasOtherG13Position()",
              "ACCOUNT_TRADE_MODE_DEMO",
              "ExecutionAuditFile",
              "ExecutionAuditLog(",
              "OnTradeTransaction(",
              "GetTickCount64()",
              "trade.ResultRetcode()",
              "HistoryDealSelect(",
              "HistoryOrderSelect(",
              "OrderCalcProfit(ORDER_TYPE_SELL",
              "SYMBOL_TRADE_STOPS_LEVEL",
              "CLOSE_ATTEMPT",
              "ConfigHash",
              "ResultVolume()",
              "ResultPrice()",
              "requested_price",
              "executed_price",
              "spread_points",
              "slippage_points",
              "SymbolInfoTick(",
          ]:
              assert token in generator, f"missing G13 Demo safety token: {token}"

          probe_tokens = [
              "SYMBOL_TRADE_MODE_FULL",
              "SYMBOL_TRADE_MODE_SHORTONLY",
              "SYMBOL_ORDER_MARKET",
              "SYMBOL_ORDER_SL",
              "SYMBOL_ORDER_TP",
              "SYMBOL_TRADE_STOPS_LEVEL",
              "symbol_market_order_allowed",
              "symbol_sl_allowed",
              "symbol_tp_allowed",
              "stops_level_points",
              "real_account_detected",
          ]
          for probe_name in [
              "research/optimization/G13_Safety_Probe_AuthOff.mq5",
              "research/optimization/G13_Safety_Probe_AuthOn.mq5",
          ]:
              probe = Path(probe_name).read_text(encoding="utf-8")
              for token in probe_tokens:
                  assert token in probe, f"runtime probe token missing: {probe_name}: {token}"

          print("G13_RUNTIME_SYMBOL_PERMISSION_CONTRACT_OK")
          print("G13_WORKFLOW_STATIC_CONTRACT_OK")
          PY
