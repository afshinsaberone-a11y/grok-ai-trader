name: ForexAI Agent Mission Tests

on:
  push:
    branches: [main]
    paths:
      - 'agents/**'
      - 'tests/test_research_mission.py'
      - 'tests/test_validation_mission.py'
      - 'tests/test_robustness_mission.py'
      - 'tests/test_forexai_tools.py'
      - 'tests/test_forexai_orchestrator.py'
      - '.github/workflows/agent-mission-tests.yml'
  pull_request:
    paths:
      - 'agents/**'
      - 'tests/test_research_mission.py'
      - 'tests/test_validation_mission.py'
      - 'tests/test_robustness_mission.py'
      - 'tests/test_forexai_tools.py'
      - 'tests/test_forexai_orchestrator.py'
      - '.github/workflows/agent-mission-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mission-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pytest openai-agents
      - name: Compile mission modules
        run: python -m py_compile agents/research_mission.py agents/validation_mission.py agents/robustness_mission.py agents/forexai_tools.py agents/research_controller.py agents/forexai_orchestrator.py
      - name: Run mission and orchestrator tests
        run: python -m pytest -q tests/test_research_mission.py tests/test_validation_mission.py tests/test_robustness_mission.py tests/test_forexai_tools.py tests/test_forexai_orchestrator.py
