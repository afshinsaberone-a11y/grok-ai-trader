name: ForexAI Dropbox Health Check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
      DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
      DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify credential
        run: |
          set -euo pipefail
          if [ -n "${DROPBOX_REFRESH_TOKEN:-}" ]; then
            test -n "${DROPBOX_APP_KEY:-}" || { echo "DROPBOX_HEALTHCHECK_NOT_CONFIGURED: DROPBOX_APP_KEY missing for refresh-token mode"; exit 78; }
            test -n "${DROPBOX_APP_SECRET:-}" || { echo "DROPBOX_HEALTHCHECK_NOT_CONFIGURED: DROPBOX_APP_SECRET missing for refresh-token mode"; exit 78; }
          elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then
            :
          else
            echo "DROPBOX_HEALTHCHECK_NOT_CONFIGURED: configure DROPBOX_REFRESH_TOKEN + DROPBOX_APP_KEY + DROPBOX_APP_SECRET or DROPBOX_ACCESS_TOKEN"
            exit 78
          fi

      - name: Diagnose Dropbox auth mode (non-secret)
        run: |
          set -euo pipefail
          if [ -n "${DROPBOX_REFRESH_TOKEN:-}" ]; then
            echo "auth_mode=refresh_token"
          elif [ -n "${DROPBOX_ACCESS_TOKEN:-}" ]; then
            echo "auth_mode=access_token"
          else
            echo "auth_mode=missing"
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate local Dropbox repository contract
        run: |
          set -euo pipefail
          python tools/validate_dropbox_contract.py

      - name: Run read-only Dropbox health check
        run: |
          set -euo pipefail
          python tools/dropbox_healthcheck.py --map config/dropbox_repository_map.json > dropbox-healthcheck.json
          cat dropbox-healthcheck.json

      - name: Publish health receipt
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-healthcheck
          path: dropbox-healthcheck.json
          if-no-files-found: error
