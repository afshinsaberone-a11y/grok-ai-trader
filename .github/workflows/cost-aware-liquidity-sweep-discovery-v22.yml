name: Cost-Aware Liquidity Sweep Discovery v22
on:
  workflow_dispatch:
    inputs:
      start: {required: true, default: '2022-01-01'}
      end: {required: true, default: '2026-01-01'}
      spread_pips: {required: true, default: '0.5'}
      slippage_pips: {required: true, default: '0.2'}
permissions:
  contents: read
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and regression gate
        run: |
          python -m py_compile research/optimization/cost_aware_liquidity_sweep_v22.py
          python - <<'PY'
          from research.optimization.cost_aware_liquidity_sweep_v22 import catalog, bt
          import pandas as pd
          c=catalog()
          assert len(c)==576
          assert len({tuple(sorted(x.items())) for x in c})==576
          d=pd.DataFrame({'timestamp':pd.date_range('2022-01-03',periods=400,freq='5min',tz='UTC'),'Open':1.1,'High':1.101,'Low':1.099,'Close':1.1002,'Volume':100})
          m=bt(d,c[0])
          assert m['execution_model']=='v28.1_next_bar_open'
          assert m['entries']==m['exits']
          assert not m['open_position']
          print('v22 gate PASS:',len(c))
          PY
  discover:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START: ${{ inputs.start }}
      END: ${{ inputs.end }}
      SPREAD: ${{ inputs.spread_pips }}
      SLIPPAGE: ${{ inputs.slippage_pips }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate dispatch
        run: |
          test "$START" = '2022-01-01'
          test "$END" = '2026-01-01'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Cache REAL HistData raw files
        uses: actions/cache@v4
        with:
          path: data/real/raw
          key: histdata-eurusd-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: histdata-eurusd-
      - name: Ingest REAL EURUSD M5
        run: |
          mkdir -p data/real
          python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M5 --start "$START" --end "$END" --output data/real --validate --manifest
          DATASET="$(find data/real/normalized -type f -name 'EURUSD_M5_*.csv' | head -1)"
          test -n "$DATASET"
          DATASET="$DATASET" python - <<'PY'
          import os,pandas as pd
          p=os.environ['DATASET'];d=pd.read_csv(p);d['timestamp']=pd.to_datetime(d.timestamp,utc=True)
          assert len(d)>1000 and d.timestamp.is_unique and d.timestamp.is_monotonic_increasing
          assert (d.timestamp.diff().dropna()>=pd.Timedelta(minutes=5)).all()
          assert d.timestamp.max()<pd.Timestamp('2026-01-01',tz='UTC')
          assert (d.high>=d.low).all() and (d.high>=d.open).all() and (d.high>=d.close).all() and (d.low<=d.open).all() and (d.low<=d.close).all()
          print('REAL M5 integrity OK:',len(d),d.timestamp.min(),d.timestamp.max())
          PY
          echo "DATASET=$DATASET" >> "$GITHUB_ENV"
      - name: Run v22 liquidity sweep discovery
        run: |
          python -m research.optimization.cost_aware_liquidity_sweep_v22 --data "$DATASET" --output artifacts/liquidity_sweep_v22.json --spread-pips "$SPREAD" --slippage-pips "$SLIPPAGE"
      - name: Assert fail-closed research controls
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/liquidity_sweep_v22.json'));r=d['result']
          assert d['real_data_required'] and not d['synthetic_fallback']
          assert d['research_timeframe']=='M5'
          assert d['oos_policy']['loaded'] is False and d['oos_policy']['status']=='HELD_OUT'
          assert r['execution_model']=='v28.1_next_bar_open'
          assert r['candidate_total']==576 and r['champion'] is None
          for x in r['top_20_diagnostics']:
            for y in x['pre_oos']:
              m=y['metrics'];assert m['entries']==m['exits'] and m['open_position'] is False
          print('FAIL-CLOSED OK:',r['qualified_count'],'qualified')
          PY
      - name: Upload v22 result
        uses: actions/upload-artifact@v4
        with:
          name: liquidity-sweep-v22
          path: artifacts/liquidity_sweep_v22.json
          if-no-files-found: error
