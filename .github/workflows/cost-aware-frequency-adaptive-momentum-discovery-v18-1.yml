name: Cost-Aware Frequency-Adaptive Momentum Discovery v18.1
on:
  workflow_dispatch:
    inputs:
      timeframe:
        required: true
        default: M5
        type: choice
        options: [M5]
      start:
        required: true
        default: '2022-01-01'
        type: string
      end:
        required: true
        default: '2026-01-01'
        type: string
      spread_pips:
        required: true
        default: '0.5'
        type: string
      slippage_pips:
        required: true
        default: '0.2'
        type: string
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Compile and integrity test
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile research/optimization/cost_aware_frequency_adaptive_momentum_v18_1.py
          python - <<'PY'
          import pandas as pd
          from research.optimization.cost_aware_frequency_adaptive_momentum_v18_1 import bt,catalog
          d=pd.DataFrame({'timestamp':pd.date_range('2022-01-03',periods=300,freq='5min',tz='UTC'),'Open':1.1,'High':1.101,'Low':1.099,'Close':1.1002,'Volume':100}).set_index('timestamp')
          m=bt(d,catalog()[0])
          assert m['execution_model']=='v28.1_next_bar_open'
          assert m['round_trip_cost_pips']==1.4
          assert m['entries']==m['exits']
          assert not m['open_position_end']
          assert abs(m['final_equity']-10000.0)<1e-9
          print('V18_1_TEST=PASS')
          PY
  discover:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Validate M5
        env: {TF: ${{ inputs.timeframe }}}
        run: test "$TF" = M5
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download REAL M1 only
        env: {START: ${{ inputs.start }}, END: ${{ inputs.end }}}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Build REAL M5 deterministically
        env: {START: ${{ inputs.start }}, END: ${{ inputs.end }}}
        run: |
          python - <<'PY'
          import os,pandas as pd
          from pathlib import Path
          src=Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          if not src.exists(): raise SystemExit('REAL_DATA_REQUIRED')
          d=pd.read_csv(src); d.timestamp=pd.to_datetime(d.timestamp,utc=True)
          for c in ['open','high','low','close','volume']: d[c]=pd.to_numeric(d[c],errors='raise')
          if d.timestamp.duplicated().any() or not d.timestamp.is_monotonic_increasing: raise SystemExit('INVALID_M1')
          d=d[(d.timestamp>=pd.Timestamp(os.environ['START'],tz='UTC'))&(d.timestamp<pd.Timestamp(os.environ['END'],tz='UTC'))]
          if d.empty: raise SystemExit('REAL_DATA_REQUIRED_EMPTY_INTERVAL')
          g=d.set_index('timestamp')[['open','high','low','close','volume']].resample('5min')
          m=g.agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'}); complete=g['close'].count().eq(5); m=m.loc[complete].dropna().reset_index()
          if m.empty: raise SystemExit('REAL_DATA_REQUIRED_EMPTY_M5')
          m.to_csv('data/real/normalized/EURUSD_M5_20220101_20251231.csv',index=False)
          print('REAL_M5_ROWS=',len(m)); print('INCOMPLETE_BUCKETS_DROPPED=',int((~complete).sum())); print('REAL_M5_NO_SYNTHETIC_FILL=true')
          PY
      - name: Run v18.1
        env: {SPREAD: ${{ inputs.spread_pips }}, SLIPPAGE: ${{ inputs.slippage_pips }}}
        run: |
          python -m research.optimization.cost_aware_frequency_adaptive_momentum_v18_1 --data data/real/normalized/EURUSD_M5_20220101_20251231.csv --output artifacts/frequency_adaptive_momentum_v18_1.json --spread-pips "$SPREAD" --slippage-pips "$SLIPPAGE"
          python - <<'PY'
          import json
          d=json.load(open('artifacts/frequency_adaptive_momentum_v18_1.json'))
          assert d['real_data_required'] and not d['synthetic_fallback']
          assert d['oos_policy']['status']=='HELD_OUT' and not d['oos_policy']['loaded']
          assert d['research_timeframe']=='M5'
          assert d['result']['execution_model']=='v28.1_next_bar_open'
          print(json.dumps({'candidate_total':d['result']['candidate_total'],'qualified_count':d['result']['qualified_count'],'top_candidate':d['result']['top_20_diagnostics'][0]['candidate']}))
          PY
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frequency-adaptive-momentum-v18-1
          path: artifacts/frequency_adaptive_momentum_v18_1.json
          if-no-files-found: error
