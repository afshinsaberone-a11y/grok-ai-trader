name: ForexAI Control Plane Authorization Materialization v1

# Explicitly confirmed follow-up after the producer has created a valid Ledger
# and HMAC-authenticated envelope. This workflow never creates Admission,
# invents source attestations, changes the switch to ALLOW, or submits orders.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type MATERIALIZE_ONE_SIGNAL_DEMO_AUTHORIZATION for the existing approved signal"
        required: true
        type: string
      terminal_path:
        description: "MT5 terminal executable on the self-hosted Windows runner"
        required: true
        default: 'C:\Program Files\MetaTrader 5\terminal64.exe'
        type: string

permissions:
  contents: read

concurrency:
  group: forexai-control-plane-materialize-authorization-v1
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
      TERMINAL_PATH: ${{ inputs.terminal_path }}
      MT5_DATA_ROOT: 'C:\Users\Star\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075'
      MATERIALIZE_CONFIRMATION: ${{ inputs.confirmation }}
      CANDIDATE_ID: "2"

    steps:
      - name: Validate explicit one-signal confirmation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch') {
            throw 'MQL5_AUTH_MATERIALIZATION_MANUAL_DISPATCH_REQUIRED'
          }
          if ($env:MATERIALIZE_CONFIRMATION -cne 'MATERIALIZE_ONE_SIGNAL_DEMO_AUTHORIZATION') {
            throw 'MQL5_AUTH_MATERIALIZATION_CONFIRMATION_INVALID'
          }
          Write-Output 'MQL5_AUTH_MATERIALIZATION_CONFIRMATION=PASS'
          Write-Output 'ORDER_SUBMISSION_ENABLED=false'
          Write-Output 'LIVE_TRADING_ALLOWED=false'

      - name: Checkout workflow revision
        uses: actions/checkout@v4

      - name: Resolve MT5 profile and force Kill Switch DENY
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $resolver = Join-Path $env:GITHUB_WORKSPACE 'tools\resolve_mt5_profile_or_desktop_v1.ps1'
          if (-not (Test-Path -LiteralPath $resolver -PathType Leaf)) {
            throw 'MQL5_AUTH_MATERIALIZATION_PROFILE_RESOLVER_MISSING'
          }
          try {
            $resolverOutput = @(& $resolver -TerminalPath "$env:TERMINAL_PATH" -DataRoot "$env:MT5_DATA_ROOT" -SetDenyKillSwitch)
            foreach ($item in $resolverOutput) {
              $line = [string]$item
              if ($line -match '^(G13_MT5_COMMON_FILES|FOREXAI_MT5_COMMON_FILES|APPDATA)=') {
                Write-Output 'MT5_PROFILE_PATHS=[RESOLVED]'
              } elseif ($line -match '^G13_MT5_TERMINAL_OWNER=') {
                Write-Output 'G13_MT5_TERMINAL_OWNER=[REDACTED]'
              } elseif ($line -match '^G13_MT5_TERMINAL_PIDS=') {
                Write-Output 'G13_MT5_TERMINAL_PIDS=[REDACTED]'
              } else {
                Write-Output $line
              }
            }
          } catch {
            throw 'MQL5_AUTH_MATERIALIZATION_MT5_PROFILE_RESOLUTION_BLOCKED'
          }

      - name: Verify existing producer outputs and bind exact signal
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestPath = $env:FOREXAI_CONTROL_PLANE_ADMISSION_REQUEST_PATH
          $ledgerPath = $env:FOREXAI_TRADE_LEDGER_PATH
          $envelopePath = $env:FOREXAI_AUTHENTICATED_ENVELOPE_PATH
          $commonFiles = $env:FOREXAI_MT5_COMMON_FILES

          if ([string]::IsNullOrWhiteSpace($requestPath)) { throw 'MQL5_AUTH_ADMISSION_REQUEST_PATH_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($ledgerPath)) { throw 'MQL5_AUTH_LEDGER_PATH_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($envelopePath)) { throw 'MQL5_AUTH_ENVELOPE_PATH_NOT_CONFIGURED' }
          if ([string]::IsNullOrWhiteSpace($commonFiles) -or -not (Test-Path -LiteralPath $commonFiles -PathType Container)) {
            throw 'MQL5_AUTH_COMMON_FILES_DIRECTORY_MISSING'
          }
          if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) { throw 'MQL5_AUTH_ADMISSION_REQUEST_FILE_MISSING' }
          if (-not (Test-Path -LiteralPath $ledgerPath -PathType Leaf)) { throw 'MQL5_AUTH_TRADE_LEDGER_FILE_MISSING_RUN_PRODUCER_FIRST' }
          if (-not (Test-Path -LiteralPath $envelopePath -PathType Leaf)) { throw 'MQL5_AUTH_AUTHENTICATED_ENVELOPE_FILE_MISSING_RUN_PRODUCER_FIRST' }

          try {
            $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json
            $authenticated = Get-Content -LiteralPath $envelopePath -Raw | ConvertFrom-Json
          } catch {
            throw 'MQL5_AUTH_INPUT_JSON_INVALID'
          }
          if ($request.schema -cne 'forexai.control_plane_admission_request.v1') { throw 'MQL5_AUTH_ADMISSION_SCHEMA_INVALID' }
          if (-not $request.candidate -or -not $request.authorization -or -not $request.promotion_evidence) {
            throw 'MQL5_AUTH_ADMISSION_FIELDS_MISSING'
          }
          if ([int]$request.candidate.candidate_id -ne 2) { throw 'MQL5_AUTH_CANDIDATE_ID_MISMATCH' }
          if ($request.promotion_evidence.demo_trading_allowed -ne $true -or
              $request.promotion_evidence.live_trading_allowed -ne $false -or
              $request.promotion_evidence.real_data_only -ne $true -or
              $request.promotion_evidence.synthetic_data -ne $false) {
            throw 'MQL5_AUTH_PROMOTION_PERMISSION_OR_PROVENANCE_BLOCKED'
          }
          if ([string]$request.candidate.symbol -cne 'EURUSD' -or
              [string]$request.candidate.timeframe -cne 'M15' -or
              [string]$request.candidate.side -cne 'SELL') {
            throw 'MQL5_AUTH_SIGNAL_SCOPE_MISMATCH'
          }
          $tradeId = [string]$request.candidate.trade_id
          if ($tradeId -notmatch '^[A-Za-z0-9_.:]+(?:-[A-Za-z0-9_.:]+)*-S$') {
            throw 'MQL5_AUTH_TRADE_ID_INVALID'
          }
          if ($authenticated.auth_schema -cne 'forexai.runtime_authorization_authentication.v1' -or
              -not $authenticated.envelope) {
            throw 'MQL5_AUTH_ENVELOPE_SCHEMA_INVALID'
          }
          $inner = $authenticated.envelope
          if ([string]$inner.trade_id -cne $tradeId) { throw 'MQL5_AUTH_ENVELOPE_TRADE_ID_MISMATCH' }
          if ([string]$inner.authorization_id -cne [string]$request.authorization.authorization_id) {
            throw 'MQL5_AUTH_AUTHORIZATION_ID_MISMATCH'
          }
          if ([string]$inner.reservation_id -cne [string]$request.authorization.reservation_id) {
            throw 'MQL5_AUTH_RESERVATION_ID_MISMATCH'
          }

          $authName = 'ForexAI_Authorization_130002_EURUSD.auth'
          $authPath = Join-Path $commonFiles $authName
          if (Test-Path -LiteralPath $authPath) {
            throw 'MQL5_AUTH_RECORD_ALREADY_EXISTS_MANUAL_REVIEW_REQUIRED'
          }

          "MATERIALIZE_TRADE_ID=$tradeId" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MATERIALIZE_AUTH_PATH=$authPath" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $reportDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/g13-control-plane-materialization'
          "MATERIALIZE_REPORT_DIR=$reportDir" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'MQL5_AUTH_INPUTS=EXIST_AND_MATCH'
          Write-Output 'MQL5_AUTH_OUTPUT_TARGET=ABSENT'
          Write-Output 'MQL5_AUTH_LIVE_TRADING_ALLOWED=false'

      - name: Resolve supported Python runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $candidatePaths = @(
            (Get-Command python -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1),
            'C:\Users\Star\AppData\Local\Programs\Python\Python312\python.exe',
            'C:\Program Files\Python312\python.exe',
            'C:\Program Files\Python311\python.exe'
          ) | Where-Object { $_ }
          $pythonExe = $null
          foreach ($candidate in $candidatePaths) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              try {
                $version = (& $candidate -c "import sys; print(sys.version_info.major, sys.version_info.minor)" 2>$null | Select-Object -Last 1).Trim()
                if ($LASTEXITCODE -eq 0 -and $version -match '^3 (11|12|13)$') { $pythonExe = $candidate; break }
              } catch { }
            }
          }
          if (-not $pythonExe) { throw 'MQL5_AUTH_SUPPORTED_PYTHON_NOT_FOUND' }
          & $pythonExe -c "import cryptography" 2>$null
          if ($LASTEXITCODE -ne 0) { throw 'MQL5_AUTH_CRYPTOGRAPHY_DEPENDENCY_MISSING' }
          "PYTHON_EXE=$pythonExe" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'MQL5_AUTH_PYTHON=PASS'

      - name: Materialize short-lived MQL5 authorization record (no order submission)
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          FOREXAI_CONTROL_PLANE_HMAC_SECRET: ${{ secrets.FOREXAI_CONTROL_PLANE_HMAC_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:FOREXAI_CONTROL_PLANE_HMAC_SECRET)) {
            throw 'MQL5_AUTH_CONTROL_PLANE_SECRET_NOT_CONFIGURED'
          }
          $nowUtc = [DateTime]::UtcNow.ToString('o')
          $toolArgs = @(
            '-m', 'tools.materialize_mql5_authorization_v1',
            '--ledger', $env:FOREXAI_TRADE_LEDGER_PATH,
            '--authenticated-envelope', $env:FOREXAI_AUTHENTICATED_ENVELOPE_PATH,
            '--control-plane-secret-env', 'FOREXAI_CONTROL_PLANE_HMAC_SECRET',
            '--output', $env:MATERIALIZE_AUTH_PATH,
            '--now-utc', $nowUtc,
            '--trade-id', $env:MATERIALIZE_TRADE_ID
          )
          Push-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
            $toolOutput = & $env:PYTHON_EXE @toolArgs 2>&1
            $materializerExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($materializerExit -ne 0) {
            throw 'MQL5_AUTH_MATERIALIZATION_FAILED_CLOSED_REVIEW_RUNNER_AND_REDACTED_INPUTS'
          }
          if (-not (Test-Path -LiteralPath $env:MATERIALIZE_AUTH_PATH -PathType Leaf)) {
            throw 'MQL5_AUTH_MATERIALIZATION_OUTPUT_MISSING'
          }
          # Record ownership of the output before running any later validation.
          # Cleanup is allowed only when this run's exact file hash still matches.
          $authHash = (Get-FileHash -LiteralPath $env:MATERIALIZE_AUTH_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          "MATERIALIZE_AUTH_CREATED_BY_RUN=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "MATERIALIZE_AUTH_SHA256=$authHash" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output 'MQL5_AUTHORIZATION_RECORD_CREATED=true'
          Write-Output 'ORDER_SUBMISSION_PERFORMED=false'
          Write-Output 'LIVE_TRADING_ALLOWED=false'

      - name: Re-run read-only Capital Firewall prerequisite diagnostic
        if: success()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        env:
          FOREXAI_CONTROL_PLANE_HMAC_SECRET: ${{ secrets.FOREXAI_CONTROL_PLANE_HMAC_SECRET }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:MATERIALIZE_REPORT_DIR)) {
            $reportDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts/g13-control-plane-materialization'
          } else {
            $reportDir = $env:MATERIALIZE_REPORT_DIR
          }
          New-Item -ItemType Directory -Force -Path $reportDir | Out-Null
          $reportPath = Join-Path $reportDir 'report.json'
          $diagnosticArgs = @(
            '-m', 'tools.diagnose_capital_authorization_prerequisites_v1',
            '--candidate-id', $env:CANDIDATE_ID,
            '--common-files', $env:FOREXAI_MT5_COMMON_FILES,
            '--report-out', $reportPath,
            '--ledger-path', $env:FOREXAI_TRADE_LEDGER_PATH,
            '--authenticated-envelope-path', $env:FOREXAI_AUTHENTICATED_ENVELOPE_PATH
          )
          if (-not [string]::IsNullOrWhiteSpace($env:MATERIALIZE_TRADE_ID)) {
            $diagnosticArgs += @('--expected-trade-id', $env:MATERIALIZE_TRADE_ID)
          }
          Push-Location -LiteralPath $env:GITHUB_WORKSPACE
          try {
            & $env:PYTHON_EXE @diagnosticArgs
            $diagnosticExit = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($diagnosticExit -ne 0) { throw 'MQL5_AUTH_POST_MATERIALIZATION_DIAGNOSTIC_FAILED' }

          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          Write-Output "CAPITAL_AUTH_PREFLIGHT_STATUS=$($report.status)"
          Write-Output "CAPITAL_AUTH_PREFLIGHT_BLOCKER_COUNT=$(@($report.blockers).Count)"
          Write-Output 'ORDER_SUBMISSION_PERFORMED=false'
          Write-Output 'LIVE_TRADING_ALLOWED=false'
          $blockers = @($report.blockers | Where-Object { -not [string]::IsNullOrWhiteSpace([string]$_) })
          if ($report.status -ne 'PREREQUISITES_PRESENT_NO_EXECUTION' -or $blockers.Count -gt 0) {
            throw 'MQL5_AUTH_POST_MATERIALIZATION_PREREQUISITES_BLOCKED'
          }
          Write-Output 'CAPITAL_AUTH_PREFLIGHT=PASS_PREREQUISITES_PRESENT_NO_EXECUTION'
          "MATERIALIZE_AUDIT_PASS=true" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Remove only this run's authorization record after incomplete post-audit
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:MATERIALIZE_AUTH_CREATED_BY_RUN -cne 'true' -or
              $env:MATERIALIZE_AUDIT_PASS -ceq 'true') {
            Write-Output 'MQL5_AUTH_FAILURE_CLEANUP=NOT_REQUIRED'
            exit 0
          }
          if ([string]::IsNullOrWhiteSpace($env:MATERIALIZE_AUTH_PATH) -or
              [string]::IsNullOrWhiteSpace($env:MATERIALIZE_AUTH_SHA256)) {
            throw 'MQL5_AUTH_FAILURE_CLEANUP_OWNERSHIP_PROOF_MISSING'
          }
          if (-not (Test-Path -LiteralPath $env:MATERIALIZE_AUTH_PATH -PathType Leaf)) {
            Write-Output 'MQL5_AUTH_FAILURE_CLEANUP=ALREADY_ABSENT'
            exit 0
          }
          $currentHash = (Get-FileHash -LiteralPath $env:MATERIALIZE_AUTH_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($currentHash -cne $env:MATERIALIZE_AUTH_SHA256) {
            throw 'MQL5_AUTH_FAILURE_CLEANUP_HASH_MISMATCH_MANUAL_REVIEW_REQUIRED'
          }
          Remove-Item -LiteralPath $env:MATERIALIZE_AUTH_PATH -Force
          if (Test-Path -LiteralPath $env:MATERIALIZE_AUTH_PATH) {
            throw 'MQL5_AUTH_FAILURE_CLEANUP_REMOVE_FAILED'
          }
          Write-Output 'MQL5_AUTH_FAILURE_CLEANUP=REMOVED_THIS_RUN_RECORD'
          Write-Output 'ORDER_SUBMISSION_PERFORMED=false'
          Write-Output 'LIVE_TRADING_ALLOWED=false'

      - name: Upload redacted materialization report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forexai-control-plane-materialization-v1
          path: artifacts/g13-control-plane-materialization/report.json
          if-no-files-found: ignore
          retention-days: 7
