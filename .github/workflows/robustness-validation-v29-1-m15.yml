name: ForexAI v29.1 Robustness Validation — M15

on:
  workflow_dispatch:

env:
  TIMEFRAME: M15

jobs:
  robustness-validation-m15:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify runtime
        run: python --version

      - name: Download REAL EURUSD M1 dataset
        run: |
          set -euo pipefail
          mkdir -p data/real/raw/histdata data/real/normalized
          python - <<'PY'
          from pathlib import Path
          import zipfile
          import pandas as pd
          from research.real_data.histdata_ingest import fetch_archive, _extract_archive_csv, _parse_csv
          out = Path('data/real/raw/histdata')
          frames = []
          for year in range(2022, 2026):
              item = fetch_archive(year, out, retries=4, timeout=90)
              if not zipfile.is_zipfile(item.archive):
                  raise SystemExit(f'REAL_DATA_REQUIRED: downloaded archive is not a valid ZIP: {item.archive}')
              name, payload = _extract_archive_csv(item.archive)
              frame = _parse_csv(payload)
              frames.append(frame)
              print(f'validated REAL HistData archive: year={year} file={name} rows={len(frame)} sha256={item.sha256}')
          df = pd.concat(frames, ignore_index=True)
          df = df[(df.timestamp >= pd.Timestamp('2022-01-01', tz='UTC')) & (df.timestamp < pd.Timestamp('2026-01-01', tz='UTC'))]
          df = df.sort_values('timestamp').drop_duplicates('timestamp', keep='first').reset_index(drop=True)
          if df.empty:
              raise SystemExit('REAL_DATA_REQUIRED: no REAL EURUSD M1 rows available')
          path = Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          df.to_csv(path, index=False)
          print(f'REAL EURUSD M1 rows={len(df)} start={df.timestamp.min()} end={df.timestamp.max()}')
          print('2026 holdout: NOT downloaded and NOT included')
          PY

      - name: Locate REAL M15 dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from research.real_data.normalizer import resample_ohlcv
          from research.real_data.validator import validate_ohlcv
          src = Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          if not src.exists() or src.stat().st_size == 0:
              raise SystemExit('REAL_DATA_REQUIRED: validated REAL M1 dataset missing')
          df = pd.read_csv(src, parse_dates=['timestamp'])
          required = {'timestamp','open','high','low','close','volume','spread'}
          if not required.issubset(df.columns):
              raise SystemExit(f'REAL_DATA_REQUIRED: M1 dataset missing columns: {sorted(required-set(df.columns))}')
          df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True)
          df = df.sort_values('timestamp').drop_duplicates('timestamp', keep='first')
          # resample_ohlcv canonicalizes the timestamp column itself.
          out = resample_ohlcv(df, '15min')
          report = validate_ohlcv(out, symbol='EURUSD', timeframe='M15')
          if report.status != 'PASS':
              raise SystemExit(f'REAL_DATA_REQUIRED: REAL M15 validation failed: {report.to_dict()}')
          path = Path('data/real/normalized/EURUSD_M15_20220101_20251231.csv')
          out.to_csv(path, index=False)
          print(f'validated REAL M15 rows={len(out)}')
          PY

      - name: Validate REAL M15 dataset and cadence
        run: |
          set -euo pipefail
          python - <<'PY'
          import pandas as pd
          from pathlib import Path
          p=Path('data/real/normalized/EURUSD_M15_20220101_20251231.csv')
          if not p.exists() or p.stat().st_size == 0: raise SystemExit('REAL M15 dataset missing')
          df=pd.read_csv(p, parse_dates=['timestamp']).sort_values('timestamp')
          if len(df) < 1000: raise SystemExit('REAL M15 dataset unexpectedly small')
          for c in ['open','high','low','close']:
              if not pd.api.types.is_numeric_dtype(df[c]): raise SystemExit(f'non-numeric {c}')
          if ((df.high < df[['open','close','low']].max(axis=1)) | (df.low > df[['open','close','high']].min(axis=1))).any(): raise SystemExit('OHLC invariant failure')
          d=df.timestamp.diff().dropna().dt.total_seconds().div(60)
          if d.median() != 15.0: raise SystemExit(f'cadence median is {d.median()}, expected 15')
          if df.timestamp.max() >= pd.Timestamp('2026-01-01', tz='UTC'): raise SystemExit('2026 holdout contamination detected')
          print(f'rows={len(df)} median_cadence_minutes={d.median()} start={df.timestamp.min()} end={df.timestamp.max()}')
          PY

      - name: Run v29.1 frozen robustness validation — M15
        run: |
          set -euo pipefail
          python -m research.optimization.robustness_validation_v29_1 --data data/real/normalized/EURUSD_M15_20220101_20251231.csv --timeframe M15 --output artifacts/robustness-validation-v29-1-M15.json
      - name: Assert output timeframe is M15
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/robustness-validation-v29-1-M15.json', encoding='utf-8'))
          if d.get('timeframe') != 'M15': raise SystemExit(f"wrong timeframe: {d.get('timeframe')}")
          PY
      - name: Validate fail-closed promotion state
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/robustness-validation-v29-1-M15.json', encoding='utf-8'))
          if d.get('real_data_only') is not True: raise SystemExit('real_data_only must be true')
          if d.get('oos_evaluated') is not False: raise SystemExit('OOS must remain held out')
          if d.get('optimization_enabled') is not False: raise SystemExit('optimization must be disabled')
          ex=d.get('execution', {})
          if ex.get('entry_model') != 'next_bar_open': raise SystemExit('wrong entry model')
          if ex.get('round_trip_cost_pips') != 1.4: raise SystemExit('wrong execution cost')
          if ex.get('same_bar_ambiguity') != 'sl_first': raise SystemExit('wrong ambiguity policy')
          if ex.get('one_position_at_a_time') is not True: raise SystemExit('position overlap policy violated')
          promo=d.get('promotion', {})
          if promo.get('ready_for_oos') is True and promo.get('robustness_pass') is not True: raise SystemExit('fail-closed promotion violation')
          if promo.get('ready_for_oos') is True and promo.get('strict_validation_pass') is not True: raise SystemExit('strict gate bypass')
          print('fail-closed checks passed')
          PY
      - name: Upload v29.1 M15 artifact
        uses: actions/upload-artifact@v4
        with:
          name: robustness-validation-v29-1-M15
          path: artifacts/robustness-validation-v29-1-M15.json
          if-no-files-found: error
