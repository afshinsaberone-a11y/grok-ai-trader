name: ForexAI Demo Evidence Assembly Contract

on:
  push:
    paths:
      - "tools/assemble_demo_evidence_v1.py"
      - "tests/test_assemble_demo_evidence_v1.py"
      - "config/forexai_demo_evidence_assembly_v1.json"
  pull_request:
    paths:
      - "tools/assemble_demo_evidence_v1.py"
      - "tests/test_assemble_demo_evidence_v1.py"
      - "config/forexai_demo_evidence_assembly_v1.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assembly:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run assembly contract tests
        run: pytest -q tests/test_assemble_demo_evidence_v1.py
      - name: Compile assembly tool
        run: python -m py_compile tools/assemble_demo_evidence_v1.py
