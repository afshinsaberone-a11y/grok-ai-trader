name: ForexAI Agent Runtime Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Mission task for the live orchestrator run"
        required: true
        default: "MISSION-001: Audit the current ForexAI state. Inspect real-data provenance, execution_contract_v1, v29.1 M1/M5/M15 evidence, validation/robustness/OOS gates, code integrity, and Champion status. Return exactly one safest next action: GO, HOLD, or REJECT."
        type: string

jobs:
  agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Agents SDK imports
        run: python -c "from agents import Agent, Runner, function_tool; print('Agents SDK runtime OK')"
      - name: Compile agent modules
        run: python -m py_compile agents/forexai_tools.py agents/research_controller.py agents/forexai_orchestrator.py agents/deterministic_mission.py
      - name: Run deterministic agent tests
        run: python -m pytest -q tests/test_agents_runtime.py tests/test_forexai_tools.py tests/test_research_controller.py
      - name: Run offline deterministic Mission-001 audit
        run: python agents/deterministic_mission.py
      - name: Upload offline Mission-001 evidence
        uses: actions/upload-artifact@v4
        with:
          name: mission-001-offline-evidence
          path: reports/agents/mission-001-offline.json
      - name: Detect optional live API availability
        id: api_check
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "OpenAI API secret is available for optional live mission."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OpenAI API secret is unavailable; offline audit remains authoritative."
          fi
      - name: Run optional live Mission-001 orchestrator
        id: live_mission
        if: ${{ github.event_name == 'workflow_dispatch' && steps.api_check.outputs.available == 'true' }}
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOREXAI_AGENT_TASK: ${{ inputs.task }}
        run: python agents/forexai_orchestrator.py
