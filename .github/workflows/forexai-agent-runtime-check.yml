name: ForexAI Agent Runtime Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      task:
        description: "Mission task for the live orchestrator run"
        required: true
        default: "MISSION-001: Audit the current ForexAI state. Inspect real-data provenance, execution_contract_v1, v29.1 M1/M5/M15 evidence, validation/robustness/OOS gates, code integrity, and Champion status. Return exactly one safest next action: GO, HOLD, or REJECT."
        type: string

jobs:
  agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify Agents SDK imports
        run: python -c "from agents import Agent, Runner, function_tool; print('Agents SDK runtime OK')"
      - name: Compile agent modules
        run: python -m py_compile agents/forexai_tools.py agents/research_controller.py agents/forexai_orchestrator.py
      - name: Run deterministic agent tests
        run: python -m pytest -q tests/test_agents_runtime.py tests/test_forexai_tools.py tests/test_research_controller.py
      - name: Verify API secret is present for manual live mission
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY GitHub Actions secret is required for a live Agent Mission."
            exit 1
          fi
      - name: Run Mission-001 orchestrator
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FOREXAI_AGENT_TASK: ${{ inputs.task }}
        run: python agents/forexai_orchestrator.py
