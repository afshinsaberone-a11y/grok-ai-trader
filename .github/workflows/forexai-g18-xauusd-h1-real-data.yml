name: ForexAI G18 XAUUSD H1 Real Data Coverage Audit

on:
  push:
    branches:
      - "research/g18-xauusd-h1-regime-trend-20261103"
    paths:
      - "research/real_data/dukascopy_xauusd_ingest.py"
      - "research/real_data/xauusd_h1_coverage_audit_g18.py"
      - "research/optimization/xauusd_execution_contract_v1.py"
      - "tests/test_dukascopy_xauusd_ingest.py"
      - "tests/test_xauusd_execution_contract_v1.py"
      - "tests/test_xauusd_h1_coverage_audit_g18.py"
      - "docs/research/g18-xauusd-h1-data-coverage-protocol-20261103.md"
      - ".github/workflows/forexai-g18-xauusd-h1-real-data.yml"
  pull_request:
    paths:
      - "research/real_data/dukascopy_xauusd_ingest.py"
      - "research/real_data/xauusd_h1_coverage_audit_g18.py"
      - "research/optimization/xauusd_execution_contract_v1.py"
      - "tests/test_dukascopy_xauusd_ingest.py"
      - "tests/test_xauusd_execution_contract_v1.py"
      - "tests/test_xauusd_h1_coverage_audit_g18.py"
      - "docs/research/g18-xauusd-h1-data-coverage-protocol-20261103.md"
      - ".github/workflows/forexai-g18-xauusd-h1-real-data.yml"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest
      - name: Compile XAUUSD ingestion, execution, and G18 audit
        run: |
          python -m py_compile \
            research/real_data/dukascopy_xauusd_ingest.py \
            research/real_data/xauusd_h1_coverage_audit_g18.py \
            research/optimization/xauusd_execution_contract_v1.py \
            tests/test_dukascopy_xauusd_ingest.py \
            tests/test_xauusd_execution_contract_v1.py \
            tests/test_xauusd_h1_coverage_audit_g18.py
      - name: Run XAUUSD source, quote execution, and coverage tests
        run: |
          pytest -q \
            tests/test_dukascopy_xauusd_ingest.py \
            tests/test_xauusd_execution_contract_v1.py \
            tests/test_xauusd_h1_coverage_audit_g18.py

  real-data-coverage:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real-data audit dependencies
        run: python -m pip install --upgrade pip numpy pandas
      - name: Download REAL XAUUSD H1 BID/ASK history (2021-2024 only)
        run: |
          python -m research.real_data.dukascopy_xauusd_ingest \
            --start 2021-01-01 \
            --end 2025-01-01 \
            --timeframe H1 \
            --output data/real/xauusd
      - name: Resolve exact source-backed dataset and manifest
        shell: bash
        run: |
          set -euo pipefail
          DATA="data/real/xauusd/normalized/XAUUSD_H1_BIDASK_20210101_20250101.csv"
          MANIFEST="data/real/xauusd/normalized/XAUUSD_H1_BIDASK_20210101_20250101.manifest.json"
          test -s "$DATA"
          test -s "$MANIFEST"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
      - name: Run hash, quote, spread, and coverage audit
        run: |
          python -m research.real_data.xauusd_h1_coverage_audit_g18 \
            --data "$DATA" \
            --manifest "$MANIFEST" \
            --output artifacts/g18-xauusd-h1-coverage-audit.json
      - name: Fail closed on source, years, and no-backtest policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("artifacts/g18-xauusd-h1-coverage-audit.json").read_text(encoding="utf-8"))
          assert p["schema"] == "forexai.g18.xauusd_h1_coverage_audit.v1"
          assert p["status"] == "REAL_DATA_COVERAGE_AUDIT_PASS"
          assert p["symbol"] == "XAUUSD" and p["timeframe"] == "H1"
          assert set(p["years"]) == {"2021", "2022", "2023", "2024"}
          assert p["rows"] >= 15000
          assert p["data_policy"]["real_bid_ask_bars"] is True
          assert p["data_policy"]["synthetic_data"] is False
          assert p["data_policy"]["backtest_run"] is False
          assert p["data_policy"]["commission_inferred"] is False
          assert p["data_policy"]["financing_inferred"] is False
          assert p["data_policy"]["2025_loaded"] is False
          assert p["data_policy"]["2026_plus_loaded"] is False
          assert p["coverage"]["missing_bars_filled"] == 0
          print(json.dumps({
              "status": p["status"],
              "rows": p["rows"],
              "years": p["years"],
              "spread_open": p["spread_open"],
              "spread_close": p["spread_close"],
              "coverage": {k:v for k,v in p["coverage"].items() if k != "gaps_examples_first_100"},
              "data_sha256": p["data_sha256"],
              "manifest_sha256": p["manifest_sha256"],
              "next_gate": p["next_gate"],
          }, indent=2))
          PY
      - name: Upload source data, manifest, and G18 coverage report
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g18-xauusd-h1-real-data-2021-2024
          path: |
            \${{ env.DATA }}
            \${{ env.MANIFEST }}
            artifacts/g18-xauusd-h1-coverage-audit.json
          if-no-files-found: error
          compression-level: 1
      - name: Publish G18 coverage result to PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('artifacts/g18-xauusd-h1-coverage-audit.json', 'utf8'));
            const body = [
              '<!-- forexai-g18-xauusd-coverage -->',
              '## G18 XAUUSD H1 real-data coverage audit',
              '',
              '**Status:** ' + p.status,
              '- Bars: ' + p.rows,
              '- Years: 2021-2024 only; 2025/2026+ not loaded',
              '- Baseline observed open spread median / P95: ' + p.spread_open.median_usd_per_oz + ' / ' + p.spread_open.p95_usd_per_oz + ' USD/oz',
              '- H1 gaps > 1h: ' + p.coverage.gap_count_gt_1h,
              '- Same-UTC-date gaps: ' + p.coverage.same_utc_date_gap_count,
              '- Long closures > 12h: ' + p.coverage.long_closure_gap_count_gt_12h,
              '- Filled/made-up bars: ' + p.coverage.missing_bars_filled,
              '- Data SHA-256: ' + p.data_sha256,
              '- Manifest SHA-256: ' + p.manifest_sha256,
              '- Backtest / inferred commission / inferred financing: ' + p.data_policy.backtest_run + ' / ' + p.data_policy.commission_inferred + ' / ' + p.data_policy.financing_inferred,
              '',
              'Artifact: forexai-g18-xauusd-h1-real-data-2021-2024 from run ' + context.runId + '.',
              '',
              'Coverage evidence only. Strategy backtesting remains blocked until broker-specific commission and financing inputs are sourced.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const prior = existing.data.find(c => c.body && c.body.includes('<!-- forexai-g18-xauusd-coverage -->'));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
