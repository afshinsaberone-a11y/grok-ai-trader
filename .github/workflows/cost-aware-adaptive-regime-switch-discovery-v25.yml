name: Cost-Aware Adaptive Regime Switch Discovery v25
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      timeframe:
        description: Research timeframe
        required: true
        default: M5
        type: choice
        options: [M5, M1, M15]
permissions:
  contents: read
env:
  REQUESTED_TIMEFRAME: ${{ inputs.timeframe || 'M5' }}
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Runtime check
        run: python -c "import numpy,pandas; print(numpy.__version__, pandas.__version__)"
      - name: Contract and agent compile check
        run: python -m py_compile research/optimization/execution_contract_v1.py research/optimization/cost_aware_adaptive_regime_switch_v25.py agents/research_mission.py agents/validation_mission.py agents/robustness_mission.py agents/research_controller.py agents/forexai_orchestrator.py
      - name: Download REAL EURUSD data
        run: |
          python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe "$REQUESTED_TIMEFRAME" --output data/real --validate --manifest
      - name: Locate exact REAL dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name "EURUSD_${REQUESTED_TIMEFRAME}_20220101_20251231.csv" | sort | head -n1)"
          test -n "$DATA" && test -f "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Validate dataset
        run: |
          DATASET="$DATA" python - <<'PY'
          import os,pandas as pd
          p=os.environ['DATASET']; d=pd.read_csv(p); ts=pd.to_datetime(d.timestamp,utc=True)
          exp={'M1':1,'M5':5,'M15':15}[os.environ['REQUESTED_TIMEFRAME']]
          assert len(d)>1000 and ts.is_unique and ts.is_monotonic_increasing
          assert ts.min()<pd.Timestamp('2025-01-01',tz='UTC') and ts.max()>=pd.Timestamp('2025-12-31',tz='UTC')
          med=ts.diff().dropna().dt.total_seconds().div(60).median(); assert abs(float(med)-exp)<0.01,(med,exp)
          print('REAL_DATA_OK',os.environ['REQUESTED_TIMEFRAME'],len(d),med)
          PY
      - name: Assert v25 catalog
        run: |
          python - <<'PY'
          from research.optimization.cost_aware_adaptive_regime_switch_v25 import catalog
          c=catalog(); assert len(c)==432 and len({str(sorted(x.items())) for x in c})==432
          print('CATALOG_OK',len(c))
          PY
      - name: Run v25
        run: python -m research.optimization.cost_aware_adaptive_regime_switch_v25 --data "$DATA" --timeframe "$REQUESTED_TIMEFRAME" --output artifacts/adaptive-regime-switch-v25.json
      - name: Fail-closed controls
        run: |
          python - <<'PY'
          import json,os
          d=json.load(open('artifacts/adaptive-regime-switch-v25.json')); r=d['result']; e=d['execution_model']
          requested=os.environ['REQUESTED_TIMEFRAME']
          assert d['real_data_required'] is True and d['synthetic_fallback'] is False
          assert d['research_timeframe']==requested
          assert d['oos_policy']['loaded'] is False and d['oos_policy']['status']=='HELD_OUT'
          assert r['candidate_total']==432 and r['champion'] is None
          assert isinstance(r['pre_oos_qualified_count'], int) and r['pre_oos_qualified_count'] >= 0
          assert isinstance(r['validation_qualified_count'], int) and r['validation_qualified_count'] >= 0
          assert r['validation_qualified_count'] <= r['pre_oos_qualified_count']
          assert r['validation_qualified_count'] == len([x for x in r['validated_candidates'] if x.get('validation_pass') is True])
          assert e['entry']=='next_bar_open' and e['round_trip_cost_pips']==1.4 and e['same_bar_resolution']=='SL first (conservative)' and e['expiry_bars']==30 and e['overlap']=='one position at a time' and e['adverse_exit_cost_applied'] is True
          print('V25_FAIL_CLOSED_OK',requested,r['pre_oos_qualified_count'],r['validation_qualified_count'])
          PY
      - name: Run Agent Research Mission
        run: |
          set +e
          python agents/research_mission.py --artifact artifacts/adaptive-regime-switch-v25.json --output artifacts/research-mission-v25.json
          rc=$?
          test "$rc" -eq 0 || test "$rc" -eq 2
      - name: Run Agent Validation Mission
        run: |
          set +e
          python agents/validation_mission.py --artifact artifacts/adaptive-regime-switch-v25.json --output artifacts/validation-mission-v25.json
          rc=$?
          test "$rc" -eq 0 || test "$rc" -eq 2
      - name: Run Agent Robustness Mission
        run: |
          set +e
          python agents/robustness_mission.py --artifact artifacts/adaptive-regime-switch-v25.json --output artifacts/robustness-mission-v25.json
          rc=$?
          test "$rc" -eq 0 || test "$rc" -eq 2
      - name: Upload agent mission evidence
        uses: actions/upload-artifact@v4
        with:
          name: research-missions-v25-${{ env.REQUESTED_TIMEFRAME }}
          path: |
            artifacts/research-mission-v25.json
            artifacts/validation-mission-v25.json
            artifacts/robustness-mission-v25.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: adaptive-regime-switch-v25-${{ env.REQUESTED_TIMEFRAME }}
          path: artifacts/adaptive-regime-switch-v25.json
          if-no-files-found: error

# Fix: avoid collision between the local agents/ directory and the installed
# openai-agents package named "agents" when invoking mission modules.
