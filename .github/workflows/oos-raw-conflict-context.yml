name: OOS Raw Conflict Context

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas

      - name: Download July 2026 HistData and inspect raw duplicates
        run: |
          set -euo pipefail
          mkdir -p data/audit/raw data/audit/out
          python - <<'PY'
          import csv
          import io
          import zipfile
          from pathlib import Path
          from datetime import datetime, timezone, timedelta
          import urllib.request

          # Reuse the project's real current-year downloader.
          from research.real_data.histdata_current import fetch_month_archive, _extract_year_csv

          item = fetch_month_archive(2026, 7, "data/audit/raw/histdata")
          name, payload = _extract_year_csv(item.archive)
          print("ARCHIVE=", item.archive)
          print("CSV=", name)

          text = payload.decode("utf-8", errors="replace")
          target_prefixes = {
              "20260706 0321", "20260706 0322", "20260706 0324", "20260706 0325"
          }

          # HistData source timestamps are fixed EST (UTC-5).
          wanted = []
          for raw in io.StringIO(text).read().splitlines():
              if not raw or raw.startswith("#"):
                  continue
              cols = next(csv.reader([raw], delimiter=";"), [])
              if not cols:
                  continue
              ts = cols[0].strip()
              if any(ts.startswith(p) for p in target_prefixes):
                  wanted.append(cols)

          out = Path("data/audit/out/raw_conflict_rows.csv")
          with out.open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["source_timestamp_est", "open", "high", "low", "close", "volume"])
              for cols in wanted:
                  w.writerow(cols[:6])

          print("MATCHED_ROWS=", len(wanted))
          for row in wanted:
              print("RAW_ROW=", ";".join(row[:6]))
          PY

      - name: Upload raw conflict context
        uses: actions/upload-artifact@v4
        with:
          name: oos-raw-conflict-context-2026-07-05
          path: data/audit/out/raw_conflict_rows.csv
          if-no-files-found: error
