name: Cost-Aware Multi-Family Discovery v10
on:
  workflow_dispatch:
    inputs:
      start:
        description: Pre-OOS start
        required: true
        default: '2022-01-01'
        type: string
      end:
        description: Pre-OOS end exclusive
        required: true
        default: '2026-01-01'
        type: string
      spread_pips:
        description: Spread per side
        required: true
        default: '0.5'
        type: string
      slippage_pips:
        description: Slippage per side
        required: true
        default: '0.2'
        type: string
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q tests/test_cost_aware_discovery.py
          python - <<'PY'
          from research.optimization.cost_aware_gate_v6 import pre_oos_gate
          def m(y,pf,ex,trades=100,dd=10): return {'year':y,'metrics':{'profit_factor':pf,'expectancy_R':ex,'trades':trades,'max_dd_pct':dd}}
          assert not pre_oos_gate([m(2022,1.013,.01),m(2023,.795,-.03),m(2024,.605,-.05)])
          assert not pre_oos_gate([m(2022,1.05,.01),m(2023,1.12,.02,dd=36),m(2024,1.05,-.01)])
          assert pre_oos_gate([m(2022,1.05,.01),m(2023,1.12,.02),m(2024,1.05,-.01)])
          print('STRICT_COST_AWARE_GATE_V6=PASS')
          PY
  discover:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        family: [trend_ema_rsi, momentum_breakout, donchian_breakout, bollinger_mean_reversion, rsi_mean_reversion, session_range_breakout, volatility_expansion, sp2l_lite, volatility_switch_momentum_reversal, skew_kurt_momentum, regime_zscore_reversion, ichimoku_regime_trend]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download real pre-OOS data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Build M5
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          src=Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          if not src.exists(): raise SystemExit(f'REAL_DATA_REQUIRED: missing {src}')
          d=pd.read_csv(src); d.timestamp=pd.to_datetime(d.timestamp,utc=True)
          for c in ['open','high','low','close','volume']: d[c]=pd.to_numeric(d[c],errors='raise')
          m=d.set_index('timestamp')[['open','high','low','close','volume']].resample('5min').agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'}).dropna(subset=['open','high','low','close']).reset_index()
          Path('data/real/normalized').mkdir(parents=True,exist_ok=True)
          m.to_csv('data/real/normalized/EURUSD_M5_20220101_20251231.csv',index=False)
          PY
      - name: Run strict cost-aware discovery
        env:
          FAMILY: ${{ matrix.family }}
          SPREAD: ${{ inputs.spread_pips }}
          SLIPPAGE: ${{ inputs.slippage_pips }}
        run: python -m research.optimization.cost_aware_discovery --data data/real/normalized/EURUSD_M5_20220101_20251231.csv --family "$FAMILY" --spread-pips "$SPREAD" --slippage-pips "$SLIPPAGE" --output "artifacts/${FAMILY}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cost-aware-v10-${{ matrix.family }}
          path: artifacts/${{ matrix.family }}.json
          if-no-files-found: warn
  aggregate:
    if: ${{ always() }}
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: cost-aware-v10-*
          path: artifacts/families
          merge-multiple: false
      - name: Aggregate strict results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.optimization.cost_aware_gate_v6 import *
          results=[]
          for p in sorted(Path('artifacts/families').glob('cost-aware-v10-*/**/*.json')):
              d=json.loads(p.read_text()); r=d.get('result',d)
              if not isinstance(r,dict): raise SystemExit(f'INVALID_ARTIFACT_SCHEMA: {p}')
              results.append(r)
          champs=[r['champion'] for r in results if r.get('champion')]
          champs.sort(key=lambda x:(-float(x['cost_aware_robustness_score']),x['family'],x['candidate']))
          report={'schema_version':'forexai.cost_aware_multi_family.v10','gate_policy':{'pre_oos_years':list(PRE_OOS_YEARS),'pre_oos_min_profitable_years':MIN_PROFITABLE_YEARS,'pre_oos_min_pf_each_year':MIN_PF_EACH_YEAR,'pre_oos_min_expectancy_R':MIN_EXPECTANCY_R,'pre_oos_min_trades_each_year':MIN_TRADES_EACH_YEAR,'pre_oos_max_dd_pct':PRE_OOS_MAX_DD_PCT,'validation_min_pf':VALIDATION_MIN_PF,'validation_max_dd_pct':VALIDATION_MAX_DD_PCT,'validation_min_trades':VALIDATION_MIN_TRADES,'fail_closed':True},'results':results,'qualified_count':len(champs),'champion':champs[0] if champs else None,'execution_cost_model':{'spread_pips_per_side':float('${{ inputs.spread_pips }}'),'slippage_pips_per_side':float('${{ inputs.slippage_pips }}'),'round_trip_pips':2*(float('${{ inputs.spread_pips }}')+float('${{ inputs.slippage_pips }}'))},'oos_policy':{'loaded':False,'start':'2026-01-01','status':'HELD_OUT'},'real_data_required':True,'synthetic_fallback':False}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/cost_aware_summary_v10.json').write_text(json.dumps(report,indent=2,sort_keys=True))
          print(json.dumps({'qualified_count':len(champs),'champion':report['champion']},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: cost-aware-summary-v10
          path: artifacts/cost_aware_summary_v10.json
          if-no-files-found: warn
