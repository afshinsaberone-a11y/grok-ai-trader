name: ForexAI MT5 Terminal Preflight

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Broker symbol to inspect"
        required: true
        default: "EURUSD"
        type: string
      mt5_root:
        description: "Optional MT5 terminal executable path"
        required: false
        default: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MT5 package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mt5.txt
      - name: Verify terminal executable
        shell: pwsh
        run: |
          if (!(Test-Path "${{ inputs.mt5_root }}")) { Write-Error "MT5_PREFLIGHT_TERMINAL_PATH_NOT_FOUND" }
      - name: Run read-only Demo terminal preflight
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/mt5-preflight | Out-Null
          python tools/mt5_terminal_preflight_v1.py --symbol "${{ inputs.symbol }}" --path "${{ inputs.mt5_root }}" | Tee-Object artifacts/mt5-preflight/preflight.json
          $j = Get-Content artifacts/mt5-preflight/preflight.json -Raw | ConvertFrom-Json
          if ($j.status -ne "PASS") { throw "MT5_PREFLIGHT_STATUS_NOT_PASS" }
          if ($j.account_mode -ne "DEMO") { throw "MT5_PREFLIGHT_ACCOUNT_NOT_DEMO" }
          if ($j.terminal_connected -ne $true) { throw "MT5_PREFLIGHT_TERMINAL_NOT_CONNECTED" }
          if ($j.order_submission_performed -ne $false) { throw "MT5_PREFLIGHT_SUBMISSION_INVARIANT_FAILED" }
      - name: Upload preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: forexai-mt5-terminal-preflight-${{ inputs.symbol }}
          path: artifacts/mt5-preflight/preflight.json
          if-no-files-found: error