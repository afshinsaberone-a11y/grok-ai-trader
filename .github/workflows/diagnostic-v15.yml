name: ForexAI Diagnostic v15
on:
  workflow_dispatch:
    inputs:
      data_path:
        description: 'Real pre-OOS CSV path'
        required: true
        default: 'data/processed/eurusd_m5.csv'
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Refuse missing real data
        run: test -s "${{ inputs.data_path }}"
      - name: Run v15 diagnostics
        run: python -m research.optimization.diagnostic_v15 --data "${{ inputs.data_path }}" --output artifacts/diagnostic-v15.json
      - uses: actions/upload-artifact@v4
        with:
          name: diagnostic-v15
          path: artifacts/diagnostic-v15.json
