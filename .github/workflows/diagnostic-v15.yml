name: ForexAI Diagnostic v15

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Real pre-OOS start'
        required: true
        default: '2022-01-01'
        type: string
      end:
        description: 'Real pre-OOS end (exclusive)'
        required: true
        default: '2026-01-01'
        type: string
      timeframe:
        description: 'Diagnostic timeframe'
        required: true
        default: 'M5'
        type: choice
        options: [M5, M15]

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore real HistData cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/histdata
          key: histdata-eurusd-m1-diagnostic-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            histdata-eurusd-m1-diagnostic-
            histdata-eurusd-m1-
      - name: Download and validate real data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TF: ${{ inputs.timeframe }}
        run: |
          python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe "$TF" --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Locate normalized real dataset
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TF: ${{ inputs.timeframe }}
        run: |
          DATA="data/real/normalized/EURUSD_${TF}_$(date -u -d "$START" +%Y%m%d)_$(date -u -d "$END - 1 day" +%Y%m%d).csv"
          test -s "$DATA" || { echo "REAL_DATA_REQUIRED: missing $DATA"; exit 2; }
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run diagnostic on real data only
        run: |
          python -m research.optimization.diagnostic_v15 --data "$DATA" --output artifacts/diagnostic-v15.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: diagnostic-v15
          path: artifacts/diagnostic-v15.json
          if-no-files-found: warn
