name: ForexAI G13 RSI Divergence Discovery M15

on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/rsi_divergence_discovery_g13.py
      - .github/workflows/forexai-g13-rsi-divergence-m15.yml

permissions:
  contents: read
  actions: read

jobs:
  g13:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile research/optimization/rsi_divergence_discovery_g13.py research/optimization/execution_contract_v1.py research/optimization/cost_aware_gate_v14.py
      - name: Download REAL EURUSD M15
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M15 --output data/real --validate --manifest
      - name: Locate and validate dataset
        shell: bash
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M15_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          DATASET="$DATA" python - <<'PY'
          import os,pandas as pd
          d=pd.read_csv(os.environ['DATASET'])
          assert len(d)==93017, len(d)
          assert 'timestamp' in d.columns
          ts=pd.to_datetime(d.timestamp,utc=True)
          assert ts.max().year < 2026
          assert ts.is_monotonic_increasing
          print('REAL_DATA_OK',len(d),ts.max().isoformat())
          PY
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Run G13 discovery
        run: python -m research.optimization.rsi_divergence_discovery_g13 --data "$DATA" --output artifacts/rsi-divergence-g13-M15.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/rsi-divergence-g13-M15.json',encoding='utf-8'))
          assert p['policy']['real_data_required'] is True
          assert p['policy']['synthetic_data'] is False
          assert p['policy']['oos_2026_used'] is False
          assert p['policy']['parameter_selection_used_2025'] is False
          assert p['policy']['gates_unchanged'] is True
          assert p['policy']['champion'] is None
          assert p['execution_model']['entry']=='next_bar_open'
          assert p['execution_model']['cost_pips_per_side']==0.7
          assert p['execution_model']['round_trip_cost_pips']==1.4
          assert p['execution_model']['same_bar_resolution']=='SL first (conservative)'
          assert p['execution_model']['expiry_bars']==30
          print('G13_FAIL_CLOSED_OK')
          print('CANDIDATES',p['candidate_total'])
          print('PRE_OOS_QUALIFIED',p['pre_oos_qualified'])
          print('CHAMPION',p['champion'])
          PY
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: rsi-divergence-g13-M15
          path: artifacts/rsi-divergence-g13-M15.json
          if-no-files-found: error
