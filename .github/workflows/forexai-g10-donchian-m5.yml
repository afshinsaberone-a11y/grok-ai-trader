name: ForexAI G10 Donchian Breakout M5
on:
  workflow_dispatch:
  push:
    paths:
      - research/optimization/donchian_breakout_g10.py
      - tests/test_donchian_breakout_g10.py
      - .github/workflows/forexai-g10-donchian-m5.yml
      - research/optimization/execution_contract_v1.py
jobs:
  g10:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile research/optimization/donchian_breakout_g10.py research/optimization/execution_contract_v1.py tests/test_donchian_breakout_g10.py
      - name: Run G10 unit tests
        run: pytest -q tests/test_donchian_breakout_g10.py
      - name: Download REAL EURUSD M5
        run: |
          set -euo pipefail
          python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M5 --output data/real --validate --manifest
      - name: Locate exact real dataset
        run: |
          set -euo pipefail
          DATA="$(find data/real/normalized -type f -name 'EURUSD_M5_20220101_20251231.csv' | sort | head -n1)"
          test -n "$DATA"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Validate REAL dataset and holdout
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pandas as pd
          d=pd.read_csv(os.environ['DATA'],usecols=['timestamp'])
          ts=pd.to_datetime(d.timestamp,utc=True)
          assert len(d)>0
          assert ts.max()<pd.Timestamp('2026-01-01T00:00:00Z')
          print(f'G10_REAL_DATA_OK rows={len(d)} max={ts.max().isoformat()}')
          PY
      - name: Run G10 Donchian discovery
        run: python -m research.optimization.donchian_breakout_g10 --data "$DATA" --output artifacts/donchian-g10-M5.json
      - name: Fail closed
        run: |
          python - <<'PY'
          import json
          p=json.load(open('artifacts/donchian-g10-M5.json'))
          assert p['schema_version']=='forexai.g10.donchian_breakout.v1'
          assert p['real_data_required'] is True
          assert p['synthetic_fallback'] is False
          assert p['candidate_total']==64
          assert p['execution_model']['entry']=='next_bar_open'
          assert p['execution_model']['round_trip_cost_pips']==1.4
          assert p['oos_2026']['loaded'] is False and p['oos_2026']['status']=='HELD_OUT'
          assert p['champion'] is None
          assert p['oos_optimization_allowed'] is False
          print('G10_FAIL_CLOSED_OK')
          PY
      - name: Upload G10 artifact
        uses: actions/upload-artifact@v4
        with:
          name: donchian-g10-m5
          path: artifacts/donchian-g10-M5.json
