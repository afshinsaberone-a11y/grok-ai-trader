name: ForexAI SP2L v15.10 MTF Cost-Aware Backtest
on:
  workflow_dispatch:
    inputs:
      start: {required: true, default: '2022-01-01', type: string}
      end: {required: true, default: '2025-01-01', type: string}
      spread_pips: {required: true, default: '0.5', type: string}
      slippage_pips: {required: true, default: '0.2', type: string}
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Validate window
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          s=datetime.fromisoformat(os.environ['START']); e=datetime.fromisoformat(os.environ['END'])
          assert s < e <= datetime(2025,1,1), 'TRAIN_WINDOW_ONLY'
          PY
      - name: Ingest REAL EURUSD M1 M5 M15
        env: {START: '${{ inputs.start }}', END: '${{ inputs.end }}'}
        run: |
          for TF in M1 M5 M15; do
            python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe "$TF" --start "$START" --end "$END" --output data/real --validate --manifest
          done
      - name: Run gap-aware MTF backtest
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          SPREAD: ${{ inputs.spread_pips }}
          SLIPPAGE: ${{ inputs.slippage_pips }}
        run: |
          python - <<'PY'
          import os,glob,json
          from pathlib import Path
          import pandas as pd, numpy as np
          from research.optimization.sp2l_v15_7 import Params,signals
          out={'schema_version':'forexai.sp2l_mtf_backtest.v15.10','cost_model':{'spread_pips_per_side':float(os.environ['SPREAD']),'slippage_pips_per_side':float(os.environ['SLIPPAGE'])},'train_end_exclusive':os.environ['END'],'timeframes':{}}
          for tf in ('M1','M5','M15'):
              files=glob.glob(f'data/real/normalized/EURUSD_{tf}_*.csv')
              if not files: raise SystemExit(f'REAL_DATA_REQUIRED_{tf}')
              p=max(files,key=lambda x:Path(x).stat().st_size); d=pd.read_csv(p)
              cols={c.lower():c for c in d.columns}; ts=next(c for c in d.columns if c.lower() in ('timestamp','time','datetime'))
              d=d.rename(columns={cols[k]:k.title() for k in ('open','high','low','close')}); d[ts]=pd.to_datetime(d[ts],utc=True); d=d.set_index(ts).sort_index(); d=d[~d.index.duplicated(keep='first')]
              d=d[(d.index>=pd.Timestamp(os.environ['START'],tz='UTC'))&(d.index<pd.Timestamp(os.environ['END'],tz='UTC'))]
              # Disable setups spanning large data gaps; no gap filling.
              expected=pd.Timedelta(minutes={'M1':1,'M5':5,'M15':15}[tf]); gap=(d.index.to_series().diff()>expected*3); valid=d.index.to_series().diff().fillna(expected)<=expected*3
              d=d.loc[valid.to_numpy()]
              s=signals(d,Params()).to_numpy(); entries=np.flatnonzero(s); pip=.0001; trades=[]; H=d.High.to_numpy(); L=d.Low.to_numpy(); C=d.Close.to_numpy()
              for i in entries:
                  if i+1>=len(d): continue
                  e=C[i+1]; risk=max(H[i]-L[i],pip); rr=1.5; sl=e-risk if s[i]>0 else e+risk; tp=e+rr*risk if s[i]>0 else e-rr*risk; hit=None
                  for j in range(i+1,min(len(d),i+1+Params().expiry_bars)):
                      if s[i]>0:
                          if L[j]<=sl: hit=-risk; break
                          if H[j]>=tp: hit=rr*risk; break
                      else:
                          if H[j]>=sl: hit=-risk; break
                          if L[j]<=tp: hit=rr*risk; break
                  if hit is not None: trades.append(hit/pip-2*(float(os.environ['SPREAD'])+float(os.environ['SLIPPAGE'])))
              a=np.asarray(trades); gp=float(a[a>0].sum()) if a.size else 0.; gl=float(-a[a<0].sum()) if a.size else 0.; eq=np.cumsum(a) if a.size else np.array([0.]); dd=float((np.maximum.accumulate(eq)-eq).max())
              out['timeframes'][tf]={'rows':len(d),'raw_gap_count':int(gap.sum()),'entries':int(len(entries)),'closed_trades':int(a.size),'net_pips':float(a.sum()) if a.size else 0.,'win_rate_pct':float((a>0).mean()*100) if a.size else 0.,'profit_factor':float(gp/gl) if gl else 999.,'max_dd_pips':dd,'expectancy_pips':float(a.mean()) if a.size else 0.}
          Path('artifacts').mkdir(exist_ok=True); Path('artifacts/sp2l-v15-10-mtf-backtest.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sp2l-v15-10-mtf-backtest
          path: artifacts/
          if-no-files-found: warn
