name: ForexAI Signal Execution Audit v15.2
on:
  workflow_dispatch:
    inputs:
      start:
        required: true
        default: '2022-01-01'
      end:
        required: true
        default: '2026-01-01'
      timeframe:
        required: true
        default: 'M5'
        type: choice
        options: [M5, M15]
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download REAL data only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TF: ${{ inputs.timeframe }}
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe "$TF" --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Locate dataset
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TF: ${{ inputs.timeframe }}
        run: |
          DATA="data/real/normalized/EURUSD_${TF}_$(date -u -d "$START" +%Y%m%d)_$(date -u -d "$END - 1 day" +%Y%m%d).csv"
          test -s "$DATA" || { echo "REAL_DATA_REQUIRED: missing $DATA"; exit 2; }
          echo "DATA=$DATA" >> "$GITHUB_ENV"
      - name: Audit signal entry exit semantics
        run: python -m research.optimization.signal_execution_audit_v15_2 --data "$DATA" --output artifacts/signal-execution-audit-v15-2.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-execution-audit-v15-2
          path: artifacts/signal-execution-audit-v15-2.json
