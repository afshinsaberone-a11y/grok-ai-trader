name: Provider Dependency Lock Candidate

# Generates an untrusted review artifact only. No repository writes, secrets,
# authority provisioning, or deployment are performed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-dependency-lock-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lock-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the explicitly selected source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the bootstrap target Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      # The generator runs on an ephemeral GitHub-hosted runner, not on the
      # elevated Provider. Its output is untrusted until independently reviewed.
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.1"

      - name: Compile complete dependency closure with SHA-256 hashes
        shell: bash
        run: |
          mkdir -p artifacts/provider-dependency-lock
          python -m piptools compile \
            --no-header \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file artifacts/provider-dependency-lock/requirements-provider.lock.txt \
            requirements-provider-lock.in

      - name: Validate and identify the candidate artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts/provider-dependency-lock/requirements-provider.lock.txt'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'LOCK_CANDIDATE_NOT_CREATED'
          }
          $content = Get-Content -LiteralPath $path -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            throw 'LOCK_CANDIDATE_EMPTY'
          }
          $pins = [regex]::Matches($content, '(?m)^\s*[A-Za-z0-9][A-Za-z0-9._-]*==')
          $hashes = [regex]::Matches($content, '--hash=sha256:[0-9a-fA-F]{64}')
          if ($pins.Count -lt 1 -or $hashes.Count -lt $pins.Count) {
            throw 'LOCK_CANDIDATE_PIN_OR_HASH_CHECK_FAILED'
          }
          $lockHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "SOURCE_SHA=${{ github.sha }}"
          Write-Output "LOCK_CANDIDATE_SHA256=$lockHash"
          Write-Output "PINNED_REQUIREMENT_COUNT=$($pins.Count)"
          Write-Output "HASH_COUNT=$($hashes.Count)"
          Write-Output 'LOCK_CANDIDATE_IS_NOT_APPROVED_FOR_BOOTSTRAP=true'

      - name: Upload candidate for explicit review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-dependency-lock-candidate-${{ github.sha }}
          path: artifacts/provider-dependency-lock/requirements-provider.lock.txt
          if-no-files-found: error
          retention-days: 7
