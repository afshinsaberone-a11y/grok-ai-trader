name: Provider Dependency Lock Candidate

# Generates an untrusted review artifact only. No repository writes, secrets,
# authority provisioning, or deployment are performed.
on:
  workflow_dispatch:
  # Generate a review-only candidate automatically for narrowly scoped dependency
  # input/workflow changes on this branch. No secrets or write permissions exist.
  push:
    branches:
      - ops/bootstrap-provider-host-v1-20261025
    paths:
      - .github/workflows/provider-dependency-lock-candidate.yml
      - requirements-provider-lock.in
      - requirements.txt

permissions:
  contents: read

concurrency:
  group: provider-dependency-lock-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-lock-candidate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the explicitly selected source ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the bootstrap target Python version
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      # The generator runs on an ephemeral GitHub-hosted runner, not on the
      # elevated Provider. Its output is untrusted until independently reviewed.
      - name: Install pinned lock compiler
        run: python -m pip install --disable-pip-version-check "pip-tools==7.6.1"

      - name: Compile complete dependency closure with SHA-256 hashes
        shell: bash
        run: |
          mkdir -p artifacts/provider-dependency-lock
          python -m piptools compile \
            --no-header \
            --resolver=backtracking \
            --generate-hashes \
            --allow-unsafe \
            --strip-extras \
            --output-file artifacts/provider-dependency-lock/requirements-provider.lock.txt \
            requirements-provider-lock.in

      - name: Verify binary-only install and Provider contracts on Windows Python 3.13
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts/provider-dependency-lock/requirements-provider.lock.txt'
          $venvRoot = Join-Path $env:RUNNER_TEMP ('forexai-provider-lock-validation-' + [Guid]::NewGuid().ToString('N'))
          & python -m venv $venvRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'LOCK_VALIDATION_VENV_CREATION_FAILED'
          }
          $venvPython = Join-Path $venvRoot 'Scripts\python.exe'
          if (-not (Test-Path -LiteralPath $venvPython -PathType Leaf)) {
            throw 'LOCK_VALIDATION_PYTHON_NOT_FOUND'
          }
          & $venvPython -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r $path
          if ($LASTEXITCODE -ne 0) {
            throw 'LOCK_VALIDATION_BINARY_ONLY_INSTALL_FAILED'
          }
          & $venvPython -c "import cryptography, pytest; print('PROVIDER_RUNTIME_IMPORTS=PASS')"
          if ($LASTEXITCODE -ne 0) {
            throw 'LOCK_VALIDATION_RUNTIME_IMPORTS_FAILED'
          }
          $focusedTests = @(
            'tests/test_control_plane_provider_host_preflight_v1.py',
            'tests/test_control_plane_admission_provider_v1.py',
            'tests/test_control_plane_provider_service_v1.py',
            'tests/test_control_plane_service_v1.py'
          )
          & $venvPython -m pytest -q -p no:cacheprovider $focusedTests
          if ($LASTEXITCODE -ne 0) {
            throw 'LOCK_VALIDATION_PROVIDER_CONTRACT_TESTS_FAILED'
          }

      - name: Validate and identify the candidate artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'artifacts/provider-dependency-lock/requirements-provider.lock.txt'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw 'LOCK_CANDIDATE_NOT_CREATED'
          }
          $content = Get-Content -LiteralPath $path -Raw
          if ([string]::IsNullOrWhiteSpace($content)) {
            throw 'LOCK_CANDIDATE_EMPTY'
          }
          $pins = [regex]::Matches($content, '(?m)^\s*[A-Za-z0-9][A-Za-z0-9._-]*==')
          $hashes = [regex]::Matches($content, '--hash=sha256:[0-9a-fA-F]{64}')
          if ($pins.Count -lt 1 -or $hashes.Count -lt $pins.Count) {
            throw 'LOCK_CANDIDATE_PIN_OR_HASH_CHECK_FAILED'
          }
          $lockHash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output "SOURCE_SHA=${{ github.sha }}"
          Write-Output "LOCK_CANDIDATE_SHA256=$lockHash"
          Write-Output "PINNED_REQUIREMENT_COUNT=$($pins.Count)"
          Write-Output "HASH_COUNT=$($hashes.Count)"
          Write-Output 'LOCK_CANDIDATE_IS_NOT_APPROVED_FOR_BOOTSTRAP=true'

      - name: Upload candidate for explicit review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provider-dependency-lock-candidate-${{ github.sha }}
          path: artifacts/provider-dependency-lock/requirements-provider.lock.txt
          if-no-files-found: error
          retention-days: 7
