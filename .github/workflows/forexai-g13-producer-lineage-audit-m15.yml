name: ForexAI G13 Producer Lineage Audit M15
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA whose Validation/Robustness/OOS producer runs must be audited'
        required: true
        type: string
  workflow_run:
    workflows:
      - "ForexAI G13 OOS M15 Current"
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONOPTIMIZE: '0'
      VALIDATION_WORKFLOW_FILE: forexai-g13-validation-m15.yml
      ROBUSTNESS_WORKFLOW_FILE: forexai-g13-robustness-m15.yml
      OOS_WORKFLOW_FILE: forexai-g13-oos-m15-current.yml
    steps:
      - name: Checkout exact target
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.target_sha }}
      - name: Resolve exact producer runs and verify artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_TARGET_SHA: ${{ inputs.target_sha }}
          EVENT_TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          TARGET_SHA="$EVENT_TARGET_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then TARGET_SHA="$MANUAL_TARGET_SHA"; fi
          test -n "$TARGET_SHA"
          echo "TARGET_SHA=$TARGET_SHA" >> "$GITHUB_ENV"
          rm -rf evidence/g13-producers
          mkdir -p evidence/g13-producers/{validation,robustness,oos}
          resolve_run() {
            local key="$1" workflow="$2" artifact_name="$3" dest="$4" expected_job="$5" expected_workflow_id="$6"
            local runs_json run_id artifact_json artifact_count digest zip actual artifact_id prov jobs_json job_count job_id
            runs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=100")"
            run_id="$(printf '%s' "$runs_json" | jq -r --arg sha "$TARGET_SHA" '.workflow_runs | map(select(.head_sha == $sha and .conclusion == "success")) | sort_by(.id) | last | .id // empty')"
            test -n "$run_id"
            artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts")"
            artifact_count="$(printf '%s' "$artifact_json" | jq --arg n "$artifact_name" '[.artifacts[] | select(.name == $n and .expired == false)] | length')"
            test "$artifact_count" -eq 1
            artifact_id="$(printf '%s' "$artifact_json" | jq -r --arg n "$artifact_name" '[.artifacts[] | select(.name == $n and .expired == false)][0].id')"
            digest="$(printf '%s' "$artifact_json" | jq -r --arg n "$artifact_name" '[.artifacts[] | select(.name == $n and .expired == false)][0].digest')"
            printf '%s' "$digest" | grep -Eq '^sha256:[0-9a-fA-F]{64}$'
            jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs")"
            job_count="$(printf '%s' "$jobs_json" | jq --arg j "$expected_job" '[.jobs[] | select(.name == $j and .conclusion == "success")] | length')"
            test "$job_count" -eq 1
            mkdir -p "$dest"
            zip="$dest/source.zip"
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip"
            actual="sha256:$(sha256sum "$zip" | awk '{print $1}')"
            test "$actual" = "$digest"
            unzip -o "$zip" -d "$dest/extracted" >/dev/null
            prov="$(find "$dest/extracted" -type f -name "$key" | head -n1)"
            test -n "$prov"
            cp "$prov" "$dest/provenance.json"
            job_id="$(printf '%s' "$jobs_json" | jq -r --arg j "$expected_job" '[.jobs[] | select(.name == $j and .conclusion == "success")][0].id')"
            workflow_name="$(printf '%s' "$runs_json" | jq -r --arg rid "$run_id" '.workflow_runs[] | select(.id == ($rid|tonumber)) | .name')"
            artifact_sha="\${digest#sha256:}"
            downloaded_sha="\${actual#sha256:}"
            WORKFLOW_NAME="$workflow_name" WORKFLOW_ID="$expected_workflow_id" RUN_ID="$run_id" EXPECTED_JOB="$expected_job" JOB_ID="$job_id" ARTIFACT_NAME="$artifact_name" ARTIFACT_ID="$artifact_id" ARTIFACT_SHA="$artifact_sha" DOWNLOADED_SHA="$downloaded_sha" TARGET_SHA="$TARGET_SHA" python -c 'import json,os,sys; p=sys.argv[1]; d={"workflow_name":os.environ["WORKFLOW_NAME"],"workflow_id":int(os.environ["WORKFLOW_ID"]),"head_branch":"main","head_sha":os.environ["TARGET_SHA"],"run_id":int(os.environ["RUN_ID"]),"job_name":os.environ["EXPECTED_JOB"],"job_id":int(os.environ["JOB_ID"]),"artifact_name":os.environ["ARTIFACT_NAME"],"artifact_id":int(os.environ["ARTIFACT_ID"]),"artifact_sha256":os.environ["ARTIFACT_SHA"],"downloaded_zip_sha256":os.environ["DOWNLOADED_SHA"],"expired":False}; open(p,"w",encoding="utf-8").write(json.dumps(d,indent=2,sort_keys=True)+"\\n")' "$dest/source-metadata.json"
            printf '%s\n' "$run_id" > "$dest/run_id.txt"low_dispatch:
    inputs:
      target_sha:
        description: 'Exact main SHA whose Validation/Robustness/OOS producer runs must be audited'
        required: true
        type: string
  workflow_run:
    workflows:
      - "ForexAI G13 OOS M15 Current"
    types: [completed]
    branches: [main]
