name: ForexAI G13 MT5 Compile + Signal Parity

on:
  workflow_dispatch:
    inputs:
      mt5_root:
        description: 'MT5 installation root on the self-hosted Windows runner'
        required: false
        default: 'C:\\Program Files\\MetaTrader 5'
      mt5_data_root:
        description: 'MT5 terminal data root containing MQL5\\Experts'
        required: false
        default: 'C:\\Users\\Star\\AppData\\Roaming\\MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
      parity_csv:
        description: 'Legacy parity path; generated parity is collected from the MT5 service Common/Files folder'
        required: false
        default: 'C:\\Users\\Star\\AppData\\Roaming\\MetaQuotes\\Terminal\\Common\\Files\\g13_mql5_parity.csv'
      data_csv:
        description: 'Path to the REAL EURUSD M15 CSV on the runner'
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  compile-and-parity:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify local Python runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          function Add-Candidate([string]$p) {
            if (-not $p -or $candidates.Contains($p)) { return }
            try {
              if (Test-Path -LiteralPath $p -PathType Leaf) { [void]$candidates.Add($p) }
            } catch [System.UnauthorizedAccessException] {
              Write-Host "PYTHON_PATH_SKIPPED_ACCESS_DENIED=$p"
            } catch { Write-Host "PYTHON_PATH_SKIPPED_ERROR=$p :: $($_.Exception.Message)" }
          }
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { Add-Candidate $cmd.Source }
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            try {
              $candidate = & $py.Source -0p 2>$null | Select-Object -First 1
              if ($candidate) {
                $candidate = $candidate.Trim()
                if ($candidate -match '^\s*(?:-V:)?3\.\d+\s+(.+)$') { $candidate = $Matches[1].Trim() }
                Add-Candidate $candidate
              }
            } catch { Write-Host "PYTHON_LAUNCHER_DISCOVERY_FAILED=$($_.Exception.Message)" }
          }
          foreach ($userRoot in @('C:\\Users\\Star', $env:USERPROFILE)) {
            if ($userRoot -and (Test-Path -LiteralPath $userRoot -PathType Container)) {
              foreach ($ver in 'Python313','Python312','Python311') {
                Add-Candidate "$userRoot\\AppData\\Local\\Programs\\Python\\$ver\\python.exe"
                Add-Candidate "$userRoot\\AppData\\Programs\\Python\\$ver\\python.exe"
              }
            }
          }
          Add-Candidate 'C:\\Program Files\\Python313\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python312\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python311\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Anaconda3\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Miniconda3\\python.exe'
          foreach ($candidate in $candidates) {
            try {
              $version = (& $candidate -c "import sys; print('.'.join(map(str,sys.version_info[:3])))" 2>&1 | Select-Object -Last 1).Trim()
              if ($LASTEXITCODE -eq 0 -and $version -match '^3\.(11|12|13)(?:\.|$)') {
                Write-Host "PYTHON=$candidate"
                Write-Host "PYTHON_VERSION=$version"
                "PYTHON_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                break
              }
            } catch { Write-Host "PYTHON_EXECUTION_SKIPPED=$candidate :: $($_.Exception.Message)" }
          }
          if (-not (Get-Content $env:GITHUB_ENV -ErrorAction SilentlyContinue | Select-String '^PYTHON_EXE=')) {
            Write-Host 'PYTHON_CANDIDATES=' ($candidates -join ';')
            throw 'Python 3.11+ not found on the self-hosted runner.'
          }

      - name: Install Python dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      - name: Verify MT5 toolchain and data folder
        env:
          MT5_ROOT: ${{ inputs.mt5_root }}
          MT5_DATA_ROOT: ${{ inputs.mt5_data_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MT5_ROOT
          $data = $env:MT5_DATA_ROOT
          $meta = Join-Path $root 'metaeditor64.exe'
          $terminal = Join-Path $root 'terminal64.exe'
          $experts = Join-Path $data 'MQL5\\Experts'
          if (!(Test-Path -LiteralPath $meta -PathType Leaf)) { throw "MetaEditor not found: $meta" }
          if (!(Test-Path -LiteralPath $terminal -PathType Leaf)) { throw "MT5 terminal not found: $terminal" }
          if (!(Test-Path -LiteralPath $data -PathType Container)) { throw "MT5 data root not found: $data" }
          if (!(Test-Path -LiteralPath $experts -PathType Container)) { throw "MT5 Experts folder not found: $experts" }
          Write-Host "METAEDITOR=$meta"
          Write-Host "TERMINAL=$terminal"
          Write-Host "MT5_DATA_ROOT=$data"
          Write-Host "MT5_EXPERTS=$experts"

      - name: Stage MT5 include tree for service-account MetaEditor
        env:
          MT5_DATA_ROOT: ${{ inputs.mt5_data_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MT5_DATA_ROOT 'MQL5\\Include'
          $serviceData = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
          $target = Join-Path $serviceData 'MQL5\\Include'
          if (!(Test-Path -LiteralPath $source -PathType Container)) { throw "MT5 Include tree not found: $source" }
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item (Join-Path $source '*') $target -Recurse -Force
          $trade = Join-Path $target 'Trade\\Trade.mqh'
          if (!(Test-Path -LiteralPath $trade -PathType Leaf)) { throw "Trade.mqh not staged for service-account MetaEditor: $trade" }
          Write-Host "MT5_SERVICE_DATA_ROOT=$serviceData"
          Write-Host "MT5_SERVICE_INCLUDE_OK=$target"

      - name: Generate fresh frozen EAs
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force artifacts/g13/mql5 -ErrorAction SilentlyContinue
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_generator_v2 `
            --manifest artifacts/g13/g13-promotion-manifest-m15.json `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --output-dir artifacts/g13/mql5

      - name: Generate deterministic MQL5 real-data parity harness
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_parity_harness_generator `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --output artifacts/g13/mql5/ForexAI_G13_Parity_Harness.mq5

      - name: Compile all 15 EAs with MetaEditor
        env:
          MT5_ROOT: ${{ inputs.mt5_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\_ci_build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          Remove-Item -Path (Join-Path $buildDir '*') -Recurse -Force -ErrorAction SilentlyContinue
          $files = @(Get-ChildItem 'artifacts/g13/mql5/*.mq5' | Sort-Object Name)
          if ($files.Count -ne 15) { throw "Expected 15 mq5 files, found $($files.Count)" }
          foreach ($f in $files) {
            $src = Join-Path $buildDir $f.Name
            $ex5 = [System.IO.Path]::ChangeExtension($src, '.ex5')
            $log = [System.IO.Path]::ChangeExtension($src, '.log')
            Copy-Item $f.FullName $src -Force
            Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
            Write-Host "Compiling $($f.Name) from $buildDir"
            $proc = Start-Process -FilePath $meta -WorkingDirectory $buildDir -ArgumentList @("/compile:$src", '/log') -Wait -PassThru
            Write-Host "METAEDITOR_EXIT_CODE=$($proc.ExitCode) FILE=$($f.Name)"
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              $logText = Get-Content -LiteralPath $log -Raw -ErrorAction Stop
              $logText -split "`r?`n" | ForEach-Object { if ($_.Trim()) { Write-Host "METAEDITOR_LOG=$($_)" } }
              $resultMatch = [regex]::Match($logText, 'Result:\s*(\d+) errors,\s*(\d+) warnings')
              if (!$resultMatch.Success) { throw "Unable to parse MetaEditor compile result for $($f.Name)" }
              $errors = [int]$resultMatch.Groups[1].Value
              $warnings = [int]$resultMatch.Groups[2].Value
              Write-Host "METAEDITOR_ERRORS=$errors FILE=$($f.Name)"
              Write-Host "METAEDITOR_WARNINGS=$warnings FILE=$($f.Name)"
              if ($errors -ne 0) { throw "MetaEditor compile produced $errors errors for $($f.Name)" }
            } else {
              throw "MetaEditor compile log missing for $($f.Name)"
            }
            if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) {
              throw "No EX5 produced for $($f.Name); MetaEditor exit code=$($proc.ExitCode)"
            }
            Copy-Item $ex5 (Join-Path 'artifacts/g13/mql5' ([System.IO.Path]::GetFileName($ex5))) -Force
          }
          Write-Host "MT5_COMPILE_OK=15"

      - name: Compile and deploy MQL5 real-data parity harness
        env:
          MT5_ROOT: ${{ inputs.mt5_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\_ci_parity_harness'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          Remove-Item -Path (Join-Path $buildDir '*') -Recurse -Force -ErrorAction SilentlyContinue
          $f = Get-Item 'artifacts/g13/mql5/ForexAI_G13_Parity_Harness.mq5'
          $src = Join-Path $buildDir $f.Name
          $ex5 = [System.IO.Path]::ChangeExtension($src, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($src, '.log')
          Copy-Item $f.FullName $src -Force
          $proc = Start-Process -FilePath $meta -WorkingDirectory $buildDir -ArgumentList @("/compile:$src", '/log') -Wait -PassThru
          Write-Host "PARITY_HARNESS_METAEDITOR_EXIT_CODE=$($proc.ExitCode)"
          if (!(Test-Path -LiteralPath $log -PathType Leaf)) { throw "Parity harness MetaEditor compile log missing" }
          $logText = Get-Content -LiteralPath $log -Raw -ErrorAction Stop
          $resultMatch = [regex]::Match($logText, 'Result:\\s*(\\d+) errors,\\s*(\\d+) warnings')
          if (!$resultMatch.Success) { throw "Unable to parse parity harness MetaEditor result" }
          $errors = [int]$resultMatch.Groups[1].Value
          $warnings = [int]$resultMatch.Groups[2].Value
          Write-Host "PARITY_HARNESS_METAEDITOR_ERRORS=$errors"
          Write-Host "PARITY_HARNESS_METAEDITOR_WARNINGS=$warnings"
          if ($errors -ne 0) { throw "Parity harness compile produced $errors errors" }
          if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) { throw "Parity harness EX5 was not produced" }

          $scripts = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075\\MQL5\\Scripts'
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          Copy-Item $src (Join-Path $scripts $f.Name) -Force
          Copy-Item $ex5 (Join-Path $scripts ([System.IO.Path]::GetFileName($ex5))) -Force
          Write-Host "PARITY_HARNESS_DEPLOY_OK=$scripts\\ForexAI_G13_Parity_Harness.ex5"

      - name: Deploy fresh EAs to MT5 Experts
        env:
          MT5_DATA_ROOT: ${{ inputs.mt5_data_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $experts = Join-Path $env:MT5_DATA_ROOT 'MQL5\\Experts'
          if (!(Test-Path -LiteralPath $experts -PathType Container)) { throw "MT5 Experts folder not found: $experts" }
          $files = @(Get-ChildItem 'artifacts/g13/mql5/*.mq5' | Sort-Object Name)
          if ($files.Count -ne 15) { throw "Expected 15 mq5 files before deploy, found $($files.Count)" }
          foreach ($f in $files) {
            $ex5 = [System.IO.Path]::ChangeExtension($f.FullName, '.ex5')
            $dstMq5 = Join-Path $experts $f.Name
            $dstEx5 = Join-Path $experts ([System.IO.Path]::GetFileName($ex5))
            Copy-Item $f.FullName $dstMq5 -Force
            Copy-Item $ex5 $dstEx5 -Force
            $srcHash = (Get-FileHash $ex5 -Algorithm SHA256).Hash
            $dstHash = (Get-FileHash $dstEx5 -Algorithm SHA256).Hash
            if ($srcHash -ne $dstHash) { throw "EX5 deploy hash mismatch for $($f.Name)" }
            Write-Host "DEPLOYED=$($f.Name) EX5_SHA256=$dstHash"
          }
          Write-Host "MT5_EXPERTS_DEPLOY_OK=15"

      - name: Stage REAL M15 data for MQL5 parity harness
        env:
          DATA_CSV_INPUT: ${{ inputs.data_csv }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:DATA_CSV_INPUT -PathType Leaf)) {
            throw "REAL market-data CSV not found: $env:DATA_CSV_INPUT"
          }
          $serviceCommon = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files'
          New-Item -ItemType Directory -Path $serviceCommon -Force | Out-Null
          $inputTarget = Join-Path $serviceCommon 'g13_real_eurusd_m15.csv'
          $parityTarget = Join-Path $serviceCommon 'g13_mql5_parity.csv'
          $doneTarget = Join-Path $serviceCommon 'g13_mql5_parity.done.txt'
          Remove-Item $parityTarget,$doneTarget -Force -ErrorAction SilentlyContinue
          Copy-Item $env:DATA_CSV_INPUT $inputTarget -Force
          if (!(Test-Path -LiteralPath $inputTarget -PathType Leaf)) {
            throw "Failed to stage REAL M15 CSV for MQL5 parity harness: $inputTarget"
          }
          Write-Host "REAL_DATA_COMMON_INPUT=$inputTarget"
          Write-Host "REAL_INPUT_STAGED_OK"

      - name: Run MQL5 real-data parity harness
        env:
          MT5_ROOT: ${{ inputs.mt5_root }}
        run: |
          $ErrorActionPreference = 'Stop'
          $terminal = Join-Path $env:MT5_ROOT 'terminal64.exe'
          $config = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\g13_parity_harness.ini'
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Script=ForexAI_G13_Parity_Harness
          Symbol=EURUSD.cent
          Period=M15
          ShutdownTerminal=1
          "@ | Set-Content -LiteralPath $config -Encoding ascii

          Remove-Item (Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files\\g13_mql5_parity.csv') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files\\g13_mql5_parity.done.txt') -Force -ErrorAction SilentlyContinue

          Write-Host "Launching MT5 parity harness via terminal config"
          $proc = Start-Process -FilePath $terminal -ArgumentList @("/config:$config") -PassThru
          if (!$proc.WaitForExit(180000)) {
            try { $proc.Kill() } catch {}
            throw "MT5 parity harness timed out after 180 seconds"
          }
          Write-Host "MT5_PARITY_TERMINAL_EXIT_CODE=$($proc.ExitCode)"

          $serviceCommon = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files'
          $parity = Join-Path $serviceCommon 'g13_mql5_parity.csv'
          $done = Join-Path $serviceCommon 'g13_mql5_parity.done.txt'
          if (!(Test-Path -LiteralPath $parity -PathType Leaf)) {
            throw "MQL5 parity output was not generated: $parity"
          }
          if (!(Test-Path -LiteralPath $done -PathType Leaf)) {
            throw "MQL5 parity completion marker was not generated: $done"
          }
          if (!(Select-String -LiteralPath $done -Pattern '^status,PASS$' -Quiet)) {
            throw "MQL5 parity harness did not report PASS"
          }
          if (!(Select-String -LiteralPath $done -Pattern '^real_data_only,true$' -Quiet)) {
            throw "MQL5 parity harness did not confirm real_data_only=true"
          }
          if (!(Select-String -LiteralPath $done -Pattern '^synthetic_data,false$' -Quiet)) {
            throw "MQL5 parity harness did not confirm synthetic_data=false"
          }
          if (!(Select-String -LiteralPath $done -Pattern '^candidate_count,15$' -Quiet)) {
            throw "MQL5 parity harness did not process exactly 15 candidates"
          }

          $stageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\ci_inputs'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item $parity (Join-Path $stageDir 'g13_mql5_parity.csv') -Force
          Copy-Item $done (Join-Path $stageDir 'g13_mql5_parity.done.txt') -Force
          "PARITY_CSV_RESOLVED=$(Join-Path $stageDir 'g13_mql5_parity.csv')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DATA_CSV_RESOLVED=$(Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files\\g13_real_eurusd_m15.csv')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "MQL5_REAL_DATA_PARITY_OK"

      - name: Verify generated parity input
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:PARITY_CSV_RESOLVED -PathType Leaf)) {
            throw "Generated MQL5 parity CSV missing: $env:PARITY_CSV_RESOLVED"
          }
          Write-Host "PARITY_INPUT_OK"
          
      - name: Run fail-closed Python vs MQL5 signal parity
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_parity `
            --data "$env:DATA_CSV_RESOLVED" `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --manifest artifacts/g13/g13-promotion-manifest-m15.json `
            --mt5 "$env:PARITY_CSV_RESOLVED" `
            --output artifacts/g13-mql5-signal-parity.json

      - name: Upload compile + parity evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-mt5-compile-parity
          path: |
            artifacts/g13/mql5/*.mq5
            artifacts/g13/mql5/*.ex5
            artifacts/g13/mql5/g13_parity_harness.ini
            artifacts/g13-mql5-signal-parity.json
            artifacts/g13/ci_inputs/*
          if-no-files-found: error
