name: ForexAI G13 MT5 Compile + Signal Parity
# CI hardening: self-hosted MT5 downloads the exact same-run Promotion artifact through
# actions/download-artifact REST lookup (repository + run-id + token), while retaining digest binding.

on:
  workflow_dispatch:
    inputs:
      promotion_run_id:
        description: 'Successful G13 Final Promotion M15 run for this exact commit'
        required: true
        type: string
      mt5_root:
        description: 'MT5 installation root on the self-hosted Windows runner'
        required: false
        default: 'C:\\Program Files\\MetaTrader 5'
      mt5_data_root:
        description: 'MT5 terminal data root containing MQL5\\Experts'
        required: false
        default: 'C:\\Users\\Star\\AppData\\Roaming\\MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
      parity_csv:
        description: 'Legacy parity path; generated parity is collected from the MT5 service Common/Files folder'
        required: false
        default: 'C:\\Users\\Star\\AppData\\Roaming\\MetaQuotes\\Terminal\\Common\\Files\\g13_mql5_parity.csv'
        type: string
      data_csv:
        description: 'Canonical REAL EURUSD M15 CSV path only; must have a matching provenance manifest; non-canonical paths are rejected'
        required: false
        default: 'C:\\actions-runner\\ForexAI\\market-data-cache\\g13\\normalized\\EURUSD_M15_20220101_20251231.csv'
        type: string
  # Compile/Parity is intentionally dispatch-only.
  # G13 Watchdog dispatches this workflow only after exact-SHA OOS + Promotion succeed.
concurrency:
  group: g13-mt5-compile-parity-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"

jobs:
  resolve-promotion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      promotion_run_id: ${{ steps.resolve.outputs.promotion_run_id }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      promotion_artifact_id: ${{ steps.stage.outputs.promotion_artifact_id }}
      promotion_artifact_digest: ${{ steps.stage.outputs.promotion_artifact_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      MANUAL_PROMOTION_RUN_ID: ${{ inputs.promotion_run_id }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Resolve exact Promotion run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            promotion_id="$MANUAL_PROMOTION_RUN_ID"
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$promotion_id")"
            printf '%s' "$run_json" | python -c 'import json,sys; x=json.load(sys.stdin); target=sys.argv[1]; assert x["name"]=="ForexAI G13 Final Promotion M15"; assert x["conclusion"]=="success"; assert x["head_branch"]=="main"; assert x["head_sha"]==target, (x["id"],x["head_sha"],target); print("MANUAL_PROMOTION_RUN_OK",x["id"],x["head_sha"])' "$TARGET_SHA"
          else
            promotion_id=""
            for attempt in $(seq 1 100); do
              payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-promotion-m15.yml/runs?branch=main&per_page=50")"
              state="$(printf '%s' "$payload" | python -c 'import json,sys; target=sys.argv[1]; rs=json.load(sys.stdin).get("workflow_runs",[]); rs=[r for r in rs if r.get("head_branch")=="main" and r.get("head_sha")==target and r.get("name")=="ForexAI G13 Final Promotion M15"]; success=[r for r in rs if r.get("conclusion")=="success"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|" if rs else "NOT_STARTED|")))' "$TARGET_SHA")"
              case "$state" in
                SUCCESS\|*)
                  promotion_id="${state#SUCCESS|}"
                  echo "PROMOTION_READY=true RUN=$promotion_id SHA=$TARGET_SHA"
                  break
                  ;;
                PENDING\|*|NOT_STARTED\|*)
                  echo "PROMOTION_WAIT attempt=$attempt state=$state SHA=$TARGET_SHA"
                  sleep 15
                  ;;
                FAILED\|*)
                  echo "PROMOTION_FAILED_FOR_SHA=$TARGET_SHA"
                  exit 1
                  ;;
              esac
            done
            if [[ -z "$promotion_id" ]]; then
              echo "PROMOTION_WAIT_TIMEOUT_FOR_SHA=$TARGET_SHA"
              exit 1
            fi
          fi
          echo "promotion_run_id=$promotion_id" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"

      - name: Stage exact Promotion artifact on GitHub-hosted resolver
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_RUN_ID: ${{ steps.resolve.outputs.promotion_run_id }}
        run: |
          set -euo pipefail
          stage_dir="artifacts/g13/promotion-source-handoff"
          rm -rf "$stage_dir"
          mkdir -p "$stage_dir"
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PROMOTION_RUN_ID/artifacts?per_page=100")"
          artifact_line="$(printf '%s' "$artifact_json" | python -c 'import json,sys; rs=[a for a in json.load(sys.stdin).get("artifacts",[]) if a.get("name")=="g13-promotion-manifest-m15" and not a.get("expired")]; assert len(rs)==1, f"expected one non-expired Promotion artifact, found {len(rs)}"; a=rs[0]; assert isinstance(a.get("id"),int); assert isinstance(a.get("digest"),str) and a["digest"].startswith("sha256:"); print(a["id"],a["digest"])')"
          read -r artifact_id artifact_digest <<< "$artifact_line"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o "$stage_dir/promotion.zip"
          actual_digest="sha256:$(sha256sum "$stage_dir/promotion.zip" | awk '{print tolower($1)}')"
          if [[ "$actual_digest" != "$(printf '%s' "$artifact_digest" | tr '[:upper:]' '[:lower:]')" ]]; then
            echo "PROMOTION_SOURCE_DIGEST_MISMATCH actual=$actual_digest expected=$artifact_digest"
            exit 1
          fi
          cat > "$stage_dir/source-artifact.env" <<EOF
          PROMOTION_RUN_ID=$PROMOTION_RUN_ID
          TARGET_SHA=$TARGET_SHA
          PROMOTION_ARTIFACT_ID=$artifact_id
          PROMOTION_ARTIFACT_DIGEST=$artifact_digest
          EOF
          echo "promotion_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "promotion_artifact_digest=$artifact_digest" >> "$GITHUB_OUTPUT"
          echo "G13_PROMOTION_SOURCE_ZIP_VERIFIED=true ID=$artifact_id DIGEST=$artifact_digest"

      - name: Upload exact Promotion artifact handoff
        uses: actions/upload-artifact@v4
        with:
          name: g13-promotion-source-handoff
          path: artifacts/g13/promotion-source-handoff/*
          if-no-files-found: error

  compile-and-parity:
    needs: resolve-promotion
    if: needs.resolve-promotion.result == 'success'
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 60
    env:
      PYTHONOPTIMIZE: '0'
      PROMOTION_RUN_ID: ${{ needs.resolve-promotion.outputs.promotion_run_id }}
      TARGET_SHA: ${{ needs.resolve-promotion.outputs.target_sha }}
      PROMOTION_ARTIFACT_ID: ${{ needs.resolve-promotion.outputs.promotion_artifact_id }}
      PROMOTION_ARTIFACT_DIGEST: ${{ needs.resolve-promotion.outputs.promotion_artifact_digest }}
      PARITY_INPUT_FILE: g13_real_eurusd_m15_${{ github.run_id }}.csv
      PARITY_OUTPUT_FILE: g13_mql5_parity_${{ github.run_id }}.csv
      PARITY_DONE_FILE: g13_mql5_parity.done_${{ github.run_id }}.txt
      PARITY_STARTED_FILE: g13_mql5_parity.started_${{ github.run_id }}.txt
      MT5_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.mt5_root || 'C:\\Program Files\\MetaTrader 5' }}
      MT5_DATA_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.mt5_data_root || 'C:\\Users\\Star\\AppData\\Roaming\\MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075' }}
      DATA_CSV_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.data_csv || 'C:\\actions-runner\\ForexAI\\market-data-cache\\g13\\normalized\\EURUSD_M15_20220101_20251231.csv' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Verify local Python runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          function Add-Candidate([string]$p) {
            if (-not $p -or $candidates.Contains($p)) { return }
            try {
              if (Test-Path -LiteralPath $p -PathType Leaf) { [void]$candidates.Add($p) }
            } catch [System.UnauthorizedAccessException] {
              Write-Host "PYTHON_PATH_SKIPPED_ACCESS_DENIED=$p"
            } catch { Write-Host "PYTHON_PATH_SKIPPED_ERROR=$p :: $($_.Exception.Message)" }
          }
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { Add-Candidate $cmd.Source }
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            try {
              $candidate = & $py.Source -0p 2>$null | Select-Object -First 1
              if ($candidate) {
                $candidate = $candidate.Trim()
                if ($candidate -match '^\s*(?:-V:)?3\.\d+\s+(.+)$') { $candidate = $Matches[1].Trim() }
                Add-Candidate $candidate
              }
            } catch { Write-Host "PYTHON_LAUNCHER_DISCOVERY_FAILED=$($_.Exception.Message)" }
          }
          foreach ($userRoot in @('C:\\Users\\Star', $env:USERPROFILE)) {
            if ($userRoot -and (Test-Path -LiteralPath $userRoot -PathType Container)) {
              foreach ($ver in 'Python313','Python312','Python311') {
                Add-Candidate "$userRoot\\AppData\\Local\\Programs\\Python\\$ver\\python.exe"
                Add-Candidate "$userRoot\\AppData\\Programs\\Python\\$ver\\python.exe"
              }
            }
          }
          Add-Candidate 'C:\\Program Files\\Python313\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python312\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python311\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Anaconda3\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Miniconda3\\python.exe'
          foreach ($candidate in $candidates) {
            try {
              $version = (& $candidate -c "import sys; print('.'.join(map(str,sys.version_info[:3])))" 2>&1 | Select-Object -Last 1).Trim()
              if ($LASTEXITCODE -eq 0 -and $version -match '^3\.(11|12|13)(?:\.|$)') {
                Write-Host "PYTHON=$candidate"
                Write-Host "PYTHON_VERSION=$version"
                "PYTHON_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                break
              }
            } catch { Write-Host "PYTHON_EXECUTION_SKIPPED=$candidate :: $($_.Exception.Message)" }
          }
          if (-not (Get-Content $env:GITHUB_ENV -ErrorAction SilentlyContinue | Select-String '^PYTHON_EXE=')) {
            Write-Host 'PYTHON_CANDIDATES=' ($candidates -join ';')
            throw 'Python 3.11+ not found on the self-hosted runner.'
          }

      - name: Install Python dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m pip install -r requirements.txt

      - name: Download exact Promotion artifact handoff
        uses: actions/download-artifact@v4
        with:
          name: g13-promotion-source-handoff
          path: artifacts\\g13\\promotion-source
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Verify exact Promotion artifact handoff
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\promotion-source'
          $zip = Join-Path $artifactDir 'promotion.zip'
          $metaFile = Join-Path $artifactDir 'source-artifact.env'
          if (!(Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Resolver Promotion handoff ZIP not found: $zip" }
          if (!(Test-Path -LiteralPath $metaFile -PathType Leaf)) { throw "Resolver Promotion handoff metadata not found: $metaFile" }
          $meta = @{}
          Get-Content -LiteralPath $metaFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $meta[$matches[1]] = $matches[2] }
          }
          if ($meta.PROMOTION_RUN_ID -ne $env:PROMOTION_RUN_ID) { throw "Resolver Promotion run mismatch: $($meta.PROMOTION_RUN_ID) != $env:PROMOTION_RUN_ID" }
          if ($meta.TARGET_SHA -ne $env:TARGET_SHA) { throw "Resolver Promotion handoff SHA mismatch: $($meta.TARGET_SHA) != $env:TARGET_SHA" }
          if ($meta.PROMOTION_ARTIFACT_ID -ne $env:PROMOTION_ARTIFACT_ID) { throw "Resolver Promotion artifact ID mismatch: $($meta.PROMOTION_ARTIFACT_ID) != $env:PROMOTION_ARTIFACT_ID" }
          if ($meta.PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant() -ne $env:PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant()) { throw "Resolver Promotion handoff digest mismatch: $($meta.PROMOTION_ARTIFACT_DIGEST) != $env:PROMOTION_ARTIFACT_DIGEST" }
          if ($env:PROMOTION_ARTIFACT_DIGEST -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Invalid Promotion artifact digest: $env:PROMOTION_ARTIFACT_DIGEST" }
          $actualDigest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualDigest -ne $env:PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant()) { throw "Promotion artifact digest mismatch: $actualDigest != $env:PROMOTION_ARTIFACT_DIGEST" }
          Write-Host "PROMOTION_HANDOFF_ARTIFACT_DOWNLOADED_AND_VERIFIED=true ID=$env:PROMOTION_ARTIFACT_ID DIGEST=$actualDigest"
          Write-Host "G13_RESOLVER_HANDOFF_CONSUMED=true"
      - name: Download and bind exact Promotion artifact
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\promotion-source'
          $zip = Join-Path $artifactDir 'promotion.zip'
          $metaFile = Join-Path $artifactDir 'source-artifact.env'
          if (!(Test-Path -LiteralPath $zip -PathType Leaf)) { throw "Promotion handoff ZIP not found: $zip" }
          if (!(Test-Path -LiteralPath $metaFile -PathType Leaf)) { throw "Promotion handoff metadata not found: $metaFile" }
          $meta = @{}
          Get-Content -LiteralPath $metaFile | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $meta[$matches[1]] = $matches[2] }
          }
          if ($meta.PROMOTION_RUN_ID -ne $env:PROMOTION_RUN_ID) { throw "Promotion run mismatch: $($meta.PROMOTION_RUN_ID) != $env:PROMOTION_RUN_ID" }
          if ($meta.TARGET_SHA -ne $env:TARGET_SHA) { throw "Promotion handoff SHA mismatch: $($meta.TARGET_SHA) != $env:TARGET_SHA" }
          if ($meta.PROMOTION_ARTIFACT_ID -ne $env:PROMOTION_ARTIFACT_ID) { throw "Promotion artifact ID mismatch: $($meta.PROMOTION_ARTIFACT_ID) != $env:PROMOTION_ARTIFACT_ID" }
          if ($meta.PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant() -ne $env:PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant()) { throw "Promotion handoff digest mismatch: $($meta.PROMOTION_ARTIFACT_DIGEST) != $env:PROMOTION_ARTIFACT_DIGEST" }
          if ($env:PROMOTION_ARTIFACT_DIGEST -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Invalid Promotion artifact digest: $env:PROMOTION_ARTIFACT_DIGEST" }
          $actualDigest = 'sha256:' + (Get-FileHash -Algorithm SHA256 -LiteralPath $zip).Hash.ToLowerInvariant()
          if ($actualDigest -ne $env:PROMOTION_ARTIFACT_DIGEST.ToLowerInvariant()) { throw "Promotion artifact digest mismatch: $actualDigest != $env:PROMOTION_ARTIFACT_DIGEST" }

          $extract = Join-Path $artifactDir 'extracted'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $manifest = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'g13-promotion-manifest-m15.json')
          $provenance = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'source-provenance.json')
          $attestation = @(Get-ChildItem -LiteralPath $extract -Recurse -File -Filter 'promotion-run-attestation.json')
          if ($manifest.Count -ne 1) { throw "Expected exactly one Promotion manifest, found $($manifest.Count)" }
          if ($provenance.Count -ne 1) { throw "Expected exactly one Promotion provenance file, found $($provenance.Count)" }
          if ($attestation.Count -ne 1) { throw "Expected exactly one Promotion attestation, found $($attestation.Count)" }
          $manifest = $manifest[0].FullName
          $provenance = $provenance[0].FullName
          $attestation = $attestation[0].FullName

          $m = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $p = Get-Content -LiteralPath $provenance -Raw | ConvertFrom-Json
          $a = Get-Content -LiteralPath $attestation -Raw | ConvertFrom-Json
          if ($m.schema_version -ne 'forexai.g13.promotion_manifest.m15.v1') { throw 'Promotion manifest schema mismatch' }
          if ($m.status -ne 'PROMOTION_READY') { throw 'Promotion manifest is not PROMOTION_READY' }
          if ($m.symbol -ne 'EURUSD' -or $m.timeframe -ne 'M15') { throw 'Promotion scope mismatch' }
          if ($m.decision_policy.demo_trading_allowed -ne $false -or $m.decision_policy.live_trading_allowed -ne $false) { throw 'Promotion policy allows trading' }
          if ($a.schema_version -ne 'forexai.g13.promotion_run_attestation.m15.v1') { throw 'Promotion attestation schema mismatch' }
          if ([int64]$a.workflow_run_id -ne [int64]$env:PROMOTION_RUN_ID) { throw 'Promotion attestation run mismatch' }
          if ($a.head_sha -ne $env:TARGET_SHA) { throw 'Promotion attestation head mismatch' }
          if ($a.manifest_sha256.ToLowerInvariant() -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $manifest).Hash.ToLowerInvariant()) { throw 'Promotion manifest SHA mismatch' }
          if ($a.provenance_sha256.ToLowerInvariant() -ne (Get-FileHash -Algorithm SHA256 -LiteralPath $provenance).Hash.ToLowerInvariant()) { throw 'Promotion provenance SHA mismatch' }
          if ($p.schema_version -ne 'forexai.g13.promotion_evidence_provenance.m15.v1') { throw 'Promotion provenance schema mismatch' }
          if (-not $p.sources.validation -or -not $p.sources.robustness -or -not $p.sources.oos) { throw 'Promotion provenance source set mismatch' }
          foreach ($key in @('validation','robustness','oos')) {
            $src = $p.sources.$key
            if ([int64]$src.run_id -le 0) { throw "Promotion provenance $key run_id is invalid" }
            if ([int64]$src.job_id -le 0) { throw "Promotion provenance $key job_id is invalid" }
            if ([int64]$src.artifact.artifact_id -le 0) { throw "Promotion provenance $key artifact_id is invalid" }
            if ($src.artifact.digest -notmatch '^sha256:[0-9a-fA-F]{64}$') { throw "Promotion provenance $key artifact digest is invalid" }
          }
          Write-Host 'G13_PROMOTION_ARTIFACT_CONSUMER_OK'

          "PROMOTION_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROMOTION_PROVENANCE=$provenance" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PROMOTION_ATTESTATION=$attestation" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # The resolver already exported the exact artifact identity to the job environment.
          # Never dereference an out-of-scope $artifact object here: doing so can silently
          # overwrite the bound ID/digest with empty values for downstream steps.
          "PROMOTION_ARTIFACT_ZIP_SHA256=$($actualDigest.Substring(7))" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "G13_PROMOTION_ARTIFACT_BOUND=true ID=$env:PROMOTION_ARTIFACT_ID DIGEST=$env:PROMOTION_ARTIFACT_DIGEST"
      - name: Verify MT5 toolchain and data folder
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MT5_ROOT
          $data = $env:MT5_DATA_ROOT
          $meta = Join-Path $root 'metaeditor64.exe'
          $terminal = Join-Path $root 'terminal64.exe'
          $experts = Join-Path $data 'MQL5\\Experts'
          if (!(Test-Path -LiteralPath $meta -PathType Leaf)) { throw "MetaEditor not found: $meta" }
          if (!(Test-Path -LiteralPath $terminal -PathType Leaf)) { throw "MT5 terminal not found: $terminal" }
          if (!(Test-Path -LiteralPath $data -PathType Container)) { throw "MT5 data root not found: $data" }
          if (!(Test-Path -LiteralPath $experts -PathType Container)) { throw "MT5 Experts folder not found: $experts" }
          # Resolve profile identity once in the preflight step. The execution
          # step receives only this derived root and never accesses MT5_DATA_ROOT,
          # which must not be used as a destination for candidate Expert files.
          $profileRoot = [System.IO.Path]::GetFullPath((Join-Path $data '..\..\..\..\..')).TrimEnd('\')
          "G13_MT5_PROFILE_ROOT=$profileRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "METAEDITOR=$meta"
          Write-Host "TERMINAL=$terminal"
          Write-Host "MT5_DATA_ROOT=$data"
          Write-Host "MT5_EXPERTS=$experts"

      - name: Verify MT5 script execution prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          # The runner service runs as LocalSystem, so APPDATA resolves to the
          # service profile, not C:\Users\Star. MT5 launched by this job also
          # uses that service profile; bootstrap the exact Scripts and Common
          # Files paths consumed by the harness instead of assuming an
          # interactive user's folders exist.
          $serviceData = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
          $scripts = Join-Path $serviceData 'MQL5\\Scripts'
          $common = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files'
          New-Item -ItemType Directory -Path $scripts,$common -Force | Out-Null
          if (!(Test-Path -LiteralPath $scripts -PathType Container)) { throw "MT5 Scripts folder not found after bootstrap: $scripts" }
          if (!(Test-Path -LiteralPath $common -PathType Container)) { throw "MT5 Common Files folder not found after bootstrap: $common" }
          Write-Host 'MT5_SCRIPT_EXECUTION_PROFILE_BOOTSTRAPPED=true'
          Write-Host "MT5_SCRIPTS=$scripts"
          Write-Host "MT5_COMMON_FILES=$common"

      - name: Stage MT5 include tree for service-account MetaEditor
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:MT5_DATA_ROOT 'MQL5\\Include'
          $serviceData = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
          $target = Join-Path $serviceData 'MQL5\\Include'
          if (!(Test-Path -LiteralPath $source -PathType Container)) { throw "MT5 Include tree not found: $source" }

          $sourceCanonical = [System.IO.Path]::GetFullPath($source).TrimEnd('\\')
          $targetCanonical = [System.IO.Path]::GetFullPath($target).TrimEnd('\\')
          if ([System.String]::Equals($sourceCanonical, $targetCanonical, [System.StringComparison]::OrdinalIgnoreCase)) {
            # When the runner executes as the MT5 profile owner, both paths are
            # already the same tree. Copy-Item would fail by copying Array.mqh
            # onto itself; verify the include tree in place instead.
            Write-Host 'MT5_INCLUDE_TREE_ALREADY_AT_TARGET=true'
          } else {
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Get-ChildItem -LiteralPath $source -Force | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination $target -Recurse -Force
            }
            Write-Host 'MT5_INCLUDE_TREE_COPIED_TO_SERVICE_PROFILE=true'
          }

          $trade = Join-Path $target 'Trade\\Trade.mqh'
          if (!(Test-Path -LiteralPath $trade -PathType Leaf)) { throw "Trade.mqh not staged for service-account MetaEditor: $trade" }
          Write-Host "MT5_SERVICE_DATA_ROOT=$serviceData"
          Write-Host "MT5_SERVICE_INCLUDE_OK=true"

      - name: Generate fresh frozen EAs
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force artifacts/g13/mql5 -ErrorAction SilentlyContinue
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_generator_v2 `
            --manifest "$env:PROMOTION_MANIFEST" `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --output-dir artifacts/g13/mql5

          $promotionPayload = Get-Content -LiteralPath $env:PROMOTION_MANIFEST -Raw | ConvertFrom-Json
          $candidateIds = @($promotionPayload.promoted_candidate_ids | ForEach-Object { [int]$_ })
          if ($candidateIds.Count -lt 1) { throw 'Promotion manifest has no promoted candidates' }
          if (@($candidateIds | Select-Object -Unique).Count -ne $candidateIds.Count) {
            throw 'Promotion manifest contains duplicate promoted candidate IDs'
          }
          $manifestCandidateIds = @($promotionPayload.candidates | ForEach-Object { [int]$_.candidate_id } | Sort-Object)
          $promotedCandidateIds = @($candidateIds | Sort-Object)
          $manifestCandidateKey = ($manifestCandidateIds | ForEach-Object { [string]$_ }) -join ','
          $promotedCandidateKey = ($promotedCandidateIds | ForEach-Object { [string]$_ }) -join ','
          if ($manifestCandidateKey -ne $promotedCandidateKey) {
            throw "Promotion manifest candidate record mismatch: promoted=$promotedCandidateKey records=$manifestCandidateKey"
          }
          if ($manifestCandidateIds.Count -ne $candidateIds.Count) {
            throw "Promotion manifest candidate count mismatch: promoted=$($candidateIds.Count) records=$($manifestCandidateIds.Count)"
          }
          "G13_CANDIDATE_COUNT=$($candidateIds.Count)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "G13_PROMOTED_CANDIDATE_COUNT=$($candidateIds.Count)"

      - name: Generate deterministic MQL5 real-data parity harness
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_parity_harness_generator `
            --manifest "$env:PROMOTION_MANIFEST" `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --output artifacts/g13/mql5/ForexAI_G13_Parity_Harness.mq5 `
            --input-file "$env:PARITY_INPUT_FILE" `
            --output-file "$env:PARITY_OUTPUT_FILE" `
            --done-file "$env:PARITY_DONE_FILE" `
            --started-file "$env:PARITY_STARTED_FILE"

      - name: Compile all promoted G13 EAs with MetaEditor
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\_ci_build'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          Remove-Item -Path (Join-Path $buildDir '*') -Recurse -Force -ErrorAction SilentlyContinue
          $files = @(Get-ChildItem 'artifacts/g13/mql5/ForexAI_G13_Candidate_*.mq5' | Sort-Object Name)
          if ($files.Count -ne [int]$env:G13_CANDIDATE_COUNT) { throw "Expected $env:G13_CANDIDATE_COUNT mq5 files, found $($files.Count)" }
          foreach ($f in $files) {
            $src = Join-Path $buildDir $f.Name
            $ex5 = [System.IO.Path]::ChangeExtension($src, '.ex5')
            $log = [System.IO.Path]::ChangeExtension($src, '.log')
            Copy-Item $f.FullName $src -Force
            Remove-Item $ex5,$log -Force -ErrorAction SilentlyContinue
            Write-Host "Compiling $($f.Name) from $buildDir"
            $proc = Start-Process -FilePath $meta -WorkingDirectory $buildDir -ArgumentList @("/compile:$src", '/log') -Wait -PassThru
            Write-Host "METAEDITOR_EXIT_CODE=$($proc.ExitCode) FILE=$($f.Name)"
            if (Test-Path -LiteralPath $log -PathType Leaf) {
              $logText = Get-Content -LiteralPath $log -Raw -ErrorAction Stop
              $logText -split "`r?`n" | ForEach-Object { if ($_.Trim()) { Write-Host "METAEDITOR_LOG=$($_)" } }
              $resultMatch = [regex]::Match($logText, 'Result:\s*(\d+) errors,\s*(\d+) warnings')
              if (!$resultMatch.Success) { throw "Unable to parse MetaEditor compile result for $($f.Name)" }
              $errors = [int]$resultMatch.Groups[1].Value
              $warnings = [int]$resultMatch.Groups[2].Value
              Write-Host "METAEDITOR_ERRORS=$errors FILE=$($f.Name)"
              Write-Host "METAEDITOR_WARNINGS=$warnings FILE=$($f.Name)"
              if ($errors -ne 0) { throw "MetaEditor compile produced $errors errors for $($f.Name)" }
            } else {
              throw "MetaEditor compile log missing for $($f.Name)"
            }
            if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) {
              throw "No EX5 produced for $($f.Name); MetaEditor exit code=$($proc.ExitCode)"
            }
            Copy-Item $ex5 (Join-Path 'artifacts/g13/mql5' ([System.IO.Path]::GetFileName($ex5))) -Force
          }
          Write-Host "MT5_COMPILE_OK=$env:G13_CANDIDATE_COUNT"

      - name: Compile and deploy MQL5 real-data parity script
        run: |
          $ErrorActionPreference = 'Stop'
          $meta = Join-Path $env:MT5_ROOT 'metaeditor64.exe'
          $buildDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\_ci_parity_harness'
          New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
          Remove-Item -Path (Join-Path $buildDir '*') -Recurse -Force -ErrorAction SilentlyContinue
          $f = Get-Item 'artifacts/g13/mql5/ForexAI_G13_Parity_Harness.mq5'
          $src = Join-Path $buildDir $f.Name
          $ex5 = [System.IO.Path]::ChangeExtension($src, '.ex5')
          $log = [System.IO.Path]::ChangeExtension($src, '.log')
          Copy-Item $f.FullName $src -Force
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $meta
          $psi.WorkingDirectory = $buildDir
          $psi.Arguments = "/compile:$src /log"
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          [void]$proc.Start()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          Write-Host "PARITY_HARNESS_METAEDITOR_EXIT_CODE=$($proc.ExitCode)"
          if ($stdout) { $stdout -split [Environment]::NewLine | ForEach-Object { if ($_.Trim()) { Write-Host "PARITY_HARNESS_STDOUT=$($_.Trim())" } } }
          if ($stderr) { $stderr -split [Environment]::NewLine | ForEach-Object { if ($_.Trim()) { Write-Host "PARITY_HARNESS_STDERR=$($_.Trim())" } } }
          if (!(Test-Path -LiteralPath $log -PathType Leaf)) { throw "Parity harness MetaEditor compile log missing" }
          $logText = Get-Content -LiteralPath $log -Raw -ErrorAction Stop
          $resultMatch = [regex]::Match($logText, 'Result:\s*(\d+) errors,\s*(\d+) warnings')
          if (!$resultMatch.Success) { throw "Unable to parse parity harness MetaEditor result" }
          $errors = [int]$resultMatch.Groups[1].Value
          $warnings = [int]$resultMatch.Groups[2].Value
          Write-Host "PARITY_HARNESS_METAEDITOR_ERRORS=$errors"
          Write-Host "PARITY_HARNESS_METAEDITOR_WARNINGS=$warnings"
          if ($errors -ne 0) { throw "Parity harness compile produced $errors errors" }
          if (!(Test-Path -LiteralPath $ex5 -PathType Leaf)) { throw "Parity harness EX5 was not produced" }

          $scripts = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075\\MQL5\\Scripts'
          New-Item -ItemType Directory -Path $scripts -Force | Out-Null
          Copy-Item $src (Join-Path $scripts $f.Name) -Force
          Copy-Item $ex5 (Join-Path $scripts ([System.IO.Path]::GetFileName($ex5))) -Force
          Write-Host "PARITY_HARNESS_DEPLOY_OK=$scripts\\ForexAI_G13_Parity_Harness.ex5"

      - name: Verify fresh EAs for isolated portable runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\mql5') -Filter 'ForexAI_G13_Candidate_*.mq5' -File | Sort-Object Name)
          if ($candidates.Count -ne [int]$env:G13_CANDIDATE_COUNT) {
            throw "Expected $env:G13_CANDIDATE_COUNT compiled candidate sources, found $($candidates.Count)"
          }
          foreach ($candidate in $candidates) {
            $binary = [System.IO.Path]::ChangeExtension($candidate.FullName, '.ex5')
            if (!(Test-Path -LiteralPath $binary -PathType Leaf)) {
              throw "Compiled candidate EX5 is missing: $($candidate.Name)"
            }
            $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
            Write-Host "CANDIDATE_COMPILE_ARTIFACT_READY=$($candidate.Name) EX5_SHA256=$hash"
          }
          Write-Host "MT5_CANDIDATE_COMPILE_ARTIFACTS_READY=$($candidates.Count)"
          Write-Host 'MT5_USER_EXPERTS_DIRECTORY_NOT_MODIFIED=true'

      - name: Resolve REAL EURUSD M15 dataset
        run: |
          $ErrorActionPreference = 'Stop'
          function Try-ReadableFile([string]$p) {
            if (-not $p) { return $false }
            try {
              return [bool](Test-Path -LiteralPath $p -PathType Leaf)
            } catch [System.UnauthorizedAccessException] {
              Write-Host "REAL_M15_PATH_ACCESS_DENIED=$p"
              return $false
            } catch {
              Write-Host "REAL_M15_PATH_CHECK_FAILED=$p :: $($_.Exception.Message)"
              return $false
            }
          }

          $requested = ($env:DATA_CSV_INPUT | Out-String).Trim()
          $expectedDatasetId = '20220101_20251231'
          $workspaceCanonical = Join-Path $env:GITHUB_WORKSPACE 'data\\real\\normalized\\EURUSD_M15_20220101_20251231.csv'
          $workspaceManifest = Join-Path $env:GITHUB_WORKSPACE 'data\\real\\normalized\\EURUSD_M15_20220101_20251231.manifest.json'
          $cacheRoot = 'C:\\actions-runner\\ForexAI\\market-data-cache\\g13'
          $cacheCanonical = Join-Path $cacheRoot 'normalized\\EURUSD_M15_20220101_20251231.csv'
          $cacheManifest = Join-Path $cacheRoot 'normalized\\EURUSD_M15_20220101_20251231.manifest.json'
          $data = $null
          $dataManifest = $null

          function Test-TrustedRealDataset([string]$csv, [string]$manifest) {
            if (-not (Try-ReadableFile $csv) -or -not (Try-ReadableFile $manifest)) { return $false }
            & $env:PYTHON_EXE -m research.optimization.g13_real_data_provenance --csv $csv --manifest $manifest
            return ($LASTEXITCODE -eq 0)
          }

          if ($requested) {
            if ($requested -eq $workspaceCanonical -and (Test-TrustedRealDataset $workspaceCanonical $workspaceManifest)) {
              $data = $workspaceCanonical
              $dataManifest = $workspaceManifest
              Write-Host "REAL_M15_SOURCE=workspace"
            } elseif ($requested -eq $cacheCanonical -and (Test-TrustedRealDataset $cacheCanonical $cacheManifest)) {
              $data = $cacheCanonical
              $dataManifest = $cacheManifest
              Write-Host "REAL_M15_SOURCE=runner_cache"
            } elseif ($requested -ne $workspaceCanonical -and $requested -ne $cacheCanonical) {
              Write-Host "REAL_M15_INPUT_REJECTED_NONCANONICAL=$requested"
            }
          }

          if (-not $data -and (Test-TrustedRealDataset $workspaceCanonical $workspaceManifest)) {
            $data = $workspaceCanonical
            $dataManifest = $workspaceManifest
            Write-Host "REAL_M15_SOURCE=workspace"
          }

          if (-not $data -and (Test-TrustedRealDataset $cacheCanonical $cacheManifest)) {
            $data = $cacheCanonical
            $dataManifest = $cacheManifest
            Write-Host "REAL_M15_SOURCE=runner_cache"
          }

          if (-not $data) {
            # G13 canonical parity must use the same real-data provenance as
            # the frozen validation/robustness runs: HistData.com M1 resampled
            # to M15. Dukascopy JETTA is retained as a real-data fallback only.
            Write-Host "BUILDING_CANONICAL_REAL_EURUSD_M15_FROM_HISTDATA"
            New-Item -ItemType Directory -Path $cacheRoot -Force | Out-Null
            & $env:PYTHON_EXE -m research.real_data.histdata_ingest `
              --symbol EURUSD `
              --timeframe M15 `
              --start 2022-01-01 `
              --end 2026-01-01 `
              --output $cacheRoot `
              --validate `
              --manifest
            if ($LASTEXITCODE -eq 0 -and (Test-TrustedRealDataset $cacheCanonical $cacheManifest)) {
              $data = $cacheCanonical
              $dataManifest = $cacheManifest
              Write-Host "REAL_M15_SOURCE=histdata_runner_cache"
            } else {
              Write-Host "HISTDATA_SOURCE_UNAVAILABLE=falling back to real Dukascopy JETTA ingestion"
              & $env:PYTHON_EXE -m research.real_data.dukascopy_ingest `
                --symbol EURUSD `
                --timeframe M15 `
                --start 2022-01-01 `
                --end 2026-01-01 `
                --output $cacheRoot `
                --validate `
                --manifest `
                --resume
              if ($LASTEXITCODE -ne 0) {
                throw "REAL_DATA_REQUIRED: both HistData and Dukascopy real-data ingestion failed"
              }
              if (-not (Test-TrustedRealDataset $cacheCanonical $cacheManifest)) {
                throw "REAL_DATA_REQUIRED: Dukascopy ingestion produced no trusted canonical EURUSD M15 dataset + manifest"
              }
              $data = $cacheCanonical
              $dataManifest = $cacheManifest
              Write-Host "REAL_M15_SOURCE=dukascopy_runner_cache"
            }
          }
          if (-not $data -or -not $dataManifest) {
            throw "REAL_DATA_REQUIRED: trusted EURUSD M15 CSV and provenance manifest are both required"
          }

          "DATA_CSV_RESOLVED=$data" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DATA_MANIFEST_RESOLVED=$dataManifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DATA_MANIFEST_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $dataManifest).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $env:PYTHON_EXE -m research.optimization.g13_real_data_provenance --csv "$data" --manifest "$dataManifest" --expected-csv "$data"
          if ($LASTEXITCODE -ne 0) {
            throw "REAL_DATA_REQUIRED: resolved EURUSD M15 dataset failed strict 2022-2025 scope validation"
          }

          Write-Host "REAL_EURUSD_M15_RESOLVED=$data"
          Write-Host "REAL_EURUSD_M15_RESOLVED_OK"

      - name: Stage REAL M15 data for MQL5 parity harness
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:DATA_CSV_RESOLVED -PathType Leaf)) {
            throw "REAL market-data CSV not found after resolution: $env:DATA_CSV_RESOLVED"
          }
          $serviceCommon = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files'
          New-Item -ItemType Directory -Path $serviceCommon -Force | Out-Null
          $inputTarget = Join-Path $serviceCommon $env:PARITY_INPUT_FILE
          $parityTarget = Join-Path $serviceCommon $env:PARITY_OUTPUT_FILE
          $doneTarget = Join-Path $serviceCommon $env:PARITY_DONE_FILE
          $startedTarget = Join-Path $serviceCommon $env:PARITY_STARTED_FILE
          Remove-Item $parityTarget,$doneTarget,$startedTarget -Force -ErrorAction SilentlyContinue
          Copy-Item $env:DATA_CSV_RESOLVED $inputTarget -Force
          if (!(Test-Path -LiteralPath $inputTarget -PathType Leaf)) {
            throw "Failed to stage REAL M15 CSV for MQL5 parity harness: $inputTarget"
          }
          Write-Host "REAL_DATA_COMMON_INPUT=$inputTarget"
          Write-Host "REAL_INPUT_STAGED_OK"

      - name: Run MQL5 real-data parity script
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceTerminal = Join-Path $env:MT5_ROOT 'terminal64.exe'
          if (!(Test-Path -LiteralPath $sourceTerminal -PathType Leaf)) {
            throw "MT5 terminal not found: $sourceTerminal"
          }

          # Run a separate portable clone in a logged-on desktop session.
          # LocalSystem/Session 0 can launch MT5 but cannot reliably create MDI charts.
          $portableRoot = Join-Path $env:RUNNER_TEMP ("g13-mt5-parity-portable-{0}" -f $env:GITHUB_RUN_ID)
          $runnerTemp = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          $portableFull = [System.IO.Path]::GetFullPath($portableRoot)
          if (!$portableFull.StartsWith($runnerTemp, [System.StringComparison]::OrdinalIgnoreCase) -or
              (Split-Path -Leaf $portableFull) -notmatch '^g13-mt5-parity-portable-\d+$') {
            throw 'G13_PORTABLE_RUNTIME_PATH_REJECTED'
          }
          if (Test-Path -LiteralPath $portableRoot) {
            throw "G13_PORTABLE_RUNTIME_ALREADY_EXISTS=$portableRoot"
          }

          $interactiveProcesses = @(Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ExecutablePath -and $_.SessionId -gt 0 -and
              [System.IO.Path]::GetFullPath($_.ExecutablePath).Equals(
                [System.IO.Path]::GetFullPath($sourceTerminal),
                [System.StringComparison]::OrdinalIgnoreCase
              )
            } | Sort-Object CreationDate -Descending)

          $interactiveProcess = $null
          $owner = $null
          if ($interactiveProcesses.Count -gt 0) {
            # Prefer the actual MT5 process identity whenever its desktop instance is running.
            $interactiveProcess = $interactiveProcesses[0]
            $owner = Invoke-CimMethod -InputObject $interactiveProcess -MethodName GetOwner -ErrorAction SilentlyContinue
            Write-Host 'G13_MT5_SESSION_RESOLUTION_SOURCE=existing_terminal'
          } else {
            # A logged-in desktop can be valid even when MT5 was closed. Resolve only the
            # Explorer shell whose profile matches MT5_DATA_ROOT, then start the isolated
            # portable terminal in that existing interactive logon. Never launch in Session 0.
            $expectedProfileRoot = [System.IO.Path]::GetFullPath(
              $env:G13_MT5_PROFILE_ROOT
            ).TrimEnd('\')
            $expectedProfiles = @(Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
              Where-Object {
                $_.LocalPath -and
                [System.String]::Equals(
                  [System.IO.Path]::GetFullPath([string]$_.LocalPath).TrimEnd('\'),
                  $expectedProfileRoot,
                  [System.StringComparison]::OrdinalIgnoreCase
                )
              })
            if ($expectedProfiles.Count -ne 1) {
              throw 'G13_INTERACTIVE_MT5_PROFILE_UNRESOLVED: configured MT5 data root has no unique Windows profile'
            }

            $explorerPath = [System.IO.Path]::GetFullPath((Join-Path $env:WINDIR 'explorer.exe'))
            $desktopShells = @(Get-CimInstance Win32_Process -Filter "Name='explorer.exe'" -ErrorAction SilentlyContinue |
              Where-Object {
                $_.SessionId -gt 0 -and $_.ExecutablePath -and
                [System.IO.Path]::GetFullPath([string]$_.ExecutablePath).Equals(
                  $explorerPath, [System.StringComparison]::OrdinalIgnoreCase
                )
              })
            $matchingShells = @()
            foreach ($shell in $desktopShells) {
              $shellOwner = Invoke-CimMethod -InputObject $shell -MethodName GetOwner -ErrorAction SilentlyContinue
              if ($null -eq $shellOwner -or $shellOwner.ReturnValue -ne 0 -or
                  [string]::IsNullOrWhiteSpace([string]$shellOwner.User) -or
                  $shellOwner.User -in @('SYSTEM','LOCAL SERVICE','NETWORK SERVICE')) {
                continue
              }
              $shellAccount = "$($shellOwner.Domain)\$($shellOwner.User)"
              try {
                $shellSid = (New-Object System.Security.Principal.NTAccount($shellAccount)).Translate(
                  [System.Security.Principal.SecurityIdentifier]
                )
              } catch {
                continue
              }
              if ([string]::Equals(
                    [string]$shellSid.Value,
                    [string]$expectedProfiles[0].SID,
                    [System.StringComparison]::OrdinalIgnoreCase
                  )) {
                $matchingShells += [PSCustomObject]@{ Process = $shell; Owner = $shellOwner }
              }
            }
            $matchingSessions = @($matchingShells | ForEach-Object { [int]$_.Process.SessionId } | Sort-Object -Unique)
            if ($matchingSessions.Count -ne 1) {
              throw 'G13_INTERACTIVE_MT5_SESSION_REQUIRED: sign in to the configured MT5 desktop profile; refusing Session 0 launch'
            }
            $selectedShell = $matchingShells |
              Where-Object { [int]$_.Process.SessionId -eq [int]$matchingSessions[0] } |
              Sort-Object { [DateTime]$_.Process.CreationDate } -Descending |
              Select-Object -First 1
            $interactiveProcess = $selectedShell.Process
            $owner = $selectedShell.Owner
            Write-Host 'G13_MT5_SESSION_RESOLUTION_SOURCE=desktop_shell'
          }

          if ($null -eq $interactiveProcess -or $null -eq $owner -or
              $owner.ReturnValue -ne 0 -or
              [string]::IsNullOrWhiteSpace([string]$owner.User) -or
              $owner.User -in @('SYSTEM','LOCAL SERVICE','NETWORK SERVICE')) {
            throw 'G13_INTERACTIVE_MT5_OWNER_UNRESOLVED'
          }
          $account = "$($owner.Domain)\$($owner.User)"
          try {
            $sid = (New-Object System.Security.Principal.NTAccount($account)).Translate([System.Security.Principal.SecurityIdentifier])
          } catch {
            throw "G13_INTERACTIVE_MT5_SID_UNRESOLVED account=$account"
          }
          $interactiveUserProfile = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
            Where-Object { $_.SID -eq $sid.Value -and $_.LocalPath } |
            Select-Object -First 1
          if (!$interactiveUserProfile -or !(Test-Path -LiteralPath $interactiveUserProfile.LocalPath -PathType Container)) {
            throw "G13_INTERACTIVE_USER_PROFILE_UNAVAILABLE account=$account"
          }
          $userCommon = Join-Path $interactiveUserProfile.LocalPath 'AppData\Roaming\MetaQuotes\Terminal\Common\Files'
          New-Item -ItemType Directory -Path $userCommon -Force | Out-Null

          New-Item -ItemType Directory -Path $portableRoot -Force | Out-Null
          $grant = "*$($sid.Value):(OI)(CI)M"
          & "$env:SystemRoot\System32\icacls.exe" $portableRoot /grant $grant /C /Q
          if ($LASTEXITCODE -ne 0) {
            throw "G13_PORTABLE_RUNTIME_ACL_FAILED exit_code=$LASTEXITCODE"
          }

          # Keep only installation binaries; do not copy terminal credentials,
          # chart profiles, local history, tester state, or source logs.
          $excludeDirs = @(
            (Join-Path $env:MT5_ROOT 'Bases'),
            (Join-Path $env:MT5_ROOT 'Tester'),
            (Join-Path $env:MT5_ROOT 'Logs'),
            (Join-Path $env:MT5_ROOT 'Config'),
            (Join-Path $env:MT5_ROOT 'MQL5\Profiles')
          )
          $copyArgs = @($env:MT5_ROOT,$portableRoot,'/E','/COPY:DAT','/DCOPY:DAT','/R:1','/W:1','/XD') + $excludeDirs
          & "$env:SystemRoot\System32\robocopy.exe" @copyArgs
          $robocopyExit = $LASTEXITCODE
          if ($robocopyExit -ge 8) {
            throw "G13_PORTABLE_INSTALL_COPY_FAILED robocopy_exit=$robocopyExit"
          }
          $portableTerminal = Join-Path $portableRoot 'terminal64.exe'
          if (!(Test-Path -LiteralPath $portableTerminal -PathType Leaf)) {
            throw 'G13_PORTABLE_TERMINAL_COPY_MISSING'
          }

          $scripts = Join-Path $portableRoot 'MQL5\Scripts'
          $experts = Join-Path $portableRoot 'MQL5\Experts'
          $configDir = Join-Path $portableRoot 'Config'
          New-Item -ItemType Directory -Path $scripts,$experts,$configDir -Force | Out-Null
          $harnessSource = Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\mql5\_ci_parity_harness'
          $harnessMql = Join-Path $harnessSource 'ForexAI_G13_Parity_Harness.mq5'
          $harnessEx5 = Join-Path $harnessSource 'ForexAI_G13_Parity_Harness.ex5'
          if (!(Test-Path -LiteralPath $harnessMql -PathType Leaf) -or
              !(Test-Path -LiteralPath $harnessEx5 -PathType Leaf)) {
            throw 'G13_PORTABLE_HARNESS_BUILD_MISSING'
          }
          Copy-Item -LiteralPath $harnessMql -Destination $scripts -Force
          Copy-Item -LiteralPath $harnessEx5 -Destination $scripts -Force

          $candidateFiles = @(Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\mql5') -Filter 'ForexAI_G13_Candidate_*.mq5' -File | Sort-Object Name)
          if ($candidateFiles.Count -ne [int]$env:G13_CANDIDATE_COUNT) {
            throw "G13_PORTABLE_CANDIDATE_COUNT_MISMATCH expected=$env:G13_CANDIDATE_COUNT actual=$($candidateFiles.Count)"
          }
          foreach ($candidate in $candidateFiles) {
            $candidateEx5 = [System.IO.Path]::ChangeExtension($candidate.FullName, '.ex5')
            if (!(Test-Path -LiteralPath $candidateEx5 -PathType Leaf)) {
              throw "G13_PORTABLE_CANDIDATE_BINARY_MISSING=$($candidate.Name)"
            }
            Copy-Item -LiteralPath $candidate.FullName -Destination $experts -Force
            Copy-Item -LiteralPath $candidateEx5 -Destination $experts -Force
            $expectedHash = (Get-FileHash -LiteralPath $candidateEx5 -Algorithm SHA256).Hash
            $copiedBinary = Join-Path $experts ([System.IO.Path]::GetFileName($candidateEx5))
            if ((Get-FileHash -LiteralPath $copiedBinary -Algorithm SHA256).Hash -ne $expectedHash) {
              throw "G13_PORTABLE_CANDIDATE_COPY_HASH_MISMATCH=$($candidate.Name)"
            }
          }

          $portableConfig = Join-Path $configDir 'g13_parity_harness.ini'
          @"
          [Experts]
          AllowLiveTrading=0
          AllowDllImport=0
          Enabled=1

          [StartUp]
          Symbol=EURUSD
          Period=M15
          Script=ForexAI_G13_Parity_Harness.ex5
          ShutdownTerminal=1
          "@ | Set-Content -LiteralPath $portableConfig -Encoding ascii

          $mcpHelper = Join-Path $env:GITHUB_WORKSPACE 'tools\disable_mt5_internal_mcp_v1.py'
          if (!(Test-Path -LiteralPath $mcpHelper -PathType Leaf)) {
            throw 'MT5_INTERNAL_MCP_ISOLATION_HELPER_MISSING'
          }
          & $env:PYTHON_EXE $mcpHelper --portable-root $portableRoot
          if ($LASTEXITCODE -ne 0) {
            throw 'MT5_INTERNAL_MCP_PORTABLE_ISOLATION_FAILED'
          }
          Write-Host 'MT5_INTERNAL_MCP_ISOLATION_VERIFIED=true'
          Write-Host 'MT5_EXTERNAL_BARE_TERMINAL_PRESERVED=true'
          Write-Host "G13_INTERACTIVE_ACCOUNT=$account"
          Write-Host "G13_INTERACTIVE_SESSION=$($interactiveProcess.SessionId)"
          Write-Host "G13_PORTABLE_RUNTIME=$portableRoot"

          $serviceCommon = Join-Path $env:APPDATA 'MetaQuotes\Terminal\Common\Files'
          $inputSource = Join-Path $serviceCommon $env:PARITY_INPUT_FILE
          if (!(Test-Path -LiteralPath $inputSource -PathType Leaf)) {
            throw "G13_REAL_DATA_INPUT_MISSING=$inputSource"
          }
          Copy-Item -LiteralPath $inputSource -Destination $userCommon -Force
          $parityUser = Join-Path $userCommon $env:PARITY_OUTPUT_FILE
          $doneUser = Join-Path $userCommon $env:PARITY_DONE_FILE
          $startedUser = Join-Path $userCommon $env:PARITY_STARTED_FILE
          $statusUser = Join-Path $userCommon "g13_mt5_launcher_$($env:GITHUB_RUN_ID).status.txt"
          Remove-Item -LiteralPath $parityUser,$doneUser,$startedUser,$statusUser -Force -ErrorAction SilentlyContinue

          $taskName = "ForexAI-G13-Parity-$($env:GITHUB_RUN_ID)"
          $launcherSource = Join-Path $env:GITHUB_WORKSPACE 'tools\run_g13_mt5_parity_interactive_v1.ps1'
          if (!(Test-Path -LiteralPath $launcherSource -PathType Leaf)) {
            throw 'G13_INTERACTIVE_LAUNCHER_MISSING'
          }
          $launcher = Join-Path $portableRoot 'run_g13_mt5_parity_interactive_v1.ps1'
          Copy-Item -LiteralPath $launcherSource -Destination $launcher -Force
          "G13_PORTABLE_MT5_ROOT=$portableRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "G13_PARITY_TASK_NAME=$taskName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "G13_PARITY_USER_COMMON_FILES=$userCommon" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "G13_PARITY_INTERACTIVE_ACCOUNT=$account" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $powershellExe = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
          $taskArguments = '-NoLogo -NoProfile -ExecutionPolicy Bypass -File "' + $launcher + '" -TerminalRoot "' + $portableRoot + '" -ConfigPath "' + $portableConfig + '" -RunId "' + $env:GITHUB_RUN_ID + '"'
          $action = New-ScheduledTaskAction -Execute $powershellExe -Argument $taskArguments
          $principal = New-ScheduledTaskPrincipal -UserId $account -LogonType Interactive -RunLevel Limited
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 15) -MultipleInstances IgnoreNew
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            Start-ScheduledTask -TaskName $taskName
            Write-Host "G13_INTERACTIVE_TASK_STARTED=$taskName"

            $startupDeadline = (Get-Date).AddSeconds(180)
            while ((Get-Date) -lt $startupDeadline -and !(Test-Path -LiteralPath $startedUser -PathType Leaf)) {
              if ((Test-Path -LiteralPath $statusUser -PathType Leaf) -and (Select-String -LiteralPath $statusUser -Pattern '^state,failed$' -Quiet)) {
                $why = Get-Content -LiteralPath $statusUser -Raw
                throw "G13_INTERACTIVE_MT5_LAUNCH_FAILED $why"
              }
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path -LiteralPath $startedUser -PathType Leaf)) {
              throw 'G13_INTERACTIVE_MT5_SCRIPT_START_TIMEOUT'
            }
            Write-Host 'MQL5_PARITY_SCRIPT_STARTED_IN_INTERACTIVE_SESSION=true'
            Get-Content -LiteralPath $startedUser -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.Trim()) { Write-Host "MQL5_PARITY_STARTED_MARKER=$($_.Trim())" }
            }

            $completionDeadline = (Get-Date).AddSeconds(600)
            while ((Get-Date) -lt $completionDeadline -and !(Test-Path -LiteralPath $doneUser -PathType Leaf)) {
              if ((Test-Path -LiteralPath $statusUser -PathType Leaf) -and (Select-String -LiteralPath $statusUser -Pattern '^state,failed$' -Quiet)) {
                $why = Get-Content -LiteralPath $statusUser -Raw
                throw "G13_INTERACTIVE_MT5_RUN_FAILED $why"
              }
              Start-Sleep -Seconds 2
            }
            if (!(Test-Path -LiteralPath $doneUser -PathType Leaf)) {
              throw 'G13_INTERACTIVE_MT5_COMPLETION_TIMEOUT'
            }
            $statusReadyDeadline = (Get-Date).AddSeconds(20)
            $statusText = ''
            $statusSuccess = $false
            while ((Get-Date) -lt $statusReadyDeadline) {
              if (Test-Path -LiteralPath $statusUser -PathType Leaf) {
                $statusText = Get-Content -LiteralPath $statusUser -Raw
                if (Select-String -LiteralPath $statusUser -Pattern '^state,success$' -Quiet) {
                  $statusSuccess = $true
                  break
                }
                if (Select-String -LiteralPath $statusUser -Pattern '^state,failed$' -Quiet) {
                  throw "G13_INTERACTIVE_MT5_LAUNCHER_FAILED $statusText"
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $statusSuccess) {
              throw "G13_INTERACTIVE_MT5_LAUNCHER_NOT_SUCCESSFUL $statusText"
            }
            Write-Host "G13_INTERACTIVE_MT5_STATUS=$($statusText.Trim() -replace '\r?\n',';')"
          }
          finally {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

          Copy-Item -LiteralPath $parityUser -Destination (Join-Path $serviceCommon $env:PARITY_OUTPUT_FILE) -Force
          Copy-Item -LiteralPath $doneUser -Destination (Join-Path $serviceCommon $env:PARITY_DONE_FILE) -Force
          Copy-Item -LiteralPath $startedUser -Destination (Join-Path $serviceCommon $env:PARITY_STARTED_FILE) -Force
          if (Test-Path -LiteralPath $statusUser -PathType Leaf) {
            Copy-Item -LiteralPath $statusUser -Destination $serviceCommon -Force
          }
          $parity = Join-Path $serviceCommon $env:PARITY_OUTPUT_FILE
          $done = Join-Path $serviceCommon $env:PARITY_DONE_FILE
          $started = Join-Path $serviceCommon $env:PARITY_STARTED_FILE
          if (!(Test-Path -LiteralPath $parity -PathType Leaf)) {
            throw "MQL5 parity output was not generated: $parity"
          }
          if (!(Test-Path -LiteralPath $done -PathType Leaf)) {
            throw "MQL5 parity completion marker was not generated: $done"
          }
          if (!(Select-String -LiteralPath $done -Pattern '^status,PASS$' -Quiet)) {
            throw 'MQL5 parity harness did not report PASS'
          }
          if (!(Select-String -LiteralPath $done -Pattern '^real_data_only,true$' -Quiet)) {
            throw 'MQL5 parity harness did not confirm real_data_only=true'
          }
          if (!(Select-String -LiteralPath $done -Pattern '^synthetic_data,false$' -Quiet)) {
            throw 'MQL5 parity harness did not confirm synthetic_data=false'
          }
          if (!(Select-String -LiteralPath $done -Pattern "^candidate_count,$env:G13_CANDIDATE_COUNT$" -Quiet)) {
            throw "MQL5 parity harness did not process exactly $env:G13_CANDIDATE_COUNT candidates"
          }

          $stageDir = Join-Path $env:GITHUB_WORKSPACE 'artifacts\g13\ci_inputs'
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item $parity (Join-Path $stageDir 'g13_mql5_parity.csv') -Force
          Copy-Item $done (Join-Path $stageDir 'g13_mql5_parity.done.txt') -Force
          "PARITY_CSV_RESOLVED=$(Join-Path $stageDir 'g13_mql5_parity.csv')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Copy-Item $env:DATA_MANIFEST_RESOLVED (Join-Path $stageDir 'g13_real_eurusd_m15.manifest.json') -Force
          "DATA_MANIFEST_CI=$(Join-Path $stageDir 'g13_real_eurusd_m15.manifest.json')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host 'MQL5_REAL_DATA_PARITY_OK'

      - name: Collect MT5 parity diagnostics
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\diagnostics'
          New-Item -ItemType Directory -Path $diag -Force | Out-Null

          $serviceData = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\D0E8209F77C8CF37AD8BF550E51FF075'
          $commonFiles = Join-Path $env:APPDATA 'MetaQuotes\\Terminal\\Common\\Files'
          $interactiveCommonFiles = $env:G13_PARITY_USER_COMMON_FILES
          $terminal = Join-Path $env:MT5_ROOT 'terminal64.exe'
          $portableRoot = $env:G13_PORTABLE_MT5_ROOT
          $config = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\mql5\\g13_parity_harness.ini'

          if (Test-Path $terminal) {
            (Get-Item $terminal).VersionInfo | Out-File (Join-Path $diag 'terminal_version.txt') -Encoding utf8
          }
          if ($portableRoot -and (Test-Path -LiteralPath $portableRoot -PathType Container)) {
            @(
              "G13_PORTABLE_MT5_ROOT=$portableRoot"
              "G13_PORTABLE_MT5_TERMINAL=$(Join-Path $portableRoot 'terminal64.exe')"
              "G13_PORTABLE_MT5_MODE=true"
              "MT5_SHARED_USER_TERMINAL_LEFT_RUNNING=true"
            ) | Out-File (Join-Path $diag 'portable_runtime.txt') -Encoding utf8
            $portableTerminal = Join-Path $portableRoot 'terminal64.exe'
            if (Test-Path -LiteralPath $portableTerminal) {
              (Get-Item $portableTerminal).VersionInfo | Out-File (Join-Path $diag 'portable_terminal_version.txt') -Encoding utf8
            }
          }
          Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" |
            Select-Object ProcessId,ExecutablePath,CommandLine,CreationDate |
            Format-List * |
            Out-File (Join-Path $diag 'terminal_processes.txt') -Encoding utf8
          if (Test-Path $config) { Copy-Item $config (Join-Path $diag 'g13_parity_harness.ini') -Force }

          $logSources = @()
          if ($portableRoot) {
            $logSources += @(
              @{ Name = 'portable_terminal_logs'; Path = (Join-Path $portableRoot 'logs') },
              @{ Name = 'portable_mql5_logs'; Path = (Join-Path $portableRoot 'MQL5\\Logs') }
            )
          }
          $logSources += @(
            @{ Name = 'service_terminal_logs'; Path = (Join-Path $serviceData 'logs') },
            @{ Name = 'service_mql5_logs'; Path = (Join-Path $serviceData 'MQL5\\Logs') }
          )
          if ($interactiveCommonFiles -and (Test-Path -LiteralPath $interactiveCommonFiles -PathType Container)) {
            Get-ChildItem -LiteralPath $interactiveCommonFiles -File |
              Where-Object { $_.Name -like 'g13_mql5_parity*' -or $_.Name -like 'g13_mt5_launcher_*' } |
              Select-Object Name,Length,LastWriteTime |
              Format-Table -AutoSize |
              Out-File (Join-Path $diag 'interactive_common_files_inventory.txt') -Encoding utf8
          }
          foreach ($source in $logSources) {
            if ($source.Path -and (Test-Path -LiteralPath $source.Path -PathType Container)) {
              $out = Join-Path $diag $source.Name
              New-Item -ItemType Directory -Path $out -Force | Out-Null
              Get-ChildItem -LiteralPath $source.Path -File |
                Sort-Object LastWriteTime -Descending |
                Select-Object -First 10 |
                ForEach-Object { Copy-Item $_.FullName (Join-Path $out $_.Name) -Force }
            }
          }

          if (Test-Path $commonFiles) {
            Get-ChildItem $commonFiles -File |
              Where-Object { $_.Name -like 'g13_mql5_parity*' -or $_.Name -like 'g13_real_eurusd_m15*.csv' } |
              Select-Object Name,Length,LastWriteTime |
              Format-Table -AutoSize |
              Out-File (Join-Path $diag 'common_files_inventory.txt') -Encoding utf8
          }
          Write-Host "MT5_DIAGNOSTICS_COLLECTED=$diag"


      - name: Verify generated parity input
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Test-Path -LiteralPath $env:PARITY_CSV_RESOLVED -PathType Leaf)) {
            throw "Generated MQL5 parity CSV missing: $env:PARITY_CSV_RESOLVED"
          }
          Write-Host "PARITY_INPUT_OK"
          
      - name: Run fail-closed Python vs MQL5 signal parity
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m research.optimization.g13_mql5_parity `
            --data "$env:DATA_CSV_RESOLVED" `
            --data-manifest "$env:DATA_MANIFEST_RESOLVED" `
            --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json `
            --manifest "$env:PROMOTION_MANIFEST" `
            --mt5 "$env:PARITY_CSV_RESOLVED" `
            --output artifacts/g13-mql5-signal-parity.json

      - name: Build immutable Demo package manifest
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m research.optimization.g13_demo_package_manifest_builder_m15 `
            --promotion "$env:PROMOTION_MANIFEST" `
            --parity artifacts/g13-mql5-signal-parity.json `
            --package-root artifacts/g13/mql5 `
            --output artifacts/g13/g13-demo-package-manifest-m15.json `
            --source-commit "$env:TARGET_SHA" `
            --compile-parity-run-id ([int64]$env:GITHUB_RUN_ID)
      - name: Print MT5 parity diagnostics
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13\\diagnostics'
          if (Test-Path $diag) {
            Write-Host "MT5_DIAGNOSTICS_DIR=$diag"
            Get-ChildItem $diag -Recurse -File |
              Sort-Object FullName |
              Select-Object FullName,Length,LastWriteTime |
              Format-Table -AutoSize |
              Out-String |
              Write-Host
            foreach ($file in @(Get-ChildItem $diag -Recurse -File | Where-Object { $_.Extension -in @('.txt','.log') } | Sort-Object LastWriteTime -Descending | Select-Object -First 5)) {
              Write-Host "===== MT5_DIAGNOSTIC_FILE=$($file.FullName) ====="
              Get-Content -LiteralPath $file.FullName -ErrorAction Continue |
                Select-Object -Last 80 |
                ForEach-Object { if ($_.Trim()) { Write-Host $_ } }
            }
          } else {
            Write-Host 'MT5_DIAGNOSTICS_DIR_MISSING'
          }

          $parityJson = Join-Path $env:GITHUB_WORKSPACE 'artifacts\\g13-mql5-signal-parity.json'
          if (Test-Path $parityJson) {
            Write-Host "===== G13_SIGNAL_PARITY_JSON ====="
            Get-Content -LiteralPath $parityJson -Raw | Write-Host
          }

      - name: Upload MT5 parity diagnostics
        id: upload-mt5-parity-diagnostics
        if: always()
        # Diagnostic logs are supplementary. Transient GitHub artifact API
        # resets must not invalidate successful signal parity when the required
        # compile + parity evidence artifact uploads separately.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: g13-mt5-parity-diagnostics-${{ github.run_id }}
          path: artifacts/g13/diagnostics/**
          if-no-files-found: warn

      - name: Warn if supplementary diagnostics upload failed
        if: steps.upload-mt5-parity-diagnostics.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "G13_DIAGNOSTICS_ARTIFACT_UPLOAD_FAILED_NON_BLOCKING; verify the mandatory compile+parity evidence artifact separately."

      - name: Upload compile + parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-mt5-compile-parity-${{ github.run_id }}
          path: |
            artifacts/g13/mql5/*.mq5
            artifacts/g13/mql5/*.ex5
            artifacts/g13/mql5/g13_parity_harness.ini
            artifacts/g13/g13-demo-package-manifest-m15.json
            artifacts/g13-mql5-signal-parity.json
            artifacts/g13/ci_inputs/*
          if-no-files-found: warn

      - name: Cleanup isolated MT5 portable runtime
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $taskName = $env:G13_PARITY_TASK_NAME
          if ($taskName) {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
            Write-Host "MT5_PARITY_TASK_REMOVED=$taskName"
          }
          $portableRoot = $env:G13_PORTABLE_MT5_ROOT
          if (-not $portableRoot) {
            Write-Host 'MT5_PORTABLE_CLEANUP_SKIPPED=no_runtime_root'
            exit 0
          }
          try {
            $tempRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
            $portableFull = [System.IO.Path]::GetFullPath($portableRoot)
            $leaf = Split-Path -Leaf $portableFull
            if (-not $portableFull.StartsWith($tempRoot, [System.StringComparison]::OrdinalIgnoreCase)) {
              Write-Host 'MT5_PORTABLE_CLEANUP_SKIPPED=root_outside_runner_temp'
              exit 0
            }
            $portablePrefix = 'g13-mt5-parity-portable-'
            $portableRunId = 0L
            if (-not $leaf.StartsWith($portablePrefix, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not [Int64]::TryParse($leaf.Substring($portablePrefix.Length), [ref]$portableRunId)) {
              Write-Host 'MT5_PORTABLE_CLEANUP_SKIPPED=unexpected_directory_name'
              exit 0
            }

            # Kill only a terminal binary within this exact run-scoped clone.
            $cloneTerminal = Join-Path $portableFull 'terminal64.exe'
            if (Test-Path -LiteralPath $cloneTerminal -PathType Leaf) {
              $cloneExe = [System.IO.Path]::GetFullPath($cloneTerminal)
              $cloneProcesses = @(Get-CimInstance Win32_Process -Filter "Name='terminal64.exe'" -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.ExecutablePath -and [System.IO.Path]::GetFullPath($_.ExecutablePath).Equals(
                    $cloneExe, [System.StringComparison]::OrdinalIgnoreCase
                  )
                })
              foreach ($process in $cloneProcesses) {
                Stop-Process -Id ([int]$process.ProcessId) -Force -ErrorAction SilentlyContinue
              }
              if ($cloneProcesses.Count -gt 0) { Start-Sleep -Seconds 2 }
            }

            if (Test-Path -LiteralPath $portableFull) {
              Remove-Item -LiteralPath $portableFull -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path -LiteralPath $portableFull) {
              Write-Host 'MT5_PORTABLE_CLEANUP_RESULT=directory_remains'
            } else {
              Write-Host 'MT5_PORTABLE_CLEANUP_RESULT=removed'
            }
          } catch {
            Write-Host "MT5_PORTABLE_CLEANUP_ERROR=$($_.Exception.GetType().Name)"
          }

