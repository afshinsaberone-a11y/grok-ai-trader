name: ForexAI G13 Preflight Dispatcher M15

# Separate orchestration workflow.
# Waits for the COMPLETE Compile + Signal Parity workflow to succeed, then
# dispatches the existing read-only Controlled Demo Package Preflight with
# the exact successful Compile/Parity run ID.
on:
  workflow_run:
    workflows:
      - "ForexAI G13 MT5 Compile + Signal Parity"
    types: [completed]
    branches:
      - main

permissions:
  contents: read
  actions: write

concurrency:
  group: g13-preflight-dispatcher-m15
  cancel-in-progress: true

jobs:
  dispatch-preflight:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.name == 'ForexAI G13 MT5 Compile + Signal Parity' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact successful Compile/Parity run
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_PARITY_RUN_ID: ${{ github.event.workflow_run.id }}
          COMPILE_PARITY_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID")"
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity", p["name"]; assert p["head_branch"]=="main", p["head_branch"]; assert p["conclusion"]=="success", (p["id"],p["conclusion"]); assert p["head_sha"]==sys.argv[1], (p["id"],p["head_sha"],sys.argv[1]); print("COMPILE_PARITY_RUN_VERIFIED",p["id"],p["head_sha"])' "$COMPILE_PARITY_SHA" <<< "$json"

      - name: Dispatch exact Controlled Demo Package Preflight
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_PARITY_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"compile_parity_run_id":sys.argv[1]}}))' "$COMPILE_PARITY_RUN_ID")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_PREFLIGHT_DISPATCH_FAILED_HTTP=$status"
            exit 1
          }
          echo "G13_PREFLIGHT_DISPATCHED=true COMPILE_PARITY_RUN_ID=$COMPILE_PARITY_RUN_ID"
