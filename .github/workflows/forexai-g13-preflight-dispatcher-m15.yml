name: ForexAI G13 Preflight Dispatcher M15

# Manual recovery path only. The primary G13 Watchdog dispatches Preflight directly
# with the exact Compile/Parity run ID and correlates the newly dispatched run.
# This workflow remains available for operator-triggered recovery.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: g13-preflight-dispatcher-m15-${{ github.sha }}
  cancel-in-progress: true

jobs:
  dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Resolve COMPLETE successful Compile/Parity run
        shell: bash
        run: |
          set -euo pipefail

          # Authoritative path: workflow_run.completed carries the exact Compile/Parity
          # run that just finished. Bind directly to that immutable run ID and SHA.
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_run" ]]; then
            compile_run_id="$(python -c 'import json; print(json.load(open(__import__("os").environ["GITHUB_EVENT_PATH"]))["workflow_run"]["id"])')"
            echo "COMPILE_PARITY_TRIGGER_RUN=$compile_run_id"
            if [[ -z "$compile_run_id" ]]; then
              echo "COMPILE_PARITY_TRIGGER_RUN_MISSING=true"
              exit 1
            fi
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$compile_run_id")"
            printf '%s' "$payload" | python -c 'import json,sys; p=json.load(sys.stdin); target=sys.argv[1]; assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity", p["name"]; assert p["head_branch"]=="main", p["head_branch"]; assert p["status"]=="completed", (p["id"],p["status"]); assert p["conclusion"]=="success", (p["id"],p["conclusion"]); assert p["head_sha"]==target, (p["id"],p["head_sha"],target); print("COMPILE_PARITY_TRIGGER_RUN_VERIFIED",p["id"],p["head_sha"])' "$TARGET_SHA"
            echo "COMPILE_PARITY_RUN_ID=$compile_run_id" >> "$GITHUB_ENV"
            echo "COMPILE_PARITY_RUN_RESOLVED=true RUN=$compile_run_id SHA=$TARGET_SHA SOURCE=workflow_run"
            exit 0
          fi

          # Recovery path: a main push may race with Compile/Parity. Poll for the
          # exact successful run for this SHA, then dispatch Preflight.
          for attempt in $(seq 1 60); do
            payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-mt5-compile-parity.yml/runs?branch=main&per_page=50")"
            state="$(printf '%s' "$payload" | python -c 'import json,sys; target=sys.argv[1]; rs=json.load(sys.stdin).get("workflow_runs",[]); rs=[r for r in rs if r.get("head_branch")=="main" and r.get("head_sha")==target and r.get("name")=="ForexAI G13 MT5 Compile + Signal Parity"]; success=[r for r in rs if r.get("conclusion")=="success" and r.get("status")=="completed"]; pending=[r for r in rs if r.get("status") in {"queued","in_progress","waiting","requested","pending"}]; failed=[r for r in rs if r.get("status")=="completed" and r.get("conclusion") in {"failure","cancelled","timed_out","action_required","startup_failure"}]; print(("SUCCESS|"+str(max(success,key=lambda x:x["id"])["id"])) if success else ("PENDING|" if pending else ("FAILED|"+str(max(failed,key=lambda x:x["id"])["id"]) if failed else "NOT_STARTED|")))' "$TARGET_SHA")"
            case "$state" in
              SUCCESS\|*)
                compile_run_id="${state#SUCCESS|}"
                echo "COMPILE_PARITY_RUN_ID=$compile_run_id" >> "$GITHUB_ENV"
                echo "COMPILE_PARITY_RUN_RESOLVED=true RUN=$compile_run_id SHA=$TARGET_SHA SOURCE=manual-recovery"
                break
                ;;
              PENDING\|*|NOT_STARTED\|*)
                echo "COMPILE_PARITY_WAIT attempt=$attempt state=$state SHA=$TARGET_SHA"
                sleep 30
                ;;
              FAILED\|*)
                echo "COMPILE_PARITY_FAILED_FOR_SHA=$TARGET_SHA RUN=${state#FAILED|}"
                exit 1
                ;;
            esac
          done

          if [[ -z "${compile_run_id:-}" ]]; then
            echo "COMPILE_PARITY_WAIT_TIMEOUT_FOR_SHA=$TARGET_SHA"
            exit 1
          fi

      - name: Verify exact successful Compile/Parity run
        if: ${{ env.COMPILE_PARITY_RUN_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID")"
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity", p["name"]; assert p["head_branch"]=="main", p["head_branch"]; assert p["conclusion"]=="success", (p["id"],p["conclusion"]); assert p["head_sha"]==sys.argv[1], (p["id"],p["head_sha"],sys.argv[1]); print("COMPILE_PARITY_RUN_VERIFIED",p["id"],p["head_sha"])' "$TARGET_SHA" <<< "$json"

      - name: Dispatch exact Controlled Demo Package Preflight
        if: ${{ env.COMPILE_PARITY_RUN_ID != '' }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"compile_parity_run_id":sys.argv[1]}}))' "$COMPILE_PARITY_RUN_ID")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_PREFLIGHT_DISPATCH_FAILED_HTTP=$status"
            exit 1
          }
          echo "G13_PREFLIGHT_DISPATCHED=true COMPILE_PARITY_RUN_ID=$COMPILE_PARITY_RUN_ID TARGET_SHA=$TARGET_SHA"
