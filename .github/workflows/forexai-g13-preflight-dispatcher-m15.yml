name: ForexAI G13 Preflight Dispatcher M15

# Explicit orchestration workflow. The Compile/Parity workflow dispatches this
# after its compile-and-parity job succeeds. This workflow waits until the
# COMPLETE source workflow reaches success, then dispatches the read-only
# Controlled Demo Package Preflight.
on:
  workflow_dispatch:
    inputs:
      compile_parity_run_id:
        description: "Compile + Signal Parity workflow run ID"
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: g13-preflight-dispatcher-m15
  cancel-in-progress: true

jobs:
  dispatch-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for exact Compile/Parity workflow to finish successfully
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_PARITY_RUN_ID: ${{ inputs.compile_parity_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          source_json=""
          for attempt in $(seq 1 60); do
            source_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID")"
            state="$(printf '%s' "$source_json" | python -c 'import json,sys; x=json.load(sys.stdin); print(f"{x[\"status\"]}|{x.get(\"conclusion\") or \"\"}|{x[\"name\"]}|{x[\"head_branch\"]}|{x[\"head_sha\"]}")')"
            IFS='|' read -r status conclusion name branch sha <<< "$state"
            echo "PREFLIGHT_SOURCE_POLL attempt=$attempt status=$status conclusion=$conclusion sha=$sha"
            test "$name" = "ForexAI G13 MT5 Compile + Signal Parity"
            test "$branch" = "main"
            if [[ "$status" == "completed" ]]; then
              test "$conclusion" = "success" || {
                echo "G13_COMPILE_PARITY_SOURCE_NOT_SUCCESS=$conclusion"
                exit 1
              }
              echo "G13_COMPILE_PARITY_SOURCE_SUCCESS=true RUN=$COMPILE_PARITY_RUN_ID SHA=$sha"
              break
            fi
            sleep 5
          done

          final_state="$(printf '%s' "$source_json" | python -c 'import json,sys; x=json.load(sys.stdin); print(x["status"],x.get("conclusion"))')"
          echo "G13_COMPILE_PARITY_FINAL_STATE=$final_state"
          test "$final_state" = "completed success"

      - name: Dispatch exact Controlled Demo Package Preflight
        env:
          GH_TOKEN: ${{ github.token }}
          COMPILE_PARITY_RUN_ID: ${{ inputs.compile_parity_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python -c 'import json,sys; print(json.dumps({"ref":"main","inputs":{"compile_parity_run_id":sys.argv[1]}}))' "$COMPILE_PARITY_RUN_ID")"
          status="$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/forexai-g13-controlled-demo-package-preflight-m15.yml/dispatches" \
            --data "$payload")"
          test "$status" = "204" || {
            echo "G13_PREFLIGHT_DISPATCH_FAILED_HTTP=$status"
            exit 1
          }
          echo "G13_PREFLIGHT_DISPATCHED=true COMPILE_PARITY_RUN_ID=$COMPILE_PARITY_RUN_ID"
