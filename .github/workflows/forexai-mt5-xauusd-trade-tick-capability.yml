name: ForexAI MT5 XAUUSD Trade Tick Capability Audit

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Exact broker XAUUSD symbol name"
        required: true
        default: "XAUUSD"
        type: string
      days:
        description: "Historical tick lookback (1-365 days)"
        required: true
        default: "180"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/forexai-mt5-xauusd-trade-tick-capability.yml"
      - "tools/mt5_xauusd_trade_tick_capability_probe.py"
      - "tests/test_mt5_xauusd_trade_tick_capability_probe.py"

permissions:
  contents: read

concurrency:
  group: forexai-mt5-read-only-history-probe
  cancel-in-progress: false

jobs:
  capability:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PYTHONUNBUFFERED: "1"
      MT5_SYMBOL: ${{ inputs.symbol || 'XAUUSD' }}
      MT5_DAYS: ${{ inputs.days || '180' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate an installed 64-bit Python runtime
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            'C:\Users\Star\AppData\Local\Programs\Python\Python312\python.exe',
            'C:\Users\Star\AppData\Local\Programs\Python\Python311\python.exe',
            'C:\Users\Star\AppData\Local\Programs\Python\Python310\python.exe',
            'C:\Program Files\Python312\python.exe',
            'C:\Program Files\Python311\python.exe',
            'C:\Program Files\Python310\python.exe',
            'C:\Python312\python.exe',
            'C:\Python311\python.exe',
            'C:\Python310\python.exe'
          )
          if ($env:RUNNER_TOOL_CACHE) {
            $cached = Get-ChildItem -Path (Join-Path $env:RUNNER_TOOL_CACHE 'Python\*\x64\python.exe') -File -ErrorAction SilentlyContinue
            $candidates += @($cached | ForEach-Object { $_.FullName })
          }
          $selected = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate -PathType Leaf) {
              $bits = & $candidate -c "import struct; print(struct.calcsize('P') * 8)" 2>$null
              if ($LASTEXITCODE -eq 0 -and "$bits".Trim() -eq '64') {
                $selected = $candidate
                break
              }
            }
          }
          if (-not $selected) {
            throw "NO_ACCESSIBLE_64BIT_PYTHON_FOUND_FOR_MT5_RUNNER"
          }
          "MT5_PYTHON=$selected" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $selected --version
          Write-Output "MT5_PYTHON_PATH=$selected"

      - name: Install MT5 package into discovered Python
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:MT5_PYTHON -m pip install -r requirements-mt5.txt numpy
          if ($LASTEXITCODE -ne 0) { throw "MT5_PACKAGE_INSTALL_FAILED:$LASTEXITCODE" }

      - name: Run read-only historical trade-tick capability probe
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/mt5-trade-tick-capability | Out-Null
          & $env:MT5_PYTHON -m tools.mt5_xauusd_trade_tick_capability_probe --symbol "$env:MT5_SYMBOL" --days ([int]$env:MT5_DAYS) --output artifacts/mt5-trade-tick-capability/xauusd-trade-tick-capability.json
          if ($LASTEXITCODE -ne 0) { throw "MT5_TRADE_TICK_CAPABILITY_PROBE_FAILED:$LASTEXITCODE" }

          $p = "artifacts/mt5-trade-tick-capability/xauusd-trade-tick-capability.json"
          $j = Get-Content -LiteralPath $p -Raw | ConvertFrom-Json
          if ($j.no_orders_submitted -ne $true) { throw "ORDER_SUBMISSION_INVARIANT_FAILED" }
          if ($j.no_positions_modified -ne $true) { throw "POSITION_MODIFICATION_INVARIANT_FAILED" }
          if ($j.no_terminal_settings_modified -ne $true) { throw "TERMINAL_SETTINGS_INVARIANT_FAILED" }
          Write-Output "TRADE_SIDE_FLAGS_AVAILABLE=$($j.trade_side_capability.trade_side_flags_available)"
          Write-Output "TRADE_SIDE_VOLUME_AVAILABLE=$($j.trade_side_capability.trade_side_volume_available)"
          Write-Output "NO_ORDERS_SUBMITTED=true"

      - name: Upload redacted capability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forexai-mt5-xauusd-trade-tick-capability
          path: artifacts/mt5-trade-tick-capability/xauusd-trade-tick-capability.json
          if-no-files-found: warn
          retention-days: 90
