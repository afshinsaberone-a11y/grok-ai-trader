name: Dukascopy Cross-Feed Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dukascopy-cross-check.yml
      - research/real_data/histdata_ingest.py
      - research/real_data/timezone_crosscheck.py

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download EURUSD M1 from Dukascopy Node
        run: |
          set -euo pipefail
          mkdir -p artifacts/dukascopy
          rm -f download/*.csv
          npx --yes dukascopy-node -i eurusd -from 2026-07-05 -to 2026-07-06 -t m1 -f csv
          FILE=$(find download -maxdepth 1 -type f -name '*.csv' | head -n 1)
          test -n "$FILE"
          test -s "$FILE" || { echo "REAL_DATA_REQUIRED: Dukascopy returned an empty CSV: $FILE"; exit 2; }
          ROWS=$(awk 'END{print NR-1}' "$FILE")
          test "$ROWS" -gt 0 || { echo "REAL_DATA_REQUIRED: Dukascopy CSV contains no data rows: $FILE"; exit 2; }
          HEADER=$(head -n 1 "$FILE")
          test "$HEADER" = "timestamp,open,high,low,close" || { echo "REAL_DATA_REQUIRED: unexpected Dukascopy CSV header: $HEADER"; exit 2; }
          cp "$FILE" artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv
          echo "SOURCE_FILE=$FILE"
          echo "DUKASCOPY_BYTES=$(wc -c < "$FILE")"
          echo "DUKASCOPY_DATA_ROWS=$ROWS"
          echo "DUKASCOPY_HEADER=$HEADER"
          head -n 8 "$FILE"

      - name: Download canonical REAL HistData EURUSD M1 source
        run: |
          set -euo pipefail
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --timeframe M1 \
            --start 2026-07-05 \
            --end 2026-07-06 \
            --output data/real \
            --validate \
            --manifest
          echo "--- NORMALIZED HISTDATA FILES ---"
          find data/real/normalized -type f -name '*.csv' -print | sort

      - name: Diagnose explicit HistData EST to UTC alignment
        run: |
          set -euo pipefail
          python research/real_data/timezone_crosscheck.py

      - name: Build canonical and unresolved source-variant cross-feed comparison
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path

          duka_path = Path("artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv")
          normalized_dir = Path("data/real/normalized")
          out_path = Path("artifacts/dukascopy/conflict_crossfeed_comparison.csv")
          targets = [
              datetime(2026, 7, 5, 22, 31, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 32, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 34, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 35, tzinfo=timezone.utc),
          ]

          def parse_ts(value):
              s = str(value).strip()
              if s.isdigit():
                  n = int(s)
                  if n >= 100_000_000_000:
                      return datetime.fromtimestamp(n / 1000, tz=timezone.utc)
                  if n >= 100_000_000:
                      return datetime.fromtimestamp(n, tz=timezone.utc)
              for candidate in (s, s.replace("Z", "+00:00"), s.replace(" ", "T")):
                  try:
                      ts = datetime.fromisoformat(candidate)
                      return (ts if ts.tzinfo else ts.replace(tzinfo=timezone.utc)).astimezone(timezone.utc)
                  except ValueError:
                      pass
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%d %H:%M"):
                  try:
                      return datetime.strptime(s, fmt).replace(tzinfo=timezone.utc)
                  except ValueError:
                      pass
              return None

          def read_rows(path):
              found = {}
              with path.open(newline="", encoding="utf-8-sig") as f:
                  reader = csv.DictReader(f)
                  for row in reader:
                      raw = row.get("timestamp") or row.get("datetime") or row.get("timestamp_utc") or row.get("date")
                      ts = parse_ts(raw) if raw else None
                      if ts in targets:
                          found.setdefault(ts, []).append(row)
              return found

          duka = read_rows(duka_path)
          canonical = {}
          variants = {}
          sources = {}

          for path in sorted(normalized_dir.rglob("*.csv")):
              try:
                  found = read_rows(path)
              except (OSError, UnicodeDecodeError, csv.Error):
                  continue
              is_conflict = path.name.endswith("_source_conflicts.csv")
              for ts, rows in found.items():
                  target = variants if is_conflict else canonical
                  for row in rows:
                      target.setdefault(ts, []).append(row)
                      sources.setdefault((ts, "variant" if is_conflict else "canonical"), []).append(str(path))

          fields = ["timestamp_utc","record_type","variant","hist_open","hist_high","hist_low","hist_close","duka_open","duka_high","duka_low","duka_close","diff_open","diff_high","diff_low","diff_close","match_status","hist_source"]

          def num(row, *names):
              if not row:
                  return None
              lower = {str(k).strip().lower(): v for k, v in row.items()}
              for name in names:
                  value = lower.get(name.lower())
                  if value not in (None, ""):
                      try:
                          return float(value)
                      except (TypeError, ValueError):
                          return None
              return None

          def fmt(x):
              return "" if x is None else f"{x:.5f}"

          rows = []
          for ts in targets:
              ds = duka.get(ts, [])
              hs = canonical.get(ts, [])
              vs = variants.get(ts, [])
              if not ds:
                  rows.append([ts.isoformat(), "", "", "", "", "", "", "", "", "", "", "", "", "", "", "MISSING_DUKASCOPY", ""])
                  continue
              d = ds[0]
              dv = [num(d,"open","duka_open"),num(d,"high","duka_high"),num(d,"low","duka_low"),num(d,"close","duka_close")]
              records = [("canonical", i, h) for i,h in enumerate(hs,1)] + [("source_variant", i, h) for i,h in enumerate(vs,1)]
              if not records:
                  rows.append([ts.isoformat(), "", "", "", "", "", *map(fmt,dv), "", "", "", "", "MISSING_HISTDATA", ""])
              for record_type, idx, h in records:
                  hv = [num(h,"open","hist_open"),num(h,"high","hist_high"),num(h,"low","hist_low"),num(h,"close","hist_close")]
                  diffs = [None if a is None or b is None else a-b for a,b in zip(hv,dv)]
                  status = "INCOMPLETE" if any(x is None for x in diffs) else ("MATCH" if all(abs(x) < 1e-12 for x in diffs) else "DIFFERENT")
                  source_list = sources.get((ts, "variant" if record_type == "source_variant" else "canonical"), ["NOT_FOUND"])
                  source = source_list[min(idx-1, len(source_list)-1)]
                  rows.append([ts.isoformat(), record_type, idx, *map(fmt,hv), *map(fmt,dv), *map(fmt,diffs), status, source])

          with out_path.open("w",newline="",encoding="utf-8") as out:
              w=csv.writer(out); w.writerow(fields); w.writerows(rows)

          canonical_ts = len(canonical)
          variant_ts = len(variants)
          canonical_rows = sum(len(v) for v in canonical.values())
          variant_rows = sum(len(v) for v in variants.values())
          duka_ts = len(duka)
          print("HISTDATA_CANONICAL_MATCHED_TIMESTAMPS=", canonical_ts)
          print("HISTDATA_CANONICAL_ROWS=", canonical_rows)
          print("HISTDATA_SOURCE_CONFLICT_TIMESTAMPS=", variant_ts)
          print("HISTDATA_SOURCE_CONFLICT_ROWS=", variant_rows)
          print("DUKASCOPY_MATCHED_TIMESTAMPS=", duka_ts)
          print("COMPARISON_FILE=", out_path)
          for row in rows: print("CROSSFEED_ROW=", row)

          if duka_ts != 4:
              raise SystemExit(f"Expected 4 Dukascopy timestamps, got {duka_ts}")
          if canonical_ts != 4:
              raise SystemExit(f"Expected 4 canonical HistData timestamps, got {canonical_ts}")
          if variant_ts not in (0, 4):
              raise SystemExit(f"Expected either 0 or 4 unresolved conflict timestamps, got {variant_ts}")
          PY

      - name: Upload cross-feed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-node-cross-check-2026-07-05
          path: |
            artifacts/dukascopy/
            data/real/normalized/
          if-no-files-found: error
