name: Dukascopy Cross-Feed Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dukascopy-cross-check.yml

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download EURUSD M1 from Dukascopy Node
        run: |
          set -euo pipefail
          mkdir -p artifacts/dukascopy
          rm -f download/*.csv
          npx --yes dukascopy-node -i eurusd -from 2026-07-05 -to 2026-07-06 -t m1 -f csv
          FILE=$(find download -maxdepth 1 -type f -name '*.csv' | head -n 1)
          test -n "$FILE"
          cp "$FILE" artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv
          echo "SOURCE_FILE=$FILE"
          head -n 8 "$FILE"

      - name: Build four-row cross-feed comparison
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path

          duka_path = Path("artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv")
          out_path = Path("artifacts/dukascopy/conflict_crossfeed_comparison.csv")
          targets = [
              datetime(2026, 7, 5, 22, 31, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 32, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 34, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 35, tzinfo=timezone.utc),
          ]

          def parse_ts(value):
              s = str(value).strip()
              if s.isdigit():
                  n = int(s)
                  if n >= 100_000_000_000:
                      return datetime.fromtimestamp(n / 1000, tz=timezone.utc)
                  if n >= 100_000_000:
                      return datetime.fromtimestamp(n, tz=timezone.utc)
              for candidate in (s, s.replace("Z", "+00:00"), s.replace(" ", "T")):
                  try:
                      ts = datetime.fromisoformat(candidate)
                      return (ts if ts.tzinfo else ts.replace(tzinfo=timezone.utc)).astimezone(timezone.utc)
                  except ValueError:
                      pass
              return None

          with duka_path.open(newline="", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              duka = {}
              for r in reader:
                  ts = parse_ts(r.get("timestamp", ""))
                  if ts in targets:
                      duka[ts] = r

          # Discover HistData anywhere in the checked-out repository. Values are
          # never fabricated; only rows actually present in a CSV are accepted.
          excluded_parts = {".git", "download", "artifacts"}
          hist_candidates = [
              p for p in Path(".").rglob("*.csv")
              if not any(part in excluded_parts for part in p.parts)
          ]

          hist = {}
          hist_sources = {}
          scanned = 0
          for hp in sorted(hist_candidates):
              try:
                  with hp.open(newline="", encoding="utf-8-sig") as f:
                      reader = csv.DictReader(f)
                      fieldnames = reader.fieldnames or []
                      lowered_names = {str(h).strip().lower(): h for h in fieldnames}
                      ts_key = next((lowered_names[k] for k in ("timestamp_utc", "timestamp", "datetime", "date_time") if k in lowered_names), None)
                      if not ts_key:
                          continue
                      scanned += 1
                      for row in reader:
                          raw = row.get(ts_key)
                          ts = parse_ts(raw) if raw else None
                          if ts not in targets:
                              continue
                          lower = {str(k).strip().lower(): v for k, v in row.items()}
                          if lower.get("open") not in (None, "") or lower.get("hist_open") not in (None, ""):
                              hist[ts] = row
                              hist_sources[ts] = str(hp)
              except (OSError, UnicodeDecodeError, csv.Error):
                  continue

          fields = ["timestamp_utc","hist_open","hist_high","hist_low","hist_close","duka_open","duka_high","duka_low","duka_close","diff_open","diff_high","diff_low","diff_close","match_status","hist_source"]

          def num(row, *names):
              if not row:
                  return None
              lower = {str(k).strip().lower(): v for k, v in row.items()}
              for name in names:
                  value = lower.get(name.lower())
                  if value not in (None, ""):
                      try:
                          return float(value)
                      except (TypeError, ValueError):
                          return None
              return None

          def fmt(x):
              return "" if x is None else f"{x:.5f}"

          rows = []
          for ts in targets:
              h, d = hist.get(ts), duka.get(ts)
              hv = [num(h,"open","hist_open"),num(h,"high","hist_high"),num(h,"low","hist_low"),num(h,"close","hist_close")]
              dv = [num(d,"open"),num(d,"high"),num(d,"low"),num(d,"close")]
              diffs = [None if a is None or b is None else a-b for a,b in zip(hv,dv)]
              if h is None:
                  status = "MISSING_HISTDATA"
              elif d is None:
                  status = "MISSING_DUKASCOPY"
              elif any(x is None for x in diffs):
                  status = "INCOMPLETE"
              else:
                  status = "MATCH" if all(abs(x) < 1e-12 for x in diffs) else "DIFFERENT"
              rows.append([ts.isoformat(),*map(fmt,hv),*map(fmt,dv),*map(fmt,diffs),status,hist_sources.get(ts,"NOT_FOUND")])

          with out_path.open("w", newline="", encoding="utf-8") as out:
              w = csv.writer(out)
              w.writerow(fields)
              w.writerows(rows)

          print("HISTDATA_CSV_CANDIDATES=", len(hist_candidates))
          print("HISTDATA_TIMESTAMP_FILES_SCANNED=", scanned)
          print("HISTDATA_MATCHED_ROWS=", len(hist))
          print("HISTDATA_SOURCE_BY_TIMESTAMP=", hist_sources)
          print("DUKASCOPY_MATCHED_ROWS=", len(duka))
          print("COMPARISON_FILE=", out_path)
          for row in rows:
              print("CROSSFEED_ROW=", row)

          if len(duka) != 4:
              raise SystemExit(f"Expected 4 Dukascopy rows, got {len(duka)}")
          PY

      - name: Upload cross-feed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-node-cross-check-2026-07-05
          path: artifacts/dukascopy/
          if-no-files-found: error
