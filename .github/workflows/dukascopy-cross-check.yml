name: Dukascopy Cross-Feed Check

on:
  workflow_dispatch:

jobs:
  cross-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Query Dukascopy historical BID M1
        run: |
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          start = int(datetime(
              2026, 7, 5, 22, 20,
              tzinfo=timezone.utc
          ).timestamp() * 1000)

          end = int(datetime(
              2026, 7, 5, 22, 45,
              tzinfo=timezone.utc
          ).timestamp() * 1000)

          params = {
              "path": "api/historicalPrices",
              "instrument": "1",
              "timeFrame": "1min",
              "count": "100",
              "start": str(start),
              "end": str(end),
              "dayStartTime": "UTC",
              "offerSide": "B",
          }

          url = (
              "https://freeserv.dukascopy.com/2.0/?"
              + urllib.parse.urlencode(params)
          )

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "ForexAI/0.1"}
          )

          with urllib.request.urlopen(req, timeout=60) as r:
              data = json.loads(r.read().decode("utf-8"))

          print(json.dumps(data, indent=2)[:10000])
          PY
