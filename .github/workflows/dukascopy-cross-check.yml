name: Dukascopy Cross-Feed Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dukascopy-cross-check.yml

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download EURUSD M1 from Dukascopy Node
        run: |
          set -euo pipefail
          mkdir -p artifacts/dukascopy
          rm -f download/*.csv
          npx --yes dukascopy-node -i eurusd -from 2026-07-05 -to 2026-07-06 -t m1 -f csv
          FILE=$(find download -maxdepth 1 -type f -name '*.csv' | head -n 1)
          test -n "$FILE"
          cp "$FILE" artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv
          echo "SOURCE_FILE=$FILE"
          echo "--- RAW CSV FIRST 8 LINES ---"
          head -n 8 "$FILE"

      - name: Extract four known conflict timestamps
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("artifacts/dukascopy/eurusd-m1-bid-2026-07-05-2026-07-06.csv")
          targets = {
              datetime(2026, 7, 5, 22, 31, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 32, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 34, tzinfo=timezone.utc),
              datetime(2026, 7, 5, 22, 35, tzinfo=timezone.utc),
          }

          def parse_ts(value: str) -> datetime | None:
              s = value.strip()
              # Dukascopy Node emits epoch milliseconds in the CSV timestamp column.
              if s.isdigit():
                  n = int(s)
                  if n >= 100_000_000_000:  # epoch milliseconds
                      return datetime.fromtimestamp(n / 1000, tz=timezone.utc)
                  if n >= 100_000_000:      # epoch seconds, defensive support
                      return datetime.fromtimestamp(n, tz=timezone.utc)
              for candidate in (s, s.replace("Z", "+00:00"), s.replace(" ", "T")):
                  try:
                      ts = datetime.fromisoformat(candidate)
                      if ts.tzinfo is None:
                          ts = ts.replace(tzinfo=timezone.utc)
                      return ts.astimezone(timezone.utc)
                  except ValueError:
                      pass
              for fmt in (
                  "%Y-%m-%d %H:%M:%S",
                  "%Y-%m-%d %H:%M",
                  "%Y/%m/%d %H:%M:%S",
                  "%Y/%m/%d %H:%M",
              ):
                  try:
                      return datetime.strptime(s, fmt).replace(tzinfo=timezone.utc)
                  except ValueError:
                      pass
              return None

          with path.open(newline="", encoding="utf-8-sig") as f:
              rows = list(csv.reader(f))

          print("CSV_HEADER=", rows[0] if rows else [])
          print("RAW_TIMESTAMP_SAMPLES=")
          for row in rows[1:7]:
              if row:
                  print("  ", repr(row[0]), "=>", parse_ts(row[0]))

          matches = []
          for row in rows[1:]:
              if not row:
                  continue
              ts = parse_ts(row[0])
              if ts in targets:
                  matches.append(row)

          print("MATCHED_ROWS=", len(matches))
          for row in matches:
              print("DUKASCOPY_ROW=", row)

          with open("artifacts/dukascopy/conflict_crosscheck.csv", "w", newline="", encoding="utf-8") as out:
              w = csv.writer(out)
              w.writerow(["timestamp_utc", "open", "high", "low", "close", "volume"])
              for row in matches:
                  w.writerow(row[:6])

          if len(matches) == 0:
              raise SystemExit("No known conflict timestamps returned by Dukascopy Node after epoch-ms parsing")
          PY

      - name: Upload cross-check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dukascopy-node-cross-check-2026-07-05
          path: artifacts/dukascopy/
          if-no-files-found: error
