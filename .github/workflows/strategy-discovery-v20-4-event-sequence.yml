name: ForexAI v20.4 Event Sequence Discovery

on:
  workflow_dispatch:

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      START: '2022-01-01'
      END: '2026-01-01'
      MIN_TRADES: '100'
      ROUND_TRIP_COST_PIPS: '1.4'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt && pip install pandas numpy requests
      - name: Ingest real EURUSD M1 data
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Fail if real data is unavailable
        run: |
          python - <<'PY'
          from pathlib import Path
          f=list(Path('data/real').rglob('*.csv'))+list(Path('data/real').rglob('*.parquet'))
          if not f: raise SystemExit('REAL_DATA_REQUIRED: no downloaded market data found')
          print('real_data_files=',len(f))
          PY
      - name: Run v20.4 event-sequence discovery
        run: |
          cat > /tmp/v20_4.py <<'PY'
          import json, math, os
          from pathlib import Path
          import numpy as np, pandas as pd
          START=os.environ['START']; END=os.environ['END']; MIN_TRADES=int(os.environ['MIN_TRADES']); COST=float(os.environ['ROUND_TRIP_COST_PIPS'])
          files=list(Path('data/real').rglob('*.csv'))+list(Path('data/real').rglob('*.parquet')); frames=[]
          for p in files:
            try: frames.append(pd.read_parquet(p) if p.suffix=='.parquet' else pd.read_csv(p))
            except Exception: pass
          if not frames: raise SystemExit('Unable to parse real data')
          df=pd.concat(frames,ignore_index=True); df.columns=[str(x).lower() for x in df.columns]
          tc=next((x for x in ['time','timestamp','datetime','date'] if x in df.columns),None)
          if not tc: raise SystemExit('No time column')
          df['time']=pd.to_datetime(df[tc],utc=True,errors='coerce')
          for a,b in [('open','o'),('high','h'),('low','l'),('close','c')]:
            if a in df.columns: df=df.rename(columns={a:b})
          df=df.dropna(subset=['time','o','h','l','c']).sort_values('time').drop_duplicates('time').reset_index(drop=True)
          df=df[(df.time>=pd.Timestamp(START,tz='UTC'))&(df.time<pd.Timestamp(END,tz='UTC'))].reset_index(drop=True)
          if len(df)<10000: raise SystemExit('Insufficient real data')
          o,h,l,c=[df[x].astype(float) for x in ['o','h','l','c']]
          prev=c.shift(1); tr=pd.concat([h-l,(h-prev).abs(),(l-prev).abs()],axis=1).max(axis=1); atr=tr.rolling(14).mean(); atr50=atr.rolling(50).mean()
          rng=(h-l); body=(c-o).abs(); hour=df.time.dt.hour; london=hour.between(7,11); ny=hour.between(13,16); overlap=hour.between(13,14)
          base=df.set_index('time')[['c']].sort_index()
          m5=base.c.resample('5min',label='right',closed='right').last().shift(1).reindex(df.time,method='ffill').to_numpy()
          m15=base.c.resample('15min',label='right',closed='right').last().shift(1).reindex(df.time,method='ffill').to_numpy()
          m5s=pd.Series(m5); m15s=pd.Series(m15); m5e20=m5s.ewm(span=20,adjust=False).mean(); m5e50=m5s.ewm(span=50,adjust=False).mean(); m15e20=m15s.ewm(span=20,adjust=False).mean(); m15e50=m15s.ewm(span=50,adjust=False).mean()
          agree_up=(m5e20>m5e50)&(m15e20>m15e50); agree_dn=(m5e20<m5e50)&(m15e20<m15e50)
          day=df.time.dt.floor('D'); asia=df.assign(day=day); asia_h=asia['h'].where(hour.between(0,6)).groupby(day).transform('max'); asia_l=asia['l'].where(hour.between(0,6)).groupby(day).transform('min'); asia_ready=hour>=7
          daily=df.assign(day=day).groupby('day').agg(day_h=('h','max'),day_l=('l','min')).shift(1); prior_h=day.map(daily.day_h).to_numpy(); prior_l=day.map(daily.day_l).to_numpy()
          p20h=h.shift(1).rolling(20).max(); p20l=l.shift(1).rolling(20).min(); p60h=h.shift(1).rolling(60).max(); p60l=l.shift(1).rolling(60).min()
          # Event 1: sweep/reclaim on a completed candle. Event 2: displacement on a later completed candle. Event 3: entry on first retest of the reclaimed level.
          levels={'sweep20':(p20l,p20h),'sweep60':(p60l,p60h),'asia':(asia_l,asia_h),'prior_day':(pd.Series(prior_l),pd.Series(prior_h))}
          contexts={'any':pd.Series(True,index=df.index),'htf_agree':agree_up|agree_dn,'htf_up':agree_up,'htf_down':agree_dn,'london':london,'ny':ny,'overlap':overlap,'high_vol':(atr/atr50)>=1.2,'normal_vol':(atr/atr50>=0.85)&(atr/atr50<1.2)}
          exits=[(0.75,1.25,30),(1.0,1.5,60),(1.0,2.0,90),(1.5,2.5,120)]
          variants=[]
          for family,(lo,hi) in levels.items():
            for ctx,mask in contexts.items():
              for sl,tp,exp in exits: variants.append((family,ctx,sl,tp,exp,mask,lo,hi))
          results=[]; print('variants=',len(variants),flush=True)
          for n,(family,ctx,slm,tpm,expiry,mask,lo,hi) in enumerate(variants,1):
            if n%25==0: print(f'progress={n}/{len(variants)}',flush=True)
            trades=[]; i=300
            while i<len(df)-3:
              if not bool(mask.iloc[i]) or not np.isfinite(atr.iloc[i]): i+=1; continue
              # Find a sweep/reclaim event, then displacement within the next 1..5 completed candles.
              found=False
              for s in range(i,min(i+8,len(df)-1)):
                if family=='asia' and (not asia_ready.iloc[s] or not np.isfinite(lo.iloc[s])): continue
                lu,hu=float(lo.iloc[s]),float(hi.iloc[s])
                up=(float(l.iloc[s])<lu and float(c.iloc[s])>lu); dn=(float(h.iloc[s])>hu and float(c.iloc[s])<hu)
                if not (up or dn): continue
                direction=1 if up else -1
                for d in range(s+1,min(s+6,len(df)-1)):
                  rr=float(rng.iloc[d]); bb=float(body.iloc[d]); aa=float(atr.iloc[d])
                  if not np.isfinite(aa) or rr<=0 or bb/rr<0.65 or rr<1.15*aa or (direction>0 and c.iloc[d]<=o.iloc[d]) or (direction<0 and c.iloc[d]>=o.iloc[d]): continue
                  # First retest after displacement, at least one bar later.
                  level=lu if direction>0 else hu
                  for r in range(d+1,min(d+1+expiry,len(df))):
                    touched=(l.iloc[r]<=level and direction>0) or (h.iloc[r]>=level and direction<0)
                    if not touched: continue
                    if not bool(mask.iloc[r]): break
                    entry=float(o.iloc[r+1]) if r+1<len(df) else None
                    if entry is None: break
                    a=float(atr.iloc[r]); sl=entry-direction*slm*a; tp=entry+direction*tpm*a; end=min(len(df)-1,r+1+expiry); j=r+1; px=None
                    while j<=end:
                      hi2,lo2=float(h.iloc[j]),float(l.iloc[j])
                      if direction>0:
                        if lo2<=sl: px=sl; break
                        if hi2>=tp: px=tp; break
                      else:
                        if hi2>=sl: px=sl; break
                        if lo2<=tp: px=tp; break
                      j+=1
                    if px is None: px=float(c.iloc[end])
                    trades.append((int(df.time.iloc[r+1].year),(px-entry)*direction*10000-COST)); i=j+1; found=True; break
                  if found: break
                if found: break
              if not found: i+=1
            if len(trades)<MIN_TRADES: continue
            a=np.array([x[1] for x in trades]); gp=a[a>0].sum(); gl=-a[a<0].sum()
            if gp<=0 or gl<=0: continue
            pf=gp/gl; ex=float(a.mean()); wins=int((a>0).sum()); curve=np.cumsum(a); dd=float(np.max(np.maximum.accumulate(curve)-curve)); years=[]
            for y in sorted(set(x[0] for x in trades)):
              ya=np.array([x[1] for x in trades if x[0]==y]); yg=ya[ya>0].sum(); yl=-ya[ya<0].sum(); years.append({'year':y,'trades':len(ya),'net_pips':float(ya.sum()),'pf':float(yg/yl) if yl>0 else None})
            pos=sum(y['net_pips']>0 for y in years); stable=sum(y['pf'] is not None and y['pf']>1 for y in years); score=math.log1p(len(a))*max(pf-1,0)*max(ex,0)*pos/(1+dd/1000)
            results.append({'entry_family':family,'context':ctx,'sl_atr':slm,'tp_atr':tpm,'expiry':expiry,'trades':len(a),'win_rate':wins/len(a)*100,'pf':pf,'expectancy_pips':ex,'net_pips':float(a.sum()),'max_dd_pips':dd,'positive_years':pos,'stable_pf_years':stable,'yearly':years,'score':score})
          results.sort(key=lambda x:x['score'],reverse=True); eligible=[r for r in results if r['pf']>1 and r['expectancy_pips']>0 and r['positive_years']>=3 and r['stable_pf_years']>=2]
          out={'schema':'forexai.strategy_discovery.v20.4','data':{'candles':len(df),'start':str(df.time.min()),'end':str(df.time.max()),'synthetic_data':False},'cost_model':{'round_trip_pips':COST},'candidate_count':len(results),'eligible_count':len(eligible),'champion':eligible[0] if eligible else None,'top_candidates':results[:20]}
          Path('artifacts').mkdir(exist_ok=True); Path('artifacts/strategy-discovery-v20.4.json').write_text(json.dumps(out,indent=2),encoding='utf-8'); print(json.dumps({'candidate_count':len(results),'eligible_count':len(eligible),'champion':eligible[0] if eligible else None,'top':results[:5]},indent=2))
          if not eligible: print('NO_CHAMPION')
          PY
          python /tmp/v20_4.py
      - name: Upload discovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-discovery-v20-4
          path: artifacts/strategy-discovery-v20.4.json
          if-no-files-found: ignore
