name: ForexAI Broker Reconciliation

on:
  push:
    paths:
      - "tools/broker_reconciliation_v1.py"
      - "tools/trade_ledger_v1.py"
      - "tests/test_broker_reconciliation_v1.py"
  pull_request:
    paths:
      - "tools/broker_reconciliation_v1.py"
      - "tools/trade_ledger_v1.py"
      - "tests/test_broker_reconciliation_v1.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconciliation contract tests
        run: |
          pip install pytest
          pytest -q tests/test_broker_reconciliation_v1.py
