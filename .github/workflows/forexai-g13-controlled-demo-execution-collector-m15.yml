name: ForexAI G13 Controlled Demo Execution Collector M15

# Read-only collector. The frozen G13 EA is the only component allowed to place
# a Demo trade. This workflow never calls order_check or order_send.
on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Promoted G13 candidate ID"
        required: true
        type: choice
        options: ["2","6","10","12","14","22","26","28","30","32","34","38","42","46","48"]
      terminal_path:
        description: "Optional MT5 terminal executable path"
        required: false
        default: 'C:\\Program Files\\MetaTrader 5\\terminal64.exe'
        type: string
      audit_csv:
        description: "Optional absolute path to g13_demo_execution_audit.csv"
        required: false
        type: string
      confirmation:
        description: "Must exactly equal DEMO_EXECUTION_CONFIRMED"
        required: true
        type: string
      trade_id:
        description: "Unique ForexAI Demo trade ID for this controlled audit"
        required: true
        type: string
      package_preflight_run_id:
        description: "Successful G13 Controlled Demo Package Preflight M15 run for exact main SHA"
        required: true
        type: string
      timeout_seconds:
        description: "Maximum wait for ORDER_ATTEMPT telemetry"
        required: true
        default: "900"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g13-controlled-demo-execution-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      G13_CANDIDATE_ID: ${{ inputs.candidate_id }}
      G13_TERMINAL_PATH: ${{ inputs.terminal_path }}
      G13_AUDIT_CSV: ${{ inputs.audit_csv }}
      G13_CONFIRMATION: ${{ inputs.confirmation }}
      G13_TRADE_ID: ${{ inputs.trade_id }}
      G13_PACKAGE_PREFLIGHT_RUN_ID: ${{ inputs.package_preflight_run_id }}
      G13_TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MT5 package
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-mt5.txt

      - name: Verify collector guard tests
        shell: pwsh
        run: |
          python -m pytest -q tests/test_g13_demo_execution_collector_v1.py

      - name: Fail closed on confirmation
        shell: pwsh
        run: |
          if ($env:G13_CONFIRMATION -ne 'DEMO_EXECUTION_CONFIRMED') { throw 'DEMO_EXECUTION_CONFIRMATION_INVALID' }
          Write-Output 'PYTHON_ORDER_SUBMISSION=false'
          Write-Output 'LIVE_AUTHORIZATION=false'


      - name: Require exact main Package Preflight
        uses: actions/github-script@v7
        env:
          PACKAGE_PREFLIGHT_RUN_ID: ${{ inputs.package_preflight_run_id }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              core.setFailed('G13_DEMO_MUST_RUN_FROM_MAIN');
              return;
            }
            const runId = Number(process.env.PACKAGE_PREFLIGHT_RUN_ID);
            if (!Number.isInteger(runId) || runId <= 0) {
              core.setFailed('G13_PACKAGE_PREFLIGHT_RUN_ID_INVALID');
              return;
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const r = run.data;
            if (r.name !== 'ForexAI G13 Controlled Demo Package Preflight M15' || r.head_branch !== 'main' || r.head_sha !== context.sha || r.conclusion !== 'success') {
              core.setFailed('G13_PACKAGE_PREFLIGHT_PROVENANCE_MISMATCH');
              return;
            }
            core.exportVariable('G13_PACKAGE_PREFLIGHT_RUN_ID', String(runId));
            core.exportVariable('G13_PACKAGE_PREFLIGHT_HEAD_SHA', r.head_sha);
            core.info('G13_PACKAGE_PREFLIGHT_BOUND=true');

      - name: Download exact Package Preflight evidence
        uses: actions/download-artifact@v4
        with:
          name: g13-controlled-demo-package-preflight-m15
          path: artifacts/g13/package-preflight
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.package_preflight_run_id }}

      - name: Bind selected candidate ConfigHash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:G13_PACKAGE_PREFLIGHT_HEAD_SHA -ne $env:GITHUB_SHA) { throw 'G13_PACKAGE_PREFLIGHT_HEAD_SHA_MISMATCH' }
          $reports = @(Get-ChildItem -LiteralPath 'artifacts/g13/package-preflight' -Recurse -File -Filter 'g13-demo-package-preflight-m15.json')
          if ($reports.Count -ne 1) { throw "G13_PACKAGE_PREFLIGHT_REPORT_COUNT:$($reports.Count)" }
          $report = Get-Content -LiteralPath $reports[0].FullName -Raw | ConvertFrom-Json
          if ($report.status -ne 'PASS') { throw 'G13_PACKAGE_PREFLIGHT_STATUS_NOT_PASS' }
          if ($report.compile_parity_head_sha -ne $env:GITHUB_SHA) { throw 'G13_COMPILE_PARITY_HEAD_SHA_MISMATCH' }
          $expectedHash = [string]$report.candidate_config_hashes.($env:G13_CANDIDATE_ID)
          if ($expectedHash -notmatch '^[0-9a-fA-F]{64}        shell: pwsh
        run: |
          $common = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          $auth = Join-Path $common ("ForexAI_Authorization_{0}_EURUSD.auth" -f (130000 + [int]$env:G13_CANDIDATE_ID))
          if (!(Test-Path $auth)) { throw 'G13_DEMO_AUTHORIZATION_RECORD_MISSING' }
          $pythonCheck = @'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.runtime_authorization_record_v1 import parse_mql5_authorization_record
          candidate = int(os.environ["G13_CANDIDATE_ID"])
          trade_id = os.environ["G13_TRADE_ID"]
          common = Path(os.environ["APPDATA"]) / "MetaQuotes" / "Terminal" / "Common" / "Files"
          path = common / f"ForexAI_Authorization_{130000 + candidate}_EURUSD.auth"
          record = parse_mql5_authorization_record(
              path.read_text(encoding="utf-8"),
              now_utc=datetime.now(timezone.utc).isoformat(),
              expected_trade_id=trade_id,
          )
          print("G13_AUTHORIZATION_RECORD_VALID")
          print({
              "trade_id": record["trade_id"],
              "authorization_id": record["authorization_id"],
              "reservation_id": record["reservation_id"],
              "expires_at_utc": record["expires_at_utc"],
          })
          '@
          $pythonCheck | python


      - name: Collect real Demo execution telemetry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/g13/demo-execution | Out-Null
          $args = @('--candidate-id', $env:G13_CANDIDATE_ID, '--symbol', 'EURUSD', '--terminal-path', $env:G13_TERMINAL_PATH,
                   '--context-out', 'artifacts/g13/demo-execution/context.json',
                   '--report-out', 'artifacts/g13/demo-execution/collector-report.json',
                   '--evidence-csv-out', 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv',
                   '--confirmation', $env:G13_CONFIRMATION, '--trade-id', $env:G13_TRADE_ID, '--timeout-seconds', $env:G13_TIMEOUT_SECONDS)
          if ($env:G13_AUDIT_CSV -ne '') { $args += @('--audit-csv', $env:G13_AUDIT_CSV) }
          python tools/g13_demo_execution_collector_v1.py @args
      - name: Bind collector evidence to exact candidate and trade
        shell: pwsh
        run: |
          $ctx = Get-Content 'artifacts/g13/demo-execution/context.json' -Raw | ConvertFrom-Json
          $report = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
          if ([int]$ctx.candidate_id -ne [int]$env:G13_CANDIDATE_ID) { throw 'G13_COLLECTOR_CANDIDATE_MISMATCH' }
          if ([string]$ctx.trade_id -ne $env:G13_TRADE_ID) { throw 'G13_COLLECTOR_TRADE_ID_MISMATCH' }
          if ([string]$report.trade_id -ne $env:G13_TRADE_ID) { throw 'G13_COLLECTOR_REPORT_TRADE_ID_MISMATCH' }
          $rows = @(Import-Csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv')
          $attempts = @($rows | Where-Object { $_.event -eq 'ORDER_ATTEMPT' })
          if ($attempts.Count -ne 1) { throw "G13_EXPECTED_EXACTLY_ONE_ORDER_ATTEMPT:$($attempts.Count)" }
          $other = @($rows | Where-Object { $_.event -eq 'ORDER_ATTEMPT' -and $_.candidate_id -ne $env:G13_CANDIDATE_ID })
          if ($other.Count -ne 0) { throw 'G13_OTHER_CANDIDATE_ORDER_ATTEMPT_DETECTED' }
          $row = $attempts[0]
          if ($row.candidate_id -ne $env:G13_CANDIDATE_ID) { throw 'G13_TARGET_CANDIDATE_ORDER_MISMATCH' }
          if ([string]$row.config_hash -ne $env:G13_EXPECTED_CONFIG_HASH) { throw 'G13_TARGET_CONFIG_HASH_MISMATCH' }
          if ($row.side -ne 'SELL') { throw 'G13_TARGET_SIDE_MISMATCH' }
          if ([int]$row.retcode -ne 10009) { throw "G13_TARGET_RETCODE_NOT_DONE:$($row.retcode)" }
          if ([int64]$row.order -le 0 -or [int64]$row.deal -le 0) { throw 'G13_TARGET_BROKER_ID_MISSING' }
          if ([math]::Abs([double]$row.executed_volume - [double]$row.requested_volume) -gt 1e-9) { throw 'G13_TARGET_NOT_FULL_FILL' }
          $selected = [ordered]@{
            schema = 'forexai.g13.controlled_demo_execution_selection.v1'
            candidate_id = [int]$row.candidate_id
            config_hash = [string]$row.config_hash
            trade_id = $env:G13_TRADE_ID
            broker_order_id = [string]$row.order
            broker_deal_id = [string]$row.deal
            requested_volume = [double]$row.requested_volume
            executed_volume = [double]$row.executed_volume
            retcode = [int]$row.retcode
            timestamp_utc = [string]$row.timestamp_utc
            account_mode = 'DEMO'
            live_enabled = $false
          }
          $selected | ConvertTo-Json -Depth 4 | Set-Content 'artifacts/g13/demo-execution/selected-execution.json' -Encoding utf8
          Write-Output 'G13_COLLECTOR_EVIDENCE_BOUND=true'

      - name: Copy exact broker execution audit CSV
        shell: pwsh
        run: |
          if ($env:G13_AUDIT_CSV -ne '') {
            $audit = $env:G13_AUDIT_CSV
          } else {
            $report = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
            $audit = [string]$report.audit_path
          }
          if ([string]::IsNullOrWhiteSpace($audit) -or !(Test-Path $audit)) { throw 'G13_DEMO_AUDIT_CSV_NOT_FOUND' }
          Copy-Item -Force $audit 'artifacts/g13/demo-execution/g13_demo_execution_audit.csv'

      - name: Validate recorded execution evidence
        shell: pwsh
        run: |
          python -m research.optimization.g13_controlled_demo_execution_audit `
            --execution-csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv' `
            --handoff 'artifacts/g13/frozen/g13-candidate-handoff-m15.json' `
            --context 'artifacts/g13/demo-execution/context.json' `
            --report 'artifacts/g13/demo-execution/execution-audit-report.json'

      - name: Independently observe broker execution
        shell: pwsh
        run: |
          $row = Import-Csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv' |
            Where-Object { $_.event -eq 'ORDER_ATTEMPT' } |
            Select-Object -First 1
          if ($null -eq $row) { throw 'G13_DEMO_ORDER_ATTEMPT_NOT_FOUND' }
          if ([string]::IsNullOrWhiteSpace($row.order)) { throw 'G13_DEMO_ORDER_ID_MISSING' }
          python tools/mt5_demo_observe_v1.py `
            --symbol 'EURUSD' `
            --broker-order-id "$($row.order)" `
            --side "$($row.side)" `
            --requested-volume "$($row.requested_volume)" `
            --trade-id "$env:G13_TRADE_ID" `
            --terminal-path "$env:G13_TERMINAL_PATH" `
            --output 'artifacts/g13/demo-execution/observation.json'
          $obs = Get-Content 'artifacts/g13/demo-execution/observation.json' -Raw | ConvertFrom-Json
          if ($obs.status -ne 'OBSERVED') { throw 'G13_DEMO_OBSERVATION_STATUS_INVALID' }
          if ($obs.account_mode -ne 'DEMO') { throw 'G13_DEMO_OBSERVATION_ACCOUNT_NOT_DEMO' }
          if ($obs.order_submission_performed -ne $false) { throw 'G13_DEMO_OBSERVATION_SUBMISSION_INVARIANT_FAILED' }
          if ($obs.retry_performed -ne $false) { throw 'G13_DEMO_OBSERVATION_RETRY_INVARIANT_FAILED' }
          if ($obs.capital_authority_granted -ne $false) { throw 'G13_DEMO_OBSERVATION_CAPITAL_AUTHORITY_INVARIANT_FAILED' }
          if ($obs.observation.status -ne 'ACCEPTED') { throw "G13_DEMO_OBSERVATION_NOT_ACCEPTED:$($obs.observation.status)" }
          if ([string]$obs.observation.broker_order_id -ne [string]$row.order) { throw 'G13_DEMO_ORDER_ID_MISMATCH' }
          if ([string]::IsNullOrWhiteSpace([string]$obs.observation.broker_deal_id)) { throw 'G13_DEMO_DEAL_ID_MISSING' }
          if ([string]$obs.observation.broker_deal_id -ne [string]$row.deal) { throw 'G13_DEMO_DEAL_ID_MISMATCH' }
          if ($obs.observation.symbol -ne $row.symbol) { throw 'G13_DEMO_OBSERVATION_SYMBOL_MISMATCH' }
          if ($obs.observation.side -ne $row.side) { throw 'G13_DEMO_OBSERVATION_SIDE_MISMATCH' }
          if ([math]::Abs([double]$obs.observation.volume - [double]$row.requested_volume) -gt 1e-9) { throw 'G13_DEMO_OBSERVATION_VOLUME_MISMATCH' }
          if ([math]::Abs([double]$obs.observation.filled_volume - [double]$row.executed_volume) -gt 1e-9) { throw 'G13_DEMO_OBSERVATION_FILL_MISMATCH' }

      - name: Enforce Demo-only invariants
        shell: pwsh
        run: |
          $j = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
          if ($j.status -ne 'PASS') { throw 'COLLECTOR_STATUS_NOT_PASS' }
          if ($j.account_mode -ne 'DEMO') { throw 'COLLECTOR_ACCOUNT_NOT_DEMO' }
          if ($j.broker_full_fill_detected -ne $true) { throw 'COLLECTOR_NO_BROKER_FULL_FILL' }
          Write-Output 'G13_DEMO_EXECUTION_COLLECTOR_PASS=true'
          Write-Output 'LIVE_AUTHORIZATION=false'

      - name: Upload broker-backed Demo audit
        uses: actions/upload-artifact@v4
        with:
          name: g13-controlled-demo-execution-m15-candidate-${{ inputs.candidate_id }}
          path: artifacts/g13/demo-execution
          if-no-files-found: error
) { throw 'G13_PACKAGE_CONFIG_HASH_INVALID' }
          $handoff = Get-Content -LiteralPath 'artifacts/g13/frozen/g13-candidate-handoff-m15.json' -Raw | ConvertFrom-Json
          $candidate = @($handoff.candidates | Where-Object { [int]$_.candidate_id -eq [int]$env:G13_CANDIDATE_ID })
          if ($candidate.Count -ne 1) { throw 'G13_FROZEN_HANDOFF_CANDIDATE_MISSING' }
          if ([string]$candidate[0].config_hash -ne $expectedHash) { throw 'G13_HANDOFF_CONFIG_HASH_MISMATCH' }
          "G13_EXPECTED_CONFIG_HASH=$expectedHash" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output 'G13_PACKAGE_PREFLIGHT_PASS=true'

      - name: Verify pre-issued Capital Firewall authorization
        shell: pwsh
        run: |
          $common = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          $auth = Join-Path $common ("ForexAI_Authorization_{0}_EURUSD.auth" -f (130000 + [int]$env:G13_CANDIDATE_ID))
          if (!(Test-Path $auth)) { throw 'G13_DEMO_AUTHORIZATION_RECORD_MISSING' }
          $pythonCheck = @'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from tools.runtime_authorization_record_v1 import parse_mql5_authorization_record
          candidate = int(os.environ["G13_CANDIDATE_ID"])
          trade_id = os.environ["G13_TRADE_ID"]
          common = Path(os.environ["APPDATA"]) / "MetaQuotes" / "Terminal" / "Common" / "Files"
          path = common / f"ForexAI_Authorization_{130000 + candidate}_EURUSD.auth"
          record = parse_mql5_authorization_record(
              path.read_text(encoding="utf-8"),
              now_utc=datetime.now(timezone.utc).isoformat(),
              expected_trade_id=trade_id,
          )
          print("G13_AUTHORIZATION_RECORD_VALID")
          print({
              "trade_id": record["trade_id"],
              "authorization_id": record["authorization_id"],
              "reservation_id": record["reservation_id"],
              "expires_at_utc": record["expires_at_utc"],
          })
          '@
          $pythonCheck | python


      - name: Collect real Demo execution telemetry
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/g13/demo-execution | Out-Null
          $args = @('--candidate-id', $env:G13_CANDIDATE_ID, '--symbol', 'EURUSD', '--terminal-path', $env:G13_TERMINAL_PATH,
                   '--context-out', 'artifacts/g13/demo-execution/context.json',
                   '--report-out', 'artifacts/g13/demo-execution/collector-report.json',
                   '--evidence-csv-out', 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv',
                   '--confirmation', $env:G13_CONFIRMATION, '--trade-id', $env:G13_TRADE_ID, '--timeout-seconds', $env:G13_TIMEOUT_SECONDS)
          if ($env:G13_AUDIT_CSV -ne '') { $args += @('--audit-csv', $env:G13_AUDIT_CSV) }
          python tools/g13_demo_execution_collector_v1.py @args
      - name: Bind collector evidence to exact candidate and trade
        shell: pwsh
        run: |
          $ctx = Get-Content 'artifacts/g13/demo-execution/context.json' -Raw | ConvertFrom-Json
          $report = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
          if ([int]$ctx.candidate_id -ne [int]$env:G13_CANDIDATE_ID) { throw 'G13_COLLECTOR_CANDIDATE_MISMATCH' }
          if ([string]$ctx.trade_id -ne $env:G13_TRADE_ID) { throw 'G13_COLLECTOR_TRADE_ID_MISMATCH' }
          if ([string]$report.trade_id -ne $env:G13_TRADE_ID) { throw 'G13_COLLECTOR_REPORT_TRADE_ID_MISMATCH' }
          $rows = @(Import-Csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv')
          $attempts = @($rows | Where-Object { $_.event -eq 'ORDER_ATTEMPT' })
          if ($attempts.Count -ne 1) { throw "G13_EXPECTED_EXACTLY_ONE_ORDER_ATTEMPT:$($attempts.Count)" }
          $other = @($rows | Where-Object { $_.event -eq 'ORDER_ATTEMPT' -and $_.candidate_id -ne $env:G13_CANDIDATE_ID })
          if ($other.Count -ne 0) { throw 'G13_OTHER_CANDIDATE_ORDER_ATTEMPT_DETECTED' }
          $row = $attempts[0]
          if ($row.candidate_id -ne $env:G13_CANDIDATE_ID) { throw 'G13_TARGET_CANDIDATE_ORDER_MISMATCH' }
          if ($row.side -ne 'SELL') { throw 'G13_TARGET_SIDE_MISMATCH' }
          if ([int]$row.retcode -ne 10009) { throw "G13_TARGET_RETCODE_NOT_DONE:$($row.retcode)" }
          if ([int64]$row.order -le 0 -or [int64]$row.deal -le 0) { throw 'G13_TARGET_BROKER_ID_MISSING' }
          if ([math]::Abs([double]$row.executed_volume - [double]$row.requested_volume) -gt 1e-9) { throw 'G13_TARGET_NOT_FULL_FILL' }
          $selected = [ordered]@{
            schema = 'forexai.g13.controlled_demo_execution_selection.v1'
            candidate_id = [int]$row.candidate_id
            config_hash = [string]$row.config_hash
            trade_id = $env:G13_TRADE_ID
            broker_order_id = [string]$row.order
            broker_deal_id = [string]$row.deal
            requested_volume = [double]$row.requested_volume
            executed_volume = [double]$row.executed_volume
            retcode = [int]$row.retcode
            timestamp_utc = [string]$row.timestamp_utc
            account_mode = 'DEMO'
            live_enabled = $false
          }
          $selected | ConvertTo-Json -Depth 4 | Set-Content 'artifacts/g13/demo-execution/selected-execution.json' -Encoding utf8
          Write-Output 'G13_COLLECTOR_EVIDENCE_BOUND=true'

      - name: Copy exact broker execution audit CSV
        shell: pwsh
        run: |
          if ($env:G13_AUDIT_CSV -ne '') {
            $audit = $env:G13_AUDIT_CSV
          } else {
            $report = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
            $audit = [string]$report.audit_path
          }
          if ([string]::IsNullOrWhiteSpace($audit) -or !(Test-Path $audit)) { throw 'G13_DEMO_AUDIT_CSV_NOT_FOUND' }
          Copy-Item -Force $audit 'artifacts/g13/demo-execution/g13_demo_execution_audit.csv'

      - name: Validate recorded execution evidence
        shell: pwsh
        run: |
          python -m research.optimization.g13_controlled_demo_execution_audit `
            --execution-csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv' `
            --handoff 'artifacts/g13/frozen/g13-candidate-handoff-m15.json' `
            --context 'artifacts/g13/demo-execution/context.json' `
            --report 'artifacts/g13/demo-execution/execution-audit-report.json'

      - name: Independently observe broker execution
        shell: pwsh
        run: |
          $row = Import-Csv 'artifacts/g13/demo-execution/g13_demo_execution_audit_new.csv' |
            Where-Object { $_.event -eq 'ORDER_ATTEMPT' } |
            Select-Object -First 1
          if ($null -eq $row) { throw 'G13_DEMO_ORDER_ATTEMPT_NOT_FOUND' }
          if ([string]::IsNullOrWhiteSpace($row.order)) { throw 'G13_DEMO_ORDER_ID_MISSING' }
          python tools/mt5_demo_observe_v1.py `
            --symbol 'EURUSD' `
            --broker-order-id "$($row.order)" `
            --side "$($row.side)" `
            --requested-volume "$($row.requested_volume)" `
            --trade-id "$env:G13_TRADE_ID" `
            --terminal-path "$env:G13_TERMINAL_PATH" `
            --output 'artifacts/g13/demo-execution/observation.json'
          $obs = Get-Content 'artifacts/g13/demo-execution/observation.json' -Raw | ConvertFrom-Json
          if ($obs.status -ne 'OBSERVED') { throw 'G13_DEMO_OBSERVATION_STATUS_INVALID' }
          if ($obs.account_mode -ne 'DEMO') { throw 'G13_DEMO_OBSERVATION_ACCOUNT_NOT_DEMO' }
          if ($obs.order_submission_performed -ne $false) { throw 'G13_DEMO_OBSERVATION_SUBMISSION_INVARIANT_FAILED' }
          if ($obs.retry_performed -ne $false) { throw 'G13_DEMO_OBSERVATION_RETRY_INVARIANT_FAILED' }
          if ($obs.capital_authority_granted -ne $false) { throw 'G13_DEMO_OBSERVATION_CAPITAL_AUTHORITY_INVARIANT_FAILED' }
          if ($obs.observation.status -ne 'ACCEPTED') { throw "G13_DEMO_OBSERVATION_NOT_ACCEPTED:$($obs.observation.status)" }
          if ([string]$obs.observation.broker_order_id -ne [string]$row.order) { throw 'G13_DEMO_ORDER_ID_MISMATCH' }
          if ([string]::IsNullOrWhiteSpace([string]$obs.observation.broker_deal_id)) { throw 'G13_DEMO_DEAL_ID_MISSING' }
          if ([string]$obs.observation.broker_deal_id -ne [string]$row.deal) { throw 'G13_DEMO_DEAL_ID_MISMATCH' }
          if ($obs.observation.symbol -ne $row.symbol) { throw 'G13_DEMO_OBSERVATION_SYMBOL_MISMATCH' }
          if ($obs.observation.side -ne $row.side) { throw 'G13_DEMO_OBSERVATION_SIDE_MISMATCH' }
          if ([math]::Abs([double]$obs.observation.volume - [double]$row.requested_volume) -gt 1e-9) { throw 'G13_DEMO_OBSERVATION_VOLUME_MISMATCH' }
          if ([math]::Abs([double]$obs.observation.filled_volume - [double]$row.executed_volume) -gt 1e-9) { throw 'G13_DEMO_OBSERVATION_FILL_MISMATCH' }

      - name: Enforce Demo-only invariants
        shell: pwsh
        run: |
          $j = Get-Content 'artifacts/g13/demo-execution/collector-report.json' -Raw | ConvertFrom-Json
          if ($j.status -ne 'PASS') { throw 'COLLECTOR_STATUS_NOT_PASS' }
          if ($j.account_mode -ne 'DEMO') { throw 'COLLECTOR_ACCOUNT_NOT_DEMO' }
          if ($j.broker_full_fill_detected -ne $true) { throw 'COLLECTOR_NO_BROKER_FULL_FILL' }
          Write-Output 'G13_DEMO_EXECUTION_COLLECTOR_PASS=true'
          Write-Output 'LIVE_AUTHORIZATION=false'

      - name: Upload broker-backed Demo audit
        uses: actions/upload-artifact@v4
        with:
          name: g13-controlled-demo-execution-m15-candidate-${{ inputs.candidate_id }}
          path: artifacts/g13/demo-execution
          if-no-files-found: error
