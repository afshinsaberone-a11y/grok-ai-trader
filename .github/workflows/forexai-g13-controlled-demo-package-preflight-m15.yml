name: ForexAI G13 Controlled Demo Package Preflight M15

# Manual, offline/read-only package integrity gate.
# This workflow never connects to MT5 and never submits orders.
on:
  workflow_dispatch:
    inputs:
      compile_parity_run_id:
        description: "Successful ForexAI G13 MT5 Compile + Signal Parity run containing the frozen EX5 package"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: g13-controlled-demo-package-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONOPTIMIZE: '0'
      COMPILE_PARITY_RUN_ID: ${{ inputs.compile_parity_run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify compile + parity source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          echo "MAIN_HEAD_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID")"
          python -c 'import json,sys; p=json.load(sys.stdin); assert p["name"]=="ForexAI G13 MT5 Compile + Signal Parity", p["name"]; assert p["head_branch"]=="main", p["head_branch"]; assert p["conclusion"]=="success", (p["id"],p["conclusion"]); assert p["head_sha"]==sys.argv[1], (p["id"],p["head_sha"],sys.argv[1]); print("COMPILE_PARITY_RUN_OK",p["id"],p["head_sha"])' "$MAIN_SHA" <<< "$json"
          COMPILE_PARITY_HEAD_SHA="$(python -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])' <<< "$json")"
          echo "COMPILE_PARITY_HEAD_SHA=$COMPILE_PARITY_HEAD_SHA" >> "$GITHUB_ENV"

      - name: Download and verify exact compiled package artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf package
          mkdir -p package
          artifact_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$COMPILE_PARITY_RUN_ID/artifacts")"
          artifact_id="$(python -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; m=[x for x in a if x["name"]=="g13-mt5-compile-parity-"+sys.argv[1] and not x["expired"]]; assert len(m)==1; print(m[0]["id"])' "$COMPILE_PARITY_RUN_ID" <<< "$artifact_json")"
          artifact_digest="$(python -c 'import json,sys; a=json.load(sys.stdin)["artifacts"]; m=[x for x in a if x["name"]=="g13-mt5-compile-parity-"+sys.argv[1] and not x["expired"]]; assert len(m)==1; print(m[0]["digest"])' "$COMPILE_PARITY_RUN_ID" <<< "$artifact_json")"
          test "$artifact_digest" = sha256:* 
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > package/source.zip
          actual_digest="sha256:$(sha256sum package/source.zip | awk '{print $1}')"
          test "$actual_digest" = "$artifact_digest" || { echo "artifact digest mismatch: $actual_digest != $artifact_digest"; exit 1; }
          unzip -q -o package/source.zip -d package/extracted
          test "$(find package/extracted -name 'ForexAI_G13_Candidate_*.ex5' | wc -l)" -eq 15
          test "$(find package/extracted -name 'ForexAI_G13_Candidate_*.mq5' | wc -l)" -eq 15
          manifest_file="$(find package/extracted -name 'g13-demo-package-manifest-m15.json' -type f | head -n1)"
          parity_file="$(find package/extracted -name 'g13-mql5-signal-parity.json' -type f | head -n1)"
          data_manifest_file="$(find package/extracted -name 'g13_real_eurusd_m15.manifest.json' -type f | head -n1)"
          test -n "$manifest_file" && test -n "$parity_file" && test -n "$data_manifest_file"
          {
            echo "DEMO_PACKAGE_MANIFEST=$manifest_file"
            echo "PARITY_EVIDENCE=$parity_file"
            echo "DATA_MANIFEST_EVIDENCE=$data_manifest_file"
            echo "COMPILE_PARITY_ARTIFACT_ID=$artifact_id"
            echo "COMPILE_PARITY_ARTIFACT_DIGEST=$artifact_digest"
            echo "COMPILE_PARITY_ZIP_SHA256=${actual_digest#sha256:}"
          } >> "$GITHUB_ENV"
          echo "EXACT_COMPILED_PACKAGE_DOWNLOADED_AND_DIGEST_VERIFIED=15_EX5_15_MQ5"

      - name: Run offline Demo package preflight
        run: |
          set -euo pipefail
          python -m py_compile research/optimization/g13_demo_package_preflight_m15.py
          python -m research.optimization.g13_demo_package_preflight_m15 \
            --manifest "$DEMO_PACKAGE_MANIFEST" \
            --package-root package/extracted \
            --compile-parity-run-id "$COMPILE_PARITY_RUN_ID" \
            --compile-parity-head-sha "$COMPILE_PARITY_HEAD_SHA" \
            --compile-parity-artifact-id "$COMPILE_PARITY_ARTIFACT_ID" \
            --compile-parity-artifact-digest "$COMPILE_PARITY_ARTIFACT_DIGEST" \
            --downloaded-zip-sha256 "$COMPILE_PARITY_ZIP_SHA256" \
            --parity-evidence "$PARITY_EVIDENCE" \
            --data-manifest "$DATA_MANIFEST_EVIDENCE" \
            --report artifacts/g13/g13-demo-package-preflight-m15.json

      - name: Fail-closed assertions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p=json.load(open("artifacts/g13/g13-demo-package-preflight-m15.json",encoding="utf-8"))
          assert p["status"]=="PASS"
          assert p["candidate_count"]==15
          assert p["binary_hashes_verified"]==15
          assert p["source_hashes_verified"]==15
          assert p["source_safety_contracts_verified"]==15
          assert p["real_data_only"] is True
          assert p["synthetic_data"] is False
          assert p["demo_trading_allowed_by_source"] is False
          assert p["live_trading_allowed"] is False
          print("G13_CONTROLLED_DEMO_PACKAGE_PREFLIGHT_OK")
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: g13-controlled-demo-package-preflight-m15
          path: artifacts/g13/g13-demo-package-preflight-m15.json
          if-no-files-found: error
