name: ForexAI G13 Controlled Demo Execution Audit M15

on:
  workflow_dispatch:
    inputs:
      candidate_id:
        description: "Promoted G13 candidate to audit (one candidate only)"
        required: true
        type: string

      symbol:
        description: "Demo symbol"
        required: true
        default: "EURUSD"
        type: string
      terminal_path:
        description: "MT5 terminal executable"
        required: false
        default: "C:\\Program Files\\MetaTrader 5\\terminal64.exe"
        type: string
      audit_wait_minutes:
        description: "Maximum minutes to wait for fresh EA execution telemetry"
        required: true
        default: "20"
        type: string
      trade_id:
        description: "Exact Trade ID from the pre-issued Capital Firewall authorization; G13 M15 SELL identity ends in -S."
        required: true
        type: string
      operator_confirmation:
        description: "Exact confirmation before the frozen EA is enabled for this Demo audit"
        required: true
        default: "I_CONFIRM_G13_DEMO_ONLY"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: forexai-g13-controlled-demo-execution-audit-m15
  cancel-in-progress: false

jobs:
  controlled-demo-audit:
    runs-on: [self-hosted, windows, mt5]
    timeout-minutes: 35
    env:
      PYTHONUNBUFFERED: "1"
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      SYMBOL: ${{ inputs.symbol }}
      TERMINAL_PATH: ${{ inputs.terminal_path }}
      AUDIT_WAIT_MINUTES: ${{ inputs.audit_wait_minutes }}
      TRADE_ID: ${{ inputs.trade_id }}
    steps:
      - name: Validate operator confirmation
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if ("${{ inputs.operator_confirmation }}" -ne "I_CONFIRM_G13_DEMO_ONLY") {
            throw "G13_OPERATOR_CONFIRMATION_INVALID"
          }
          Write-Output "G13_OPERATOR_CONFIRMATION_ACCEPTED=DEMO_ONLY"

      - name: Checkout exact revision
        uses: actions/checkout@v4

      - name: Initialize Demo audit evidence
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/g13-controlled-demo | Out-Null
          $invocation = [ordered]@{
            schema = "forexai.g13.controlled_demo_invocation.v1"
            run_id = [long]$env:GITHUB_RUN_ID
            run_attempt = [int]$env:GITHUB_RUN_ATTEMPT
            head_sha = $env:GITHUB_SHA
            candidate_id = [int]$env:CANDIDATE_ID
            trade_id = $env:TRADE_ID
            symbol = $env:SYMBOL
            timeframe = "M15"
            operator_confirmation_accepted = $true
            account_mode_verified = $false
            order_submission_performed_by_workflow = $false
            stage = "PROMOTION_RESOLUTION_PENDING"
            created_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $invocation | ConvertTo-Json -Depth 5 | Set-Content artifacts/g13-controlled-demo/invocation.json -Encoding utf8

      - name: Set fail-closed Demo kill switch before audit setup
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $common = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          New-Item -ItemType Directory -Force -Path $common | Out-Null
          $kill = Join-Path $common "g13_demo_kill_switch.txt"
          Set-Content -Path $kill -Value "DENY" -NoNewline -Encoding ascii
          if ((Get-Content $kill -Raw) -ne "DENY") { throw "G13_KILL_SWITCH_INITIAL_DENY_FAILED" }
          Write-Output "G13_KILL_SWITCH_INITIAL_DENY=true"

      - name: Resolve exact Promotion manifest
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $sha = git rev-parse HEAD
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            "User-Agent" = "ForexAI-G13-Controlled-Demo-Audit"
          }
          $base = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          function Invoke-GitHubJsonWithRetry {
            param([Parameter(Mandatory=$true)][string]$Uri)
            $lastError = $null
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                return Invoke-RestMethod -Method Get -Uri $Uri -Headers $headers -TimeoutSec 60 -ErrorAction Stop
              } catch {
                $lastError = $_
                Write-Warning "G13_GITHUB_API_RETRY attempt=$attempt/5 error=$($_.Exception.Message)"
                if ($attempt -lt 5) { Start-Sleep -Seconds ([Math]::Min(2 * $attempt, 8)) }
              }
            }
            throw "G13_GITHUB_API_REQUEST_FAILED_AFTER_RETRIES uri=$Uri error=$($lastError.Exception.Message)"
          }
          function Invoke-GitHubDownloadWithRetry {
            param([Parameter(Mandatory=$true)][string]$Uri,[Parameter(Mandatory=$true)][string]$OutFile)
            $lastError = $null
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              try {
                Invoke-WebRequest -Method Get -Uri $Uri -Headers $headers -TimeoutSec 120 -OutFile $OutFile -ErrorAction Stop
                return
              } catch {
                $lastError = $_
                Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                Write-Warning "G13_ARTIFACT_DOWNLOAD_RETRY attempt=$attempt/5 error=$($_.Exception.Message)"
                if ($attempt -lt 5) { Start-Sleep -Seconds ([Math]::Min(2 * $attempt, 8)) }
              }
            }
            throw "G13_ARTIFACT_DOWNLOAD_FAILED_AFTER_RETRIES uri=$Uri error=$($lastError.Exception.Message)"
          }
          $runsUrl = "$base/actions/workflows/forexai-g13-promotion-m15.yml/runs?branch=main&status=completed&per_page=25"
          $runs = Invoke-GitHubJsonWithRetry -Uri $runsUrl
          $matches = @($runs.workflow_runs | Where-Object { $_.head_branch -eq 'main' -and $_.head_sha -eq $sha -and $_.name -eq 'ForexAI G13 Final Promotion M15' -and $_.conclusion -eq 'success' })
          if ($matches.Count -lt 1) { throw "G13_EXACT_SUCCESSFUL_PROMOTION_RUN_NOT_FOUND" }
          # Multiple successful runs can exist for the same exact SHA (push + watchdog/dispatch).
          # Select the newest successful exact-SHA run; its artifact will still be digest-verified below.
          $promotionRun = $matches | Sort-Object { [datetime]$_.created_at } -Descending | Select-Object -First 1
          $artifactUrl = "$base/actions/runs/$($promotionRun.id)/artifacts"
          $artifactList = Invoke-GitHubJsonWithRetry -Uri $artifactUrl
          $artifact = @($artifactList.artifacts | Where-Object { $_.name -eq 'g13-promotion-manifest-m15' -and !$_.expired })
          if ($artifact.Count -ne 1) { throw "G13_PROMOTION_ARTIFACT_NOT_FOUND" }
          New-Item -ItemType Directory -Force -Path evidence/g13-promotion | Out-Null
          $zipUrl = "$base/actions/artifacts/$($artifact[0].id)/zip"
          Invoke-GitHubDownloadWithRetry -Uri $zipUrl -OutFile evidence/g13-promotion/source.zip
          $actual = (Get-FileHash evidence/g13-promotion/source.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = ([string]$artifact[0].digest).Split(':')[-1].ToLowerInvariant()
          if ($actual -ne $expected) { throw "G13_PROMOTION_ARTIFACT_DIGEST_MISMATCH" }
          Expand-Archive -Path evidence/g13-promotion/source.zip -DestinationPath evidence/g13-promotion/extracted -Force
          $manifest = Get-ChildItem evidence/g13-promotion/extracted -Recurse -Filter 'g13-promotion-manifest-m15.json' | Select-Object -First 1
          if ($null -eq $manifest) { throw "G13_PROMOTION_MANIFEST_NOT_FOUND" }
          $payload = Get-Content $manifest.FullName -Raw | ConvertFrom-Json
          $ids = @($payload.promoted_candidate_ids | ForEach-Object { [int]$_ })
          if ($ids.Count -lt 1) { throw "G13_NO_PROMOTED_CANDIDATES" }
          if ($ids -notcontains [int]$env:CANDIDATE_ID) { throw "G13_CANDIDATE_NOT_PROMOTED:$env:CANDIDATE_ID" }
          "PROMOTION_MANIFEST=$($manifest.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "PROMOTION_RUN_ID=$($promotionRun.id)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "G13_EXACT_PROMOTION_OK=$($promotionRun.id)"
          Write-Output "G13_PROMOTED_CANDIDATES=$($ids -join ',')"

      - name: Verify local Python runtime
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = New-Object System.Collections.Generic.List[string]
          function Add-Candidate([string]$p) {
            if (-not $p -or $candidates.Contains($p)) { return }
            try {
              if (Test-Path -LiteralPath $p -PathType Leaf) { [void]$candidates.Add($p) }
            } catch [System.UnauthorizedAccessException] {
              Write-Host "PYTHON_PATH_SKIPPED_ACCESS_DENIED=$p"
            } catch { Write-Host "PYTHON_PATH_SKIPPED_ERROR=$p :: $($_.Exception.Message)" }
          }
          $cmd = Get-Command python -ErrorAction SilentlyContinue
          if ($cmd) { Add-Candidate $cmd.Source }
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            try {
              $candidate = & $py.Source -0p 2>$null | Select-Object -First 1
              if ($candidate) {
                $candidate = $candidate.Trim()
                if ($candidate -match '^\s*(?:-V:)?3\.\d+\s+(.+)$') { $candidate = $Matches[1].Trim() }
                Add-Candidate $candidate
              }
            } catch { Write-Host "PYTHON_LAUNCHER_DISCOVERY_FAILED=$($_.Exception.Message)" }
          }
          foreach ($userRoot in @('C:\\Users\\Star', $env:USERPROFILE)) {
            if ($userRoot -and (Test-Path -LiteralPath $userRoot -PathType Container)) {
              foreach ($ver in 'Python313','Python312','Python311') {
                Add-Candidate "$userRoot\\AppData\\Local\\Programs\\Python\\$ver\\python.exe"
                Add-Candidate "$userRoot\\AppData\\Programs\\Python\\$ver\\python.exe"
              }
            }
          }
          Add-Candidate 'C:\\Program Files\\Python313\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python312\\python.exe'
          Add-Candidate 'C:\\Program Files\\Python311\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Anaconda3\\python.exe'
          Add-Candidate 'C:\\ProgramData\\Miniconda3\\python.exe'
          foreach ($candidate in $candidates) {
            try {
              $version = (& $candidate -c "import sys; print('.'.join(map(str,sys.version_info[:3])))" 2>&1 | Select-Object -Last 1).Trim()
              if ($LASTEXITCODE -eq 0 -and $version -match '^3\.(11|12|13)(?:\.|$)') {
                Write-Host "PYTHON=$candidate"
                Write-Host "PYTHON_VERSION=$version"
                "PYTHON_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                $pythonDir = Split-Path -Parent $candidate
                $pythonScripts = Join-Path $pythonDir 'Scripts'
                @($pythonDir, $(if (Test-Path -LiteralPath $pythonScripts -PathType Container) { $pythonScripts })) |
                  Where-Object { $_ } | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
                break
              }
            } catch { Write-Host "PYTHON_EXECUTION_SKIPPED=$candidate :: $($_.Exception.Message)" }
          }
          if (-not (Get-Content $env:GITHUB_ENV -ErrorAction SilentlyContinue | Select-String '^PYTHON_EXE=')) {
            Write-Host 'PYTHON_CANDIDATES=' ($candidates -join ';')
            throw 'Python 3.11+ not found on the self-hosted runner.'
          }


      - name: Install MT5 package
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:PYTHON_EXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_PIP_UPGRADE_FAILED" }
          & $env:PYTHON_EXE -m pip install -r requirements-mt5.txt
          if ($LASTEXITCODE -ne 0) { throw "MT5_PYTHON_DEPENDENCIES_INSTALL_FAILED" }

      - name: Verify terminal executable
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          if (!(Test-Path "$env:TERMINAL_PATH")) { throw "MT5_TERMINAL_PATH_NOT_FOUND" }

      - name: Read-only Demo terminal preflight
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/g13-controlled-demo | Out-Null
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE;$env:PYTHONPATH"
          & $env:PYTHON_EXE -m tools.mt5_terminal_preflight_v1 --symbol "$env:SYMBOL" --path "$env:TERMINAL_PATH" |
            Tee-Object artifacts/g13-controlled-demo/terminal-preflight.json
          if ($LASTEXITCODE -ne 0) { throw "MT5_PREFLIGHT_PROCESS_FAILED:$LASTEXITCODE" }
          $j = Get-Content artifacts/g13-controlled-demo/terminal-preflight.json -Raw | ConvertFrom-Json
          if ($j.status -ne "PASS") { throw "MT5_PREFLIGHT_NOT_PASS" }
          if ($j.account_mode -ne "DEMO") { throw "MT5_PREFLIGHT_ACCOUNT_NOT_DEMO" }
          if ($j.terminal_connected -ne $true) { throw "MT5_PREFLIGHT_TERMINAL_NOT_CONNECTED" }
          if ($j.order_submission_performed -ne $false) { throw "MT5_PREFLIGHT_SUBMISSION_INVARIANT_FAILED" }

      - name: Bind exact trade identity to pre-issued authorization
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $tradeId = [string]$env:TRADE_ID
          if ($tradeId -notmatch '^[A-Za-z0-9._:-]{1,124}-S
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $common = Join-Path $env:APPDATA "MetaQuotes\\Terminal\\Common\\Files"
          New-Item -ItemType Directory -Force -Path $common | Out-Null
          Set-Content -Path (Join-Path $common "g13_demo_kill_switch.txt") -Value "ALLOW" -NoNewline -Encoding ascii
          if ((Get-Content (Join-Path $common "g13_demo_kill_switch.txt") -Raw) -ne "ALLOW") {
            throw "G13_KILL_SWITCH_NOT_ALLOW"
          }

      - name: Create audit context and operator handoff
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $context = [ordered]@{
            schema = "forexai.g13.controlled_demo_execution_context.v1"
            account_mode = "DEMO"
            explicit_demo_authorization = $true
            kill_switch = "ALLOW"
            live_enabled = $false
            one_position_guard = $true
            symbol = $env:SYMBOL
            timeframe = "M15"
            candidate_id = [int]$env:CANDIDATE_ID
            trade_id = $env:TRADE_ID
            execution_mode = "human_attached_frozen_ea"
            created_by_workflow_sha = $env:GITHUB_SHA
            run_id = [long]$env:GITHUB_RUN_ID
            created_at_utc = (Get-Date).ToUniversalTime().ToString("o")
          }
          $context | ConvertTo-Json | Set-Content artifacts/g13-controlled-demo/context.json -Encoding utf8
          @"
          CONTROLLED DEMO HANDOFF
          Candidate=$env:CANDIDATE_ID
          Symbol=$env:SYMBOL
          Timeframe=M15
          Account must remain DEMO.
          TradeId=$env:TRADE_ID
          Attach the exact frozen G13 candidate EA compiled from the approved package before starting this workflow.
          Set DemoTradingAuthorized=true for this audit only.
          Keep ParityMode=false.
          The EA must use this TradeId; Capital Firewall authorization must be fresh when the strategy signal is evaluated.
          Do not manually create an order.
          Do not use Python order_send as a bypass.
          The EA must generate the strategy signal and broker order normally.
          Kill switch has been set to ALLOW by this workflow.
          "@ | Set-Content artifacts/g13-controlled-demo/operator-handoff.txt -Encoding utf8

      - name: Wait for fresh MQL5 execution telemetry
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $common = Join-Path $env:APPDATA "MetaQuotes\Terminal\Common\Files"
          $audit = Join-Path $common "g13_demo_execution_audit.csv"
          $baselineRows = [int]$env:G13_AUDIT_BASELINE_ROWS
          $deadline = (Get-Date).AddMinutes([int]$env:AUDIT_WAIT_MINUTES)
          $found = $false
          $allRows = @()
          $freshRows = @()
          $target = @()
          while ((Get-Date) -lt $deadline) {
            $allRows = @()
            if (Test-Path -LiteralPath $audit -PathType Leaf) {
              $allRows = @(Import-Csv -LiteralPath $audit)
            }
            if ($allRows.Count -lt $baselineRows) {
              throw "G13_DEMO_AUDIT_CSV_SHRANK_DURING_AUDIT"
            }
            $freshRows = @($allRows | Select-Object -Skip $baselineRows)
            $attempts = @($freshRows | Where-Object { $_.event -eq "ORDER_ATTEMPT" })
            if ($attempts.Count -gt 1) {
              throw "G13_DEMO_MULTIPLE_FRESH_ORDER_ATTEMPTS:$($attempts.Count)"
            }
            if ($attempts.Count -eq 1) {
              $target = @($attempts | Where-Object {
                $_.candidate_id -eq $env:CANDIDATE_ID -and
                $_.symbol -eq $env:SYMBOL -and
                $_.timeframe -eq "M15"
              })
              if ($target.Count -ne 1) {
                throw "G13_DEMO_FRESH_ORDER_ATTEMPT_NOT_BOUND_TO_TARGET"
              }
              $found = $true
              break
            }
            Start-Sleep -Seconds 10
          }

          if (!$found) {
            $allRows = @()
            if (Test-Path -LiteralPath $audit -PathType Leaf) {
              $allRows = @(Import-Csv -LiteralPath $audit)
            }
            if ($allRows.Count -ge $baselineRows) {
              $freshRows = @($allRows | Select-Object -Skip $baselineRows)
            } else {
              $freshRows = @()
            }
            $target = @($freshRows | Where-Object {
              $_.candidate_id -eq $env:CANDIDATE_ID -and
              $_.event -eq "ORDER_ATTEMPT" -and
              $_.symbol -eq $env:SYMBOL -and
              $_.timeframe -eq "M15"
            })
            $tradeIdPath = Join-Path $common "ForexAI_G13_Demo_TradeId.txt"
            $authPath = Join-Path $common ("ForexAI_Authorization_{0}_EURUSD.auth" -f (130000 + [int]$env:CANDIDATE_ID))
            $killPath = Join-Path $common "g13_demo_kill_switch.txt"
            $diagnostic = [ordered]@{
              schema = "forexai.g13.demo_telemetry_timeout_diagnostics.v1"
              status = "FAIL"
              failure = "G13_DEMO_EXECUTION_TELEMETRY_TIMEOUT"
              candidate_id = [int]$env:CANDIDATE_ID
              trade_id = $env:TRADE_ID
              symbol = $env:SYMBOL
              timeframe = "M15"
              audit_file_present = (Test-Path -LiteralPath $audit -PathType Leaf)
              baseline_row_count = $baselineRows
              current_row_count = $allRows.Count
              new_row_count = $freshRows.Count
              matching_new_order_attempt_count = $target.Count
              trade_id_context_present = (Test-Path -LiteralPath $tradeIdPath -PathType Leaf)
              authorization_file_present = (Test-Path -LiteralPath $authPath -PathType Leaf)
              kill_switch_at_timeout = if (Test-Path -LiteralPath $killPath -PathType Leaf) { (Get-Content -LiteralPath $killPath -Raw).Trim() } else { "MISSING" }
              order_submission_performed_by_workflow = $false
              live_enabled = $false
              note = "No matching fresh MQL5 ORDER_ATTEMPT observed. No synthetic or manual fallback is allowed."
              created_at_utc = (Get-Date).ToUniversalTime().ToString("o")
            }
            $diagnostic | ConvertTo-Json -Depth 5 | Set-Content artifacts/g13-controlled-demo/telemetry-diagnostics.json -Encoding utf8
            throw "G13_DEMO_EXECUTION_TELEMETRY_TIMEOUT: see telemetry-diagnostics.json"
          }

          # Give the asynchronous OnTradeTransaction logger a brief bounded
          # window to append its broker-matching row after ORDER_ATTEMPT.
          for ($i = 0; $i -lt 5; $i++) {
            $allRows = @(Import-Csv -LiteralPath $audit)
            $freshRows = @($allRows | Select-Object -Skip $baselineRows)
            $attempt = @($freshRows | Where-Object { $_.event -eq "ORDER_ATTEMPT" }) | Select-Object -First 1
            if ($null -ne $attempt) {
              $tx = @($freshRows | Where-Object {
                $_.event -eq "TRADE_TRANSACTION" -and
                $_.order -eq $attempt.order -and
                $_.deal -eq $attempt.deal
              })
              if ($tx.Count -gt 0) { break }
            }
            Start-Sleep -Seconds 2
          }

          $env:G13_DEMO_AUDIT_SOURCE = $audit
          $env:G13_DEMO_AUDIT_BASELINE_ROWS = [string]$baselineRows
          $env:G13_DEMO_AUDIT_OUTPUT = "artifacts/g13-controlled-demo/g13_demo_execution_audit.csv"
          $filterNewEvidence = @'
          import csv
          import json
          import os
          from pathlib import Path

          source = Path(os.environ["G13_DEMO_AUDIT_SOURCE"])
          output = Path(os.environ["G13_DEMO_AUDIT_OUTPUT"])
          baseline = int(os.environ["G13_DEMO_AUDIT_BASELINE_ROWS"])

          with source.open("r", encoding="utf-8-sig", newline="") as handle:
              reader = csv.DictReader(handle)
              columns = reader.fieldnames
              rows = list(reader)
          if not columns or len(rows) < baseline:
              raise SystemExit("G13_DEMO_AUDIT_BASELINE_INVALID")
          fresh = rows[baseline:]
          attempts = [r for r in fresh if r.get("event") == "ORDER_ATTEMPT"]
          if len(attempts) != 1:
              raise SystemExit(f"G13_EXPECTED_EXACTLY_ONE_FRESH_ORDER_ATTEMPT:{len(attempts)}")
          row = attempts[0]
          if (row.get("candidate_id"), row.get("symbol"), row.get("timeframe")) != (
              os.environ["CANDIDATE_ID"], os.environ["SYMBOL"], "M15"
          ):
              raise SystemExit("G13_FRESH_ORDER_ATTEMPT_IDENTITY_MISMATCH")
          output.parent.mkdir(parents=True, exist_ok=True)
          with output.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, fieldnames=columns)
              writer.writeheader()
              writer.writerows(fresh)
          print(json.dumps({
              "status": "PASS",
              "baseline_row_count": baseline,
              "fresh_row_count": len(fresh),
              "fresh_order_attempt_count": len(attempts),
              "target_candidate_id": row["candidate_id"],
              "trade_id": os.environ["TRADE_ID"],
              "evidence_csv": str(output),
          }, sort_keys=True))
          '@
          $filterNewEvidence | & $env:PYTHON_EXE -
          if ($LASTEXITCODE -ne 0) { throw "G13_FRESH_TELEMETRY_FILTER_FAILED" }

      - name: Validate actual broker-backed Demo execution
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          python -m research.optimization.g13_controlled_demo_execution_audit --execution-csv artifacts/g13-controlled-demo/g13_demo_execution_audit.csv --handoff artifacts/g13/frozen/g13-candidate-handoff-m15.json --context artifacts/g13-controlled-demo/context.json --promotion "$env:PROMOTION_MANIFEST" --report artifacts/g13-controlled-demo/g13-controlled-demo-execution-audit.json
          @' 
          import csv, json, os
          from pathlib import Path
          candidate = int(os.environ["CANDIDATE_ID"])
          rows = list(csv.DictReader(Path("artifacts/g13-controlled-demo/g13_demo_execution_audit.csv").open(encoding="utf-8")))
          attempts = [r for r in rows if r["candidate_id"] == str(candidate) and r["event"] == "ORDER_ATTEMPT"]
          assert attempts, "NO_TARGET_ORDER_ATTEMPT"
          accepted = []
          for r in attempts:
              if int(r["order"]) > 0 and int(r["deal"]) > 0 and float(r["requested_volume"]) > 0 and abs(float(r["executed_volume"]) - float(r["requested_volume"])) <= 1e-9:
                  accepted.append(r)
          assert accepted, "NO_FULL_FILL_BROKER_BACKED_ORDER_FOUND"
          report = json.loads(Path("artifacts/g13-controlled-demo/g13-controlled-demo-execution-audit.json").read_text(encoding="utf-8"))
          assert report["status"] == "PASS"
          assert report["policy"]["demo_only"] is True
          assert report["policy"]["live_enabled"] is False
          assert report["policy"]["trading_performed_by_validator"] is False
          print("G13_CONTROLLED_DEMO_EXECUTION_ACCEPTED")
          print(json.dumps({"candidate_id":candidate,"broker_order_id":accepted[-1]["order"],"broker_deal_id":accepted[-1]["deal"],"requested_volume":accepted[-1]["requested_volume"],"executed_volume":accepted[-1]["executed_volume"],"retcode":accepted[-1]["retcode"],"timestamp_utc":accepted[-1]["timestamp_utc"]},sort_keys=True))
          '@ | python

      - name: Shutdown Demo kill switch after audit
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $common = Join-Path $env:APPDATA "MetaQuotes\\Terminal\\Common\\Files"
          $kill = Join-Path $common "g13_demo_kill_switch.txt"
          Set-Content -Path $kill -Value "DENY" -NoNewline -Encoding ascii
          if ((Get-Content $kill -Raw) -ne "DENY") { throw "G13_KILL_SWITCH_SHUTDOWN_FAILED" }
          $receiptPath = "artifacts/g13-controlled-demo/authorization-identity-binding.json"
          if (Test-Path -LiteralPath $receiptPath -PathType Leaf) {
            $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
            $tradeIdPath = Join-Path $common "ForexAI_G13_Demo_TradeId.txt"
            if (Test-Path -LiteralPath $tradeIdPath -PathType Leaf) {
              $activeTradeId = (Get-Content -LiteralPath $tradeIdPath -Raw).Trim()
              if ($activeTradeId -eq [string]$receipt.trade_id) {
                Remove-Item -LiteralPath $tradeIdPath -Force
                Write-Output "G13_DEMO_TRADE_ID_CONTEXT_REMOVED=true"
              } else {
                Write-Warning "G13_DEMO_TRADE_ID_CONTEXT_NOT_REMOVED_MISMATCH=true"
              }
            }
          }

      - name: Upload controlled Demo evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g13-controlled-demo-execution-m15
          path: artifacts/g13-controlled-demo
          if-no-files-found: error
