name: ForexAI G16 Regime Z-Score Reversion M5

on:
  pull_request:
    paths:
      - "research/optimization/regime_zscore_reversion_g16.py"
      - "tests/test_regime_zscore_reversion_g16.py"
      - ".github/workflows/forexai-g16-regime-zscore-reversion-m5.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile G16
        run: python -m py_compile research/optimization/regime_zscore_reversion_g16.py tests/test_regime_zscore_reversion_g16.py
      - name: Run G16 and G15 regression tests
        run: pytest -q tests/test_regime_zscore_reversion_g16.py tests/test_session_range_breakout_g15.py
      - name: Download REAL EURUSD M5 through canonical HistData pipeline
        run: python -m research.real_data.histdata_ingest --symbol EURUSD --start 2022-01-01 --end 2026-01-01 --timeframe M5 --output data/real --validate --manifest
      - name: Locate exact dataset and manifest
        run: |
          set -euo pipefail
          DATA="data/real/normalized/EURUSD_M5_20220101_20251231.csv"
          MANIFEST="data/real/normalized/EURUSD_M5_20220101_20251231.manifest.json"
          test -s "$DATA"
          test -s "$MANIFEST"
          echo "DATA=$DATA" >> "$GITHUB_ENV"
          echo "MANIFEST=$MANIFEST" >> "$GITHUB_ENV"
      - name: Run G16 IS-only discovery and locked 2025 validation
        run: |
          python -m research.optimization.regime_zscore_reversion_g16 \
            --data "$DATA" \
            --manifest "$MANIFEST" \
            --output artifacts/g16-regime-zscore-reversion-m5.json
      - name: Fail closed on protocol and authorization boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("artifacts/g16-regime-zscore-reversion-m5.json").read_text(encoding="utf-8"))
          assert p["schema_version"] == "forexai.g16.regime_zscore_reversion.v1"
          assert p["catalog"]["candidate_total"] == 108
          assert p["real_data_required"] is True and p["synthetic_fallback"] is False
          assert p["protocol"]["is_used_for_ranking"] is True
          assert p["protocol"]["validation_used_for_ranking"] is False
          assert p["protocol"]["catalog_locked"] is True
          assert p["oos_policy"]["loaded"] is False
          assert p["oos_policy"]["oos_runner_invoked"] is False
          assert p["oos_policy"]["oos_optimization_allowed"] is False
          assert p["demo_authorized"] is False and p["live_authorized"] is False and p["orders_submitted"] is False
          assert p["selection_frozen"] == (p["frozen_candidate"] is not None)
          if p["frozen_candidate"] is not None:
              assert len(p["frozen_candidate"]["config_sha256"]) == 64
          print(json.dumps({
              "candidate_total": p["catalog"]["candidate_total"],
              "total_is_trades_across_catalog": p["catalog"]["total_is_trades_across_catalog"],
              "is_qualified": p["catalog"]["is_qualified_count"],
              "validation_finalists": p["catalog"]["validation_finalists_evaluated"],
              "fully_qualified": p["catalog"]["fully_qualified_count"],
              "decision": p["decision"],
              "oos_loaded": p["oos_policy"]["loaded"]
          }, indent=2))
          PY
      - name: Upload G16 research artifact
        uses: actions/upload-artifact@v4
        with:
          name: forexai-g16-regime-zscore-reversion-m5
          path: artifacts/g16-regime-zscore-reversion-m5.json
          if-no-files-found: error
      - name: Publish numerical decision to the draft PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('artifacts/g16-regime-zscore-reversion-m5.json', 'utf8'));
            const body = [
              '<!-- forexai-g16-result -->',
              '## G16 real-data research result',
              '',
              '**Decision:** ' + p.decision,
              '- Fixed candidates: ' + p.catalog.candidate_total,
              '- IS-qualified: ' + p.catalog.is_qualified_count,
              '- 2025 validation finalists: ' + p.catalog.validation_finalists_evaluated,
              '- Fully qualified after validation and stress: ' + p.catalog.fully_qualified_count,
              '- IS trades across all candidates: ' + p.catalog.total_is_trades_across_catalog,
              '- OOS 2026 loaded: ' + p.oos_policy.loaded,
              '- Frozen config: ' + p.selection_frozen,
              '- Demo / Live / orders: ' + p.demo_authorized + ' / ' + p.live_authorized + ' / ' + p.orders_submitted,
              '',
              'Artifact from Actions run ' + context.runId + ': forexai-g16-regime-zscore-reversion-m5',
              '',
              'Research result only. No trading authorization is created.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const existing = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const prior = existing.data.find(c => c.body && c.body.includes('<!-- forexai-g16-result -->'));
            if (prior) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prior.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
