name: ForexAI Dropbox Evidence Sync

on:
  workflow_run:
    workflows:
      - "ForexAI G13 Final Promotion M15"
      - "ForexAI G13 MT5 Compile + Signal Parity"
      - "ForexAI G13 OOS M15 Current"
      - "ForexAI G13 Agent Evidence Consumer"
      - "ForexAI G13 Controlled Demo Package Preflight M15"
      - "Dukascopy Cross-Feed Check"
      - "ForexAI v29.1 Robustness Validation"
      - "ForexAI v29.1 Robustness Validation — M1"
      - "ForexAI v29.1 Robustness Validation — M15"
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "GitHub Actions run ID to mirror"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DROPBOX_ACCESS_TOKEN: ${{ secrets.DROPBOX_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Dropbox credential is configured
        run: |
          set -euo pipefail
          if [ -z "${DROPBOX_ACCESS_TOKEN}" ]; then
            echo "DROPBOX_SYNC_NOT_CONFIGURED: add GitHub Actions secret DROPBOX_ACCESS_TOKEN"
            exit 78
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Dropbox repository health before writes
        run: |
          set -euo pipefail
          python tools/dropbox_healthcheck.py --map config/dropbox_repository_map.json

      - name: Resolve source run
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="${MANUAL_RUN_ID}"
          if [ -z "${RUN_ID}" ]; then RUN_ID="${TRIGGER_RUN_ID}"; fi
          test -n "${RUN_ID}"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/${RUN_ID}" > run.json
          python - <<'PY'
          import json, os
          p=json.load(open("run.json",encoding="utf-8"))
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf-8") as f:
              f.write(f"RUN_ID={int(p['id'])}\n")
              f.write(f"WORKFLOW_NAME={p['name']}\n")
              f.write(f"RUN_ATTEMPT={int(p.get('run_attempt') or 1)}\n")
              f.write(f"HEAD_SHA={p['head_sha']}\n")
              f.write(f"CONCLUSION={p.get('conclusion') or 'unknown'}\n")
          print("SOURCE_RUN",p["id"],p["name"],p["head_sha"],p.get("conclusion"))
          PY

      - name: Capture source run and artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" > artifacts-pages.json
          python - <<'PY'
          import json
          run=json.load(open("run.json",encoding="utf-8"))
          pages=json.load(open("artifacts-pages.json",encoding="utf-8"))
          if not isinstance(pages,list):
              pages=[pages]
          artifacts=[]
          for page in pages:
              for a in page.get("artifacts",[]):
                  if a.get("expired"):
                      continue
                  artifacts.append({
                      "id": int(a["id"]),
                      "name": str(a["name"]),
                      "digest": str(a.get("digest") or ""),
                      "size_in_bytes": int(a.get("size_in_bytes") or 0),
                      "created_at": a.get("created_at"),
                      "expires_at": a.get("expires_at")
                  })
          metadata={
              "run_id": int(run["id"]),
              "workflow_name": str(run["name"]),
              "event": run.get("event"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "created_at": run.get("created_at"),
              "updated_at": run.get("updated_at"),
              "head_sha": str(run["head_sha"]),
              "head_branch": run.get("head_branch"),
              "run_attempt": int(run.get("run_attempt") or 1),
              "artifacts": artifacts
          }
          json.dump(metadata,open("run-metadata.json","w",encoding="utf-8"),indent=2,sort_keys=True)
          print(json.dumps(metadata,indent=2,ensure_ascii=False))
          PY
      - name: Download and verify exact source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf incoming/github-artifacts
          mkdir -p incoming/github-artifacts
          python - <<'PY' > artifact-index.tsv
          import json
          metadata=json.load(open("run-metadata.json",encoding="utf-8"))
          artifacts=metadata.get("artifacts",[])
          if not artifacts:
              raise SystemExit("DROPBOX_SYNC_FAIL_CLOSED: source run has no live artifacts")
          for a in artifacts:
              digest=str(a.get("digest") or "")
              if not digest.startswith("sha256:") or len(digest) != 71:
                  raise SystemExit("DROPBOX_SYNC_FAIL_CLOSED: artifact has no valid sha256 digest: " + str(a.get("id")))
              import re
              name=str(a.get("name") or "")
              if not name:
                  raise SystemExit("DROPBOX_SYNC_FAIL_CLOSED: artifact name is empty")
              if not re.fullmatch(r"[A-Za-z0-9._-]+", name):
                  raise SystemExit(
                      "DROPBOX_SYNC_FAIL_CLOSED: artifact name contains unsafe path characters: "
                      + name
                  )
              print(str(int(a["id"])) + "\t" + name + "\t" + digest + "\t" + str(int(a.get("size_in_bytes") or 0)))
          PY
          while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME ARTIFACT_DIGEST ARTIFACT_SIZE; do
            test -n "$ARTIFACT_ID"
            ARCHIVE="incoming/github-artifacts/.artifact-$ARTIFACT_ID.zip"
            TARGET="incoming/github-artifacts/$ARTIFACT_NAME"
            mkdir -p "$TARGET"
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > "$ARCHIVE"
            ACTUAL_SIZE="$(stat -c%s "$ARCHIVE")"
            test "$ACTUAL_SIZE" = "$ARTIFACT_SIZE" \
              || { echo "DROPBOX_SYNC_FAIL_CLOSED: artifact size mismatch id=$ARTIFACT_ID actual=$ACTUAL_SIZE expected=$ARTIFACT_SIZE"; exit 2; }
            ACTUAL_DIGEST="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
            EXPECTED_DIGEST="$(printf '%s' "$ARTIFACT_DIGEST" | sed 's/^sha256://')"
            test "$ACTUAL_DIGEST" = "$EXPECTED_DIGEST" \
              || { echo "DROPBOX_SYNC_FAIL_CLOSED: artifact digest mismatch id=$ARTIFACT_ID actual=$ACTUAL_DIGEST expected=$EXPECTED_DIGEST"; exit 2; }
            python - "$ARCHIVE" "$TARGET" <<'PY'
            import pathlib
            import stat
            import sys
            import zipfile

            archive = pathlib.Path(sys.argv[1])
            root = pathlib.Path(sys.argv[2]).resolve()
            with zipfile.ZipFile(archive) as zf:
                for info in zf.infolist():
                    name = info.filename
                    if not name or "\x00" in name or "\\" in name or name.startswith("/"):
                        raise SystemExit(
                            "DROPBOX_SYNC_FAIL_CLOSED: unsafe ZIP member: " + repr(name)
                        )
                    parts = pathlib.PurePosixPath(name).parts
                    if ".." in parts:
                        raise SystemExit(
                            "DROPBOX_SYNC_FAIL_CLOSED: ZIP path traversal: " + name
                        )
                    destination = (root / pathlib.PurePosixPath(name)).resolve()
                    if destination != root and root not in destination.parents:
                        raise SystemExit(
                            "DROPBOX_SYNC_FAIL_CLOSED: ZIP escaped target: " + name
                        )
                    mode = (info.external_attr >> 16) & 0o170000
                    if mode == stat.S_IFLNK:
                        raise SystemExit(
                            "DROPBOX_SYNC_FAIL_CLOSED: ZIP symlink rejected: " + name
                        )
                    if info.is_dir():
                        destination.mkdir(parents=True, exist_ok=True)
                        continue
                    destination.parent.mkdir(parents=True, exist_ok=True)
                    with zf.open(info, "r") as source, destination.open("wb") as target:
                        target.write(source.read())
            PY
            rm -f "$ARCHIVE"
            echo "SOURCE_ARTIFACT_VERIFIED id=$ARTIFACT_ID name=$ARTIFACT_NAME sha256=$ACTUAL_DIGEST bytes=$ACTUAL_SIZE"
          done < artifact-index.tsv
          test -n "$(find incoming/github-artifacts -type f -print -quit)" \
            || { echo "DROPBOX_SYNC_FAIL_CLOSED: verified source artifacts extracted no files"; exit 2; }
      - name: Validate repository contract and sync utility
        run: |
          set -euo pipefail
          python -m py_compile tools/dropbox_evidence_sync_v2.py tools/dropbox_free_tier_policy_v2.py tools/validate_dropbox_contract.py
          python tools/validate_dropbox_contract.py
          python -m pytest -q tests/test_dropbox_contract.py tests/test_dropbox_evidence_sync.py

      - name: Sync evidence into Dropbox
        run: |
          set -euo pipefail
          WORKFLOW_SLUG=$(python - <<'PY'
          from tools.dropbox_evidence_sync_v2 import safe_slug
          import os
          print(safe_slug(os.environ["WORKFLOW_NAME"]))
          PY
          )
          echo "WORKFLOW_SLUG=${WORKFLOW_SLUG}" >> "$GITHUB_ENV"
          mkdir -p reports/dropbox
          DEST_ROOT="/ForexAI/11_GITHUB_ACTIONS/Artifacts"
          if [ "${CONCLUSION}" != "success" ]; then
            DEST_ROOT="/ForexAI/11_GITHUB_ACTIONS/Failure_Analysis"
          fi
          echo "DROPBOX_DEST_ROOT=${DEST_ROOT}" >> "$GITHUB_ENV"
          python tools/dropbox_evidence_sync_v2.py \
            --source-dir incoming/github-artifacts \
            --dropbox-root "${DEST_ROOT}/${WORKFLOW_SLUG}/${RUN_ID}/attempt-${RUN_ATTEMPT}" \
            --workflow-name "${WORKFLOW_NAME}" \
            --run-id "${RUN_ID}" \
            --run-attempt "${RUN_ATTEMPT}" \
            --head-sha "${HEAD_SHA}" \
            --conclusion "${CONCLUSION}" \
            --run-metadata "run-metadata.json" \
            --ledger-out "reports/dropbox/run-${RUN_ID}-attempt-${RUN_ATTEMPT}.json" \
            --ledger-remote-root "/ForexAI/09_EVIDENCE_LEDGER/Run_Index" \
            --manifest-out "reports/dropbox/sync-${RUN_ID}.json" \
            --policy "config/dropbox_free_tier_policy.json"
      - name: Publish sync receipt
        uses: actions/upload-artifact@v4
        with:
          name: dropbox-evidence-sync-${{ env.RUN_ID }}-attempt-${{ env.RUN_ATTEMPT }}
          path: reports/dropbox/run-${{ env.RUN_ID }}-attempt-${{ env.RUN_ATTEMPT }}.json
          if-no-files-found: error
