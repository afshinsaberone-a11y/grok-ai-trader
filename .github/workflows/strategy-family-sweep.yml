name: Strategy Family Sweep

on:
  workflow_dispatch:
    inputs:
      start:
        description: 'Pre-OOS start UTC'
        required: true
        default: '2022-01-01'
      end:
        description: 'Pre-OOS end UTC, exclusive'
        required: true
        default: '2026-01-01'

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch real pre-OOS data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          test "$START" = '2022-01-01'
          test "$END" = '2026-01-01'
          python -m research.real_data.histdata_ingest --symbol EURUSD --timeframe M1 --start "$START" --end "$END" --output data/real --validate --manifest
      - name: Build real M5 research dataset
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          src=Path('data/real/normalized/EURUSD_M1_20220101_20251231.csv')
          df=pd.read_csv(src)
          df['timestamp']=pd.to_datetime(df['timestamp'],utc=True)
          for c in ['open','high','low','close','volume']:
              df[c]=pd.to_numeric(df[c])
          work=df.set_index('timestamp')[['open','high','low','close','volume']]
          m5=work.resample('5min').agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'}).dropna(subset=['open','high','low','close']).reset_index()
          out=Path('data/real/normalized/EURUSD_M5_20220101_20251231.csv')
          m5.to_csv(out,index=False)
          print('ROWS=',len(m5))
          PY
      - name: Run broad strategy-family sweep
        run: |
          python -m research.optimization.strategy_family_sweep --data data/real/normalized/EURUSD_M5_20220101_20251231.csv --output artifacts/strategy_family_sweep.json
      - name: Upload sweep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-family-sweep
          path: |
            artifacts/strategy_family_sweep.json
            data/real/normalized/*.manifest.json
          if-no-files-found: error
