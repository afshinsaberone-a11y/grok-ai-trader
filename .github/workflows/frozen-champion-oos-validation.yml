name: Frozen Champion OOS Validation v1

on:
  workflow_dispatch:

jobs:
  validate-champion:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate REAL 2026 OOS HistData
        run: |
          set -euo pipefail
          python -m research.real_data.histdata_ingest \
            --symbol EURUSD \
            --timeframe M1 \
            --start 2026-01-01 \
            --end 2026-08-01 \
            --output data/real \
            --validate \
            --manifest

      - name: Select exact clean REAL OOS M1 dataset
        run: |
          set -euo pipefail
          OOS_M1="data/real/normalized/EURUSD_M1_20260101_20260731.csv"
          test -s "$OOS_M1"
          test ! -f "data/real/normalized/EURUSD_M1_20260101_20260731_source_conflicts.csv" || true
          echo "OOS_M1=$OOS_M1" >> "$GITHUB_ENV"
          echo "REAL_OOS_M1=$OOS_M1"

      - name: Build REAL OOS M5 dataset
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import pandas as pd

          src = Path(os.environ['OOS_M1'])
          df = pd.read_csv(src)
          df['timestamp'] = pd.to_datetime(df['timestamp'], utc=True)
          for c in ['open','high','low','close','volume']:
              df[c] = pd.to_numeric(df[c], errors='raise')

          work = df.set_index('timestamp')[['open','high','low','close','volume']]
          m5 = (
              work.resample('5min')
              .agg({'open':'first','high':'max','low':'min','close':'last','volume':'sum'})
              .dropna(subset=['open','high','low','close'])
              .reset_index()
          )

          out = Path('data/real/oos/EURUSD_M5_20260101_20260731.csv')
          out.parent.mkdir(parents=True, exist_ok=True)
          m5.to_csv(out, index=False)
          print(f'REAL_OOS_M1_ROWS={len(df)}')
          print(f'REAL_OOS_M5_ROWS={len(m5)}')
          print(f'REAL_OOS_M5={out}')
          if len(df) < 100_000 or len(m5) < 20_000:
              raise SystemExit('REAL_DATA_REQUIRED: OOS dataset unexpectedly small; refusing to evaluate')
          PY

      - name: Validate frozen Candidate 30 on REAL OOS only
        run: |
          set -euo pipefail
          python -m research.oos.validate_champion \
            --family rsi_mean_reversion \
            --candidate 30 \
            --symbol EURUSD \
            --timeframe M5 \
            --start 2026-01-01 \
            --end 2026-08-01 \
            --data data/real/oos/EURUSD_M5_20260101_20260731.csv \
            --optimization off \
            --output artifacts/champion_oos/candidate_30_oos_2026_report.json

      - name: Upload OOS report
        uses: actions/upload-artifact@v4
        with:
          name: candidate-30-oos-report
          path: |
            artifacts/champion_oos/
            data/real/oos/
            data/real/normalized/*.manifest.json
            data/real/normalized/*_source_conflicts.csv
          if-no-files-found: error
