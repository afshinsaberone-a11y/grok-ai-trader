name: real-research

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date for the real research dataset"
        required: true
        default: "2022-01-01"
        type: string
      end:
        description: "UTC end date (exclusive)"
        required: true
        default: "2026-01-01"
        type: string
      timeframe:
        description: "Research timeframe"
        required: true
        default: "M5"
        type: choice
        options:
          - M1
          - M5
          - M15

jobs:
  real-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Dukascopy raw-data cache
        uses: actions/cache@v4
        with:
          path: data/real/raw/EURUSD/m1
          key: dukascopy-eurusd-m1-${{ inputs.start }}-${{ inputs.end }}
          restore-keys: |
            dukascopy-eurusd-m1-${{ inputs.start }}-
            dukascopy-eurusd-m1-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download and validate REAL EURUSD data
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          set -u
          success=0
          for attempt in 1 2 3; do
            echo "Dukascopy ingestion attempt $attempt/3"
            if python -m research.real_data.dukascopy_ingest \
              --symbol EURUSD \
              --timeframe "$TIMEFRAME" \
              --start "$START" \
              --end "$END" \
              --output data/real \
              --validate \
              --manifest; then
              success=1
              break
            fi
            echo "Attempt $attempt failed; cached raw files will be reused on the next attempt."
            sleep $((attempt * 30))
          done
          test "$success" -eq 1

      - name: Locate normalized dataset
        run: |
          find data/real/normalized -maxdepth 1 -type f -print | sort

      - name: Run baseline backtest on IS and Validation only
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          END_INCLUSIVE=$(date -u -d "$END - 1 day" +%Y%m%d)
          START_COMPACT=${START//-/}
          DATA="data/real/normalized/EURUSD_${TIMEFRAME}_${START_COMPACT}_${END_INCLUSIVE}.csv"
          if [ ! -f "$DATA" ]; then
            DATA=$(find data/real/normalized -maxdepth 1 -type f -name "EURUSD_${TIMEFRAME}_*.csv" | head -n 1)
          fi
          test -n "$DATA"
          test -f "$DATA"
          python -m research.real_data.run_real_backtest \
            --data "$DATA" \
            --timeframe "$TIMEFRAME" \
            --output artifacts/real_backtest_report.json

      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: real-research-${{ inputs.timeframe }}-${{ inputs.start }}-${{ inputs.end }}
          path: |
            data/real/normalized/
            artifacts/real_backtest_report.json
          if-no-files-found: error
